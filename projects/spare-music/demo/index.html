<!doctype html>
<html lang="en" data-app="music">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spare Music: demo</title>
<style>
/* Spareware design tokens: the one shared look for every Spareware app.
   Read design/DESIGN.md first. An app sets data-app="<name>" on <html> to get its own colour.
   Text is always ink on light colours; white text appears only on Spareware red. */
:root {
  /* Spareware (the co-op) */
  --spare-red: #C8102E;
  --spare-red-hover: #A80D26;
  --spare-red-tint: #FCE9EC;

  /* Neutrals */
  --ink: #1A1A1A;
  --ink-2: #595959;
  --ink-3: #8A8A8A;
  --page: #FAF8F5;
  --panel: #FFFFFF;
  --panel-alt: #F7F6F3;
  --sink: #F1EFEA;
  --hairline: #E5E5E3;
  --rule: #C9C9C9;

  /* States (always paired: strong for borders and icons, tint for backgrounds) */
  --danger: #B91C1C;  --danger-tint: #FDE8E8;
  --success: #15803D; --success-tint: #E3F6E8;
  --info: #1D4ED8;    --info-tint: #E3ECFD;

  /* Type and shape */
  --font-ui: system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --text: 13px;
  --radius: 3px;
  --space: 8px;

  /* The current app's colours (default: Spareware itself) */
  --app: var(--spare-red-tint);
  --app-strong: var(--spare-red);
  --app-tint: var(--spare-red-tint);
}

/* One light colour per app: --app is the fill for its mark, primary buttons and active items
   (ink text on it), --app-strong is for thin borders and icons, --app-tint for quiet backgrounds. */
[data-app="construct"] { --app: #8EC5FF; --app-strong: #1F5FA8; --app-tint: #EAF4FF; }
[data-app="studio"] { --app: #C4B2FF; --app-strong: #5B3FB8; --app-tint: #F3EFFF; }
[data-app="social"] { --app: #FFB27A; --app-strong: #9E4A14; --app-tint: #FFF1E6; }
[data-app="ride"]   { --app: #7FD8CF; --app-strong: #13756B; --app-tint: #E8F8F6; }
[data-app="food"]   { --app: #A9DE8A; --app-strong: #3E7C1F; --app-tint: #EFF9E8; }
[data-app="stay"]   { --app: #80D4F0; --app-strong: #11708F; --app-tint: #E7F7FD; }
[data-app="home"]   { --app: #E8C99A; --app-strong: #8A5A1C; --app-tint: #FBF4EA; }
[data-app="rent"]   { --app: #F2B8E0; --app-strong: #94306F; --app-tint: #FCEEF8; }
[data-app="work"]   { --app: #B8C4D6; --app-strong: #3D4F6B; --app-tint: #EEF1F6; }
[data-app="market"] { --app: #D8E36A; --app-strong: #66700F; --app-tint: #F7F9DF; }
[data-app="office"] { --app: #A9B6FF; --app-strong: #3A47A8; --app-tint: #EEF0FF; }
[data-app="os"]     { --app: #CDD1D6; --app-strong: #4A525C; --app-tint: #F2F3F5; }
[data-app="music"]  { --app: #EB8EEB; --app-strong: #B82EB8; --app-tint: #FBE9FB; }
[data-app="movies"] { --app: #EB8E8E; --app-strong: #B82E2E; --app-tint: #FBE9E9; }
[data-app="research"] { --app: #C2DBB3; --app-strong: #458321; --app-tint: #F0FBE9; }
</style>
<style>
/* Spare Music demo styles. Only the tokens above are used for colour, type, corners and spacing. */
:root { --s1: var(--space); --s2: calc(var(--space) * 2); --s3: calc(var(--space) * 3); --half: calc(var(--space) / 2); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--font-ui); font-size: var(--text); line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, select, textarea { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 6px 8px; min-height: 32px; width: 100%; }
input[type="checkbox"], input[type="radio"] { width: auto; min-height: 0; accent-color: var(--app-strong); }
input[type="range"] { padding: 0; border: 0; min-height: 0; accent-color: var(--app-strong); background: none; }
a { color: var(--ink); text-decoration-color: var(--app-strong); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--app-strong); outline-offset: 2px; }
[hidden] { display: none !important; }
h2, h3 { font-size: 14px; margin: 0; font-weight: 700; }
h1 { font-size: 18px; margin: 0; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--ink-2); }
.small { font-size: 12px; }
.grow { flex: 1; min-width: 0; }
.mt { margin-top: var(--s1); }
.mt2 { margin-top: var(--s2); }
.nowrap { white-space: nowrap; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; margin: 0 0 var(--s1); }
.mark { display: inline-block; width: 14px; height: 14px; background: var(--app); border: 1px solid var(--app-strong); border-radius: var(--radius); flex: none; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: middle; }
.ic.sm { width: 14px; height: 14px; }
.ic.lg { width: 26px; height: 26px; }
.ic.app { color: var(--app-strong); }
.ic.inf { color: var(--info); }
.ic.ok { color: var(--success); }
.ic.dan { color: var(--danger); }

/* Demo chrome */
.demohead { height: 48px; display: flex; align-items: center; gap: var(--s1); padding: 0 var(--s2); background: var(--panel); border-bottom: 1px solid var(--hairline); }
.demohead .sep { color: var(--ink-3); }
.demohead .screens-btn, .demohead .narrow-only { display: none; }
.demohead select { width: auto; min-height: 30px; padding: 3px 6px; font-size: 12px; }
.stage { display: flex; justify-content: center; gap: var(--s3); padding: var(--s2); height: calc(100vh - 48px); }
.nav, .about { background: var(--panel); border: 1px solid var(--hairline); border-radius: var(--radius); overflow-y: auto; }
.nav { width: 232px; flex: none; padding: var(--s2) 0; }
.nav .label { padding: 0 var(--s2); margin-top: var(--s2); }
.nav .label:first-child { margin-top: 0; }
.nav a { display: flex; gap: var(--s1); align-items: baseline; padding: 6px var(--s2); text-decoration: none; color: var(--ink); border-left: 3px solid transparent; }
.nav a .num { font-family: var(--font-mono); color: var(--ink-2); font-size: 11px; width: 18px; flex: none; }
.nav a:hover { background: var(--panel-alt); }
.nav a[aria-current="page"] { background: var(--app-tint); border-left-color: var(--app); font-weight: 600; }
.nav .navfoot { margin: var(--s2) var(--s2) 0; padding-top: var(--s2); border-top: 1px solid var(--hairline); font-size: 12px; color: var(--ink-2); }
.nav .navctry { padding: 0 var(--s2); margin-top: var(--s2); }
.nav .navctry .label { padding: 0; }
.about { width: 300px; flex: none; padding: var(--s2); }
.about h3 { margin: 0 0 var(--half); }
.about p { margin: 0 0 var(--s2); color: var(--ink-2); }
.about ul { margin: 0 0 var(--s2); padding: 0; list-style: none; }
.about li { padding: 5px 0; border-bottom: 1px solid var(--hairline); }
.about li .mono { font-size: 11px; color: var(--app-strong); display: block; }
.about .try li { padding-left: var(--s2); position: relative; }
.about .try li::before { content: ""; position: absolute; left: 0; top: 11px; width: 6px; height: 6px; background: var(--app); border: 1px solid var(--app-strong); }
.device { flex: none; width: 392px; display: flex; flex-direction: column; }
.phone { width: 392px; height: 100%; max-height: 860px; background: var(--panel); border: 1px solid var(--ink); border-radius: var(--radius); position: relative; overflow: hidden; display: flex; flex-direction: column; }
.statusbar { height: 24px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--s2); font-size: 11px; font-weight: 600; font-family: var(--font-mono); border-bottom: 1px solid var(--hairline); background: var(--panel); }

/* App header */
.apphead { height: 46px; flex: none; display: flex; align-items: center; gap: var(--s1); padding: 0 var(--s1) 0 var(--s2); border-bottom: 1px solid var(--hairline); background: var(--panel); }
.apphead b { white-space: nowrap; }
.apphead .crumb { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.apphead .crumb::before { content: "/"; color: var(--ink-3); margin-right: var(--s1); }
.ctrybtn { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 7px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); font-family: var(--font-mono); font-size: 11px; font-weight: 700; }
.view { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; background: var(--panel); }
.scr { min-height: 100%; }

/* Mini player and tab bar */
.mini { flex: none; display: flex; align-items: center; gap: var(--s1); padding: 6px var(--s1) 6px 10px; border-top: 1px solid var(--hairline); background: var(--panel); position: relative; }
.mini .prog { position: absolute; left: 0; top: -1px; height: 2px; background: var(--app-strong); }
.mini .t { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 0; }
.mini .t b, .mini .t > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .t > span { font-size: 12px; color: var(--ink-2); }
.mini .pays { font-size: 11px; color: var(--ink-2); white-space: nowrap; }
.tabbar { flex: none; display: flex; border-top: 1px solid var(--hairline); background: var(--panel); }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 7px; font-size: 11px; color: var(--ink-2); text-decoration: none; }
.tabbar a[aria-current="page"] { background: var(--app); color: var(--ink); font-weight: 700; }

/* Buttons, badges, fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--ink); background: var(--panel); color: var(--ink); font-weight: 600; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--panel-alt); }
.btn.primary { background: var(--app); border-color: var(--app); }
.btn.primary:hover { border-color: var(--app-strong); }
.btn.quiet { border-color: var(--rule); color: var(--ink-2); font-weight: 500; }
.btn.small { min-height: 28px; padding: 0 9px; font-size: 12px; }
.btn.block { width: 100%; }
.btn.on { background: var(--app-tint); border-color: var(--app-strong); }
.btn.dan { border-color: var(--danger); color: var(--danger); }
.btn:disabled { opacity: .55; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: var(--s1); }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--app-strong); text-underline-offset: 2px; font-weight: 600; }
.iconbtn { width: 34px; height: 34px; display: inline-grid; place-items: center; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); color: var(--ink); padding: 0; flex: none; }
.iconbtn.ghost { border-color: transparent; }
.iconbtn:hover { background: var(--panel-alt); }
.iconbtn.big { width: 52px; height: 52px; border-radius: 50%; border-color: var(--ink); background: var(--app); }
.iconbtn[aria-pressed="true"] { background: var(--app-tint); border-color: var(--app-strong); }
/* Badge text stays ink: the music colour's deeper shade on its tint is about 4.4:1, under AA for 11px text. */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; background: var(--app-tint); color: var(--ink); box-shadow: inset 0 0 0 1px var(--app-strong); font-size: 11px; font-weight: 600; white-space: nowrap; vertical-align: middle; }
.badge .ic { width: 12px; height: 12px; }
.badge.n { background: var(--sink); color: var(--ink-2); box-shadow: none; }
.badge.inf { background: var(--info-tint); color: var(--info); box-shadow: inset 0 0 0 1px var(--info); }
.badge.ok { background: var(--success-tint); color: var(--success); box-shadow: inset 0 0 0 1px var(--success); }
.badge.dan { background: var(--danger-tint); color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.field { display: block; }
.field > span:first-child { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.field + .field { margin-top: 10px; }
.inrow { display: flex; gap: var(--s1); align-items: center; }
.hint { display: block; font-size: 12px; margin-top: 4px; color: var(--ink-2); }
.hint.ok { color: var(--success); }
.hint.dan { color: var(--danger); }
.check { display: flex; gap: var(--s1); align-items: flex-start; }
.check input { margin-top: 3px; }
.note { background: var(--app-tint); border-left: 3px solid var(--app); padding: 8px 10px; border-radius: 0 var(--radius) var(--radius) 0; }
.note.inf { background: var(--info-tint); border-left-color: var(--info); }
.note.ok { background: var(--success-tint); border-left-color: var(--success); }
.note.dan { background: var(--danger-tint); border-left-color: var(--danger); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 28px; padding: 0 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); color: var(--ink); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.chip[aria-pressed="true"] { background: var(--app); border-color: var(--app-strong); font-weight: 600; }
.seg { display: flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.seg button { flex: 1; border: 0; border-left: 1px solid var(--rule); background: var(--panel); padding: 5px 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--app); color: var(--ink); font-weight: 700; }
.sw { position: relative; width: 38px; height: 22px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sink); padding: 0; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 1px solid var(--ink-2); transition: left .15s; }
.sw[aria-checked="true"] { background: var(--app); border-color: var(--app-strong); }
.sw[aria-checked="true"]::after { left: 19px; border-color: var(--app-strong); }
.swrow { display: flex; align-items: center; justify-content: space-between; gap: var(--s1); padding: 8px 0; border-bottom: 1px solid var(--hairline); }
.swrow:last-child { border-bottom: 0; }
.swrow .sub { display: block; font-size: 12px; color: var(--ink-2); }
.tabs { display: flex; border-bottom: 1px solid var(--hairline); overflow-x: auto; scrollbar-width: none; background: var(--panel); }
.tabs button { flex: none; padding: 9px 12px; border: 0; background: none; color: var(--ink-2); font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--app); color: var(--ink); }
.bar { height: 6px; background: var(--sink); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--app); border-right: 1px solid var(--app-strong); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; }

/* Blocks and rows */
.pad { padding: var(--s2); }
.sect { padding: 12px var(--s2); border-bottom: 1px solid var(--hairline); }
.sect.alt { background: var(--panel-alt); }
.sect > * + * { margin-top: var(--s1); }
.sect > .label + * { margin-top: 0; }
.sect-title { display: flex; align-items: center; gap: var(--s1); }
.sect-title h2 { flex: 1; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px var(--s2); border: 0; border-bottom: 1px solid var(--hairline); background: var(--panel); text-align: left; color: var(--ink); text-decoration: none; }
.row .sub, .grow > .sub { display: block; font-size: 12px; color: var(--ink-2); font-weight: 400; }
button.row:hover, a.row:hover { background: var(--panel-alt); }
.row.sel { background: var(--app-tint); box-shadow: inset 3px 0 0 var(--app); }
.row.off { color: var(--ink-3); }
.rows-in-sect .row { padding-left: 0; padding-right: 0; }
.rows-in-sect .row:last-child { border-bottom: 0; }
.avatar { width: 34px; height: 34px; flex: none; display: inline-grid; place-items: center; background: var(--sink); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--radius); font-weight: 700; font-size: 11px; }
.avatar.bot { background: var(--info-tint); color: var(--info); border-color: var(--info); }
.avatar.sm { width: 26px; height: 26px; font-size: 10px; }
.num { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); width: 18px; flex: none; text-align: right; }
.dur { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }

/* Cover art: geometric pictures drawn in token colours */
.art { display: block; position: relative; overflow: hidden; border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--sink); flex: none; aspect-ratio: 1; }
.art svg { display: block; width: 100%; height: 100%; }
.art.s40 { width: 40px; } .art.s56 { width: 56px; } .art.s96 { width: 96px; } .art.s128 { width: 128px; }
.art.full { width: 100%; max-width: 260px; margin: 0 auto; }
.c0 { fill: var(--app-tint); } .c1 { fill: var(--app); } .c2 { fill: var(--app-strong); }
.c3 { fill: var(--info-tint); } .c4 { fill: color-mix(in srgb, var(--info) 45%, var(--panel)); } .c5 { fill: color-mix(in srgb, var(--success) 45%, var(--panel)); }
.c6 { fill: var(--sink); } .c7 { fill: var(--ink-2); } .c8 { fill: var(--panel); } .c9 { fill: color-mix(in srgb, var(--app-strong) 55%, var(--ink)); }
.cl { fill: none; stroke: var(--panel); stroke-width: 3; }
.cl2 { fill: none; stroke: var(--ink-2); stroke-width: 2; }
.cardrow { display: flex; gap: 12px; overflow-x: auto; padding: 0 var(--s2) 4px; scrollbar-width: none; }
.rcard { flex: none; width: 120px; border: 0; background: none; padding: 0; text-align: left; color: var(--ink); }
.rcard .art { width: 120px; }
.rcard b { display: block; margin-top: 6px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcard span { display: block; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcard .badges { margin-top: 4px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.sec-head { display: flex; align-items: center; gap: var(--s1); padding: 8px var(--s2); background: var(--panel-alt); border-bottom: 1px solid var(--hairline); border-top: 1px solid var(--hairline); }
.sec-head b { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.sec-head .muted { font-size: 12px; flex: 1; }
.hero { display: flex; gap: 12px; padding: var(--s2); border-bottom: 1px solid var(--hairline); }
.hero .grow > * + * { margin-top: 4px; }

/* Track list */
.trk { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px var(--s2); border: 0; border-bottom: 1px solid var(--hairline); background: var(--panel); text-align: left; }
.trk:hover { background: var(--panel-alt); }
.trk.now { background: var(--app-tint); box-shadow: inset 3px 0 0 var(--app); }
.trk.skip { color: var(--ink-3); }
.trk .tt { flex: 1; min-width: 0; }
.trk .tt b { display: block; font-weight: 600; }
.trk .tt .sub { display: block; font-size: 12px; color: var(--ink-2); }
.trk .tt .badges { margin-top: 3px; }
.trk .more { margin-left: 2px; }

/* Player */
.pl-art { padding: var(--s2) var(--s2) 0; }
.pl-meta { padding: 12px var(--s2) 0; text-align: center; }
.pl-meta h1 { font-size: 17px; }
.pl-meta .badges { justify-content: center; margin-top: 6px; }
.seek { padding: 10px var(--s2) 0; }
.seek input { width: 100%; }
.seek .times { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
.ctrls { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 6px var(--s2) 12px; }
.lyr { padding: 12px var(--s2); }
.lyr p { padding: 3px 0; color: var(--ink-3); font-size: 14px; }
.lyr p.on { color: var(--ink); font-weight: 700; }
.lyr p.done { color: var(--ink-2); }
.moneybox { border: 1px solid var(--hairline); border-left: 3px solid var(--app); border-radius: 0 var(--radius) var(--radius) 0; padding: 8px 10px; }
.countbar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.countbar .bar { flex: 1; }

/* Money tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; padding: 4px 0; border-bottom: 1px solid var(--rule); }
.tbl td { padding: 6px 0; border-bottom: 1px solid var(--hairline); vertical-align: top; }
.tbl .n { text-align: right; font-family: var(--font-mono); padding-left: var(--s1); white-space: nowrap; }
.tbl tr.total td { font-weight: 700; border-bottom: 0; border-top: 1px solid var(--rule); }
.tbl tr.minus td.n { color: var(--ink-2); }

function earn() {
  const c = C();
  const lines = [['Album sales', '46 sales, average ' + money(amt(13.40)), 616.40], ['Track sales', '31 sales', 62.00], ['Listening pass shares', '18,240 plays (sample pass)', 212.35], ['Monthly support', '38 supporters', 190.00], ['Tips', '9 tips', 45.00]];
  const gross = lines.reduce((a, l) => a + amt(l[2]), 0);
  const salesGross = amt(616.40 + 62 + 212.35 + 190);
  const tax = c.tax.incl ? salesGross * c.tax.r / (1 + c.tax.r) : 0;
  const card = cents(salesGross * c.card[0] + c.card[1] * 115);

  const song = cents((salesGross - tax) * 0.05);
  const held = cents(amt(14.20));
  const net = cents(gross - tax - card - deliver - song - held);
  return { lines, gross, tax, card, deliver, song, held, net };
}

  h += '<div class="sect"><h2>What others see</h2>' + swRow('Public playlists on my page', 'Others can find and follow them', 'pubpl', true) + swRow('Artists I support', 'Shown on my page', 'pubsup', true) + swRow('Listening history', 'Never shown unless you turn this on', 'pubhist', false) + '</div>';
  h += '<div class="sect"><h2>Age rules in ' + c.name + '</h2><p class="small">Minimum age here: <b>' + c.age + '</b> (sample; set by the country pack). Teen accounts start with explicit lyrics skipped, a private profile, no messages from strangers and spending limits. Checked without keeping identity documents.</p><button class="btn small quiet" data-toast="Family accounts: link a child\'s account and approve purchases (a next feature).">Family settings</button> <span class="badge n">next</span></div>';
  h += '<div class="sect"><h2>Notifications</h2>' + swRow('New releases from artists I follow', 'Push, as they come out', 'nrel', S.notif.rel) + swRow('Shows near me', 'Email, weekly digest', 'nshows', S.notif.shows) + swRow('Posts from artists I support', 'Push', 'nposts', S.notif.posts) + '</div>';
  h += '<div class="sect"><h2>Language, formats and display</h2><label class="field"><span>Language</span><select><option>English</option><option>' + c.lang + '</option></select></label><p class="small muted">Dates and money as written in ' + c.name + ': <span class="mono">' + c.date + ' · ' + money(1234.5) + '</span>. Names stay in their own script.</p>' + swRow('Larger text', 'Bigger type in the app', 'large', S.large) + swRow('Higher contrast', 'Stronger lines and text', 'contrast', S.contrast) + '</div>';
  h += '<div class="sect"><h2>Devices</h2><div class="rows-in-sect">' + [['This phone', 'now'], ['Laptop, browser', '2 hours ago'], ['Kitchen speaker', '3 days ago']].map(d => '<div class="row"><span class="grow"><b>' + d[0] + '</b><span class="sub">Last used ' + d[1] + '</span></span>' + (d[1] === 'now' ? '<span class="badge ok">This one</span>' : '<button class="btn small quiet" data-toast="Signed out of ' + d[0] + '.">Sign out</button>') + '</div>').join('') + '</div><p class="small muted">Lost your login? Recovery codes, a backup passkey and help from a person. <button class="link small" data-toast="Recovery options: 2 codes left, backup passkey on your laptop.">Recovery</button></p></div>';
  h += '<div class="sect"><h2>Your data</h2><div class="btns"><button class="btn small" data-toast="Your data is being packed: account, history, playlists and purchases. We email a link when ready.">' + ic('download') + 'Download my data</button><button class="btn small quiet" data-sheet="rightslaw">Your rights</button><button class="btn small quiet" data-sheet="where">Where it is kept</button></div>' + swRow('Use my music and history to train AI', 'Off unless you choose. The co-op never sells music for training.', 'aiTrain', S.aiTrain) + '<p class="small muted">No adverts and no data sold, now or later: a promise only a vote of all members can change.</p></div>';
  h += '<div class="sect"><h2>AI and scripts</h2><div class="rows-in-sect"><button class="row" data-sheet="agent">' + ic('bot', 'inf') + '<span class="grow"><b>Your AI assistant</b><span class="sub">Can build playlists; asks you before buying or changing splits</span></span><i data-i="chev"></i></button><button class="row" data-sheet="commands">' + ic('code', 'app') + '<span class="grow"><b>Commands for scripts and AI</b><span class="sub">The same commands the app uses</span></span><i data-i="chev"></i></button></div></div>';
  h += '<div class="sect"><h2>Leave</h2><div class="btns"><button class="btn small dan" data-sheet="delete">Delete my account</button><button class="btn small quiet" data-sheet="estate">Who looks after our music</button></div></div>';
  $('#s-you').innerHTML = h;
}

/* ---------- Sheets ---------- */
const QR = (() => { let s = ''; for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) { const f = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13); const ring = f && !((x % 14 > 0 && x % 14 < 6 && y % 14 > 0 && y % 14 < 6) && !((x % 14 > 1 && x % 14 < 5 && y % 14 > 1 && y % 14 < 5))); const on = f ? ring : ((x * 7 + y * 13 + x * y) % 5 < 2); if (on) s += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>'; } return '<svg class="qr" viewBox="0 0 21 21" aria-label="QR code for the link (sample)">' + s + '</svg>'; })();
const SHEETS = {
  country: () => ({ t: 'Example country', b: '<div class="pad"><p class="small muted">Spare Music is for every country. Money, tax, collecting societies and the law differ, so each country gets its own rules pack. Pick one to change the sample.</p></div>' + Object.entries(COUNTRIES).map(([k, c]) => '<button class="row ' + (S.country === k ? 'sel' : '') + '" data-act="country" data-v="' + k + '"><span class="mono" style="width:26px">' + c.code + '</span><span class="grow"><b>' + c.name + '</b><span class="sub">' + c.sym + ' · ' + c.tax.n + ' · songs licensed by ' + c.soc + '</span></span>' + (S.country === k ? ic('check', 'app') : '') + '</button>').join('') }),
  join: () => ({ t: 'Join Spare Music', b: '<div class="pad"><p class="small muted">One Spareware login for every Spareware app. Free to join, no member shares.</p><label class="field"><span>Your name</span><input value="Wren Fermata"></label><div class="field"><span>What do you want to hear?</span>' + secSwitch() + '<span class="hint">Change it any time.</span></div><label class="check"><input type="checkbox" checked> <span class="small">I have read the <button class="link small" data-sheet="rules">rules in plain words</button>. I am over the minimum age in ' + C().name + ' (' + C().age + ').</span></label><button class="btn primary block" data-act="joined">' + ic('lock') + 'Continue with a passkey</button><p class="small muted">Your likes and queue on this device move into your account.</p></div>' }),
  firstrun: () => ({ t: 'How Spare Music works', b: '<div class="pad"><ol class="stepper"><li class="done"><b>Choose your sections</b><span class="sub">Human, AI or both. Every track says whether AI was used.</span></li><li class="done"><b>Listen</b><span class="sub">Free music and previews for everyone; the rest when you buy it or, if members choose one, with a pass.</span></li><li class="done"><b>See where the money goes</b><span class="sub">Every price shows tax, running costs and what reaches the artist.</span></li><li class="done"><b>Support the artists you love</b><span class="sub">Tips and monthly support reach them in full.</span></li></ol></div>' }),
  why: arg => ({ t: 'Why this was suggested', b: '<div class="pad"><p>' + esc(arg) + '</p><p class="small muted">Nobody can pay to be suggested, charted or placed higher. Rules are published and members can propose changes.</p><button class="btn small quiet" data-act="closesheet" data-toast="Suggestions off. Home shows only new releases from artists you follow and your playlists.">Turn suggestions off</button></div>' }),
  share: arg => ({ t: 'Share', b: '<div class="pad">' + QR + '<label class="field"><span>Link</span><input class="mono" readonly value="https://music.spareware.example/' + (arg === 'playlist' ? 'p/rainy-tuesday' : 'r/paper-lighthouse') + '"></label><p class="small muted">Opens in any browser with no app, and plays the free track and previews. No tracking of who opens it.</p><label class="field"><span>Embed on your website</span><textarea class="mono" rows="2" readonly>&lt;iframe src="https://music.spareware.example/embed/' + (arg === 'playlist' ? 'p/rainy-tuesday' : 'r/paper-lighthouse') + '"&gt;&lt;/iframe&gt;</textarea></label><button class="btn primary block" data-act="closesheet" data-toast="Link copied.">Copy link</button></div>' }),
  track: id => ({ t: TRACKS[id].t, b: '<div class="rows-in-sect" style="padding:0 var(--s2)">' + [['play', 'Play next', 'Added to play next.'], ['plus', 'Add to a playlist', 'Added to Band demos.'], ['heart', S.saved[id] ? 'Remove from library' : 'Save to library', S.saved[id] ? 'Removed from your library.' : 'Saved to your library.'], ['share', 'Share', 'Link copied.']].map(x => '<button class="row" data-act="closesheet" data-toast="' + x[2] + '">' + ic(x[0]) + '<span class="grow">' + x[1] + '</span></button>').join('') + '<button class="row" data-sheet="wrongsec" data-arg="' + id + '">' + ic('spark') + '<span class="grow">Wrong section?<span class="sub">Flag it for a moderator</span></span></button><button class="row" data-act="hideartist" data-v="' + esc(tart(id).name) + '">' + ic('eyeoff') + '<span class="grow">Hide ' + esc(tart(id).name) + '</span></button><button class="row" data-sheet="report" data-arg="' + id + '">' + ic('flag') + '<span class="grow">Report</span></button></div>' }),
  wrongsec: id => ({ t: 'Flag a wrong section', b: '<div class="pad"><p>"' + esc(TRACKS[id].t) + '" is in the <b>' + (tsec(id) === 'ai' ? 'AI' : 'Human') + '</b> section.</p><div class="chips" data-single><button class="chip" aria-pressed="true">I think AI was used</button><button class="chip">I think no AI was used</button></div><label class="field"><span>What makes you think so? (optional)</span><input placeholder="For example, the vocals at 1:20"></label><p class="small muted">A moderator decides, with the reason in the public log. Detection signals are only hints. The artist can appeal.</p><button class="btn primary block" data-act="closesheet" data-toast="Flag sent. You will see the decision in the public log.">Send</button></div>' }),
  report: id => ({ t: 'Report', b: '<div class="pad"><p class="muted">Spare Music removes only what the law requires, plus a few rules artists voted for. Music you just dislike stays up; hide it instead.</p><div class="field"><span>Which rule does it break?</span><div class="rows-in-sect">' + ['Copies someone else\'s music', 'Poses as another artist', 'Imitates a real voice without consent', 'Illegal material', 'A credible threat', 'Noise or spam made to farm plays'].map((r, i) => '<label class="row"><input type="radio" name="rr"' + (i === 0 ? ' checked' : '') + '> ' + r + '</label>').join('') + '</div></div><label class="check"><input type="checkbox"> <span class="small">Also hide this artist for me</span></label><button class="btn primary block" data-act="closesheet" data-toast="Report sent. We tell you what was decided and why.">Send report</button><p class="small muted">Rights holders and people without an account can use the public forms.</p></div>' }),
  rights: () => ({ t: 'Rights declaration', b: '<div class="pad"><dl class="kv"><dt>Recording</dt><dd>Owned by The Lantern Moths</dd><dt>Songs 1 to 5, 7, 8</dt><dd>Juno Halftone 50% (' + C().socs[0] + '), Ash Lumen 50% (no society)</dd><dt>Song 6</dt><dd>Cover of "Ferry at Dusk" by Harbour Ghosts</dd><dt>Samples</dt><dd>None</dd><dt>AI use</dt><dd>Track 7: AI-assisted mastering. Others: none.</dd><dt>Lyrics</dt><dd>Supplied by the songwriters</dd><dt>Declared</dt><dd>1 Oct 2026, by Juno Halftone</dd></dl><p class="small muted">Spare Music holds only the rights it needs to stream and sell. Everything else stays with the band.</p></div>' }),
  verify: () => ({ t: 'Verified artist', b: '<div class="pad"><p>This page is run by the band or people acting for them. Checked with an identity check for one member, a link from the band\'s own website, and a business check for their label.</p><p class="small muted">Releases credited to a verified artist need their approval, so nobody can release music as them. The badge is lost if the checks lapse or the page is used to pose as someone else.</p></div>' }),
  mailing: () => ({ t: 'Mailing list', b: '<div class="pad"><p>Get emails from The Lantern Moths. The band keeps the list and can take it anywhere; you can leave with one click.</p><label class="field"><span>Email</span><input value="wren@example.org"></label><button class="btn primary block" data-act="closesheet" data-toast="Joined. Your consent is recorded and you can leave any time.">Join the list</button></div>' }),
  tip: () => ({ t: 'Send a tip', b: '<div class="pad"><div class="chips" data-single>' + [2, 5, 10].map(v => '<button class="chip">' + money(price(v)) + '</button>').join('') + '</div><p class="small muted">All of it reaches the band. The card cost is carried as a running cost on the open cost ledger.</p><button class="btn primary block" data-act="closesheet" data-toast="Tip sent. All of it reaches The Lantern Moths.">Send</button></div>' }),
  refund: () => ({ t: 'Refund rules', b: '<div class="pad"><p>Bought the wrong thing, or a file is broken? Ask within 14 days. Music you have not downloaded is refunded in full. A broken file is replaced or refunded.</p><p class="small muted">Plus any rights consumer law gives you in ' + C().name + '. Card disputes are handled by the payment provider\'s published rules.</p></div>' }),
  stores: () => ({ t: 'Buying on phones', b: '<div class="pad"><p>App stores can require their own payment, with a cut of 15 to 30%. Spare Music never hides that cut in an artist\'s price.</p><p class="small muted">So in the phone apps you buy on the web, or follow a link out where the store allows it, as music apps may. In the United States apps may link to web purchases. Rules differ by country and are checked for each one.</p></div>' }),
  purchase: k => ({ t: RELEASES[k].title, b: '<div class="rows-in-sect" style="padding:0 var(--s2)"><button class="row" data-act="closesheet" data-toast="Download started: FLAC with tags, artwork and lyrics.">' + ic('download') + '<span class="grow">Download again</span></button><button class="row" data-act="closesheet" data-toast="Receipt opened, with the tax and running costs shown.">' + ic('ledger') + '<span class="grow">Receipt</span></button><button class="row" data-sheet="refundask">' + ic('coin') + '<span class="grow">Ask for a refund</span></button></div>' }),
  refundask: () => ({ t: 'Ask for a refund', b: '<div class="pad"><div class="chips" data-single><button class="chip" aria-pressed="true">Bought by mistake</button><button class="chip">A file is broken</button><button class="chip">Something else</button></div><p class="small muted">Not yet downloaded, so it is refunded in full within 5 working days. The band is told, and the running cost of the sale is not taken from them.</p><button class="btn primary block" data-act="closesheet" data-toast="Refund requested. Reference RF-2026-0418.">Ask for the refund</button></div>' }),
  exportbought: () => ({ t: 'Download everything you bought', b: '<div class="pad"><div class="chips" data-single><button class="chip" aria-pressed="true">FLAC</button><button class="chip">Opus</button><button class="chip">MP3</button></div><p class="small muted">2 releases, 9 tracks, about 610 MB as FLAC, with tags, artwork and lyrics. Playlists come as M3U and XSPF files. No lock: yours to keep and play anywhere.</p><button class="btn primary block" data-act="closesheet" data-toast="Packing your music. A download link appears when it is ready.">Download</button></div>' }),
  s2o: () => { const c = C(); const p = price(1.5); let s = 0; const rows = []; for (let k = 0; k < 9; k++) { const v = p * Math.pow(2, k) / 511; s += v; rows.push('<tr><td>Play ' + (k + 1) + '</td><td class="n">' + money(v) + '</td><td class="n">' + money(s) + '</td></tr>'); } return { t: 'Stream to own', b: '<div class="pad"><span class="badge n">next</span><p class="small muted">Each play of a ' + money(p) + ' track costs twice the one before, until the ninth play makes it yours. The method a music co-op used until it closed in 2024. Billed monthly after use.</p><table class="tbl"><tr><th>Play</th><th class="n">Costs</th><th class="n">Paid so far</th></tr>' + rows.join('') + '</table></div>' }; },
  charts: () => ({ t: 'How charts are counted', b: '<div class="pad"><p>Weekly, per country and genre: plays that counted (after 30 seconds), purchases, and number of listeners. One listener counts at most 10 plays of a track a day.</p><p class="small muted">This week 48,312 plays were left out as fake in ' + C().name + '. Nobody can pay to be charted.</p></div>' }),
  privlink: () => ({ t: 'Private preview link', b: '<div class="pad"><label class="field"><span>Who is it for?</span><input value="A radio presenter"></label><label class="field"><span>Expires</span><select><option>In 14 days</option><option>On release day</option></select></label><p class="small muted">Streaming only, no download. Each link is logged with who it was sent to.</p><button class="btn primary block" data-act="closesheet" data-toast="Private link made and copied. Expires in 14 days.">Make the link</button></div>' }),
  takedown: () => ({ t: 'Take down Paper Lighthouse?', b: '<div class="pad"><p>It stops playing at once and leaves caches straight away. The masters are deleted from storage after 30 days, except copies the law or buyers\' downloads need.</p><p class="small muted">The 77 people who bought it keep their downloads and are told. You can put it back within the 30 days.</p><button class="btn dan block" data-act="closesheet" data-toast="Not taken down: this is a demo. In the app it would come down now and be logged in the team log.">Take it down</button></div>' }),
  refs: () => ({ t: 'Reference fingerprints', b: '<div class="pad"><p>Add fingerprints of your recordings, including ones not on Spare Music, so copies are caught. Only the fingerprint is kept, never the audio.</p><p class="small muted">12 recordings protected. New references are checked against everything already up, and matches go to a person.</p><button class="btn primary block" data-act="closesheet" data-toast="3 more recordings fingerprinted on your device. 1 match found in the catalogue and sent for review.">Add recordings</button></div>' }),
  teamlog: () => ({ t: 'Team log', b: '<div class="pad"><table class="tbl">' + [['19 Oct', 'Juno Halftone', 'Started the Night Ferry EP draft'], ['18 Oct', 'Lamplit Records', 'Changed the price of Paper Lighthouse'], ['4 Oct', 'Ash Lumen', 'Corrected the title of track 5'], ['1 Oct', 'Juno Halftone', 'Signed the rights declaration']].map(r => '<tr><td class="mono">' + r[0] + '</td><td>' + r[1] + '<span class="sub">' + r[2] + '</span></td></tr>').join('') + '</table></div>' }),
  estate: () => ({ t: 'Who looks after our music', b: '<div class="pad"><p>Name who looks after your catalogue and earnings if you die. Releases stay up, and earnings go to the estate once it proves its right.</p><label class="field"><span>Contact</span><input placeholder="Name and email"></label><button class="btn primary block" data-act="closesheet" data-toast="Saved. They are told only when needed.">Save</button></div>' }),
  dispute: () => ({ t: 'Saltwater Letters: held', b: '<div class="pad"><p>Mika Downbeat says they co-wrote the bridge and should have a songwriting share. Only this track\'s earnings are held; the rest of your money is paid as normal.</p><ol class="stepper"><li class="done">Disagreement raised, 12 Oct</li><li class="now">Settle it between you<span class="sub">Offer a share, or add evidence such as demos</span></li><li class="todo">A member panel decides if you cannot agree</li></ol><div class="btns mt"><button class="btn small" data-act="closesheet" data-toast="Offer sent to Mika: 10% of the songwriting share for this track.">Make an offer</button><button class="btn small quiet" data-act="closesheet" data-toast="Evidence added: the demo from March.">Add evidence</button></div></div>' }),
  rules: () => ({ t: 'The rules, in plain words', b: '<div class="pad"><p class="small muted">Laws are applied as they stand in each country. Version 1.0, voted by artists on 1 September 2026; removing only what the law requires is a promise only all members can change.</p></div>' + [['Music that infringes copyright, or illegal material', 'Removed after a valid notice or a reviewed match, as the law asks.'], ['Matches are reviewed by people', 'A fingerprint match holds an upload; a person decides.'], ['No posing as another artist', 'Releases on a verified artist\'s page need their approval.'], ['AI use is declared truthfully', 'Wrong answers are moved, with the reason logged.'], ['Real voices only with consent', 'An AI copy of a real voice needs that person\'s consent.'], ['Noise and spam', 'Tracks made only to farm plays are removed, and their plays left out.']].map((r, i) => '<div class="row" style="display:block"><b><span class="mono muted">' + (i + 1) + '.</span> ' + r[0] + '</b><span class="sub">' + r[1] + '</span></div>').join('') }),
  ladder: () => ({ t: 'Steps before a ban', b: '<div class="pad"><div class="ladder"><div class="here"><b>1</b>Warning</div><div><b>2</b>30 days</div><div><b>3</b>90 days</div><div><b>4</b>Ban</div></div><p class="small muted">The same steps for everyone, for upheld breaches such as uploading other people\'s music. Each step expires after a year. Every step can be appealed, and a ban can be lifted.</p></div>' }),
  help: () => ({ t: 'Help', b: '<div class="pad"><input placeholder="Search help" aria-label="Search help"><div class="rows-in-sect mt">' + ['How do songwriting shares work?', 'Why is my upload held?', 'How is the running cost worked out?', 'How do I join a collecting society?'].map(q => '<button class="row" data-act="closesheet" data-toast="Help page opened.">' + q + '</button>').join('') + '</div><button class="btn small quiet" data-act="closesheet" data-toast="Message sent. A person answers, usually within a day.">Ask a person</button></div>' }),
  bug: () => ({ t: 'Report a bug', b: '<div class="pad"><label class="field"><span>What went wrong?</span><textarea rows="3" placeholder="What you did, and what happened"></textarea></label><label class="check"><input type="checkbox" checked> <span class="small">Include the screen and app version</span></label><p class="small muted">It goes straight to the Spareware repo as an issue, so a contributor can fix it. No GitHub account needed; you can follow it until it is fixed.</p><button class="btn primary block" data-act="closesheet" data-toast="Bug filed as a public issue. You will get a link to follow it.">Send</button></div>' }),
  terms: () => ({ t: 'Terms in plain words', b: '<div class="pad"><p><b>Listeners:</b> play, buy and support; what you buy is yours to keep. <b>Artists:</b> you keep everything except running costs, give Spare Music only the rights it needs to stream and sell, and promise your declarations are true.</p><p class="small muted">The legal body that runs the service, and the law that applies, are set for each country.</p></div>' }),
  credits: () => ({ t: 'Open source we use', b: '<div class="pad"><table class="tbl">' + [['Symphonia', 'MPL-2.0', 'audio decoding'], ['cpal', 'Apache-2.0', 'audio output'], ['libopus', 'BSD-3-Clause', 'streaming format'], ['libFLAC', 'BSD-style', 'lossless format'], ['c2pa-rs', 'MIT or Apache-2.0', 'content credentials'], ['MusicBrainz core data', 'CC0', 'codes and credits']].map(r => '<tr><td>' + r[0] + '<span class="sub">' + r[2] + '</span></td><td class="n">' + r[1] + '</td></tr>').join('') + '</table><p class="small muted">Planned, from the licence register. We learned from Funkwhale, Navidrome, Ampache and Mirlo by reading them; their GPL and AGPL code is never copied.</p></div>' }),
  rightslaw: () => ({ t: 'Your rights', b: '<div class="pad"><p class="small muted">Example: ' + C().name + '. In each country you get the rights its law gives.</p><p class="small">Under ' + C().privacy + ' you can ask to see what Spare Music holds about you, correct it or delete it. We answer within ' + C().privDays + '.</p><div class="btns"><button class="btn small" data-act="closesheet" data-toast="Request sent. Reference PRV-2026-0311.">Ask to see it</button><button class="btn small" data-act="closesheet" data-toast="Correction request sent.">Correct it</button></div><p class="small muted">Not happy with our answer? Complain to ' + C().regulator + '.</p></div>' }),
  where: () => ({ t: 'Where your data is kept', b: '<div class="pad"><p>Account and history on co-op servers in the region you choose. Music files in storage in two places. Payments with a regulated payment provider.</p><p class="small muted">Every company that handles your data is on a public list, with what it does and where.</p></div>' }),
  agent: () => ({ t: 'Your AI assistant', b: '<div class="pad"><p>Connected through the Spare Music MCP server. Everything it does is labelled as an agent and logged.</p>' + [['Read my library and history', true], ['Make playlists for me', true], ['Buy music', false], ['Change splits or payouts', false]].map(p => '<div class="swrow"><span class="grow">' + p[0] + (p[1] ? '' : '<span class="sub">Always asks you first</span>') + '</span><span class="badge ' + (p[1] ? 'ok' : 'n') + '">' + (p[1] ? 'Allowed' : 'Ask me') + '</span></div>').join('') + '<p class="small muted">Votes, appeals, rights declarations and split approvals are for people only. Titles and lyrics reach the agent as data, never as instructions.</p></div>' }),
  commands: () => ({ t: 'Commands for scripts and AI', b: '<div class="pad"><p class="small muted">Everything the app does is a command anyone can call, with the same permissions.</p><div class="code">music.play({ release: "paper-lighthouse", track: 4 })\nmusic.library.save({ track: "pl4" })\nmusic.release.declare({ track: 7, ai: "assisted", parts: ["mastering"] })\nmusic.splits.propose({ track: 2, shares: { juno: 35, ash: 35, mika: 20, tui: 10 } })\nmusic.catalogue.get("paper-lighthouse")\n  { title, artist, tracks: 8, credits, rights, splits, codes, version: 2 }</div><p class="small muted">One catalogue holds every release, track, credit and right, so the app, scripts and agents all read the same record.</p></div>' }),
  delete: () => ({ t: 'Delete your account', b: '<div class="pad"><p>Everything is deleted after a 14-day grace period. Artists are paid what is owed first. Music you bought stays downloadable until then; download it now to keep it.</p><button class="btn dan block" data-act="closesheet" data-toast="Not deleted: this is a demo.">Delete my account</button></div>' })
};
function openSheet(name, arg) { const f = SHEETS[name]; if (!f) return; const s = f(arg); $('#sheetTitle').textContent = s.t; $('#sheetBody').innerHTML = s.b; paint($('#sheetBody')); $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('open'); }
function closeSheet() { $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('open'); }
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3400); }

/* ---------- Actions ---------- */
function cur() { return (location.hash || '#home').slice(1); }
const RENDER = { home: renderHome, search: renderSearch, album: renderAlbum, artist: renderArtist, playlist: renderPlaylist, player: renderPlayer, library: renderLibrary, buy: renderBuy, pass: renderPass, upload: renderUpload, dash: renderDash, earnings: renderEarnings, modlog: renderModlog, coop: renderCoop, you: renderYou };
function refreshCurrent() { const id = SCREENS.find(x => x.id === cur()) ? cur() : 'home'; if (RENDER[id]) { const v = $('#view'); const top = v.scrollTop; RENDER[id](); paint($('#s-' + id)); v.scrollTop = top; } }
const ACT = {
  drawer() { $('#nav').classList.toggle('open'); },
  assess() { renderAssess(); $('#assess').hidden = false; $('#assessScrim').hidden = false; },
  assessclose() { $('#assess').hidden = true; $('#assessScrim').hidden = true; },
  closesheet() { closeSheet(); },
  sec(b) { S.sec = b.dataset.v; refreshCurrent(); if ($('#sheet').classList.contains('open')) $$('#sheetBody [data-act="sec"]').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === S.sec)); toast(S.sec === 'both' ? 'Both sections, each marked.' : 'Only the ' + (S.sec === 'human' ? 'Human' : 'AI') + ' section. Change it any time.'); },
  country(b) { setCountry(b.dataset.v); closeSheet(); },
  joindismiss() { S.joinSeen = true; refreshCurrent(); },
  joined() { S.joinSeen = true; closeSheet(); refreshCurrent(); toast('Joined with your Spareware passkey. Your likes and queue moved into your account.'); },
  play(b) { playTrack(b.dataset.id); },
  playrel(b) { const r = RELEASES[b.dataset.rel]; const ids = r.tracks.filter(id => inSec(tsec(id)) && tavail(id)); if (!ids.length) { toast('Nothing in this release plays in your sections.'); return; } S.queue = ids; playTrack(ids[0]); const sk = r.tracks.length - ids.length; if (sk) toast(sk + ' track' + (sk > 1 ? 's' : '') + ' skipped: not in your sections or not licensed here.'); },
  playpl() { const ids = PLAYLIST.items.map(x => x[0]).filter(id => inSec(tsec(id)) && tavail(id)); S.queue = ids; playTrack(ids[0]); },
  toggle() { S.playing = !S.playing; renderMini(); if (cur() === 'player') { const bp = $('#bigPlay'); if (bp) { bp.innerHTML = ic(S.playing ? 'pause' : 'play'); bp.setAttribute('aria-label', S.playing ? 'Pause' : 'Play'); } } },
  next() { const q = S.queue; let i = q.indexOf(S.cur); let nx = q[(i + 1) % q.length]; if (S.shuffle) nx = q[Math.floor(Math.random() * q.length)]; const gap = TRACKS[nx] && TRACKS[nx].gapless && TRACKS[S.cur].gapless; playTrack(nx, true); if (gap) toast('No gap: these tracks run together, as the band made them.'); },
  prev() { if (S.t > 3) { S.t = 0; } else { const q = S.queue; const i = q.indexOf(S.cur); S.cur = q[(i - 1 + q.length) % q.length]; S.t = 0; S.heard = 0; S.counted = false; } renderMini(); if (cur() === 'player') renderPlayer(); paint(); },
  shuffle() { S.shuffle = !S.shuffle; renderPlayer(); paint($('#s-player')); toast(S.shuffle ? 'Shuffle on: every track plays once before any repeats.' : 'Shuffle off.'); },
  repeat() { S.repeat = !S.repeat; renderPlayer(); paint($('#s-player')); },
  pltab(b) { S.plTab = b.dataset.v; $$('#s-player [data-act="pltab"]').forEach(x => x.setAttribute('aria-selected', x.dataset.v === S.plTab)); renderPlTab(); },
  quality(b) { S.quality = b.dataset.v; renderPlTab(); toast('Quality: ' + S.quality + '. ' + QUAL[S.quality] + '.'); },
  qmove(b) { const i = +b.dataset.i; const j = i + (+b.dataset.d); if (j < 0 || j >= S.queue.length) return; [S.queue[i], S.queue[j]] = [S.queue[j], S.queue[i]]; renderPlTab(); },
  sw(b) { const k = b.dataset.k; const on = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', on);
    if (k in S && typeof S[k] === 'boolean') S[k] = on;
    if (k === 'large') $('#phone').classList.toggle('large', on);
    if (k === 'contrast') $('#phone').classList.toggle('contrast', on);
    const msg = { loud: on ? 'Even loudness on.' : 'Even loudness off: tracks play as mastered.', private: on ? 'Private listening on. Plays still pay artists.' : 'Private listening off.', explicit: on ? 'Explicit lyrics skipped from now on.' : 'Explicit lyrics play again.', aiTrain: on ? 'You allowed AI training. Change it any time.' : 'Kept out of AI training.', histOn: on ? 'History on.' : 'History paused. Nothing new is kept.' }[k];
    if (msg) toast(msg); },
  offline(b) { const k = b.dataset.rel; S.offline[k] = !S.offline[k]; refreshCurrent(); if (cur() === 'player') renderPlTab(); toast(S.offline[k] ? 'Saved for offline, kept up to date.' : 'Removed from this device.'); },
  follow() { S.follow.moths = !S.follow.moths; renderArtist(); paint($('#s-artist')); toast(S.follow.moths ? 'Following. New releases come to you in time order.' : 'Unfollowed.'); },
  followpl() { S.followPl = !S.followPl; renderPlaylist(); paint($('#s-playlist')); },
  arttab(b) { ARTTAB = b.dataset.v; renderArtist(); paint($('#s-artist')); },
  pledit() { PLEDIT = !PLEDIT; renderPlaylist(); paint($('#s-playlist')); },
  plmove(b) { const i = +b.dataset.i; const j = i + (+b.dataset.d); if (j < 0 || j >= PLAYLIST.items.length) return; [PLAYLIST.items[i], PLAYLIST.items[j]] = [PLAYLIST.items[j], PLAYLIST.items[i]]; renderPlaylist(); paint($('#s-playlist')); },
  libtab(b) { S.libTab = b.dataset.v; renderLibrary(); paint($('#s-library')); },
  clearhist() { S.hist = []; renderLibrary(); paint($('#s-library')); toast('History cleared.'); },
  stype(b) { S.stype = b.dataset.v; renderSearch(); paint($('#s-search')); },
  genre(b) { S.srch = ''; S.stype = 'all'; toast(b.dataset.v + ': ' + (b.dataset.v === 'Anywhere' ? 'every place' : 'releases tagged by their artists') + '. Sorted newest first, no paid placement.'); },
  fmt(b) { S.fmt = b.dataset.v; renderBuy(); paint($('#s-buy')); },
  buy() { const p = Math.max(price(RELEASES.lighthouse.min), Number(S.pwyl) || 0); toast('Paid ' + money(p) + '. Receipt sent; Paper Lighthouse is in your library to keep.'); },
  tip(b) { toast('Tip of ' + money(price(+b.dataset.v)) + ' sent. All of it reaches The Lantern Moths.'); },
  support(b) { S.supportTier = S.supportTier === b.dataset.v ? null : b.dataset.v; renderBuy(); paint($('#s-buy')); toast(S.supportTier ? 'Supporting as ' + S.supportTier + '. Cancel in one step any time.' : 'Support cancelled.'); },
  passmode(b) { S.passMode = b.dataset.v; renderPass(); paint($('#s-pass')); },
  upstep(b) { S.up.step = +b.dataset.v; renderUpload(); paint($('#s-upload')); $('#view').scrollTop = 0; },
  upnext() { S.up.step = Math.min(6, S.up.step + 1); renderUpload(); paint($('#s-upload')); $('#view').scrollTop = 0; },
  uppause() { S.up.paused = !S.up.paused; renderUpload(); paint($('#s-upload')); toast(S.up.paused ? 'Paused. It picks up from the same place.' : 'Resumed.'); },
  updrop() { S.up.paused = true; renderUpload(); paint($('#s-upload')); toast('Connection lost. Nothing is lost; it resumes from the last chunk when you are back.'); setTimeout(() => { S.up.paused = false; if (cur() === 'upload') { renderUpload(); paint($('#s-upload')); } toast('Back online. Upload resumed.'); }, 2500); },
  upai(b) { S.up.ai[b.dataset.n] = b.dataset.v; renderUpload(); paint($('#s-upload')); },
  upvoice(b) { S.up.voice = b.checked; renderUpload(); paint($('#s-upload')); },
  upwork(b) { S.up.work = b.dataset.v; if (b.dataset.v === 'sample') S.up.sample = true; renderUpload(); paint($('#s-upload')); },
  upcheck() { S.up.checked = true; S.up.held = true; renderUpload(); paint($('#s-upload')); toast(S.up.sample ? 'Checked. The match is your declared sample; a moderator confirms the agreements.' : 'Checked. Track 3 matches another recording and is held for a person to review.'); },
  updeclaresample() { S.up.sample = true; S.up.work = 'sample'; renderUpload(); paint($('#s-upload')); toast('Declared as a cleared sample. A moderator checks both agreements.'); },
  uprelease() { toast('Scheduled for 6 Nov at midnight in each time zone. Pre-orders open now.'); },
  thank(b) { toast('Thank-you note sent to ' + b.dataset.v + '.'); },
  modf(b) { S.modf = b.dataset.v; renderModlog(); paint($('#s-modlog')); },
  appeal() { S.appeal = Math.min(4, S.appeal + 1); renderModlog(); paint($('#s-modlog')); toast(['', 'Appeal sent. A different moderator looks at it within 7 days.', 'Second moderator could not decide. A member panel of five is drawn at random.', 'The panel is hearing it. You can add session files as evidence.', 'Decided: restored to the Human section. Logged in public.'][S.appeal]); },
  vote(b) { S.votes[b.dataset.k] = b.dataset.v; renderCoop(); paint($('#s-coop')); toast('Vote recorded. One vote per person; you can change it until the vote closes.'); },
  hideartist(b) { if (!S.hidden.includes(b.dataset.v)) S.hidden.push(b.dataset.v); closeSheet(); refreshCurrent(); toast(b.dataset.v + ' hidden everywhere. Undo in You.'); },
  unhide() { S.hidden = []; refreshCurrent(); toast('Hidden artists shown again.'); }
};
const INPUT = {
  srch(el) { S.srch = el.value; renderSearch(); paint($('#s-search')); const i = $('#srchIn'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); },
  seek(el) { S.t = +el.value; $('#tNow').textContent = mmss(S.t); syncLyrics(); const mp = $('#miniProg'); if (mp) mp.style.width = (S.t / TRACKS[S.cur].d * 100) + '%'; },
  pwyl(el) { S.pwyl = el.value; const min = price(RELEASES.lighthouse.min); const p = Math.max(min, Number(el.value) || 0); $('#bdBox').innerHTML = bdTable(breakdown(p), 'The Lantern Moths'); const btn = $('#s-buy [data-act="buy"]'); if (btn) btn.innerHTML = ic('lock') + 'Pay ' + money(C().tax.incl ? p : breakdown(p).total); },
  upsplit(el) { S.up.splits[+el.dataset.i] = Number(el.value) || 0; const sum = S.up.splits.reduce((a, x) => a + x, 0); $('#splitSum').textContent = sum + '%'; const hnt = $('#splitHint'); hnt.textContent = sum === 100 ? 'Adds up to 100%.' : 'Must add up to 100%.'; hnt.className = 'hint ' + (sum === 100 ? 'ok' : 'dan'); },
  upsoc(el) { S.up.writers[+el.dataset.i][1] = el.value; }
};
function setCountry(k) {
  if (!COUNTRIES[k]) return; S.country = k; S.pwyl = null; const c = C();
  $('#headCountry').value = k; $('#ctryBtn').innerHTML = ic('globe', 'sm') + c.code; $('#ctryBtn').setAttribute('aria-label', 'Example country: ' + c.name + '. Change it');
  const nc = $('#navCountry'); if (nc) nc.value = k;
  refreshCurrent(); renderMini(); toast('Example country: ' + c.name + '. Money, tax, societies and the law follow its rules pack.');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act], [data-sheet], [data-go], [data-toast]'); if (!t) return;
  if (t.tagName === 'A' && t.getAttribute('href') && t.getAttribute('href').startsWith('#') && !t.dataset.act) return;
  if (t.dataset.act && ACT[t.dataset.act]) ACT[t.dataset.act](t, e);
  if (t.dataset.sheet) openSheet(t.dataset.sheet, t.dataset.arg);
  if (t.dataset.go) { if (t.dataset.rel) CUR_REL = t.dataset.rel; closeSheet(); if (cur() === t.dataset.go) show(t.dataset.go); else location.hash = t.dataset.go; }
  if (t.dataset.toast) toast(t.dataset.toast);
});
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && INPUT[el.dataset.input]) INPUT[el.dataset.input](el); });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && el.dataset.change === 'country') setCountry(el.value); });
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'Escape') { closeSheet(); ACT.assessclose(); }
  if (cur() === 'player') {
    if (e.key === ' ') { e.preventDefault(); ACT.toggle(); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { S.t = Math.max(0, Math.min(TRACKS[S.cur].d - 1, S.t + (e.key === 'ArrowRight' ? 10 : -10))); const sk = $('#seek'); if (sk) { sk.value = S.t; $('#tNow').textContent = mmss(S.t); } syncLyrics(); }
  }
});
setInterval(tick, 1000);
setInterval(() => { const U = S.up; if (cur() === 'upload' && U.step === 0 && !U.paused && U.files < 102) { U.files = Math.min(102, U.files + 6); renderUpload(); paint($('#s-upload')); } }, 400);

/* ---------- Router, nav, about, assess ---------- */
function renderNav() {
  let h = '', g = '';
  SCREENS.forEach((s, i) => { if (s.g !== g) { g = s.g; h += '<div class="label">' + GROUPS[g] + '</div>'; } h += '<a href="#' + s.id + '" data-id="' + s.id + '"><span class="num">' + String(i + 1).padStart(2, '0') + '</span><span>' + s.t + '</span></a>'; });
  h += '<div class="navctry"><div class="label">Example country</div><select id="navCountry" data-change="country" aria-label="Example country">' + Object.entries(COUNTRIES).map(([k, c]) => '<option value="' + k + '"' + (S.country === k ? ' selected' : '') + '>' + c.name + '</option>').join('') + '</select></div>';
  h += '<div class="navfoot">A demo with sample data and made-up artists. Every button does something you can see. Use <b>Assess this demo</b> for the questions to judge it by.<p class="mt">Spare Music is for every country. Money, tax, collecting societies and the law differ, so each country gets its own rules pack; switch the example country to see six.</p></div>';
  $('#nav').innerHTML = h;
}
function renderAbout(s) {
  let h = '<div class="label">This screen</div><h3>' + s.t + '</h3><p>' + s.about + '</p>';
  h += '<div class="label">Try this</div><ul class="try">' + s.try.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  h += '<div class="label">Core features shown</div><ul>' + s.f.map(id => '<li><span class="mono">MUS-' + id + '</span>' + fname(id) + '</li>').join('') + '</ul>';
  if (s.x && s.x.length) h += '<div class="label">Also shown (next or later)</div><ul>' + s.x.map(id => '<li><span class="mono">MUS-' + id + ' · ' + (DATA.feats[id] ? DATA.feats[id][1] : '') + '</span>' + fname(id) + '</li>').join('') + '</ul>';
  $('#about').innerHTML = h;
}
function renderAssess() {
  const shown = new Set(); SCREENS.forEach(s => s.f.forEach(id => shown.add(id)));
  const core = Object.keys(DATA.feats).filter(id => DATA.feats[id][1] === 'core');
  const missing = core.filter(id => !shown.has(id));
  let h = '<p>A clickable demo with sample data and made-up artists, for judging the design and how much of the map it covers. It is not the real app. <a href="https://github.com/spareware-co-op/spareware/blob/main/projects/spare-music/FEATURES.md" target="_blank" rel="noopener">Feature map: FEATURES.md</a></p>';
  h += '<p class="small muted">Spare Music is for every country. Money, tax, collecting societies and the law use six example countries; each country gets its own rules pack, checked by a lawyer. Nothing here is legal or tax advice.</p>';
  h += '<div class="label">Questions to assess (from the feature map)</div><ol>' + DATA.assess.map(q => '<li>' + esc(q) + '</li>').join('') + '</ol>';
  h += '<div class="label">Core features shown, by area</div><table class="cov">' + DATA.areas.map(a => { const c = core.filter(id => id.startsWith(a[0] + '-')); const n = c.filter(id => shown.has(id)).length; return '<tr><td class="id">MUS-' + a[0] + '</td><td>' + a[1] + '</td><td class="mono">' + (c.length ? n + ' of ' + c.length : 'no core features') + '</td></tr>'; }).join('') + '</table>';
  h += '<p class="small">' + (missing.length ? 'Core features not shown yet: ' + missing.map(id => 'MUS-' + id + ' ' + fname(id)).join('; ') + '.' : 'All ' + core.length + ' core features appear on at least one screen.') + '</p>';
  h += '<div class="label mt2">What each screen shows</div>' + SCREENS.map((s, i) => '<div class="scrcov"><a href="#' + s.id + '" data-act="assessclose">' + (i + 1) + '. ' + s.t + '</a> <span class="badge n">' + GROUPS[s.g] + '</span><ul>' + s.f.map(id => '<li><span class="mono">MUS-' + id + '</span>' + fname(id) + '</li>').join('') + (s.x || []).map(id => '<li><span class="mono">MUS-' + id + '</span>' + fname(id) + ' <span class="badge n">' + DATA.feats[id][1] + '</span></li>').join('') + '</ul></div>').join('');
  $('#assessBody').innerHTML = h; paint($('#assessBody'));
}
function show(id) {
  let s = SCREENS.find(x => x.id === id); if (!s) s = SCREENS[0];
  $$('.scr').forEach(el => { el.hidden = el.id !== 's-' + s.id; });
  $('#crumb').textContent = s.id === 'album' ? RELEASES[CUR_REL].title : s.crumb;
  $$('#nav a').forEach(a => a.dataset.id === s.id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $$('.tabbar a').forEach(a => a.dataset.tab === s.tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $('#view').scrollTop = 0; closeSheet(); $('#nav').classList.remove('open');
  $('#mini').hidden = s.id === 'player';
  renderAbout(s); if (RENDER[s.id]) RENDER[s.id](); paint($('#s-' + s.id));
}
window.addEventListener('hashchange', () => show(cur()));
$('#headCountry').innerHTML = Object.entries(COUNTRIES).map(([k, c]) => '<option value="' + k + '">' + c.name + '</option>').join('');
renderNav(); setCountryQuiet();
function setCountryQuiet() { const c = C(); $('#headCountry').value = S.country; $('#ctryBtn').innerHTML = ic('globe', 'sm') + c.code; }
renderMini(); show(cur()); paint();
</script>
