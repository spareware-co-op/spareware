[package]
name = "kit-accounts"
version = "0.0.0"
edition = "2024"
publish = false
license = "MPL-2.0"
# In the test stack's workspace, not the root one: note K08 says why.
workspace = "../../test-stack"

# Every version is pinned here and by the workspace's Cargo.lock. deny.toml there checks licences.
[dependencies]
kit-core = { path = "../../crates/kit-core" }
kit-ops = { path = "../../crates/kit-ops" }
kit-store = { path = "../../crates/kit-store" }
kit-sync = { path = "../../crates/kit-sync" }
base64 = "=0.22.1"                 # MIT OR Apache-2.0
cedar-policy = "=4.14.0"           # Apache-2.0
openidconnect = { version = "=4.0.1", default-features = false }   # MIT
rand = "=0.9.2"                    # MIT OR Apache-2.0
reqwest = { version = "=0.13.1", default-features = false, features = ["rustls"] }  # MIT OR Apache-2.0
serde = { version = "=1.0.229", features = ["derive"] }  # MIT OR Apache-2.0
serde_json = "=1.0.154"            # MIT OR Apache-2.0
tokio = { version = "=1.54.1", features = ["sync"] }  # MIT

[dev-dependencies]
kit-store = { path = "../../crates/kit-store", features = ["memory"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
