[package]
name = "kit-ops"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
kit-core = { path = "../kit-core" }
# serde and serde_json write log entries, the format that is kept forever. MIT OR Apache-2.0.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-256 for content IDs: the RustCrypto implementation. MIT OR Apache-2.0.
sha2 = "0.11.0"
# Hexadecimal text of a hash. MIT OR Apache-2.0.
hex = "0.4.3"

[dev-dependencies]
# Fuzz harnesses: see kit-store's tests/fuzz_keys.rs. MIT.
bolero = "0.13.7"
