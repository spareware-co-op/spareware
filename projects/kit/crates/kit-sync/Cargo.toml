[package]
name = "kit-sync"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
kit-core = { path = "../kit-core" }
kit-ops = { path = "../kit-ops" }
kit-store = { path = "../kit-store" }
# The live channel's messages. MIT OR Apache-2.0.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Each orderer is a task with an inbox and a broadcast. Only the parts it uses. MIT.
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
bolero = "0.13.7"
kit-store = { path = "../kit-store", features = ["memory"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
