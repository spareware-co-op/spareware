<!doctype html>
<html lang="en" data-app="os">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spare OS demo</title>
<style>
/* copied from design/tokens.css */
/* Spareware design tokens: the one shared look for every Spareware app.
   Read design/DESIGN.md first. An app sets data-app="<name>" on <html> to get its own colour.
   Text is always ink on light colours; white text appears only on Spareware red. */
:root {
  /* Spareware (the co-op) */
  --spare-red: #C8102E;
  --spare-red-hover: #A80D26;
  --spare-red-tint: #FCE9EC;

  /* Neutrals */
  --ink: #1A1A1A;
  --ink-2: #595959;
  --ink-3: #8A8A8A;
  --page: #FAF8F5;
  --panel: #FFFFFF;
  --panel-alt: #F7F6F3;
  --sink: #F1EFEA;
  --hairline: #E5E5E3;
  --rule: #C9C9C9;

  /* States (always paired: strong for borders and icons, tint for backgrounds) */
  --danger: #B91C1C;  --danger-tint: #FDE8E8;
  --success: #15803D; --success-tint: #E3F6E8;
  --info: #1D4ED8;    --info-tint: #E3ECFD;

  /* Type and shape */
  --font-ui: system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --text: 13px;
  --radius: 3px;
  --space: 8px;

  /* The current app's colours (default: Spareware itself) */
  --app: var(--spare-red-tint);
  --app-strong: var(--spare-red);
  --app-tint: var(--spare-red-tint);
}

/* One light colour per app: --app is the fill for its mark, primary buttons and active items
   (ink text on it), --app-strong is for thin borders and icons, --app-tint for quiet backgrounds. */
[data-app="construct"] { --app: #8EC5FF; --app-strong: #1F5FA8; --app-tint: #EAF4FF; }
[data-app="studio"] { --app: #C4B2FF; --app-strong: #5B3FB8; --app-tint: #F3EFFF; }
[data-app="social"] { --app: #FFB27A; --app-strong: #9E4A14; --app-tint: #FFF1E6; }
[data-app="ride"]   { --app: #7FD8CF; --app-strong: #13756B; --app-tint: #E8F8F6; }
[data-app="food"]   { --app: #A9DE8A; --app-strong: #3E7C1F; --app-tint: #EFF9E8; }
[data-app="stay"]   { --app: #80D4F0; --app-strong: #11708F; --app-tint: #E7F7FD; }
[data-app="home"]   { --app: #E8C99A; --app-strong: #8A5A1C; --app-tint: #FBF4EA; }
[data-app="rent"]   { --app: #F2B8E0; --app-strong: #94306F; --app-tint: #FCEEF8; }
[data-app="work"]   { --app: #B8C4D6; --app-strong: #3D4F6B; --app-tint: #EEF1F6; }
[data-app="market"] { --app: #D8E36A; --app-strong: #66700F; --app-tint: #F7F9DF; }
[data-app="office"] { --app: #A9B6FF; --app-strong: #3A47A8; --app-tint: #EEF0FF; }
[data-app="os"]     { --app: #CDD1D6; --app-strong: #4A525C; --app-tint: #F2F3F5; }
</style>
<style>
/* Spare OS demo styles. Only the tokens above set colour, type, corners and spacing. */
:root { --tb: calc(var(--space) * 6); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: var(--text)/1.45 var(--font-ui); display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: 560px; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--app-strong); outline-offset: 1px; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.l { width: 20px; height: 20px; }
svg.i.xl { width: 24px; height: 24px; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; margin: 0 0 6px; }
.muted { color: var(--ink-2); }
.small { font-size: 12px; }
h2 { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
h3 { font-size: 13px; font-weight: 700; margin: 0 0 4px; }
p { margin: 0 0 var(--space); }
.flex { display: flex; gap: var(--space); align-items: center; flex-wrap: wrap; }
.sp { flex: 1; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(var(--space) * 1.5); }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--space) * 1.5); }
.g4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space); }
.mt { margin-top: calc(var(--space) * 2); }
.mb { margin-bottom: calc(var(--space) * 2); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 1px solid var(--ink); background: var(--panel); border-radius: var(--radius); white-space: nowrap; color: var(--ink); }
.btn:hover { background: var(--panel-alt); }
.btn.primary { background: var(--app); border-color: var(--app); }
.btn.primary:hover { background: var(--app); border-color: var(--app-strong); }
.btn.quiet { border-color: var(--rule); color: var(--ink-2); }
.btn.danger { border-color: var(--danger); color: var(--danger); background: var(--danger-tint); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
a, a:visited { color: var(--ink); text-underline-offset: 2px; }
a:hover { color: var(--app-strong); }
.link { border: none; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11px; background: var(--app-tint); color: var(--app-strong); white-space: nowrap; font-weight: 600; }
.badge.n { background: var(--sink); color: var(--ink-2); }
.badge-btn { border: 1px solid var(--rule); font-family: inherit; }
.badge-btn:hover { border-color: var(--ink); color: var(--ink); }
.badge.ok { background: var(--success-tint); color: var(--success); }
.badge.info { background: var(--info-tint); color: var(--info); }
.badge.bad { background: var(--danger-tint); color: var(--danger); }
.note { background: var(--app-tint); border-left: 3px solid var(--app); padding: 8px 12px; border-radius: 0 var(--radius) var(--radius) 0; }
.note.ok { background: var(--success-tint); border-left-color: var(--success); }
.note.info { background: var(--info-tint); border-left-color: var(--info); }
.note.bad { background: var(--danger-tint); border-left-color: var(--danger); }
.inp { height: 28px; border: 1px solid var(--rule); border-radius: var(--radius); padding: 0 8px; background: var(--panel); min-width: 0; }
.inp:focus { outline: 2px solid var(--app-strong); outline-offset: 0; border-color: var(--app-strong); }
textarea.inp { height: auto; padding: 8px; resize: vertical; }
input[type=range], input[type=checkbox], input[type=radio] { accent-color: var(--app-strong); }
input[type=checkbox], input[type=radio] { width: 16px; height: 16px; margin: 0; flex: none; }
.sw { position: relative; width: 36px; height: 20px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sink); padding: 0; flex: none; }
.sw .knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 1px solid var(--ink-3); transition: left .12s; }
.sw[aria-checked="true"] { background: var(--app); border-color: var(--app-strong); }
.sw[aria-checked="true"] .knob { left: 18px; border-color: var(--ink); }
.swl { font-size: 12px; color: var(--ink-2); min-width: 22px; }
.bar { height: 10px; border: 1px solid var(--app-strong); border-radius: 999px; background: var(--panel); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--app); transition: width .2s; }
.bar.ok { border-color: var(--success); }
.bar.ok > i { background: var(--success-tint); }

/* Tables, rows, groups */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--panel-alt); }
.tbl tr.sel td { background: var(--app-tint); }
.tbl tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--app); }
.tbl td.mono { white-space: nowrap; }
.tbl .num { text-align: right; font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
.tbl th.num { font-family: var(--font-ui); font-size: 11px; }
.group { border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--panel); margin-bottom: calc(var(--space) * 2); }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--hairline); flex-wrap: wrap; }
.row:last-child { border-bottom: none; }
.row .rt { min-width: 0; flex: 1 1 220px; }
.row .rl { font-weight: 600; }
.row .rd { color: var(--ink-2); font-size: 12px; }
.row .rc { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.cmdhint { margin-top: calc(var(--space) * 2); color: var(--ink-2); font-size: 12px; }
.cmdhint code { font-family: var(--font-mono); background: var(--sink); padding: 1px 6px; border-radius: var(--radius); color: var(--ink); }

/* Demo bar (outside the operating system) */
.demobar { flex: none; display: flex; align-items: center; gap: 16px; min-height: 44px; padding: 0 176px 0 16px; background: var(--panel); border-bottom: 1px solid var(--hairline); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
.sq { width: 14px; height: 14px; background: var(--app); flex: none; display: inline-block; }
.dtabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 0; min-width: 0; }
.dtabs::-webkit-scrollbar { display: none; }
.dtabs button { border: none; background: none; height: 28px; padding: 0 10px; border-radius: var(--radius); white-space: nowrap; color: var(--ink-2); }
.dtabs button:hover { background: var(--panel-alt); color: var(--ink); }
.dtabs button.on { background: var(--app); color: var(--ink); font-weight: 600; }
.assess-btn { position: fixed; top: 8px; right: 12px; z-index: 90; }

/* The operating system frame */
.os { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--app-tint); font-size: var(--os-text, var(--text)); }
.desk { position: absolute; inset: 0 0 var(--tb) 0; overflow: hidden; }
.wall { position: absolute; inset: 0; width: 100%; height: 100%; }
.wp-sky { fill: var(--app-tint); }
.wp-sun { fill: var(--panel); stroke: var(--hairline); stroke-width: 2; }
.wp-far { fill: var(--hairline); }
.wp-mid { fill: var(--app); }
.wp-near { fill: var(--panel-alt); }
.wp-line { fill: none; stroke: var(--rule); stroke-width: 1.5; }
.os[data-wall="plain"] .wp-far, .os[data-wall="plain"] .wp-mid, .os[data-wall="plain"] .wp-near, .os[data-wall="plain"] .wp-line, .os[data-wall="plain"] .wp-sun { display: none; }
.os[data-wall="harbour"] .wp-far { fill: var(--sink); }
.os[data-wall="harbour"] .wp-mid { fill: var(--hairline); }
.os[data-wall="harbour"] .wp-near { fill: var(--app); }
.os.hc { --hairline: var(--ink); --rule: var(--ink); --ink-2: var(--ink); --ink-3: var(--ink); }
.os.rm *, .os.rm *::after { transition: none !important; animation: none !important; }
.os.cf-grey { filter: grayscale(1); }
.desk.flashing::after { content: ''; position: absolute; inset: 0; background: var(--panel); animation: flash .6s ease-out forwards; z-index: 50; pointer-events: none; }
@keyframes flash { from { opacity: .95; } to { opacity: 0; } }

/* Desktop icons and the set-up card */
.dicons { position: absolute; top: 12px; left: 8px; display: grid; gap: 2px; width: 96px; z-index: 1; }
.dicon { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid transparent; background: none; padding: 6px 2px; border-radius: var(--radius); color: var(--ink); }
.dicon:hover { background: var(--panel-alt); border-color: var(--rule); }
.dicon .ic { width: 40px; height: 40px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); }
.dicon .t { font-size: 12px; line-height: 1.25; text-align: center; background: var(--panel); padding: 1px 4px; border-radius: 2px; }
.ready { position: absolute; top: 16px; right: 16px; width: 320px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); z-index: 1; }
.ready .hd { padding: 10px 12px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 8px; }
.ready .bd { padding: 8px 12px 12px; }
.ready ul { list-style: none; margin: 0 0 10px; padding: 0; }
.ready li { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--hairline); align-items: baseline; }
.ready li b { min-width: 104px; font-weight: 600; }
.ready li span { color: var(--ink-2); }
.deskname { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 12px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--hairline); padding: 2px 10px; border-radius: 999px; }

/* Windows */
.win { position: absolute; top: 12px; right: 16px; bottom: 12px; left: 112px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; z-index: 2; container-type: inline-size; }
.win.max { inset: 0; border: none; border-radius: 0; }
.win.left { inset: 8px calc(50% + 4px) 8px 8px; }
.win.right { inset: 8px 8px 8px calc(50% + 4px); }
.win.small { top: 40px; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 80px); }
.tbar { flex: none; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px 0 12px; background: var(--panel-alt); border-bottom: 1px solid var(--hairline); min-width: 0; }
.tbar .tt { font-weight: 700; white-space: nowrap; }
.tbar .ts { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.wcs { margin-left: auto; display: flex; gap: 2px; flex: none; }
.wc { width: 32px; height: 28px; border: none; background: none; border-radius: var(--radius); display: grid; place-items: center; color: var(--ink-2); }
.wc:hover { background: var(--sink); color: var(--ink); }
.wc.x:hover { background: var(--danger-tint); color: var(--danger); }
.wbody { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.scroll { overflow: auto; min-height: 0; flex: 1; }
.pad { padding: 16px; }
.cols { display: grid; grid-template-columns: 212px minmax(0, 1fr); flex: 1; min-height: 0; }
.side { background: var(--panel-alt); border-right: 1px solid var(--hairline); overflow: auto; padding: 8px; }
.main { overflow: auto; padding: 16px; min-width: 0; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button { display: flex; align-items: center; gap: 8px; width: 100%; border: none; background: none; padding: 6px 8px; border-radius: var(--radius); text-align: left; color: var(--ink); white-space: nowrap; }
.nav button:hover { background: var(--sink); }
.nav button.on { background: var(--app-tint); box-shadow: inset 3px 0 0 var(--app); font-weight: 600; }
.nav button .tag { margin-left: auto; }
.nav .label { margin: 12px 8px 4px; }
.toolbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--hairline); flex-wrap: wrap; }
.ibtn { width: 28px; height: 28px; border: 1px solid transparent; background: none; border-radius: var(--radius); display: grid; place-items: center; color: var(--ink); flex: none; }
.ibtn:hover { background: var(--sink); }
.ibtn[disabled] { color: var(--ink-3); cursor: default; background: none; }
.tabs2 { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--hairline); overflow-x: auto; flex: none; scrollbar-width: none; }
.tabs2 button { border: 1px solid transparent; border-bottom: none; background: none; height: 30px; padding: 0 12px; border-radius: var(--radius) var(--radius) 0 0; white-space: nowrap; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tabs2 button:hover { background: var(--panel-alt); color: var(--ink); }
.tabs2 button.on { background: var(--app); color: var(--ink); font-weight: 600; }
.statusbar { flex: none; display: flex; gap: 16px; padding: 4px 12px; border-top: 1px solid var(--hairline); color: var(--ink-2); font-size: 12px; background: var(--panel-alt); flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 4px; padding: 0 8px; height: 28px; border: 1px solid var(--rule); border-radius: var(--radius); min-width: 0; flex: 1 1 200px; overflow: hidden; white-space: nowrap; }
.crumbs button { border: none; background: none; padding: 0 2px; color: var(--ink); }
.search { display: flex; align-items: center; gap: 6px; height: 28px; border: 1px solid var(--rule); border-radius: var(--radius); padding: 0 8px; background: var(--panel); min-width: 0; color: var(--ink-2); }
.search input { border: none; outline: none; background: none; min-width: 0; width: 100%; color: var(--ink); }
.search:focus-within { outline: 2px solid var(--app-strong); border-color: var(--app-strong); }

/* Files */
.fgrid { display: grid; grid-template-columns: minmax(0, 1fr) 260px; flex: 1; min-height: 0; }
.flist { overflow: auto; min-width: 0; }
.fname { display: flex; align-items: center; gap: 8px; min-width: 0; }
.fname span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preview { border-left: 1px solid var(--hairline); padding: 12px; overflow: auto; background: var(--panel-alt); }
.thumb { height: 120px; border: 1px solid var(--hairline); background: var(--panel); border-radius: var(--radius); display: grid; place-items: center; margin-bottom: 12px; color: var(--app-strong); }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 8px; margin-bottom: 12px; font-size: 12px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; }
.nw { white-space: nowrap; }
.only-s { display: none; }
/* Narrow windows (snapped to half the screen, small screens): the preview gets narrower, then moves under the list */
@container (max-width: 980px) {
  .fgrid { grid-template-columns: minmax(0, 1fr) 220px; }
  .tbl .hide-m { display: none; }
}
@container (max-width: 760px) {
  .fgrid { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .preview { border-left: none; border-top: 1px solid var(--hairline); max-height: 34vh; }
  .preview.none, .preview .thumb { display: none; }
}
.ejc { margin-left: auto; width: 22px; height: 22px; border: none; background: none; border-radius: var(--radius); display: grid; place-items: center; color: var(--ink-2); }
.ejc:hover { background: var(--panel); color: var(--ink); }

/* Taskbar */
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tb); background: var(--panel); border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 6px; padding: 0 8px; z-index: 20; }
.tb-start { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 10px; border: 1px solid var(--rule); background: var(--panel); border-radius: var(--radius); font-weight: 700; flex: none; }
.tb-start:hover { border-color: var(--ink); }
.tb-start.on { background: var(--app); border-color: var(--app-strong); }
.osmark { width: 18px; height: 18px; flex: none; }
.osmark .a { fill: var(--app); stroke: var(--app-strong); stroke-width: 1.5; }
.osmark .b { fill: var(--ink); }
.tb-search { display: flex; align-items: center; justify-content: center; height: 34px; width: 40px; border: 1px solid var(--rule); border-radius: var(--radius); padding: 0; color: var(--ink-2); background: var(--panel); flex: none; }
.tb-search:hover { border-color: var(--ink); }
.tb-apps { display: flex; gap: 2px; min-width: 0; overflow: hidden; }
.tb-app { width: 40px; height: 40px; border: none; background: none; display: grid; place-items: center; border-radius: var(--radius); position: relative; flex: none; color: var(--ink); }
.tb-app:hover { background: var(--panel-alt); }
.tb-app.open::after { content: ''; position: absolute; bottom: 3px; left: 15px; right: 15px; height: 2px; border-radius: 2px; background: var(--app-strong); }
.tb-app.active { background: var(--app-tint); }
.tb-app.active::after { left: 10px; right: 10px; }
.tb-desks { display: flex; gap: 2px; margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--hairline); flex: none; }
.tb-desks button { min-width: 28px; height: 28px; border: 1px solid var(--rule); background: var(--panel); border-radius: var(--radius); font-size: 12px; color: var(--ink-2); }
.tb-desks button.on { background: var(--app); border-color: var(--app); color: var(--ink); font-weight: 700; }
.tray { margin-left: auto; display: flex; align-items: center; gap: 2px; flex: none; }
.tray > button { height: 38px; padding: 0 8px; border: none; background: none; border-radius: var(--radius); display: flex; align-items: center; gap: 6px; color: var(--ink); }
.tray > button:hover, .tray > button.on { background: var(--app-tint); }
.clock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; font-size: 12px; }
.count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--app); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.tip { position: relative; }

function showActive() {
  document.querySelectorAll('#dtabs, .side, .tabs2, .steps').forEach(s => {
    if (s.scrollWidth <= s.clientWidth + 1) return;
    const on = s.querySelector('.on'); if (!on) return;
    const sr = s.getBoundingClientRect(), b = on.getBoundingClientRect();
    if (b.left >= sr.left && b.right <= sr.right) return;

}

function quickSum(q) {
  const s = q.trim().toLowerCase();
  let m = s.match(/^gst\s*(on)?\s*\$?([\d.,]+)$/);
  if (m) { const v = parseFloat(m[2].replace(/,/g, '')); return `Sales tax of the example country, New Zealand: GST at 15% on NZ$${v.toFixed(2)} is NZ$${(v * .15).toFixed(2)}. Total NZ$${(v * 1.15).toFixed(2)}.`; }
  m = s.match(/^([\d.]+)\s*%\s*of\s*([\d.]+)$/);
  if (m) return `${m[1]}% of ${m[2]} = ${+(parseFloat(m[1]) * parseFloat(m[2]) / 100).toFixed(4)}`;
  if (/^[\d\s.+\-*/()x×÷]+$/.test(s) && /\d\s*[+\-*/x×÷]\s*\d/.test(s)) {
    try { const v = Function('"use strict";return (' + s.replace(/[x×]/g, '*').replace(/÷/g, '/') + ')')(); if (isFinite(v)) return `${q.trim()} = ${+v.toFixed(6)}`; } catch (e) { }
  }
  return '';
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if ((S.pop || S.startOpen) && !e.target.closest('.pop')) { S.pop = null; if (S.startOpen) { S.startOpen = false; if (S.r === 'start') { go('desktop'); return; } } render(); }
    return;
  }
  if (el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) fn(el.dataset.arg, el, e);
});
document.addEventListener('dblclick', e => { const el = e.target.closest('[data-dbl]'); if (el && A[el.dataset.dbl]) A[el.dataset.dbl](); });
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && I[el.dataset.in]) I[el.dataset.in](el.value, el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modalhost').innerHTML) return closeModal(); if ($('#drawer').classList.contains('open')) return A.assess(); if (S.pop || S.startOpen) { S.pop = null; S.startOpen = false; if (S.r === 'start') return go('desktop'); render(); } }
  if (BOOT.stage === 'menu' && ['ArrowUp', 'ArrowDown', 'Enter'].includes(e.key)) {
    e.preventDefault();
    if (e.key === 'Enter') return A.bootGo();
    const keys = [...document.querySelectorAll('#overlay .opt')].map(b => b.dataset.arg);
    const i = keys.indexOf(BOOT.pick);
    A.bootPick(keys[(i + (e.key === 'ArrowDown' ? 1 : keys.length - 1)) % keys.length]);
    return;
  }
  if (e.key === 'Enter' && e.target.id === 'stq') { const f = $('#stres .res'); if (f) f.click(); }
  if (e.key === 'Enter' && e.target.id === 'termin') A.termRun();
  /* Rows and small controls that are not buttons still work by keyboard: Space or Enter picks, Enter on a file opens it */
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[data-act][tabindex]:not(button)')) {
    e.preventDefault(); const dbl = t.dataset.dbl; t.click(); if (e.key === 'Enter' && dbl && A[dbl]) A[dbl]();
  }
});
