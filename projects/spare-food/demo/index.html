<!doctype html>
<html lang="en" data-app="food">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spare Food demo</title>
<style>
/* copied from design/tokens.css */
/* Spareware design tokens: the one shared look for every Spareware app.
   Read design/DESIGN.md first. An app sets data-app="<name>" on <html> to get its own colour.
   Text is always ink on light colours; white text appears only on Spareware red. */
:root {
  /* Spareware (the co-op) */
  --spare-red: #C8102E;
  --spare-red-hover: #A80D26;
  --spare-red-tint: #FCE9EC;

  /* Neutrals */
  --ink: #1A1A1A;
  --ink-2: #595959;
  --ink-3: #8A8A8A;
  --page: #FAF8F5;
  --panel: #FFFFFF;
  --panel-alt: #F7F6F3;
  --sink: #F1EFEA;
  --hairline: #E5E5E3;
  --rule: #C9C9C9;

  /* States (always paired: strong for borders and icons, tint for backgrounds) */
  --danger: #B91C1C;  --danger-tint: #FDE8E8;
  --success: #15803D; --success-tint: #E3F6E8;
  --info: #1D4ED8;    --info-tint: #E3ECFD;

  /* Type and shape */
  --font-ui: system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --text: 13px;
  --radius: 3px;
  --space: 8px;

  /* The current app's colours (default: Spareware itself) */
  --app: var(--spare-red-tint);
  --app-strong: var(--spare-red);
  --app-tint: var(--spare-red-tint);
}

/* One light colour per app: --app is the fill for its mark, primary buttons and active items
   (ink text on it), --app-strong is for thin borders and icons, --app-tint for quiet backgrounds. */
[data-app="arch"]   { --app: #8EC5FF; --app-strong: #1F5FA8; --app-tint: #EAF4FF; }
[data-app="studio"] { --app: #C4B2FF; --app-strong: #5B3FB8; --app-tint: #F3EFFF; }
[data-app="social"] { --app: #FFB27A; --app-strong: #9E4A14; --app-tint: #FFF1E6; }
[data-app="ride"]   { --app: #7FD8CF; --app-strong: #13756B; --app-tint: #E8F8F6; }
[data-app="food"]   { --app: #A9DE8A; --app-strong: #3E7C1F; --app-tint: #EFF9E8; }
[data-app="stay"]   { --app: #80D4F0; --app-strong: #11708F; --app-tint: #E7F7FD; }
[data-app="home"]   { --app: #E8C99A; --app-strong: #8A5A1C; --app-tint: #FBF4EA; }
[data-app="rent"]   { --app: #F2B8E0; --app-strong: #94306F; --app-tint: #FCEEF8; }
[data-app="work"]   { --app: #B8C4D6; --app-strong: #3D4F6B; --app-tint: #EEF1F6; }
[data-app="market"] { --app: #D8E36A; --app-strong: #66700F; --app-tint: #F7F9DF; }
[data-app="office"] { --app: #A9B6FF; --app-strong: #3A47A8; --app-tint: #EEF0FF; }
[data-app="os"]     { --app: #CDD1D6; --app-strong: #4A525C; --app-tint: #F2F3F5; }
</style>
<style>
/* Spare Food demo styles. Only the tokens above are used for colour, type and shape. */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:var(--font-ui);font-size:var(--text);line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--app-strong);outline-offset:2px}
a{color:var(--app-strong)}
p{margin:0 0 6px}
ul{margin:0;padding:0;list-style:none}
.mono{font-family:var(--font-mono)}
.label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 6px}
.ink2{color:var(--ink-2)}
.sm{font-size:12px}
.b{font-weight:600}
.r{text-align:right}
.grow{flex:1;min-width:0}
.flex{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:8px}.mt2{margin-top:16px}
.h{font-size:14px;font-weight:700;margin:0}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.fill{fill:currentColor}
.mark{display:inline-block;width:14px;height:14px;background:var(--app);border:1px solid var(--app-strong);border-radius:var(--radius);flex:none}
.coop .mark{background:var(--spare-red);border-color:var(--spare-red)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Demo layout: index on the left, the device in the middle */
.demo{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--hairline);position:sticky;top:0;height:100vh;overflow-y:auto;padding:14px 0 70px}
.brand{display:flex;align-items:center;gap:8px;padding:0 16px;font-weight:700;font-size:14px}
.brand .badge{margin-left:auto}
.brand-sub{padding:6px 16px 12px;color:var(--ink-2);border-bottom:1px solid var(--hairline)}
.nav{padding:4px 0 8px}
.nav .label{padding:12px 16px 2px;margin:0}
.nav a{display:block;padding:5px 16px 5px 13px;border-left:3px solid transparent;color:var(--ink);text-decoration:none}
.nav a:hover{background:var(--panel-alt)}
.nav a[aria-current="page"]{background:var(--app-tint);border-left-color:var(--app);font-weight:600}
.onscreen{border-top:1px solid var(--hairline);padding:12px 16px}
.onscreen li{padding:3px 0;line-height:1.35}
.fid{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);display:block}
.pick{display:none}
.ctry{padding:10px 16px 12px;border-bottom:1px solid var(--hairline)}
.ctry select{height:32px}
.ctry p{margin:6px 0 0}
.stage{display:flex;justify-content:center;align-items:flex-start;padding:20px 24px;min-width:0}
.device{background:var(--sink);border:1px solid var(--rule);border-radius:34px;padding:10px;flex:none}
.screen{position:relative;background:var(--panel);border:1px solid var(--hairline);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;width:390px;height:min(812px,calc(100vh - 62px))}
.device.wide{border-radius:18px;padding:12px}
.device.wide .screen{border-radius:8px;width:min(1000px,calc(100vw - 240px - 76px));height:min(700px,calc(100vh - 112px))}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.bigtext{font-size:15px}
.bigtext .sm,.bigtext .badge,.bigtext .tabbar a{font-size:13px}

/* Phone status bar and app header */
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:7px 24px 3px;font-size:12px;font-weight:600}
.statusbar .flex{gap:5px}
.apphead{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--hairline);background:var(--panel);min-height:48px}
.apphead .name{font-weight:700;white-space:nowrap}
.apphead .open{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.apphead .acts{display:flex;gap:6px;align-items:center;margin-left:auto}
.apphead .mono,.nw{white-space:nowrap}
.tabbar{display:flex;border-top:1px solid var(--hairline);background:var(--panel);flex:none}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 8px;font-size:11px;color:var(--ink-2);text-decoration:none}
.tabbar a .ic{width:18px;height:18px}
.tabbar a[aria-current="page"]{background:var(--app);color:var(--ink);font-weight:600}

/* Building blocks */
.sec{padding:12px 16px;border-bottom:1px solid var(--hairline)}
.sec.alt{background:var(--panel-alt)}
.row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--hairline);background:var(--panel)}
.row.tight{padding:8px 0;background:none}
.rows>.row:last-child{border-bottom:0}
.row.tight>.badge:first-child{min-width:82px;justify-content:center}
.row.sel{background:var(--app-tint);box-shadow:inset 3px 0 0 var(--app)}
.tick{width:18px;height:18px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--app-strong)}
.tick.round{border-radius:50%}
.tick .ic{width:12px;height:12px;stroke-width:2.6}
.sel .tick{border-color:var(--app-strong)}
button.row{width:100%;border:0;border-bottom:1px solid var(--hairline);text-align:left;font:inherit}
button.row:hover{background:var(--panel-alt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--ink);background:var(--panel);color:var(--ink);font-weight:600;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--app);border-color:var(--app);color:var(--ink)}
.btn.primary:hover{border-color:var(--app-strong)}
.btn.quiet{border-color:var(--rule);color:var(--ink-2);font-weight:500}
.btn.quiet:hover{border-color:var(--ink-2)}
.btn.danger{border-color:var(--danger);background:var(--danger-tint);color:var(--ink)}
.btn.block{display:flex;width:100%}
.btn.big{min-height:48px;font-size:15px}
.btn.sm{min-height:26px;padding:2px 8px;font-size:12px}
.coop .btn.primary{background:var(--spare-red);border-color:var(--spare-red);color:var(--panel)}
.coop .btn.primary:hover{background:var(--spare-red-hover)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.two>.btn{flex:1}
.iconbtn{width:32px;height:32px;padding:0;border:1px solid var(--rule);background:var(--panel);border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none;text-decoration:none}
.iconbtn[aria-pressed="true"]{color:var(--app-strong);border-color:var(--app-strong);background:var(--app-tint)}
.iconbtn[aria-pressed="true"] .ic{fill:currentColor}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;background:var(--app-tint);color:var(--app-strong);font-size:11px;font-weight:600;white-space:nowrap;line-height:18px}
.badge.n{background:var(--sink);color:var(--ink-2)}
.badge.ok{background:var(--success-tint);color:var(--ink);box-shadow:inset 0 0 0 1px var(--success)}
.badge.bad{background:var(--danger-tint);color:var(--ink);box-shadow:inset 0 0 0 1px var(--danger)}
.badge.info{background:var(--info-tint);color:var(--ink);box-shadow:inset 0 0 0 1px var(--info)}
.coop .badge{background:var(--spare-red-tint);color:var(--spare-red-hover)}
.coop .badge.n{background:var(--sink);color:var(--ink-2)}
.note{background:var(--app-tint);border-left:3px solid var(--app);padding:8px 10px;border-radius:var(--radius)}
.coop .note{background:var(--spare-red-tint);border-left-color:var(--spare-red)}
.state{padding:8px 10px;border-left:3px solid var(--rule);border-radius:var(--radius);background:var(--panel-alt)}
.state.bad{border-color:var(--danger);background:var(--danger-tint)}
.state.ok{border-color:var(--success);background:var(--success-tint)}
.state.info{border-color:var(--info);background:var(--info-tint)}
.state .ic{margin-right:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);border-radius:999px;padding:4px 10px;white-space:nowrap;font-size:12px}
.chip[aria-pressed="true"]{background:var(--app);border-color:var(--app);color:var(--ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--panel);flex:none}
.seg button{border:0;border-right:1px solid var(--rule);background:transparent;padding:5px 10px;color:var(--ink-2);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--app);color:var(--ink);font-weight:600}
.seg.full{display:flex}.seg.full button{flex:1}
.seg>span{padding:5px 10px;border-right:1px solid var(--rule);min-width:30px;text-align:center}
.ic .ic-fill{fill:currentColor;stroke:none}
.switch{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:2px 0;text-align:left}
.switch .track{width:36px;height:20px;border-radius:999px;background:var(--sink);border:1px solid var(--rule);position:relative;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:1px solid var(--ink-2)}
.switch[aria-checked="true"] .track{background:var(--app);border-color:var(--app-strong)}
.switch[aria-checked="true"] .track::after{left:18px;border-color:var(--ink)}
.input,textarea.input{width:100%;border:1px solid var(--rule);border-radius:var(--radius);background:var(--panel);padding:7px 9px;resize:vertical}
.input:focus{outline:2px solid var(--app-strong);outline-offset:1px}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:var(--radius);padding:0 9px;background:var(--panel)}
.field input{border:0;outline:0;padding:8px 0;flex:1;min-width:0;background:transparent}
.field:focus-within{outline:2px solid var(--app-strong);outline-offset:1px}
.field .ic{color:var(--ink-2)}
.lines{width:100%;border-collapse:collapse}
.lines td{padding:4px 0;vertical-align:top}
.lines td.r{text-align:right;font-family:var(--font-mono);white-space:nowrap;padding-left:8px}
.lines tr.total td{border-top:1px solid var(--ink);padding-top:8px;font-weight:700}
.lines .sub td{padding-top:0;color:var(--ink-2);font-size:12px}
.linkbtn{border:0;background:none;padding:0;color:var(--app-strong);text-decoration:underline;font:inherit;cursor:pointer}
.coop .linkbtn{color:var(--spare-red-hover)}
.split{display:flex;height:14px;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;margin:6px 0}
.split span{display:block;height:100%}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--rule);margin-right:6px;vertical-align:-1px}
.c-rest{background:var(--app)} .c-cour{background:repeating-linear-gradient(135deg,var(--app) 0 3px,var(--panel) 3px 6px)} .c-run{background:var(--info-tint)} .c-card{background:var(--sink)} .c-tax{background:repeating-linear-gradient(45deg,var(--rule) 0 1px,var(--panel) 1px 5px)}
.split .c-cour{box-shadow:inset 1px 0 0 var(--app-strong),inset -1px 0 0 var(--app-strong)}
.art{width:56px;height:56px;flex:none;border-radius:var(--radius);border:1px solid var(--hairline);display:block}
.art.lg{width:72px;height:72px}
.stars{display:inline-flex;gap:2px}
.stars button{border:1px solid var(--rule);background:var(--panel);border-radius:var(--radius);width:34px;height:30px;padding:0;color:var(--ink-2)}
.stars button[aria-pressed="true"]{background:var(--app);border-color:var(--app);color:var(--ink)}
.stars .ic{vertical-align:-3px}
ol.steps{margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;color:var(--ink-2)}
.steps .dot{width:18px;height:18px;border-radius:50%;border:1px solid var(--rule);background:var(--panel);flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.steps .dot .ic{width:12px;height:12px}
.steps li.done{color:var(--ink)}
.steps li.done .dot{background:var(--app-tint);border-color:var(--app-strong);color:var(--app-strong)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now .dot{background:var(--app);border-color:var(--app-strong)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--app-tint);border:1px solid var(--app-strong);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:var(--ink)}
.coop .avatar{background:var(--spare-red-tint);border-color:var(--spare-red)}
.democtl{margin:12px 16px 16px;border:1px dashed var(--rule);border-radius:var(--radius);padding:10px;background:var(--panel-alt)}
.cartbar{position:sticky;bottom:0;padding:10px 16px;background:var(--panel);border-top:1px solid var(--hairline)}
.empty{text-align:center;color:var(--ink-3);padding:28px 16px}
.stat{padding:10px 12px;border-right:1px solid var(--hairline);min-width:0}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--font-mono);font-size:16px;font-weight:700;display:block;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--hairline)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--ink-2);gap:2px}
.bars i{display:block;width:100%;background:var(--app);border:1px solid var(--app-strong);border-bottom:0;border-radius:2px 2px 0 0}
.bars .today{color:var(--ink);font-weight:600}
.bars .today i{background:repeating-linear-gradient(135deg,var(--app) 0 4px,var(--app-tint) 4px 8px)}
.coop .bars i{background:var(--spare-red-tint);border-color:var(--spare-red)}
.meter{height:8px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.meter i{display:block;height:100%;background:var(--app)}
.coop .meter i{background:var(--spare-red)}
.thread{display:flex;flex-direction:column;gap:6px;padding:12px 16px}
.msg{max-width:80%;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--hairline);background:var(--panel-alt)}
.msg.me{align-self:flex-end;background:var(--app-tint);border-color:var(--app)}
.msg .who{display:block;font-size:11px;color:var(--ink-2)}
.photo{width:64px;height:48px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--sink)}

/* Maps (illustrations, not real map data) */
.map{display:block;width:100%;height:auto;border:1px solid var(--hairline);border-radius:var(--radius)}
.m-bg{fill:var(--panel-alt)} .m-water{fill:var(--info-tint)} .m-park{fill:var(--success-tint)}
.m-minor{stroke:var(--hairline);stroke-width:4;fill:none}
.m-road-o{stroke:var(--rule);stroke-width:9;fill:none;stroke-linejoin:round}
.m-road{stroke:var(--panel);stroke-width:7;fill:none;stroke-linejoin:round}
.m-route{stroke:var(--app-strong);stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.m-route.dash{stroke-dasharray:5 5}
.m-label{fill:var(--ink-2);font-size:10px;font-family:var(--font-ui)}
.m-rest{fill:var(--app);stroke:var(--ink);stroke-width:1.5}
.m-home{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.m-courier{fill:var(--app);stroke:var(--app-strong);stroke-width:2.5}
.m-lost{fill:none;stroke:var(--danger);stroke-width:1.5;stroke-dasharray:3 3}
.m-zone{fill:var(--app-tint);stroke:var(--app-strong);stroke-width:1;stroke-dasharray:4 3}
.m-dot{fill:var(--app-strong)}
.m-warn{fill:var(--danger-tint);stroke:var(--danger);stroke-width:1.5}

/* Food pictures drawn in SVG */
.f-alt{fill:var(--panel-alt)} .f-tint{fill:var(--app-tint)} .f-app{fill:var(--app)} .f-strong{fill:var(--app-strong)}
.f-panel{fill:var(--panel)} .f-sink{fill:var(--sink)} .f-info{fill:var(--info-tint)} .f-ok{fill:var(--success-tint)}
.s-ink2{stroke:var(--ink-2);stroke-width:1.5} .s-strong{stroke:var(--app-strong);stroke-width:1.5} .s-rule{stroke:var(--rule);stroke-width:1.5}
.f-none{fill:none}

/* Sheets, toast and the assess panel */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}
.sheet-wrap::before,.assess::before{content:"";position:absolute;inset:0;background:var(--ink);opacity:.28}
.sheet{position:relative;width:100%;max-height:88%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--ink);border-radius:var(--radius) var(--radius) 0 0}
.device.wide .sheet-wrap{align-items:stretch;justify-content:flex-end}
.device.wide .sheet{width:min(440px,100%);max-height:none;border-top:0;border-left:1px solid var(--ink);border-radius:0}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--hairline);position:sticky;top:0;background:var(--panel);z-index:1}
.toast{position:absolute;left:12px;right:12px;bottom:66px;background:var(--panel);border:1px solid var(--ink);border-radius:var(--radius);padding:8px 10px;z-index:30;display:flex;gap:8px;align-items:flex-start}
.toast[hidden]{display:none}
.toast .ic{margin-top:1px}
.toast.warn{border-left:3px solid var(--danger)}
.device.wide .toast{left:auto;right:16px;bottom:16px;width:360px}
/* With a sheet open, the toast moves so it never covers what was just tapped */
.screen:has(.sheet-wrap) .toast{top:56px;bottom:auto}
.device.wide .screen:has(.sheet-wrap) .toast{top:auto;bottom:16px;right:auto;left:16px}
.assess-btn{position:fixed;right:16px;bottom:16px;z-index:50;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border:1px solid var(--ink);border-radius:var(--radius);font-weight:600;color:var(--ink)}

.assess-panel summary{padding:8px 16px;cursor:pointer;font-weight:600}
.assess-panel details ul{padding:0 16px 10px}
.assess-panel details li{padding:2px 0}

/* Restaurant tablet and operations console */
.khead{flex-wrap:wrap;row-gap:6px}
.k-wrap{display:grid;grid-template-columns:104px minmax(0,1fr);flex:1;min-height:0}
.k-rail{border-right:1px solid var(--hairline);background:var(--panel-alt);display:flex;flex-direction:column}
.k-rail a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 4px;color:var(--ink-2);text-decoration:none;font-size:12px;border-bottom:1px solid var(--hairline)}
.k-rail a .ic{width:20px;height:20px}
.k-rail a[aria-current="page"]{background:var(--app);color:var(--ink);font-weight:600}
.k-main{min-width:0;overflow-y:auto;display:flex;flex-direction:column}
.k-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--hairline)}
.k-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));flex:1;min-height:0}
.k-col{border-right:1px solid var(--hairline);overflow-y:auto;min-width:0}
.k-col:last-child{border-right:0}
.k-colhead{position:sticky;top:0;z-index:1;background:var(--panel-alt);border-bottom:1px solid var(--hairline);padding:7px 12px;display:flex;justify-content:space-between;align-items:center}
.ticket{padding:10px 12px;border-bottom:1px solid var(--hairline)}
.ticket.mine{box-shadow:inset 3px 0 0 var(--app)}
.t-items li{padding:1px 0}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.grid2>div{min-width:0}
.grid2>div:first-child{border-right:1px solid var(--hairline)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.grid3>div{border-right:1px solid var(--hairline);min-width:0}
.grid3>div:last-child{border-right:0}
.stats.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.log li{padding:5px 0;border-bottom:1px solid var(--hairline)}
.log li:last-child{border-bottom:0}
.cmd{font-family:var(--font-mono);font-size:12px;background:var(--panel-alt);border:1px solid var(--hairline);border-radius:var(--radius);padding:6px 8px;overflow-wrap:anywhere}

@media (max-width:1100px){
  .demo{display:block}

  .pick label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .assess-btn{top:8px;bottom:auto;right:16px;min-height:35px;padding:5px 10px;font-size:12px}

  .device.wide .screen{width:min(1000px,calc(100vw - 76px));height:min(700px,calc(100vh - 114px))}

}

  .statusbar{display:none}
  .apphead{position:sticky;top:52px;z-index:6}

  .tabbar{position:sticky;bottom:0;z-index:6}

  .device.wide .sheet-wrap{align-items:flex-end}
  .device.wide .sheet{width:100%;max-height:88%;border-left:0;border-top:1px solid var(--ink)}
  .toast,.device.wide .toast{position:fixed;left:12px;right:12px;bottom:120px;width:auto}

  .k-wrap{display:block}
  .k-rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--hairline)}
  .k-rail a{flex:1;border-bottom:0;border-right:1px solid var(--hairline);padding:8px 2px}
  .k-rail a:last-child{border-right:0}
  .k-main{overflow:visible}
  .k-cols,.grid2,.grid3{display:block}

  .k-bar>.grow{flex-basis:100%}
  .khead .acts>.mono{display:none}

}

function totalsFor(cart, mode, tip, km = 3.1, min = 14) {
  const food = r2(cart.reduce((a, c) => a + c.price * c.qty, 0));
  const deliv = mode === 'delivery' && food > 0 ? delivFee(km, min) : 0;
  const t = mode === 'delivery' ? tip : 0;
  const running = mode === 'delivery' && food > 0 ? FEE.running : 0;
  /* Where prices are shown before tax (as in the US and Canada), the tax is added as its own line */
  const added = CY.incl ? 0 : r2((food + deliv + running) * CY.rate);
  const sub = food + deliv + running + t + added;
  const card = food > 0 ? r2(sub * FEE.cardPct + FEE.cardFixed) : 0;
  const total = r2(sub + card);
  const gst = CY.incl ? r2((total - t) * CY.rate / (1 + CY.rate)) : added;
  return {food, deliv, tip: t, running, card, fee: r2(running + card), total, gst, added};
}

  q = q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); s = s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

function restMatches(r) {
  const f = S.filters;

    <div class="sec"><span class="label">Questions to answer (from features.json)</span><ol>${ASSESS.map(q => `<li>${esc(q)}</li>`).join('')}</ol></div>
    <div class="sec" style="border-bottom:0;padding-bottom:4px"><span class="label">Core features each screen shows</span></div>
    ${Object.entries(SCREEN_FEATS).map(([k, fs]) => `<details><summary>${ROUTES[k].g}: ${ROUTES[k].t} <span class="badge n">${fs.length}</span></summary><ul>${fs.map(f => `<li><span class="mono sm">${f}</span> ${esc(fname(f))}</li>`).join('')}</ul><p style="padding:0 16px 10px"><a href="#${k}" data-act="assessClose">Open this screen</a></p></details>`).join('')}
  </div>`;
  $('#assess').hidden = false; $('#assess .iconbtn').focus();
}

/* ---------- render loop ---------- */
/* Keyboard focus survives each redraw: it stays on the control used, moves into a sheet that opens,
   and goes back to the control that opened the sheet when it closes. */
const keyOf = el => { if (!el || !el.closest || !el.closest('#stage')) return ''; if (el.dataset.act) return 'a:' + el.dataset.act + '|' + (el.dataset.v || ''); if (el.id) return 'i:' + el.id; const h = el.getAttribute('href'); return h ? 'h:' + h : ''; };
const byKey = k => { if (!k) return null; const t = k.slice(2); if (k[0] === 'i') return document.getElementById(t); if (k[0] === 'h') return [...document.querySelectorAll('#stage a[href]')].find(e => e.getAttribute('href') === t) || null; return [...document.querySelectorAll('#stage [data-act]')].find(e => keyOf(e) === k) || null; };
let opener = '';
function render() {
  const fk = keyOf(document.activeElement); const hadSheet = !!document.querySelector('#stage .sheet');
  draw();
  const sh = document.querySelector('#stage .sheet');
  if (sh && !hadSheet) { opener = fk; const b = sh.querySelector('.iconbtn'); if (b) b.focus({preventScroll: true}); }
  else { const el = byKey(!sh && hadSheet ? opener : fk); if (el) el.focus({preventScroll: true}); }
}
function draw() {
  const r = ROUTES[S.route] ? S.route : 'home'; S.route = r; const R = ROUTES[r];
  const old = document.querySelector('.scroll, .k-main'); const keep = S.last === r && old ? old.scrollTop : 0;
  $('#side').innerHTML = side(r);
  $('#stage').innerHTML = `<div class="device ${R.frame}"><div class="screen ${S.big ? 'bigtext' : ''} ${R.coop ? 'coop' : ''}">${(RENDER[r] || rTodo)()}${sheetHtml()}<div class="toast ${S.toastWarn ? 'warn' : ''}" id="toast" role="status" ${S.toast ? '' : 'hidden'}>${ic(S.toastWarn ? 'alert' : 'check')}<span>${S.toast}</span></div></div></div>`;
  const now = document.querySelector('.scroll, .k-main'); if (now) now.scrollTop = keep;
  if (S.last !== r) window.scrollTo(0, 0);
  S.last = r;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  const res = fn(el.dataset.v, el, e);
  if (res !== false) render();
  const href = el.tagName === 'A' ? el.getAttribute('href') || '' : '';
  if (href.startsWith('#') && res !== false || (href.startsWith('#') && el.dataset.act === 'assessClose')) location.hash = href.slice(1);
});
document.addEventListener('input', e => {
  const t = e.target; const k = t.dataset.input; if (!k) return;
  if (k === 'q') { S.q = t.value; $('#results').innerHTML = restList(); }
  else if (k === 'pick') location.hash = t.value;
  else if (k === 'country') { const id = t.id; setCountry(t.value); const el = document.getElementById(id); if (el) el.focus(); }
  else if (k === 'noteCourier') S.notes.courier = t.value;
  else if (k === 'noteKitchen') S.notes.kitchen = t.value;
  else if (k === 'allergy') S.allergy = t.value;
  else if (INPUTS[k]) INPUTS[k](t.value, t);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#assess').hidden) { $('#assess').hidden = true; $('#assessBtn').focus(); return; } if (S.sheet) { S.sheet = null; render(); } } });
window.addEventListener('hashchange', () => { S.route = location.hash.slice(1) || 'home'; S.sheet = null; render(); });
S.route = location.hash.slice(1) || 'home';
render();
</script>
