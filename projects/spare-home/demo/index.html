<!doctype html>
<html lang="en" data-app="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spare Home demo</title>
<style>
/* copied from design/tokens.css */
/* Spareware design tokens: the one shared look for every Spareware app.
   Read design/DESIGN.md first. An app sets data-app="<name>" on <html> to get its own colour.
   Text is always ink on light colours; white text appears only on Spareware red. */
:root {
  /* Spareware (the co-op) */
  --spare-red: #C8102E;
  --spare-red-hover: #A80D26;
  --spare-red-tint: #FCE9EC;

  /* Neutrals */
  --ink: #1A1A1A;
  --ink-2: #595959;
  --ink-3: #8A8A8A;
  --page: #FAF8F5;
  --panel: #FFFFFF;
  --panel-alt: #F7F6F3;
  --sink: #F1EFEA;
  --hairline: #E5E5E3;
  --rule: #C9C9C9;

  /* States (always paired: strong for borders and icons, tint for backgrounds) */
  --danger: #B91C1C;  --danger-tint: #FDE8E8;
  --success: #15803D; --success-tint: #E3F6E8;
  --info: #1D4ED8;    --info-tint: #E3ECFD;

  /* Type and shape */
  --font-ui: system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --text: 13px;
  --radius: 3px;
  --space: 8px;

  /* The current app's colours (default: Spareware itself) */
  --app: var(--spare-red-tint);
  --app-strong: var(--spare-red);
  --app-tint: var(--spare-red-tint);
}

/* One light colour per app: --app is the fill for its mark, primary buttons and active items
   (ink text on it), --app-strong is for thin borders and icons, --app-tint for quiet backgrounds. */
[data-app="construct"] { --app: #8EC5FF; --app-strong: #1F5FA8; --app-tint: #EAF4FF; }
[data-app="studio"] { --app: #C4B2FF; --app-strong: #5B3FB8; --app-tint: #F3EFFF; }
[data-app="social"] { --app: #FFB27A; --app-strong: #9E4A14; --app-tint: #FFF1E6; }
[data-app="ride"]   { --app: #7FD8CF; --app-strong: #13756B; --app-tint: #E8F8F6; }
[data-app="food"]   { --app: #A9DE8A; --app-strong: #3E7C1F; --app-tint: #EFF9E8; }
[data-app="stay"]   { --app: #80D4F0; --app-strong: #11708F; --app-tint: #E7F7FD; }
[data-app="home"]   { --app: #E8C99A; --app-strong: #8A5A1C; --app-tint: #FBF4EA; }
[data-app="rent"]   { --app: #F2B8E0; --app-strong: #94306F; --app-tint: #FCEEF8; }
[data-app="work"]   { --app: #B8C4D6; --app-strong: #3D4F6B; --app-tint: #EEF1F6; }
[data-app="market"] { --app: #D8E36A; --app-strong: #66700F; --app-tint: #F7F9DF; }
[data-app="office"] { --app: #A9B6FF; --app-strong: #3A47A8; --app-tint: #EEF0FF; }
[data-app="os"]     { --app: #CDD1D6; --app-strong: #4A525C; --app-tint: #F2F3F5; }
</style>
<style>
/* Spare Home demo styles. Only the tokens above set colour, type, corners and spacing. */
:root { --s1: var(--space); --s2: calc(var(--space) * 2); --s3: calc(var(--space) * 3); --half: calc(var(--space) / 2); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-ui); font-size: var(--text); line-height: 1.45; color: var(--ink); background: var(--page); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ink); }
:focus-visible { outline: 2px solid var(--app-strong); outline-offset: 2px; }
h1, h2, h3, h4 { font-size: var(--text); margin: 0; font-weight: 700; }
p { margin: 0; }
[hidden] { display: none !important; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.mono { font-family: var(--font-mono); }
.muted { color: var(--ink-2); }
.small { font-size: 12px; }
.strong { font-weight: 700; }
.big { font-size: 15px; font-weight: 700; }
.mark { display: inline-block; width: 14px; height: 14px; flex: none; background: var(--app); border: 1px solid var(--app-strong); border-radius: var(--radius); }
.mark.coop { background: var(--spare-red); border-color: var(--spare-red); }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.ic.lg { width: 22px; height: 22px; }
.ic.app { color: var(--app-strong); }
.ic.ok { color: var(--success); }
.ic.dan { color: var(--danger); }
.ic.inf { color: var(--info); }

/* Demo chrome around the phone */
.demohead { height: 48px; display: flex; align-items: center; gap: var(--s1); padding: 0 var(--s2); background: var(--panel); border-bottom: 1px solid var(--hairline); }
.demohead .grow { flex: 1; }
.demohead .sep { color: var(--ink-3); }
.demohead .screens-btn { display: none; }
.stage { display: flex; justify-content: center; gap: var(--s3); padding: var(--s2); height: calc(100vh - 48px); height: calc(100dvh - 48px); }
.nav, .about { background: var(--panel); border: 1px solid var(--hairline); border-radius: var(--radius); overflow-y: auto; }
.nav { width: 232px; flex: none; padding: var(--s2) 0; }
.nav .label { display: block; padding: 0 var(--s2); margin: var(--s2) 0 var(--half); }
.nav .label:first-child { margin-top: 0; }
.nav a { display: flex; gap: var(--s1); padding: 7px var(--s2); text-decoration: none; color: var(--ink); border-left: 3px solid transparent; }
.nav a .num { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); width: 18px; flex: none; padding-top: 1px; }
.nav a:hover { background: var(--panel-alt); }
.nav a[aria-current="page"] { background: var(--app-tint); border-left-color: var(--app); font-weight: 600; }
.nav .foot { margin: var(--s2) var(--s2) 0; padding-top: var(--s2); border-top: 1px solid var(--hairline); font-size: 12px; color: var(--ink-2); }
.about { width: 300px; flex: none; padding: var(--s2); }
.about h2 { margin-bottom: var(--half); }
.about p { color: var(--ink-2); margin-bottom: var(--s2); }
.about ul { list-style: none; margin: var(--half) 0 var(--s2); padding: 0; }
.about li { padding: 6px 0; border-bottom: 1px solid var(--hairline); }
.about li .mono { display: block; font-size: 11px; color: var(--app-strong); }
.about .try li { padding-left: 14px; position: relative; }
.about .try li::before { content: ""; position: absolute; left: 0; top: 12px; width: 6px; height: 6px; background: var(--app); border: 1px solid var(--app-strong); }
.device { flex: none; width: 392px; display: flex; align-items: center; }
.phone { width: 392px; height: 100%; max-height: 844px; background: var(--panel); border: 1px solid var(--ink); border-radius: var(--radius); position: relative; overflow: hidden; display: flex; flex-direction: column; }
.phone.large .view { zoom: 1.15; }

/* App header, view and tab bar inside the phone */
.apphead { height: 46px; flex: none; display: flex; align-items: center; gap: var(--s1); padding: 0 var(--s1) 0 var(--s2); border-bottom: 1px solid var(--hairline); background: var(--panel); }
.apphead b { white-space: nowrap; }
.apphead .crumb { flex: 1; min-width: 0; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.apphead .crumb::before { content: "/"; color: var(--ink-3); margin-right: var(--s1); }
.iconbtn { width: 34px; height: 34px; flex: none; display: inline-grid; place-items: center; background: var(--panel); border: 1px solid transparent; border-radius: var(--radius); color: var(--ink); cursor: pointer; padding: 0; position: relative; text-decoration: none; }
.iconbtn:hover { border-color: var(--rule); }
.cbtn { width: auto; padding: 0 6px; gap: 4px; display: inline-flex; align-items: center; border-color: var(--rule); font-family: var(--font-mono); font-size: 11px; font-weight: 700; }
.cbtn .ic { width: 14px; height: 14px; }
.view { flex: 1; overflow-y: auto; overflow-x: hidden; background: var(--panel); position: relative; }
.tabbar { flex: none; display: flex; border-top: 1px solid var(--hairline); background: var(--panel); }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 8px; font-size: 11px; color: var(--ink-2); text-decoration: none; }
.tabbar a[aria-current="page"] { background: var(--app); color: var(--ink); font-weight: 700; }
.subtabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--hairline); scrollbar-width: none; background: var(--panel); }
.subtabs a { padding: 10px 12px; white-space: nowrap; text-decoration: none; color: var(--ink-2); }
.subtabs a[aria-current="page"] { background: var(--app); color: var(--ink); font-weight: 700; }

/* Building blocks */
.sect { padding: var(--s2); border-bottom: 1px solid var(--hairline); }
.sect.alt { background: var(--panel-alt); }
.sect.tight { padding: 10px var(--s2); }
.sect > .label:first-child { display: block; margin-bottom: var(--s1); }
.sect-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s1); margin-bottom: var(--s1); }
.pad { padding: 10px var(--s2); }
.row { display: flex; align-items: center; gap: var(--s1); }
.row.top { align-items: flex-start; }
.row.wrap { flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: var(--s1); }
.mt { margin-top: var(--s1); }
.mt2 { margin-top: var(--s2); }
.list { list-style: none; margin: 0; padding: 0; }
.item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
.item:last-child { border-bottom: 0; }
.item .ic { margin-top: 1px; }
.sub { display: block; color: var(--ink-2); font-size: 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px var(--s2); margin: 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-weight: 600; text-align: right; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s1); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s1); }
.stat { border: 1px solid var(--hairline); border-radius: var(--radius); padding: 8px; }
.stat b { display: block; font-size: 15px; font-family: var(--font-mono); }
.stat span { font-size: 11px; color: var(--ink-2); }
.empty { text-align: center; color: var(--ink-3); padding: var(--s3) var(--s2); }

/* Buttons, chips, badges and notes */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 12px; border: 1px solid var(--ink); border-radius: var(--radius); background: var(--panel); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--panel-alt); }
.btn.primary { background: var(--app); border-color: var(--app); }
.btn.primary:hover { border-color: var(--app-strong); }
.btn.quiet { border-color: var(--rule); color: var(--ink-2); font-weight: 500; }
.btn.danger { border-color: var(--danger); color: var(--danger); background: var(--danger-tint); }
.btn.coop { background: var(--spare-red); border-color: var(--spare-red); color: var(--panel); }
.btn.coop:hover { background: var(--spare-red-hover); }
.btn.small { min-height: 28px; padding: 0 8px; font-size: 12px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: default; }
.btns { display: flex; gap: var(--s1); flex-wrap: wrap; }
.btns > .btn.grow { flex: 1; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 0 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); color: var(--ink); font-size: 12px; cursor: pointer; white-space: nowrap; flex: none; }
.chip:hover { border-color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--app); border-color: var(--app-strong); font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: 999px; background: var(--app-tint); color: var(--app-strong); font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge .ic { width: 12px; height: 12px; vertical-align: -2px; }
.badge.n { background: var(--sink); color: var(--ink-2); }
.badge.ok { background: var(--success-tint); color: var(--success); box-shadow: inset 0 0 0 1px var(--success); }
.badge.dan { background: var(--danger-tint); color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.badge.inf { background: var(--info-tint); color: var(--info); box-shadow: inset 0 0 0 1px var(--info); }
.note { background: var(--app-tint); border-left: 3px solid var(--app); padding: 8px 10px; border-radius: 0 var(--radius) var(--radius) 0; }
.note.warn { background: var(--danger-tint); border-left-color: var(--danger); }
.note.info { background: var(--info-tint); border-left-color: var(--info); }
.note.ok { background: var(--success-tint); border-left-color: var(--success); }
.note b { font-weight: 700; }
.term { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline dotted var(--app-strong); text-decoration-thickness: 2px; text-underline-offset: 3px; cursor: help; }
.opt { display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px; margin-top: 6px; text-align: left; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); cursor: pointer; }
.opt[aria-pressed="true"] { background: var(--app-tint); border-color: var(--app-strong); border-left: 3px solid var(--app); }
.opt .box { width: 16px; height: 16px; flex: none; border: 1px solid var(--ink-2); border-radius: var(--radius); display: grid; place-items: center; background: var(--panel); }
.opt[aria-pressed="true"] .box { background: var(--app); border-color: var(--app-strong); }
.switch { width: 38px; height: 22px; flex: none; border: 1px solid var(--ink-2); border-radius: 999px; background: var(--sink); position: relative; cursor: pointer; padding: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); border: 1px solid var(--ink-2); }
.switch[aria-pressed="true"] { background: var(--app); border-color: var(--app-strong); }
.switch[aria-pressed="true"]::after { left: 18px; border-color: var(--app-strong); }
[data-tip] { position: relative; }
[data-tip]:hover::after, [data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; top: calc(100% + 4px); right: 0; z-index: 40; white-space: nowrap; background: var(--panel); color: var(--ink); border: 1px solid var(--ink); border-radius: var(--radius); padding: 2px 6px; font-size: 11px; font-weight: 500; pointer-events: none; }

/* Inputs */
.in { width: 100%; min-height: 36px; padding: 0 10px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); }
textarea.in { padding: 8px 10px; min-height: 84px; resize: vertical; line-height: 1.45; }
select.in { padding-right: 6px; }
.in:focus { outline: 2px solid var(--app-strong); outline-offset: 0; border-color: var(--app-strong); }
.field { display: block; margin-top: 10px; }
.field > span { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.search { position: relative; display: block; }
.search .ic { position: absolute; left: 10px; top: 10px; color: var(--ink-3); }
.search .in { padding-left: 32px; }
input[type="range"] { width: 100%; accent-color: var(--app-strong); }

/* Map and result cards */
.map { position: relative; border-bottom: 1px solid var(--hairline); background: var(--info-tint); }
#mapsvg svg { display: block; width: 100%; height: auto; }
.maptools { position: absolute; left: 8px; top: 8px; }
.mapnote { position: absolute; left: 8px; top: 44px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 2px 6px; font-size: 11px; color: var(--ink-2); }
.m-land { fill: var(--panel-alt); stroke: var(--rule); stroke-width: 1; }
.m-sea { fill: var(--info-tint); }
.m-park { fill: var(--success-tint); }
.m-road0 { fill: none; stroke: var(--rule); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.m-road { fill: none; stroke: var(--panel); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.m-text { fill: var(--ink-3); font-size: 10px; font-family: var(--font-ui); }
.m-text.sea { font-style: italic; }
.m-draw { fill: var(--app-tint); fill-opacity: .7; stroke: var(--app-strong); stroke-width: 1.5; stroke-dasharray: 5 4; }
.pin { cursor: pointer; }
.pin rect { fill: var(--panel); stroke: var(--app-strong); stroke-width: 1; }
.pin path { fill: var(--panel); stroke: var(--app-strong); stroke-width: 1; }
.pin text { fill: var(--ink); font-size: 10px; font-weight: 700; font-family: var(--font-ui); }
.pin.sel rect, .pin.sel path { fill: var(--app); stroke: var(--ink); stroke-width: 1.5; }
.pin.mine rect { stroke-dasharray: 3 2; }
.card { display: flex; gap: 10px; width: 100%; padding: 10px var(--s2); text-align: left; background: var(--panel); border: 0; border-bottom: 1px solid var(--hairline); border-left: 3px solid transparent; cursor: pointer; }
.card:hover { background: var(--panel-alt); }
.card.sel { background: var(--app-tint); border-left-color: var(--app); }
.card .thumb { width: 96px; flex: none; align-self: flex-start; border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; }
.card .thumb svg { display: block; width: 100%; height: auto; }
.price { display: block; font-weight: 700; font-size: 14px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--ink-2); font-size: 12px; }

/* Listing page */
.gallery { position: relative; background: var(--sink); }
.gallery svg.photo { display: block; width: 100%; height: auto; }
.gallery .navb { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--ink); border-radius: var(--radius); cursor: pointer; padding: 0; }
.gallery .prev { left: 8px; }
.gallery .next { right: 8px; }
.gallery .count { position: absolute; right: 8px; bottom: 8px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 1px 6px; font-family: var(--font-mono); font-size: 11px; }
.gallery .tag { position: absolute; left: 8px; top: 8px; background: var(--panel); border: 1px solid var(--app-strong); color: var(--app-strong); border-radius: var(--radius); padding: 2px 6px; font-size: 11px; font-weight: 700; }
.caption { padding: 6px var(--s2); font-size: 12px; color: var(--ink-2); border-bottom: 1px solid var(--hairline); }
.thumbs { display: flex; gap: 4px; padding: 6px var(--s2); overflow-x: auto; border-bottom: 1px solid var(--hairline); scrollbar-width: none; }
.thumbs button { width: 54px; flex: none; padding: 0; border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--panel); cursor: pointer; overflow: hidden; }
.thumbs button[aria-current="true"] { outline: 2px solid var(--app-strong); outline-offset: -2px; }
.thumbs svg { display: block; width: 100%; height: auto; }
.p-sky { fill: var(--info-tint); }
.p-sea { fill: var(--info-tint); stroke: var(--info); stroke-width: .6; }
.p-grass { fill: var(--success-tint); }
.p-hill { fill: var(--sink); }
.p-wall { fill: var(--app-tint); stroke: var(--app-strong); stroke-width: 1.2; }
.p-wall2 { fill: var(--panel-alt); }
.p-roof { fill: var(--app); stroke: var(--app-strong); stroke-width: 1.2; }
.p-dark { fill: var(--app-strong); }
.p-win { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1.5; }
.p-glass { fill: var(--info-tint); stroke: var(--ink-3); stroke-width: 1.5; }
.p-floor { fill: var(--sink); }
.p-soft { fill: var(--panel); stroke: var(--rule); stroke-width: 1.2; }
.p-line { fill: none; stroke: var(--rule); stroke-width: 1.5; }
.p-ink { fill: none; stroke: var(--ink-3); stroke-width: 1.5; }
.p-tree { fill: var(--success-tint); stroke: var(--success); stroke-width: 1.2; }
.plan { border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--panel); padding: 4px; }
.plan svg { display: block; width: 100%; height: auto; }
.f-room { fill: var(--panel); stroke: var(--ink); stroke-width: 1.2; }
.f-wet { fill: var(--info-tint); stroke: var(--ink); stroke-width: 1.2; }
.f-out { fill: none; stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 4 3; }
.f-site { fill: var(--success-tint); stroke: var(--ink); stroke-width: 2; }
.f-outer { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linejoin: miter; }
.f-name { font-size: 10px; font-weight: 700; fill: var(--ink); font-family: var(--font-ui); }
.f-size { font-size: 9px; fill: var(--ink-2); font-family: var(--font-mono); }
.f-leg { font-size: 9px; fill: var(--ink-2); font-family: var(--font-ui); }
.f-line { fill: none; stroke: var(--ink-2); stroke-width: 1.2; }
.docprev { border: 1px solid var(--rule); border-radius: var(--radius); padding: var(--s2); background: var(--panel); }
.docprev i { display: block; height: 6px; background: var(--sink); margin: 7px 0; border-radius: var(--radius); }
.docprev i.h { height: 9px; width: 55%; background: var(--hairline); }

/* Guide steps, bars, tables */
.steps { list-style: none; margin: 0; padding: 0; }
.step { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }

/* Offers: the register, a fair multi-offer, and agreement to settlement */
const COND_KEYS = ['{finCond}', '{inspCond}', '{cs}', 'Sale of their home'];
const depText = o => o.dep + '%, ' + (o.depAt === 'later' ? '{depLater}' : 'on signing');
const stageIdx = () => ({ offers: 0, multi: 0, conditional: 1, unconditional: 2, settled: 3, closed: 4 })[S.sale];
const OST = { open: 'In the register', accepted: 'Agreement signed', lapsed: 'Lapsed', ended: 'Agreement ended' };
function offerCard(o) {
  return `<div class="offer"><div class="row top"><span class="grow"><b>${esc(o.who)}</b><span class="sub">${esc(o.ent)}</span><span class="sub">From ${esc(o.law)} · received ${o.recv}</span></span><span class="mono strong">${money(o.price)}</span></div>
    <dl class="kv mt small"><dt>{deposit}</dt><dd>${depText(o)}</dd><dt>{conds}</dt><dd>${o.cond.length ? o.cond.map(c => c.n + ' by ' + c.due).join('<br>') : 'None'}</dd><dt>{settle}</dt><dd>${o.settle}</dd><dt>Offer ends</dt><dd>${o.exp}</dd></dl>
    ${o.hist.length ? `<ul class="list mt">${o.hist.map(x => `<li class="item small" style="padding:6px 0">${ic('clock', 'app')}<span class="grow">${esc(x)}</span></li>`).join('')}</ul>` : ''}
    <div class="btns mt"><button class="btn small" data-act="counter" data-id="${o.id}">Record a counter-offer</button><button class="btn small" data-act="accept" data-id="${o.id}">${ic('key')}{accBtn}</button><button class="btn quiet small" data-act="lapse" data-id="${o.id}">Lapsed</button></div>
  </div>`;
}
function compareTable(list) {
  const row = (label, f, cls = '') => `<tr><td>${label}</td>${list.map(o => `<td class="${cls}">${f(o)}</td>`).join('')}</tr>`;
  const has = (o, n) => o.cond.find(c => c.n === n);
  return `<div class="cmp"><table class="tbl"><tr><th></th>${list.map(o => `<th>${esc(o.who)}</th>`).join('')}</tr>
    ${row('Price', o => money(o.price), 'mono')}
    ${row('{deposit}', depText)}
    ${row('{finCond}', o => has(o, '{finCond}') ? 'By ' + has(o, '{finCond}').due : 'None')}
    ${row('Other {condsL}', o => o.cond.filter(c => c.n !== '{finCond}').map(c => c.n).join(', ') || 'None')}
    ${row('{settle}', o => o.settle)}
    ${row('Offer ends', o => o.exp)}
    ${row('Received', o => o.recv)}</table></div>
    <p class="small muted mt">In the order received. No offer is marked as best: what suits you is for you and your {law} to decide.</p>`;
}
function moneyBlock(o) {
  const dep = Math.round(o.price * o.dep / 100);

  return `<div class="sect"><span class="label">The house money</span>
    <dl class="kv"><dt>${term('{deposit}')}</dt><dd>${money(dep)}</dd><dt>Held by</dt><dd>Kauri Law's {acct}</dd><dt>When</dt><dd>${paid}</dd><dt>The rest of the price</dt><dd>Through the {laws} on ${o.settle}</dd></dl>
    <p class="note warn small mt"><b>Spare Home never holds, asks for or passes on the {depositL} or the price.</b> An email that changes bank details is a scam until Kauri Law confirms it on a phone number you already have.</p>
  </div>`;
}
function lawyersBlock(o) {
  return `<div class="sect"><span class="label">{Laws}' shared workspace</span>
    <ul class="list"><li class="item">${ic('law', 'app')}<span class="grow"><b>Kauri Law</b><span class="sub">Your {law}</span></span><span class="badge ok">${ic('check')}Joined</span></li>
      <li class="item">${ic('law', 'app')}<span class="grow"><b>${esc(o.law)}</b><span class="sub">The buyer's {law}</span></span><span class="badge ok">${ic('check')}Joined</span></li></ul>
    <button class="btn mt" data-act="workspace">Open the shared file</button>
  </div>`;
}
SELL.offers = () => {

  if (si === 0) {
    h += S.sale === 'multi' ? `<div class="sect"><p class="note info"><b>Multi-offer running.</b> Deadline ${S.multi}. Every interested buyer was told at the same moment, in the same words. See the log below.</p></div>`
      : open.length > 1 ? `<div class="sect"><p><b>${open.length} buyers have offered.</b> A fair multi-offer tells every interested buyer at the same moment and gives everyone the same deadline.</p><button class="btn primary block mt" data-act="multi">Start a multi-offer</button></div>` : '';
    h += `<div class="sect tight row"><span class="label grow">${open.length} offer${open.length === 1 ? '' : 's'}, oldest first</span><div class="chips"><button class="chip" data-act="oview" data-v="list" aria-pressed="${S.view === 'list'}">List</button><button class="chip" data-act="oview" data-v="table" aria-pressed="${S.view === 'table'}">Side by side</button></div></div>
      <div class="sect">${open.length ? (S.view === 'table' ? compareTable(open) : open.map(offerCard).join('')) : '<p class="empty">No open offers. Record one when it arrives.</p>'}
        ${S.offers.filter(x => x.st !== 'open').map(x => `<p class="small muted mt">${esc(x.who)}: ${OST[x.st].toLowerCase()}.</p>`).join('')}
        <button class="btn block mt2" data-act="newoffer">${ic('plus')}Record a new offer</button>

        <ul class="list small">${['Track the {condsL} and their dates, with reminders', 'See where the {depositL} is held, and who holds it', 'Give both {laws} a shared workspace', 'Book the {finalInspL}', 'Follow the {settleDayL} checklist', 'Close the sale, rate the pros and archive it'].map(t => `<li class="item" style="padding:6px 0">${ic('chevr', 'app')}<span class="grow">${t}</span></li>`).join('')}</ul></div>`;
  } else if (si === 1) {
    h += `<div class="sect"><span class="label">{agreeCap}</span>
        <div class="offer acc"><div class="row"><b class="grow">${esc(o.who)}</b><span class="mono strong">${money(o.price)}</span></div><span class="sub">Recorded ${S.accAt}. Their {law}: ${esc(o.law)}. Yours: Kauri Law.</span></div>
        <p class="small muted mt">Every other interested buyer was told it is under offer, at the same moment.</p></div>
      <div class="sect"><div class="sect-head"><span class="label">{conds} and dates</span><span class="badge ok">${ic('check')}Dates confirmed by Kauri Law</span></div>
        <ul class="list">${S.conds.map((c, i) => `<li class="item"><button class="tick${c.done ? ' on' : ''}" data-act="cond" data-i="${i}" aria-pressed="${c.done}" aria-label="${esc(c.n)} met">${c.done ? ic('check') : ''}</button><span class="grow">${esc(c.n)}<span class="sub">Due ${c.due}. Reminders 3 days and 1 day before.</span></span>${c.done ? '<span class="badge ok">Met</span>' : ''}</li>`).join('')}</ul>
        <div class="btns mt2"><button class="btn primary grow" data-act="uncond" ${S.conds.every(c => c.done) ? '' : 'disabled'}>${S.conds.every(c => c.done) ? '{uncondBtn}' : 'Tick each one as it is met'}</button><button class="btn quiet" data-act="fallthrough">A condition was not met</button></div></div>
      ${moneyBlock(o)}${lawyersBlock(o)}
      <div class="sect"><span class="label">Back-up buyers</span>
        ${open.length ? `<ul class="list">${open.map(x => `<li class="item"><span class="grow">${esc(x.who)}<span class="sub">Told if this sale falls through</span></span><button class="switch" data-act="backup" data-id="${x.id}" aria-pressed="${x.backup}" aria-label="Keep ${esc(x.who)} as a back-up buyer"></button></li>`).join('')}</ul>` : '<p class="empty">No other offers.</p>'}</div>`;
  } else if (si === 2) {
    const allSet = S.settleList.every(x => x[1]);

      <div class="sect"><span class="label">{finalInsp}</span>
        <p><b>${o.insp}, 10:00 am</b><span class="sub">The buyer's last look, booked with you. Check off together:</span></p>

      <div class="sect"><span class="label">{settleDay}, ${o.settle}</span>
        <ul class="list">${S.settleList.map((x, i) => tickRow('settleList', i, x)).join('')}</ul>
        <p class="small muted mt">No tenants live here, so there is no tenancy to hand over. For a tenanted home, the tenancy agreement, the bond and the records pass to the new owner here, as the law requires, and the tenants are told who the new owner is.</p>
        <button class="btn primary block mt2" data-act="settled" ${allSet ? '' : 'disabled'}>${allSet ? 'Kauri Law confirmed {settleL}' : 'Tick the {settleDayL} list first'}</button></div>
      ${moneyBlock(o)}${lawyersBlock(o)}`;
  } else {
    const unrated = S.bookings.filter(b => b.st !== 'paid').length;
    h += `<div class="sect"><p class="note ok"><b>{soldNote}</b> The keys are with the new owner.</p></div>
      <div class="sect"><span class="label">Close the sale</span><ul class="list">
        ${doneRow('Listing marked sold', 'The public page shows Sold and stays online.')}
        <li class="item"><span class="tick${unrated ? '' : ' on'}">${unrated ? '' : ic('check')}</span><span class="grow"><b>Rate the professionals</b><span class="sub">${unrated ? unrated + ' still to rate' : 'All rated'}</span></span>${unrated ? '<a class="btn small" href="#services">Rate</a>' : ''}</li>
        <li class="item"><span class="tick${S.sale === 'closed' ? ' on' : ''}">${S.sale === 'closed' ? ic('check') : ''}</span><span class="grow"><b>Archive the sale</b><span class="sub">Documents and history are kept for you. Export them any time.</span></span>${S.sale === 'closed' ? '<span class="badge ok">Archived</span>' : '<button class="btn small" data-act="archive">Archive</button>'}</li>
      </ul></div>`;
  }
  return h + `<div class="sect"><button class="btn quiet small" data-act="dispute">${ic('law')}Where to take a dispute about the sale</button></div>
    <div class="sect"><span class="label">Who was told what, and when</span>${logList()}</div>`;

/* Buyers: the register, messages, updates to everyone at once */

/* Guide: step by step, the readiness checklist, and the buyer's guide */

      ${open ? `<p class="mt small">${s[1]}</p><div class="btns mt">${s[2] ? `<a class="btn small" href="${s[2]}">${s[3]}</a>` : ''}${i === cur ? '<button class="btn primary small" data-act="gdone">Mark this step done</button>' : ''}</div>` : `<span class="sub">${i < cur ? 'Done' : i === cur ? 'You are here. Tap to open.' : 'Coming up'}</span>`}</div></li>`;

    </div>`;
};

/* Costs: full cost, recent sales, the fee and where it goes */
function costCalc() {
  const p = S.saleprice;
  const items = [['At-cost listing fee', 120], ['Photographer', 450], ['Floor plan from Spare Construct', 0], ['{council}', 345], ['{insp}', 650], ['Signboard with a QR code', 280], ['Brochures and handouts', 90]];
  const law = 1650 + 250, own = items.reduce((a, b) => a + b[1], 0), comm = p * P().comm, tax = comm * P().rate;
  const spare = own + law, agent = comm + tax + law;
  return `<table class="tbl">${items.map(i => `<tr><td>${i[0]}</td><td class="num">${money(i[1])}</td></tr>`).join('')}<tr><td>{Law}, fixed price and costs</td><td class="num">${money(law)}</td></tr><tr><th>Selling with Spare Home</th><th class="num">${money(spare)}</th></tr></table>
    <table class="tbl mt"><tr><td>Commission at ${pct(P().comm)}%</td><td class="num">${money(comm)}</td></tr>${tax ? `<tr><td>{tax} on the commission</td><td class="num">${money(tax)}</td></tr>` : ''}<tr><td>{Law}, the same either way</td><td class="num">${money(law)}</td></tr><tr><th>With a typical agent</th><th class="num">${money(agent)}</th></tr></table>
    <div class="grid2 mt2"><div class="stat"><b>${money(spare)}</b><span>Spare Home, all in</span></div><div class="stat"><b>${money(agent)}</b><span>With an agent, before any marketing</span></div></div>
    <p class="mt">Difference at this price: <b class="mono">${money(agent - spare)}</b></p>
    <p class="small muted mt">The commission is an illustration: {commNote}, and many agents charge marketing on top. Prices here are sample prices, not converted between currencies.</p>`;
}

function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, '')) || 'search';
  const [path, flag] = h.split('!');
  const parts = path.split('/');
  let r = parts[0];
  if (r === 'guide') { r = 'seller'; parts[1] = 'guide'; }
  if (!SCR[r]) r = 'search';
  const prev = S.r + '/' + S.arg;
  S.r = r; S.arg = parts[1] || '';
  if ((r === 'listing' || r === 'book') && S.arg) { if (S.sel !== S.arg) S.pi = 0; S.sel = S.arg; }
  if (r === 'services' && S.arg) S.cat = S.arg;
  closeSheet();
  render(prev !== S.r + '/' + S.arg);
  const anchor = parts[2] || (r === 'me' ? parts[1] : '');
  if (anchor) { const t = document.getElementById('sec-' + anchor); if (t) $('#view').scrollTop = t.offsetTop - (r === 'seller' ? 46 : 4); }
  $('#nav').classList.remove('open');
  if (flag === 'assess') openAssess();
}

function qrSVG(size) {
  let s = `<svg viewBox="0 0 25 25" width="${size}" height="${size}" role="img" aria-label="QR code that opens the listing"><rect class="qr-l" width="25" height="25"/>`;
  const fin = (x, y) => `<rect class="qr-d" x="${x}" y="${y}" width="7" height="7"/><rect class="qr-l" x="${x + 1}" y="${y + 1}" width="5" height="5"/><rect class="qr-d" x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
  s += fin(1, 1) + fin(17, 1) + fin(1, 17);
  let seed = 7;
  for (let y = 1; y < 24; y++) for (let x = 1; x < 24; x++) {
    if ((x < 9 && y < 9) || (x > 15 && y < 9) || (x < 9 && y > 15)) continue;
    seed = (seed * 37 + 11) % 101;
    if (seed % 3 === 0) s += `<rect class="qr-d" x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return s + '</svg>';
}

  paybook: el => {
    const c = PROS[el.dataset.c], p = c.pros[+el.dataset.i], when = pressed('#bslot').textContent;
    S.bookings.unshift({ pro: p.n, what: c.t + ', booked for ' + when, price: p.p, st: 'held', when: 'Booked Mon 19 Oct' });
    closeSheet(); render(true); toast(`Booked with ${p.n} for ${when}. ${money2(p.p + 6.5)} is held until the work is delivered.`);
  },
  deliver: el => { const b = S.bookings[+el.dataset.i]; b.st = 'delivered'; b.when = 'Delivered Mon 19 Oct, straight into your vault'; render(); toast(`${esc(b.pro)} delivered the work into your vault.`); },
  rate: el => { const b = S.bookings[+el.dataset.i]; b.rated = +el.dataset.v; b.st = 'paid'; render(); toast(`Thanks. ${money2(b.price)} released to ${esc(b.pro)}, and your rating is public.`); },
  binv: el => { const b = S.bookings[+el.dataset.i], r = P().rate; sheet('{inv}', `<div class="docprev"><b>${esc(b.pro)}</b><dl class="kv mt2 small"><dt>For</dt><dd>${esc(b.what)}</dd>${r ? `<dt>Price</dt><dd class="mono">${money2(b.price / (1 + r))}</dd><dt>{tax} at ${pct(r)}%</dt><dd class="mono">${money2(b.price - b.price / (1 + r))}</dd>` : ''}<dt>Total</dt><dd class="mono">${money2(b.price)}</dd></dl></div><p class="small muted mt">Issued by the pro through Spare Work. The Spare Work fee has its own receipt.</p>`); },
  problem: el => { const b = S.bookings[+el.dataset.i]; sheet('Report a problem with this job', `<p><b>${esc(b.pro)}</b><span class="sub">${esc(b.what)}</span></p>${['The work was not done', 'The work is not what was agreed', 'I want to cancel and get a refund', 'Something else'].map((r, i) => `<button class="opt" data-act="pick" aria-pressed="${i === 1}"><span class="box"></span><span class="grow">${r}</span></button>`).join('')}
      <p class="small muted mt2">The money stays held while it is sorted out. If you cannot agree, a member panel decides.</p><button class="btn primary block mt2" data-act="problemgo" data-i="${el.dataset.i}">Raise it</button>`); },
  problemgo: el => { S.bookings[+el.dataset.i].st = 'disputed'; closeSheet(); render(); toast('Raised. The money stays held until it is sorted out.'); },
  /* account */
  behalf: () => sheet('Sell a home for someone else', `<p class="small muted">Pick how you are allowed to sell. A person at the co-op checks the evidence before the listing can go live.</p>
      ${Object.keys(BEHALF).map((k, i) => `<button class="opt" data-act="behalfpick" data-k="${esc(k)}" aria-pressed="${i === 0}"><span class="box"></span><span class="grow">${k}</span></button>`).join('')}
      <p class="note small mt2" id="behalfnote"><b>You will need:</b> ${BEHALF[Object.keys(BEHALF)[0]]}</p>
      <button class="btn primary block mt2" data-act="toastclose" data-msg="Started. Upload the evidence and a person checks it.">Start</button>`),
  behalfpick: el => { ACT.pick(el); $('#behalfnote').innerHTML = '<b>You will need:</b> ' + BEHALF[el.dataset.k]; },
  role: el => { const k = el.dataset.k; S.roles[k] = !S.roles[k]; if (!S.roles.sell && !S.roles.buy) S.roles[k === 'sell' ? 'buy' : 'sell'] = true; render(); toast(`You now ${S.roles.sell && S.roles.buy ? 'sell and buy' : S.roles.sell ? 'sell' : 'buy'} on Spare Home. Only what that needs is asked for.`); },
  lang: () => { S.lang = S.lang === 'l2' ? 'en' : 'l2'; render(); toast(S.lang === 'l2' ? P().l2[0] + ' is on. In this demo only the tab names change.' : 'English is on.'); },
  large: () => { S.large = !S.large; $('#phone').classList.toggle('large', S.large); render(); },
  offsaved: () => { S.offlineSaved = !S.offlineSaved; render(); toast(S.offlineSaved ? 'Saved homes and their documents are kept on this phone.' : 'Saved homes now need a signal.'); },
  install: () => sheet('Install on this phone', `<p>Add Spare Home to your home screen from your browser's menu. It is under 2 MB, opens like an app and can send notifications.</p><button class="btn primary block mt2" data-act="toastclose" data-msg="Added to your home screen.">${ic('phone')}Add to home screen</button>`),
  notif: el => { const a = S.notify[el.dataset.k], c = +el.dataset.c; a[c] = a[c] ? 0 : 1; render(); },
  fmt: el => { S.fmt = el.dataset.v; render(); },
  export: () => sheet('Export everything', `<ul class="list small">${[['Listing and its history', 'JSON'], ['Photos, 6 files', 'JPEG, 38 MB'], ['Floor plan', 'SVG and the Spare Construct model'], ['Documents, 10 files', 'PDF'], ['Messages', 'JSON'], ['Offers register and log', 'CSV'], ['Payments and invoices', 'CSV and PDF']].map(([a, b]) => `<li class="item">${ic('doc', 'app')}<span class="grow">${a}</span><span class="muted">${b}</span></li>`).join('')}</ul>
      <button class="btn primary block mt2" data-act="toastclose" data-msg="Export ready: spare-home-export-2026-10-19.zip, 61 MB.">${ic('download')}Make the export</button>`),
  privacy: () => sheet('What we keep about you', `<table class="tbl"><tr><th>What</th><th>Why</th><th>How long</th></tr>${[['Identity check result', 'To stop fake listings', 'As long as the law requires'], ['Listing and its history', 'Buyers rely on it', 'Until you delete it'], ['Messages', 'Safety and disputes', '2 years after the sale'], ['Payments and invoices', 'Tax law', '{keep} years']].map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table>
      <p class="small muted mt">We never sell your data. Visitors' and neighbours' details stay private.</p>
      <button class="btn block mt2" data-act="toastclose" data-msg="Request sent. We reply {privacyReply}.">Ask to see or correct it</button>`),
  del: () => sheet('Delete my account', `<p>Your account, saved homes, messages and photos are deleted.</p><p class="mt">By law we keep payment records and {invPl} for {keep} years. Hēmi Walker keeps access to your shared sale until it is closed.</p>
      <button class="btn danger block mt2" data-act="delgo">${ic('trash')}Delete my account</button><button class="btn quiet block mt" data-act="close">Keep it</button>`),
  delgo: () => confirmKey('Delete your Spareware account.', () => toast('Demo only: nothing was deleted. In the app, your account would close now.')),
  aisort: () => sheet('Assistant: sort my photos', `<p>Suggested order: from the street, then the living areas, then the bedrooms and bathroom, then the outside.</p><ol class="mt small">${['From the street', 'Living room', 'Kitchen', 'Main bedroom', 'Bathroom', 'The beach nearby'].map(t => `<li>${t}</li>`).join('')}</ol>
      <div class="btns mt2"><button class="btn primary" data-act="aisortgo">Use this order</button><button class="btn quiet" data-act="close">Not now</button></div>`),
  aisortgo: () => { const order = ['ext', 'living', 'kitchen', 'bed', 'bath', 'view', 'garden']; byId('L1').photos.sort((a, b) => order.indexOf(a.k) - order.indexOf(b.k)); closeSheet(); render(); toast('Photos sorted. See them under Sell, Listing.'); },
  aisum: () => sheet('Assistant: the {csl} in short', `<ul class="list small">${['Zoning: medium density residential.', '{sunroom}', 'No council notices or requirements.', 'Tsunami zone: yellow.'].map(t => `<li class="item">${ic('chevr', 'app')}<span class="grow">${t}</span></li>`).join('')}</ul>
      <p class="note small mt2">A summary, not advice. Read the whole report and ask your {law}. The assistant treats text inside documents as information only, never as instructions to follow.</p>`),
  aidates: () => sheet('Assistant: your dates', `<ul class="list small">${['Tue 20 Oct, 5:00 pm: Mere Paewai\'s offer ends', 'Wed 21 Oct, 12:00 pm: the Lindqvists\' offer ends', 'Sat 24 Oct, 11:00 am: open home', 'Fri 30 Oct: the fee vote closes'].map(t => `<li class="item">${ic('clock', 'app')}<span class="grow">${t}</span></li>`).join('')}</ul>
      <p class="small muted mt">Dates from an agreement are confirmed by your {law} before you rely on them.</p>`),
  cmd: () => sheet('The command interface', `<p class="small">Every button in the app is a command. People, AI agents and scripts use the same path, with the same limits.</p>
      <pre class="code mt2">home.listing.pause { "listing": "WGN-24871" }
home.offer.record { "listing": "WGN-24871", "price": 1072000, "from_lawyer": "Kahikatea Legal" }
home.agreement.record { "offer": "O2" }
  needs a fresh passkey step from a person</pre>`),
  modlog: () => sheet('Public moderation log', `<ul class="list small">${[['Sat 17 Oct', 'Listing in Porirua removed: the owner could not prove control of the home. Rule 2.1.'], ['Thu 15 Oct', "Photo removed from a listing in Hastings: used without the photographer's licence. Rule 4.3."], ['Tue 13 Oct', "Words removed from a listing in Nelson: 'no children' is discrimination. Rule 5.2."]].map(([d, t]) => `<li class="item"><span class="mono" style="width:70px;flex:none">${d}</span><span class="grow">${t}</span></li>`).join('')}</ul><p class="small muted mt">Every removal and its reason is published. Owners can ask for a review.</p>`),
  aml: () => sheet('Anti-money-laundering checks', '<p>Anti-money-laundering law says who must check buyers and sellers, and where the money comes from. In the {n} pack, that is {aml}.</p><p class="mt">Spare Home does its own, smaller check so that only real owners list and only real buyers book. It does not replace the check the law requires.</p><p class="small muted mt">From the {n} rules pack, version 2026.10. Sample wording.</p>'),
  rulespack: () => sheet('Rules pack: {n}, 2026.10', `<ul class="list small">${['Document names and who issues them', 'Disclosure questions', 'Steps from offer to {settleL}', 'Multi-offer process', 'Tenant notice and viewing rules', 'Rules for overseas buyers', '{tax} rate and invoices', 'Identity and ownership checks', 'Plain-word meanings of property terms'].map(t => `<li class="item">${ic('check', 'app')}<span class="grow">${t}</span></li>`).join('')}</ul><p class="small muted mt">Each rule has a named owner and a date. A new country gets its own pack, without rewriting the app. {note}</p>
      <button class="btn block mt2" data-act="country">${ic('globe')}Change country</button>`),
  help: () => sheet('Ask the support team', `<label class="field" style="margin-top:0"><span>Your question</span><textarea class="in" id="htext">How do I add a second open home time?</textarea></label><button class="btn primary block mt2" data-act="helpgo">Send to a person</button>`),
  helpgo: () => { const t = $('#htext').value.trim(); if (!t) return; S.support.unshift([t, 'Open. A person replies within 1 working day.']); closeSheet(); render(); toast('Sent. Follow it here in Me.'); },
  vote: el => { const v = el.dataset.v; if (S.vote.mine === v) return; if (S.vote.mine) S.vote[S.vote.mine]--; S.vote[v]++; S.vote.mine = v; render(); toast('Vote counted. The result is public when the vote closes.'); },
  adminlog: () => sheet('Admin actions', `<ul class="list small">${[['Sat 17 Oct', 'Restored a photo removed by mistake on a Nelson listing. Case 4821.'], ['Fri 16 Oct', 'Changed the open home reminder from 2 hours to 3 hours before. Member vote 31.'], ['Wed 14 Oct', 'Paused a listing while ownership was checked again. Case 4790.']].map(([d, t]) => `<li class="item"><span class="mono" style="width:70px;flex:none">${d}</span><span class="grow">${t}</span></li>`).join('')}</ul><p class="small muted mt">Every admin action is recorded with who did it and why.</p>`),
  legalreq: () => sheet('Takedowns, court orders and police requests', '<p>We follow a published process. We tell the member unless the law stops us, and we publish the counts every quarter.</p><table class="tbl mt2"><tr><th>July to September 2026</th><th class="num">Got</th><th class="num">Met</th></tr><tr><td>Takedown demands</td><td class="num">2</td><td class="num">1</td></tr><tr><td>Court orders</td><td class="num">0</td><td class="num">0</td></tr><tr><td>Police requests</td><td class="num">1</td><td class="num">1</td></tr></table>'),
  current: () => sheet('Rules and data, kept current', `<table class="tbl"><tr><th>What</th><th>Version</th><th>Owner</th></tr>${[['Rules pack, {n}', '2026.10', 'Rules team'], ['School zones', 'Sep 2026', 'Data team'], ['Hazard maps', 'Aug 2026', 'Data team'], ['{rv} data', '2024 roll', 'Data team'], ['Selling guide', '2026.10', 'Rules team']].map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table>`)
});
const BEHALF = {
  'Trustee of a trust': 'the trust deed and the appointment of every trustee. Every trustee approves the sale.',
  'Executor of an estate': 'probate or letters of administration from the court.',
  'Attorney under a power of attorney': 'the power of attorney for property, and proof that it is in effect.',
  'Company director': "the company's entry on the companies register and a directors' resolution to sell."
};

document.addEventListener('change', e => { if (e.target.id === 'kind') { S.kindSel = kinds()[+e.target.value]; render(); } });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const fn = ACT[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g.pin')) { e.preventDefault(); ACT.pin(e.target); }
  if (e.key === 'Escape') { closeSheet(); ACT.assessclose(); }
});
document.addEventListener('input', e => {
  const id = e.target.id, v = e.target.value;
  if (id === 'q') { S.q = v; updateSearch(); }
  if (id === 'headline') S.headline = v;
  if (id === 'descr') S.descr = v;
  if (id === 'newprice') S.newprice = v;
  if (id === 'saleprice') { S.saleprice = +v; $('#spval').textContent = loc(money(S.saleprice)); $('#costcalc').innerHTML = loc(costCalc()); }
});
document.querySelectorAll('[data-i]').forEach(el => { if (I[el.dataset.i]) el.outerHTML = ic(el.dataset.i); });
window.addEventListener('hashchange', route);
const askedPack = (new URLSearchParams(location.search).get('country') || '').toUpperCase();
if (PACKS[askedPack]) S.pack = askedPack;
route();
</script>
</body>
</html>
