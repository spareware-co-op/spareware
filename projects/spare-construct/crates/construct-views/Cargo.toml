[package]
name = "construct-views"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# A view's record is construct-model's element record, unchanged; its bounds are construct-model's.
construct-model = { path = "../construct-model" }
# A view is of the views category, and a view shows only the categories that are model or import.
construct-categories = { path = "../construct-categories" }
# A plan stands on a level and its view range is tied to levels; heights go through construct-levels.
construct-levels = { path = "../construct-levels" }
# Offsets, line ends and depths are construct-params' Length, stored and typed as its values are.
construct-params = { path = "../construct-params" }
# A view's phase, its phase filter and the rule that decides what it shows.
construct-phases = { path = "../construct-phases" }
# "What is in this box" for the elements a view might show.
construct-spatial = { path = "../construct-spatial" }
# The view's scale is construct-styles' Scale, and it is what picks a pen's printed width.
construct-styles = { path = "../construct-styles" }
kit-core = { path = "../../../kit/crates/kit-core" }
# A view's phase settings and an element's staging are JSON text in a record, as the phases crate
# spells them. MIT OR Apache-2.0.
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file allows these four.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# No float is stored or compared here; a float comparison is an error.
float_cmp = "deny"
