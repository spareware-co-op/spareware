[package]
name = "construct-doorgen"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
kit-core = { path = "../../../kit/crates/kit-core" }
# A generated door or window is a family recipe, filled from a template and evaluated through
# construct-families' own evaluator: the only place its geometry comes from.
construct-families = { path = "../construct-families" }
# Every length, area and value is construct-params': grid steps, square steps, stored text.
construct-params = { path = "../construct-params" }
# The kernel's interface: the `Engine` trait the measuring engine answers. This repository's own,
# Apache-2.0. No engine is linked here.
engine-geometry = { path = "../../../engines/crates/engine-geometry" }

[dev-dependencies]
# A project's categories and materials, which a generated recipe is checked against.
construct-categories = { path = "../construct-categories" }
construct-materials = { path = "../construct-materials" }
# A generated type as a construct-types type: what a schedule reads.
construct-types = { path = "../construct-types" }
# The generated recipes are checked against the published schema with a JSON Schema validator
# (draft 2020-12), with no network fetching, the version construct-families' tests pin. MIT.
jsonschema = { version = "0.40.0", default-features = false }
# JSON values for the schema check. MIT OR Apache-2.0.
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file allows these four.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
