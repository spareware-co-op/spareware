[package]
name = "construct-drawing"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# An element's permanent ID. This repository's own.
kit-core = { path = "../../../kit/crates/kit-core" }
kit-ops = { path = "../../../kit/crates/kit-ops" }
# Category ids and the built-in tree, object styles, pens and scales, material ids, lengths, the
# element's placement and face names, and the kernel builder that makes and cuts the solids. Same
# workspace.
construct-categories = { path = "../construct-categories" }
construct-styles = { path = "../construct-styles" }
construct-materials = { path = "../construct-materials" }
construct-params = { path = "../construct-params" }
construct-model = { path = "../construct-model" }
construct-regen = { path = "../construct-regen" }
# The geometry kernel's facade: the engine seam's cut (Engine::section and its values). This
# repository's own, Apache-2.0.
engine-geometry = { path = "../../../engines/crates/engine-geometry" }
# The stored form is JSON. MIT OR Apache-2.0.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Exact fractions of any size for the interim 2D overlay (src/overlay.rs): where cut edges cross,
# the crossing's fraction can pass 128 bits, and region merge and hatch clipping are exact or they
# are wrong. num-rational's ratio of num-bigint's integers, with num-integer and num-traits for
# their traits. All MIT OR Apache-2.0 (the choice is recorded in engine-geometry's
# tests/scaffold/licence.rs); already in this workspace's lock at these versions.
num-bigint = "=0.4.8"
num-integer = "=0.1.47"
num-rational = "=0.4.2"
num-traits = "=0.2.19"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file and test module allows these four, and other
# code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# As in the kernel: doubles are compared exactly. Here a comparison asks whether a stored input
# changed, never whether two computed values are close.
float_cmp = "allow"
