[package]
name = "construct-modify"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
kit-core = { path = "../../../kit/crates/kit-core" }
# An element's record and its recipe are construct-model's, unchanged. Same workspace.
construct-model = { path = "../construct-model" }
# Lengths, angles and their stored spelling; an angle typed by a person is construct-params'.
# Same workspace.
construct-params = { path = "../construct-params" }
# How a hosted element sits in its record, a layered wall's line and a placed family's instance,
# each read by the module the builders read it with, so a move and a build cannot disagree. The
# server feature is the one that holds the hosting reader. Same workspace.
construct-regen = { path = "../construct-regen", features = ["server"] }
# A placed family's recipe: which of its parameters is a hand. Same workspace.
construct-families = { path = "../construct-families" }
# A floor's boundary, and the corners it is drawn from. Same workspace.
construct-slabs = { path = "../construct-slabs" }
construct-solver = { path = "../construct-solver" }
# A roof's footprint and what each of its edges does. Same workspace.
construct-roofs = { path = "../construct-roofs" }
# A room's point, its upper limit and its number. Same workspace.
construct-rooms = { path = "../construct-rooms" }
# The outlines of floor openings and shafts, and a wall opening's axis. Same workspace.
construct-openings = { path = "../construct-openings" }
# Grid lines and reference planes, and how a copy of one is named. Same workspace.
construct-grids = { path = "../construct-grids" }
# A layered wall's side is its instance parameter `wall.flipped`. Same workspace.
construct-walls = { path = "../construct-walls" }
# Whole numbers of any size, so a motion's fractions never overflow and a turn by any angle is
# worked out far past the grid before its points are rounded once (src/exact.rs, src/trig.rs).
# MIT OR Apache-2.0; 0.4.8, as the workspace already locks it.
num-bigint = { version = "0.4.8", default-features = false, features = ["std"] }
# Greatest common divisors and floor division of those numbers, for lowest terms. MIT OR
# Apache-2.0.
num-integer = { version = "0.1.47", default-features = false, features = ["std"] }
# Their traits (zero, one, sign). MIT OR Apache-2.0; 0.2.19, as the workspace already locks it.
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
# Recipes hold JSON. MIT OR Apache-2.0.
serde_json = "1.0.154"

[dev-dependencies]
# The level ties the fixtures' floors, roofs, rooms and shafts stand on. Same workspace.
construct-levels = { path = "../construct-levels" }
# Properties with fixed seeds, as construct-params uses it. MIT OR Apache-2.0.
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file and test module allows these four, and other
# code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# As in the kernel: doubles are compared exactly. Here a comparison asks whether a stored input
# changed, never whether two computed values are close.
float_cmp = "allow"
