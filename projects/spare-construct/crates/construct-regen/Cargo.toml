[package]
name = "construct-regen"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The regenerator that keeps a server's derived shapes up to date. The browser needs only the
# geometry, so its build leaves this out.
# It reads parameters, types, levels, wall types, floor types and roof types to fill the recipes
# that name them, the walls round a room to find its loop, and lays a stair out from its levels,
# so those crates come with it.
server = [
    "dep:kit-store",
    "dep:kit-sync",
    "dep:construct-categories",
    "dep:construct-formulas",
    "dep:construct-types",
    "dep:construct-levels",
    "dep:construct-slabs",
    "dep:construct-roofs",
    "dep:construct-rooms",
    "dep:construct-stairs",
    "dep:construct-materials",
    "dep:construct-views",
    "dep:construct-schedules",
    "dep:construct-sheets",
    "dep:construct-dimensions",
]

[dependencies]
kit-core = { path = "../../../kit/crates/kit-core" }
kit-ops = { path = "../../../kit/crates/kit-ops" }
kit-store = { path = "../../../kit/crates/kit-store", optional = true }
kit-sync = { path = "../../../kit/crates/kit-sync", optional = true }
construct-model = { path = "../construct-model" }
# The display shape of grids and reference planes: src/datum.rs reads their recipes.
construct-grids = { path = "../construct-grids" }
construct-categories = { path = "../construct-categories", optional = true }
# The one formula language: a parameter with a formula is worked out when it is read.
construct-formulas = { path = "../construct-formulas", optional = true }
# Stored lengths and angles: a layered wall's recipe holds its lengths in their stored spelling
# (src/wall_plan.rs), a floor's filled recipe is in the steps of the length grid
# (src/floor_plan.rs) and datum.rs reads grids' and planes' recipes; both builders read them,
# so it is not optional. Same workspace.
construct-params = { path = "../construct-params" }
construct-types = { path = "../construct-types", optional = true }
# An element's place and a top-tied wall's height read its levels.
construct-levels = { path = "../construct-levels", optional = true }
# A layered wall's layers are read from its wall type (src/walls.rs, the server's), and both
# builders turn its wrapping layers by construct-walls' wrapping rule (src/wall_plan.rs and the
# kernel's layered builder), so it is not optional. Same workspace; it reads no store.
construct-walls = { path = "../construct-walls" }
# A floor's layers are read from its floor type and its boundary checked (src/slabs.rs). Same
# workspace.
construct-slabs = { path = "../construct-slabs", optional = true }
# A roof's layers are read from its roof type and its shape worked out (src/roofs.rs). Same
# workspace.
construct-roofs = { path = "../construct-roofs", optional = true }
# A room's loop is found from the walls of its level (src/rooms.rs). Same workspace.
construct-rooms = { path = "../construct-rooms", optional = true }
# A stair is laid out from the rise its levels give it and filled with its pieces (src/stairs.rs).
# Same workspace.
construct-stairs = { path = "../construct-stairs", optional = true }
# A floor's read-only mass is its layers' volumes of their materials, from the default library
# (src/slabs.rs). Same workspace.
construct-materials = { path = "../construct-materials", optional = true }
# A placed family is built from its family recipe: the recipe's reader, its opening solved at a
# type's values, and its solids through the recipe evaluator over the builder's engine
# (src/families.rs, src/kernel/family.rs). Both builders read it, so it is not optional. Same
# workspace.
construct-families = { path = "../construct-families" }
# A view is a record with no shape, so the regenerator passes it over.
construct-views = { path = "../construct-views", optional = true }
# A schedule is a record with no shape, so the regenerator passes it over.
construct-schedules = { path = "../construct-schedules", optional = true }
# Openings and shafts (job 4.2): their recipes, outlines and fit, which both builders read
# (src/voids.rs, src/kernel/floor.rs, src/kernel/opening.rs), so it is not optional. Same
# workspace.
construct-openings = { path = "../construct-openings" }
# A sheet and a viewport are records with no shape too (the viewport commands, A74).
construct-sheets = { path = "../construct-sheets", optional = true }
# A dimension is a record with no shape as well (the dimension commands, A81).
construct-dimensions = { path = "../construct-dimensions", optional = true }
# Curtain walls (job 14.1): their layout, solids and quantities, which both builders read
# (src/curtain_plan.rs), so it is not optional. Same workspace.
construct-curtain = { path = "../construct-curtain" }
# The geometry kernel's facade, the only kernel crate a program depends on: its engine seam, grid
# and names, for the builder in src/kernel.rs. This repository's own, Apache-2.0.
engine-geometry = { path = "../../../engines/crates/engine-geometry" }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
# Fuzz harnesses: see kit-store's tests/fuzz_keys.rs. MIT.
bolero = "0.13.7"
construct-regen = { path = ".", features = ["server"] }
kit-store = { path = "../../../kit/crates/kit-store", features = ["memory"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file and test module allows these four, and other
# code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# As in the kernel: doubles are compared exactly. Here a comparison asks whether a stored input
# changed, never whether two computed values are close.
float_cmp = "allow"
