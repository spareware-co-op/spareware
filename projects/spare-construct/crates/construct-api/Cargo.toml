[package]
name = "construct-api"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[features]
# What the cloud server runs: the access checks and the commands the orderer calls. Left out of the
# browser's build, which has no use for a store.
cloud = ["dep:kit-core", "dep:kit-store", "dep:kit-sync"]

[dependencies]
kit-core = { path = "../../../kit/crates/kit-core", optional = true }
kit-store = { path = "../../../kit/crates/kit-store", optional = true }
kit-sync = { path = "../../../kit/crates/kit-sync", optional = true }
kit-ops = { path = "../../../kit/crates/kit-ops" }
kit-plugin = { path = "../../../kit/crates/kit-plugin" }
kit-mcp = { path = "../../../kit/crates/kit-mcp" }
construct-model = { path = "../construct-model" }
construct-elements = { path = "../construct-elements" }
construct-families = { path = "../construct-families" }
construct-views = { path = "../construct-views" }
construct-clash = { path = "../construct-clash" }
construct-versions = { path = "../construct-versions" }
construct-interop = { path = "../construct-interop" }
construct-transport = { path = "../construct-transport" }
engine-sim = { path = "../../../engines/crates/engine-sim" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: numbers are read correctly rounded, as JSON.parse does (the transport engine relies on it)
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
construct-api = { path = ".", features = ["cloud"] }
construct-regen = { path = "../construct-regen", features = ["server"] }
kit-store = { path = "../../../kit/crates/kit-store", features = ["memory"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file and test module allows these four, and other
# code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# As in the kernel: doubles are compared exactly. Here a comparison asks whether a stored input
# changed, never whether two computed values are close.
float_cmp = "allow"
