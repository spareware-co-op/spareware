[package]
name = "construct-api"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[features]
# What the cloud server runs: the access checks and the commands the orderer calls. Left out of the
# browser's build, which has no use for a store.
cloud = [
    "dep:kit-core",
    "dep:kit-store",
    "dep:kit-sync",
    "dep:construct-categories",
    "dep:construct-formulas",
    "dep:construct-grids",
    "dep:construct-params",
    "dep:construct-regen",
    "dep:construct-types",
    "dep:construct-levels",
    "dep:construct-walls",
    "dep:construct-materials",
    "dep:construct-slabs",
    "dep:construct-openings",
    "dep:construct-roofs",
    "dep:construct-phases",
]

[dependencies]
kit-core = { path = "../../../kit/crates/kit-core", optional = true }
kit-store = { path = "../../../kit/crates/kit-store", optional = true }
kit-sync = { path = "../../../kit/crates/kit-sync", optional = true }
kit-ops = { path = "../../../kit/crates/kit-ops" }
kit-plugin = { path = "../../../kit/crates/kit-plugin" }
kit-mcp = { path = "../../../kit/crates/kit-mcp" }
construct-model = { path = "../construct-model" }
# The parameter and type commands: the data crates check every change, and construct-regen's
# reader is the one the regenerator builds shapes with.
construct-categories = { path = "../construct-categories", optional = true }
# Formula parameters: the commands check a formula and work it out before they accept a change.
construct-formulas = { path = "../construct-formulas", optional = true }
# Grid lines and reference planes: the grid commands check every change with it.
construct-grids = { path = "../construct-grids", optional = true }
construct-params = { path = "../construct-params", optional = true }
construct-regen = { path = "../construct-regen", features = ["server"], optional = true }
construct-types = { path = "../construct-types", optional = true }
# The level commands: construct-levels checks every change.
construct-levels = { path = "../construct-levels", optional = true }
# The wall type and wall commands: construct-walls checks every layer and core, and a layer's
# material is construct-materials' ID.
construct-walls = { path = "../construct-walls", optional = true }
construct-materials = { path = "../construct-materials", optional = true }
# The floor type and floor commands: construct-slabs checks every layer and boundary.
construct-slabs = { path = "../construct-slabs", optional = true }
# The opening and shaft commands: construct-openings checks every outline and fit.
construct-openings = { path = "../construct-openings", optional = true }
# The roof type and roof commands: construct-roofs checks every footprint, form, pitch and overhang.
construct-roofs = { path = "../construct-roofs", optional = true }
# The view commands: a view's staging and phase settings are the phases crate's values.
construct-phases = { path = "../construct-phases", optional = true }
construct-elements = { path = "../construct-elements" }
construct-families = { path = "../construct-families" }
construct-views = { path = "../construct-views" }
construct-clash = { path = "../construct-clash" }
construct-versions = { path = "../construct-versions" }
construct-interop = { path = "../construct-interop" }
construct-transport = { path = "../construct-transport" }
engine-sim = { path = "../../../engines/crates/engine-sim" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: numbers are read correctly rounded, as JSON.parse does (the transport engine relies on it)
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
construct-api = { path = ".", features = ["cloud"] }
construct-regen = { path = "../construct-regen", features = ["server"] }
kit-store = { path = "../../../kit/crates/kit-store", features = ["memory"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file and test module allows these four, and other
# code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# As in the kernel: doubles are compared exactly. Here a comparison asks whether a stored input
# changed, never whether two computed values are close.
float_cmp = "allow"
