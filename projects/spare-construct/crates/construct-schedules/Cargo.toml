[package]
name = "construct-schedules"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# A schedule lists the elements of a category, and a category's subcategories count as it.
construct-categories = { path = "../construct-categories" }
# A calculated field is a formula in the project's one formula language, read, type-checked and
# worked out exactly by that crate; nothing here works a number out of a formula by itself.
construct-formulas = { path = "../construct-formulas" }
# A schedule's record is construct-model's element record, unchanged.
construct-model = { path = "../construct-model" }
# Values, kinds, definitions, units and the document's parameter table: a field is a parameter by
# its definition, and every number is read, compared and shown as these types do.
construct-params = { path = "../construct-params" }
# A schedule carries the staging fields every element carries.
construct-phases = { path = "../construct-phases" }
kit-core = { path = "../../../kit/crates/kit-core" }
# A schedule's fields, filters and sorting are JSON text in its record. MIT OR Apache-2.0.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file allows these four.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# No float is stored or compared here; a float comparison is an error.
float_cmp = "deny"
