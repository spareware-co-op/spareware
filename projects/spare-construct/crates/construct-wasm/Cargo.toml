[package]
name = "construct-wasm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
construct-api = { path = "../construct-api" }
construct-transport = { path = "../construct-transport" }
wasm-bindgen = "=0.2.118"
js-sys = "=0.3.95"
serde_json = { version = "1", features = ["float_roundtrip"] }
