[package]
name = "construct-stairs"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The stairs category. Same workspace.
construct-categories = { path = "../construct-categories" }
# A stair stands on its base level and reaches its top level, by construct-levels' ties in its
# record's props; typed lengths in the rule data are read by its one reader. Same workspace.
construct-levels = { path = "../construct-levels" }
# A stair's record and its recipe are construct-model's, unchanged. Same workspace.
construct-model = { path = "../construct-model" }
# Lengths, slopes and angles, their stored spelling, and the read-only parameters. Same workspace.
construct-params = { path = "../construct-params" }
# A pitch limit given in degrees is worked as the slope a roof's pitch in degrees is
# (construct-roofs' `Pitch::slope`, the rule its decision note settles), reused rather than written
# twice. Same workspace.
construct-roofs = { path = "../construct-roofs" }
# The category key a record names its category under. Same workspace.
construct-types = { path = "../construct-types" }
kit-core = { path = "../../../kit/crates/kit-core" }
# The rule data and the stored text are JSON. MIT OR Apache-2.0.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
# Reader fuzz targets, as in construct-model's tests. MIT.
bolero = "0.13.7"
# The material a stair is drawn in is one of the default library's. Same workspace.
construct-materials = { path = "../construct-materials" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file allows these four.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# No float is stored, compared or computed here; a float comparison is an error.
float_cmp = "deny"
