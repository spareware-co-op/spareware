[package]
name = "construct-solver"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The singular value decomposition the solver steps and diagnoses with. Apache-2.0. Default
# features off: the `std` feature brings `matrixmultiply`, which picks processor-specific kernels
# at run time, and the solver must give the same bits on every machine. `libm` gives the maths
# functions without `std`. The code paths used (SVD, matrix-vector products) are nalgebra's own
# scalar loops; see the engine module's header.
nalgebra = { version = "0.35.0", default-features = false, features = ["alloc", "libm"] }
# Forward-mode automatic differentiation (dual numbers), so every derivative is generated from the
# residual written once. MIT OR Apache-2.0. Default features off: only `num-traits`.
num-dual = { version = "0.16.0", default-features = false }
# Solved sketches and reports serialise to canonical bytes. MIT OR Apache-2.0.
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
# The kernel's interface, for one test only: STEPS_PER_MM and COORD_LIMIT are the kernel's
# GridStep::Q0 and coordinate range. Ours. The crate itself does not link the kernel.
engine-geometry = { path = "../../../engines/crates/engine-geometry" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file and test module allows these four, and other
# code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# As in the kernel: doubles are compared exactly. Here a comparison asks whether a stored input
# changed, never whether two computed values are close.
float_cmp = "allow"
