[package]
name = "construct-columns"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The columns category. Same workspace.
construct-categories = { path = "../construct-categories" }
# A column is tied to its base level and its top level by construct-levels' ties, in its record's
# props, and a height between two levels is construct-levels' `span`. Same workspace.
construct-levels = { path = "../construct-levels" }
# A column type's material ID, and the mass of a volume of it. Same workspace.
construct-materials = { path = "../construct-materials" }
# A column's record and its recipe are construct-model's, unchanged. Same workspace.
construct-model = { path = "../construct-model" }
# Lengths, angles, areas and volumes, the read-only parameters' definitions and values. Same
# workspace.
construct-params = { path = "../construct-params" }
# A column on a grid intersection: the crossing of two grid lines is construct-grids'. Same
# workspace.
construct-grids = { path = "../construct-grids" }
# A column type is an element type with a system block. Same workspace.
construct-types = { path = "../construct-types" }
kit-core = { path = "../../../kit/crates/kit-core" }
# A column type's stored text is JSON. MIT OR Apache-2.0.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Sine and cosine of a column's turn, in pure Rust so the bits are the same on every machine, as
# construct-grids takes them. MIT.
libm = "0.2.16"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file allows these four.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# No float is stored or compared here; a float comparison is an error.
float_cmp = "deny"
