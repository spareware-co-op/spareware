[package]
name = "construct-families"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
kit-core = { path = "../../../kit/crates/kit-core" }
# A parameter is a construct-params definition; values are its stored text.
construct-params = { path = "../construct-params" }
# A family's types are construct-types types, carrying a `family` system block.
construct-types = { path = "../construct-types" }
# Categories and subcategories by their permanent ids.
construct-categories = { path = "../construct-categories" }
# Materials by their permanent ids.
construct-materials = { path = "../construct-materials" }
# Formulas are this language, checked as it checks them.
construct-formulas = { path = "../construct-formulas" }
# A sketch is the solver's: its sides of a line and its ways two curves touch.
construct-solver = { path = "../construct-solver" }
# The kernel's interface, the only geometry a recipe is evaluated through: its `Engine` trait and
# grid points. This repository's own, Apache-2.0. No engine is linked here.
engine-geometry = { path = "../../../engines/crates/engine-geometry" }
# A recipe is JSON, read through serde_json's value. MIT OR Apache-2.0.
serde_json = "1.0.154"
# SHA-256 for content ids: the RustCrypto implementation, as kit-ops uses it. MIT OR Apache-2.0.
sha2 = { version = "0.11.0", default-features = false }
# Hexadecimal text of a hash. MIT OR Apache-2.0.
hex = "0.4.3"
# Whole numbers of any size, so a family seated at any angle has each corner worked out exactly and
# rounded once (src/evaluate/seat.rs): the products pass what an i128 holds. The version already in
# the lock files. MIT OR Apache-2.0.
num-bigint = { version = "0.4.8", default-features = false, features = ["std"] }

[dev-dependencies]
# The published schema is checked with a JSON Schema validator (draft 2020-12), with no network
# fetching (default features off). 0.40 moves no package already in the lock files (0.62 would
# move regex). MIT.
jsonschema = { version = "0.40.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file and test module allows these four, and other
# code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# As in the kernel: doubles are compared exactly. Here a comparison asks whether a stored input
# changed, never whether two computed values are close.
float_cmp = "allow"
