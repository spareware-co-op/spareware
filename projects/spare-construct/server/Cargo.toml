[package]
name = "spare-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# Its own workspace, apart from the root one: note K08 says why. The kit's crates and services and
# Spare Construct's crates come in as path dependencies.
[workspace]
members = ["."]

# The geometry kernel's builder with solidcore's engine behind it (src/geometry.rs), chosen by the
# `geometry` setting. Off by default: solidcore is about a million lines and one compile of it takes
# 10 to 17 minutes and about 7 GB (geom-solidcore's Cargo.toml), so a default build of the server,
# and the checklist's, stays as it was.
[features]
kernel = ["dep:geom-solidcore"]

# Every version is pinned here and by Cargo.lock; deny.toml checks every licence.
[dependencies]
construct-api = { path = "../crates/construct-api", features = ["cloud"] }
# A view's plan: construct-drawing prints it with these styles (src/plan.rs); the kernel's facade
# is the engine seam it cuts through. This repository's own, Apache-2.0.
construct-categories = { path = "../crates/construct-categories" }
construct-drawing = { path = "../crates/construct-drawing" }
construct-materials = { path = "../crates/construct-materials" }
construct-params = { path = "../crates/construct-params" }
construct-styles = { path = "../crates/construct-styles" }
construct-views = { path = "../crates/construct-views" }
engine-geometry = { path = "../../engines/crates/engine-geometry" }
construct-model = { path = "../crates/construct-model" }
construct-regen = { path = "../crates/construct-regen", features = ["server"] }
# Reports of problems and feedback (piece A100): their shape, checks, states and public issue.
# This repository's own, Apache-2.0.
construct-report = { path = "../crates/construct-report" }
kit-accounts = { path = "../../kit/services/accounts" }
kit-core = { path = "../../kit/crates/kit-core" }
kit-ops = { path = "../../kit/crates/kit-ops" }
kit-store = { path = "../../kit/crates/kit-store" }
kit-store-tikv = { path = "../../kit/services/store" }
kit-sync = { path = "../../kit/crates/kit-sync" }
# solidcore behind the kernel's engine seam, from its own workspace (decision 32.70): the engine the
# `kernel` feature links. Its Cargo.lock's pins are this one's for the crates it adds. Apache-2.0.
geom-solidcore = { path = "../../engines/geometry/geom-solidcore", optional = true }
axum = { version = "=0.8.9", features = ["ws"] }  # MIT
axum-extra = { version = "=0.12.6", features = ["cookie"] }  # MIT
base64 = "=0.22.1"                 # MIT OR Apache-2.0
clap = { version = "=4.5.51", features = ["derive", "env"] }  # MIT OR Apache-2.0
flate2 = "=1.1.5"                  # MIT OR Apache-2.0
futures = "=0.3.31"                # MIT OR Apache-2.0
hex = "=0.4.3"                     # MIT OR Apache-2.0
# The page's core and tools (app/core, app/tools), embedded as two trees so a new file needs no
# route (note A96); build.rs makes a new file rebuild the server.
include_dir = "=0.7.4"             # MIT
rand = "=0.9.2"                    # MIT OR Apache-2.0
serde = { version = "=1.0.229", features = ["derive"] }  # MIT OR Apache-2.0
serde_json = "=1.0.154"            # MIT OR Apache-2.0
sha2 = "=0.11.0"                   # MIT OR Apache-2.0
thiserror = "=2.0.21"              # MIT OR Apache-2.0
time = "=0.3.55"                   # MIT OR Apache-2.0
tokio = { version = "=1.54.1", features = ["full"] }  # MIT
# Every request's ID, answered in x-request-id, and a span and a line for each request
# (src/recent.rs).
tower-http = { version = "=0.6.11", features = ["request-id", "trace"] }  # MIT
tracing = "=0.1.41"                # MIT
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }  # MIT

[dev-dependencies]
kit-store = { path = "../../kit/crates/kit-store", features = ["memory"] }
# The kernel's facade, for the kernel builder's suite (construct-regen's tests/kernel_suite), which
# tests/kernel.rs runs on solidcore's engine. This repository's own, Apache-2.0.
engine-geometry = { path = "../../engines/crates/engine-geometry" }
# Stored lengths, for the suite's layered walls (a filled recipe holds its lengths in their stored
# spelling). This repository's own, Apache-2.0.
construct-params = { path = "../crates/construct-params" }
# Family recipes, for the suite's placed families (their types, turns and the evaluator the suite
# asks the engine through). This repository's own, Apache-2.0.
construct-families = { path = "../crates/construct-families" }
chrono = "=0.4.45"                 # MIT OR Apache-2.0
openidconnect = { version = "=4.0.1", default-features = false }   # MIT
reqwest = { version = "=0.13.1", default-features = false, features = ["rustls", "cookies", "json"] }  # MIT OR Apache-2.0
rsa = "=0.9.10"                    # MIT OR Apache-2.0
tokio-tungstenite = "=0.29.0"      # MIT
url = "=2.5.8"                     # MIT OR Apache-2.0

# The stand-in for Google's sign-in, for tests only: the server has no way to reach it but a setting.
[[example]]
name = "mock_oidc"
path = "tests/support/mock_oidc.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file and test module allows these four, and other
# code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# As in the kernel: doubles are compared exactly. Here a comparison asks whether a stored input
# changed, never whether two computed values are close.
float_cmp = "allow"
