[package]
name = "construct-shapes-kernel"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# Its own workspace, with its own Cargo.lock, apart from the root one and the server's: it links
# solidcore, which never enters the root workspace (decision 32.70), and it needs wasm-bindgen at
# the version wasm-bindgen-cli is pinned to, which the server's lock holds at another version for
# its own wasm-only dependencies. Its lock was started from the server's, so every crate both
# build natively is at the server's version (tests/package.rs checks it): the browser builds with
# the very engine the server's `kernel` feature does. Note CON-A3-F1-P1-kernel-in-the-browser.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
construct-model = { path = "../../crates/construct-model" }
construct-regen = { path = "../../crates/construct-regen" }
# solidcore behind the kernel's engine seam, from its own workspace (decision 32.70): the engine
# the server's `kernel` feature links. Apache-2.0.
geom-solidcore = { path = "../../../engines/geometry/geom-solidcore" }
serde = { version = "=1.0.229", features = ["derive"] }  # MIT OR Apache-2.0
serde_json = "=1.0.154"            # MIT OR Apache-2.0
# The browser's way in, at the version construct-shapes pins. MIT OR Apache-2.0.
wasm-bindgen = "=0.2.118"

[dev-dependencies]
# The stand-in's package, natively, so a test holds this one to the same answers for the same
# builder. This repository's own, Apache-2.0.
construct-shapes = { path = "../../crates/construct-shapes" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Spare Construct's lint posture: the geometry kernel's [lints] tables (geom-num's Cargo.toml), so
# that nothing here crashes (AGENTS.md, rule 8). The crate is written to clippy's pedantic idioms;
# CI denies every warning. projects/spare-construct/clippy.toml lets tests use what is denied here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The kernel's chapter 21 bans live in its own clippy.toml and are not Spare Construct's; these two
# stay denied so a ban added to projects/spare-construct/clippy.toml is an error at once.
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step is a checked method, and no cast loses a value silently. Tests
# may use native arithmetic and casts: each test file and test module allows these four, and other
# code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# As in the kernel: doubles are compared exactly. Here a comparison asks whether a stored input
# changed, never whether two computed values are close.
float_cmp = "allow"
