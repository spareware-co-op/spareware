[package]
name = "engine-geometry"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# kit-core for permanent IDs and units at the boundary (section 5), every kernel crate this
# facade re-exports (src/value.rs and src/schema.rs, piece G100), and geom-pool behind the
# `threads` feature. Checked by tests/scaffold, which holds the kernel's crate table (chapter 27).
kit-core = { path = "../../../kit/crates/kit-core" }
geom-check = { path = "../../geometry/crates/geom-check" }
geom-curve = { path = "../../geometry/crates/geom-curve" }
geom-make = { path = "../../geometry/crates/geom-make" }
geom-math = { path = "../../geometry/crates/geom-math" }
geom-name = { path = "../../geometry/crates/geom-name" }
geom-num = { path = "../../geometry/crates/geom-num" }
geom-op = { path = "../../geometry/crates/geom-op" }
geom-run = { path = "../../geometry/crates/geom-run" }
geom-surface = { path = "../../geometry/crates/geom-surface" }
geom-topo = { path = "../../geometry/crates/geom-topo" }
geom-pool = { path = "../../geometry/crates/geom-pool", optional = true }

[dev-dependencies]
# Every test build runs all four checker groups (chapter 28.4), release builds included.
geom-check = { path = "../../geometry/crates/geom-check", features = ["full"] }
# The scaffold check and the merge gate (tests/scaffold) read TOML, cargo's metadata and messages,
# JSON and Rust source with the standard crates for each, in place of readers written there (piece
# G12a; chapter 29.1, the owner's direction of 2026-10-22). Tests only, never shipped. Each pinned:
# toml 0.9.6 (MIT OR Apache-2.0), the toml-rs reader (TOML 1.0): the newest release whose optional
# indexmap requirement (^2.3) resolves beside geom-fuzz's bolero-generator-derive 0.13.5, which pins
# indexmap =2.11.2, where toml 1.x asks ^2.13 (cargo resolves optional requirements too); the API
# used here is the same in both. cargo_metadata 0.23.1 (MIT); serde_json 1.0.154 (MIT OR
# Apache-2.0), for cargo-deny's output and the seeded graphs; syn 3.0.9 (MIT OR Apache-2.0),
# without its default features, which link the compiler's proc_macro and print code; proc-macro2
# 1.0.107 (MIT OR Apache-2.0), syn's lexer, with the line numbers the reports give.
toml = "=0.9.6"
cargo_metadata = "=0.23.1"
serde_json = "=1.0.154"
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }

[features]
# Threads for geom-run's helper, through geom-pool alone (23.4, 27). Off by default, so a default
# build of the facade, wasm32-unknown-unknown included, links no threads.
threads = ["dep:geom-pool"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Kani sets `cfg(kani)` when it compiles a proof; proofs and the code they need sit beside the
# code under it (chapter 28.7).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)", "cfg(kani)"] }

[lints.clippy]
# The kernel's one lint posture: exactly geom-num's settings, here and in clippy.toml (the scaffold
# check in engine-geometry, tests/scaffold/lints.rs, fails until they match). The crate is written
# to clippy's pedantic idioms; CI denies every warning.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Chapter 21's disallowed methods and types (clippy.toml) are errors in every clippy run, not
# only in one given -D warnings (the merge gate, G12).
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name, todo!, unimplemented! and unreachable!: principle 13
# (no panics in kernel paths) and chapter 27's denial of panic, as errors (the merge gate, G12).
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step in kernel code is a checked method, and no cast loses a value
# silently. Tests may use native arithmetic and casts: each test file and test module allows these
# four, and kernel code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Doubles are compared exactly, never against a tolerance: the kernel decides with exact predicates
# and certified bounds (principles 1 and 2), so clippy's advice to compare within an epsilon does
# not apply.
float_cmp = "allow"
