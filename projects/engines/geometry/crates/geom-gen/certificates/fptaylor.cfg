# FPTaylor v0.9.3's settings for a proof certificate HOL Light can check (its formal/README.md):
# proof recording on, and the standard rounding model (the improved one has no certificates).
# Each error term is bounded on its own (opt-approx), and HOL Light checks each term's bound as
# an inequality of its own. The exact problem (opt-exact) bounds the sum of the terms at once, a
# tighter bound, but HOL Light checks it as one inequality over the whole box, split into cells:
# insphere's 16 variables took 2592 cells and 75 minutes, and lpi_side's did not finish in five
# hours (run 40603306636). A bound on each term is at least the exact one, so a sum of them
# within K says at least as much.
proof-record = true
proof-dir = proofs
fp-power2-model = false
opt-exact = false
opt-approx = true
rel-error = false
abs-error = true
