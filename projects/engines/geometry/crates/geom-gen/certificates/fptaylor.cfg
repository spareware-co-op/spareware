# FPTaylor v0.9.3's settings for a proof certificate HOL Light can check (its formal/README.md):
# proof recording on, and the standard rounding model (the improved one has no certificates).
# fptaylor.sh adds the optimisation each problem's `// fptaylor-optimisation:` line names:
# `approx` bounds each error term on its own, and HOL Light checks each term's bound as an
# inequality of its own; `exact` bounds their sum at once, which HOL Light checks as one
# inequality over the whole box, split into cells (geom-gen's EXACT_OPTIMISATION says which
# filters take which, and why).
proof-record = true
proof-dir = proofs
fp-power2-model = false
rel-error = false
abs-error = true
