# FPTaylor v0.9.3's settings for a proof certificate HOL Light can check (its formal/README.md):
# proof recording on, the standard rounding model (the improved one has no certificates), and the
# exact optimisation problems, whose bounds are tighter and which HOL Light also checks.
proof-record = true
proof-dir = proofs
fp-power2-model = false
opt-exact = true
rel-error = false
abs-error = true
