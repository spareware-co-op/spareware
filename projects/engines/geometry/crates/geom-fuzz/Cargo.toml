[package]
name = "geom-fuzz"
version = "0.0.0"
edition.workspace = true
rust-version = "1.86"
publish.workspace = true
license.workspace = true
description = "Spare Kit geometry kernel, development only: fuzz harnesses and bounded proofs, run as tests on stable, under libFuzzer with cargo-bolero, in ClusterFuzzLite and under Kani."

[dependencies]
geom-num = { path = "../geom-num" }
geom-test = { path = "../geom-test" }
# The intersect target (G158): the code under test. The shapes and boxes its cases are made of come
# from the kernel crates listed below for the make and arenas targets (ours, MPL-2.0).
geom-intersect = { path = "../geom-intersect" }
# Avnaim et al.'s reference signs (piece G42), without the bench judge's dependencies.
geom-bench = { path = "../geom-bench", default-features = false }
# The variants target (G42) reads the predicates' descriptions with geom-gen's own parser (ours,
# MPL-2.0; development only).
geom-gen = { path = "../geom-gen" }
# The make target (G101): geom-make's operations under test, and the kernel crates its inputs and
# oracles come from (ours, MPL-2.0).
geom-check = { path = "../geom-check", features = ["full"] }
geom-make = { path = "../geom-make" }
geom-math = { path = "../geom-math" }
geom-op = { path = "../geom-op" }
geom-run = { path = "../geom-run" }
geom-topo = { path = "../geom-topo" }
# The oracle of the wide-integer target (G26) and of the variants target (G42): exact
# arbitrary-precision integers, the big-integer oracle chapter 29.3 names. MIT OR Apache-2.0.
num-bigint = "0.4.8"
# The code under test of the cbor target (G91) and the cache target's memo store (G105) (MPL-2.0,
# ours).
geom-format = { path = "../geom-format" }
# The arenas target (G80): the kernel crates whose values fill geom-topo's arenas (ours, MPL-2.0).
geom-curve = { path = "../geom-curve" }
geom-surface = { path = "../geom-surface" }

[dev-dependencies]
# The harness front end: one `check!` runs a harness as a property test (on stable), under
# libFuzzer, AFL or honggfuzz (cargo-bolero) and under Kani. MIT.
bolero = "0.13.7"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Kani sets `cfg(kani)` when it compiles a proof; proofs and the code they need sit beside the
# code under it (chapter 28.7).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)", "cfg(kani)"] }

[lints.clippy]
# The crate is written to clippy's pedantic idioms; CI denies every warning.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Chapter 21's disallowed methods and types (clippy.toml) are errors in every clippy run, not
# only in one given -D warnings (the merge gate, G12).
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name, todo!, unimplemented! and unreachable!: principle 13
# (no panics in kernel paths) and chapter 27's denial of panic, as errors (the merge gate, G12).
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step in kernel code is a checked method, and no cast loses a value
# silently. Tests may use native arithmetic and casts: each test file and test module allows these
# four, and kernel code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Exact comparison of doubles is the point of this crate: the interval and error-free code compare
# bits and bounds exactly, never against a tolerance.
float_cmp = "allow"
