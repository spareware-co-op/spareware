[package]
name = "geom-exchange"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
# Apache-2.0, with MIT for the DEFLATE decoder ported from miniz_oxide (src/inflate/decode.rs), as
# chapter 29.20, rule 4, asks of a crate with a ported file.
license = "Apache-2.0 AND MIT"
description = "Spare Kit geometry kernel: units, numbers to grid and the shared mappings every format crate uses."

[dependencies]
geom-math = { path = "../geom-math", default-features = false }
geom-run = { path = "../geom-run", default-features = false }
# Exactly this crate's row of chapter 27's crate table, checked by the scaffold test
# in engine-geometry (tests/scaffold).

geom-check = { path = "../geom-check" }
geom-curve = { path = "../geom-curve" }
geom-format = { path = "../geom-format" }
geom-intersect = { path = "../geom-intersect" }
geom-num = { path = "../geom-num" }
geom-op = { path = "../geom-op" }
geom-p21 = { path = "../geom-p21" }
geom-surface = { path = "../geom-surface" }
geom-topo = { path = "../geom-topo" }

[dev-dependencies]
# Exact oracles for tests only, never linked into the kernel. All MIT OR Apache-2.0.
num-bigint = "0.4"
num-rational = "0.4.2"
num-traits = "0.2"
num-integer = "0.1"
# Printed, replayable seeds for the randomised tests (piece G19): the kernel's development crate,
# a development dependency only (chapter 28.1).
geom-test = { path = "../geom-test" }
# The oracle of the DEFLATE decoder's differential test (piece G414b): the crate its decoder is
# ported from, at its latest release, compared byte for byte. MIT OR Zlib OR Apache-2.0; a
# development dependency only, never linked into the kernel (chapter 29.1: its only DEPEND is
# `libm`).
miniz_oxide = "=0.9.1"

# Wall-clock throughput of numbers to grid, shortest decimals and reals (piece G413), with the
# standard library's clock only, like geom-math's; it moves to geom-bench with the others.
[[bench]]
name = "exchange"
harness = false

# The DEFLATE reader's throughput on a compressed 3MF-shaped mesh part, beside miniz_oxide's own
# decoder (piece G414b), the same way.
[[bench]]
name = "inflate"
harness = false

# The zip reader's cost on a 3MF-shaped package (piece G414c): its directory checked, its part
# names held to the packaging rules and its model part read, beside inflating that part alone.
[[bench]]
name = "zip"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Kani sets `cfg(kani)` when it compiles a proof; proofs and the code they need sit beside the
# code under it (chapter 28.7).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)", "cfg(kani)"] }

[lints.clippy]
# The kernel's one lint posture: exactly geom-num's settings, here and in clippy.toml (the scaffold
# check in engine-geometry, tests/scaffold/lints.rs, fails until they match). The crate is written
# to clippy's pedantic idioms; CI denies every warning.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Chapter 21's disallowed methods and types (clippy.toml) are errors in every clippy run, not
# only in one given -D warnings (the merge gate, G12).
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name, todo!, unimplemented! and unreachable!: principle 13
# (no panics in kernel paths) and chapter 27's denial of panic, as errors (the merge gate, G12).
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step in kernel code is a checked method, and no cast loses a value
# silently. Tests may use native arithmetic and casts: each test file and test module allows these
# four, and kernel code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Doubles are compared exactly, never against a tolerance: the kernel decides with exact predicates
# and certified bounds (principles 1 and 2), so clippy's advice to compare within an epsilon does
# not apply.
float_cmp = "allow"
