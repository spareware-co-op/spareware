[package]
name = "geom-bench"
version = "0.0.0"
edition.workspace = true
# Development only: never published, never a dependency of any kernel or program crate.
publish = false
license.workspace = true
description = "Spare Kit geometry kernel: benchmarks of every numbers-layer operation, with the count gates that block a regression over 5%."
# The WebAssembly fuel host (fuel/) is a separate workspace, so Wasmtime never enters this one.
exclude = ["fuel"]

[lib]
# The library holds the inputs, kernels and checks the harnesses share. It has no benchmarks of its
# own, and leaving it out of `cargo bench` keeps libtest from rejecting the gate's arguments.
bench = false

# The program the WebAssembly fuel gate runs inside Wasmtime (built for wasm32-wasip1).
[[bin]]
name = "geom-bench-guest"
test = false
bench = false

# Chapter 23.2's step mix, per corpus.
[[bin]]
name = "geom-bench-steps"
test = false
bench = false

# The checks the gates run on count files: comparison with the merge base, removals, growth.
[[bin]]
name = "geom-bench-counts"
test = false
bench = false

# The reference runner's records and report (piece G107): assembling a night, checking records,
# writing the report from the history.
[[bin]]
name = "geom-bench-timings"
test = false
bench = false
required-features = ["reference"]

[dependencies]
geom-num = { path = "../geom-num" }
# The step mix (chapter 23.2) counts the plane table's steps too (ours, MPL-2.0).
geom-poly = { path = "../geom-poly" }
# The work meter the root-isolation engine runs under (its benchmarks, G53).
geom-run = { path = "../geom-run" }
# Cache keys, the memo store and body versions (piece G105), with the crates their inputs need.
geom-format = { path = "../geom-format" }
geom-op = { path = "../geom-op" }
geom-topo = { path = "../geom-topo" }
# The math types of phase 2 (pieces G45, G46 and G48): their count benchmarks, as decision 32.44
# asks of every phase-2 code piece.
geom-math = { path = "../geom-math" }
# The box tree and cell index of phase 2 (pieces G54 and G55), for the same count benchmarks.
geom-bvh = { path = "../geom-bvh" }
# NURBS, its fitting and the Bernstein toolkit of phase 2 (pieces G56, G58 and G59).
geom-nurbs = { path = "../geom-nurbs" }
# The curve kinds of phase 2 (pieces G60 to G64, G67 and G68).
geom-curve = { path = "../geom-curve" }
# The surface kinds of phase 2 (pieces G65 to G68).
geom-surface = { path = "../geom-surface" }
# The dense linear algebra of phase 2 (pieces G49 and G50), for the same count benchmarks.
geom-linalg = { path = "../geom-linalg" }
# The attribute step of phase 3 (piece G90) and the types it takes, for the same count benchmarks.
geom-name = { path = "../geom-name" }
# The intersection results and canonical order of phase 4 (piece G158), for the same count benchmarks.
geom-intersect = { path = "../geom-intersect" }
# The primitives and transforms of phase 3 (piece G101), and the context and output they take and
# give, for the same count benchmarks.
geom-make = { path = "../geom-make" }
# SHA-256 (FIPS 180-4) for the golden digests, and their hexadecimal form in golden.txt: standard
# crates in place of the copy this crate held (piece G12a; chapter 29.1, a development crate).
# sha2 0.11.0: MIT OR Apache-2.0, RustCrypto, without its default alloc and oid features, which
# the digests do not use. hex 0.4.3: MIT OR Apache-2.0.
sha2 = { version = "=0.11.0", default-features = false }
hex = "=0.4.3"

# Reading the gate's summaries, on Unix and Windows, where the judge runs: Gungraun's summary model
# needs `OsString` to deserialize, which serde provides there only, so the WebAssembly guest
# (geom-bench-guest, built for wasm32-wasip1) never builds it. Both are optional, behind the
# `judge` feature below.
[target.'cfg(any(unix, windows))'.dependencies]
# Gungraun's summary model, the typed schema of the `summary.json` files the gate's runs write, which
# `geom-bench-counts callgrind` reads (`geom_bench::callgrind`). Only the model: no runner, no
# Valgrind. Apache-2.0 OR MIT. Exactly the version of `gungraun` below, so the schema read is the
# one the runner writes (a test checks they agree).
gungraun-runner = { version = "=0.20.0", default-features = false, features = ["summary"], optional = true }
# The JSON parser for those summaries. MIT OR Apache-2.0.
serde_json = { version = "1.0.154", optional = true }

[features]
default = ["judge", "reference"]
# The judge of the instruction-and-cache gate (`geom_bench::callgrind`), on by default. The gate's
# measured runs build without it (`cargo bench --no-default-features`): Gungraun's runner crate is
# also a dependency of the benchmark binary, so turning on its summary model would change the
# binary being measured, and a measurement must not change with the tool that judges it.
judge = ["dep:gungraun-runner", "dep:serde_json"]
# The reference runner's nightly records and report (`geom_bench::timings`, piece G107), on by
# default, on Unix and Windows only. Like the judge, the measured runs leave it out
# (`--no-default-features`) and the WebAssembly guest never has it, so no measured binary changes
# with it. It needs no dependency.
reference = []

[dev-dependencies]
geom-test = { path = "../geom-test" }
# The big-integer oracle of avnaim's own tests, as in geom-num (MIT OR Apache-2.0).
num-bigint = "0.4.8"
# Wall-clock timings for people, on every platform. MIT OR Apache-2.0.
divan = "0.1.21"
# The coverage test's readers, in place of a line scanner and text searches (piece G12a; chapter
# 29.1), the versions engine-geometry's scaffold check pins. syn 3.0.9 (MIT OR Apache-2.0) parses
# geom-num's source, without its default features: it needs no compiler proc_macro and prints
# nothing. toml 0.9.6 (MIT OR Apache-2.0) reads the manifests and Cargo.lock.
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing"] }
toml = "=0.9.6"

# The merge gate: instruction counts, cache misses and heap use under Valgrind, through Gungraun.
# Valgrind runs on Linux here, so the gate is Linux only and other platforms never build it.
# Apache-2.0 OR MIT. The `gungraun-runner` binary must have exactly this version (see the crate
# documentation).
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = "=0.20.0"

[[bench]]
name = "instructions"
harness = false

[[bench]]
name = "wall_clock"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Kani sets `cfg(kani)` when it compiles a proof; proofs and the code they need sit beside the
# code under it (chapter 28.7).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)", "cfg(kani)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
