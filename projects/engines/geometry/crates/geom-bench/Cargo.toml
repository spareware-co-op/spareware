[package]
name = "geom-bench"
version = "0.0.0"
edition.workspace = true
# Development only: never published, never a dependency of any kernel or program crate.
publish = false
license.workspace = true
description = "Spare Kit geometry kernel: benchmarks of every numbers-layer operation, with the count gates that block a regression over 5%."
# The WebAssembly fuel host (fuel/) is a separate workspace, so Wasmtime never enters this one.
exclude = ["fuel"]

[lib]
# The library holds the inputs, kernels and checks the harnesses share. It has no benchmarks of its
# own, and leaving it out of `cargo bench` keeps libtest from rejecting the gate's arguments.
bench = false

# The program the WebAssembly fuel gate runs inside Wasmtime (built for wasm32-wasip1).
[[bin]]
name = "geom-bench-guest"
test = false
bench = false

# The checks the gates run on count files: comparison with the merge base, removals, growth.
[[bin]]
name = "geom-bench-counts"
test = false
bench = false

[dependencies]
geom-num = { path = "../geom-num" }
# Gungraun's summary model, the typed schema of the `summary.json` files the gate's runs write, which
# `geom-bench-counts callgrind` reads (`geom_bench::callgrind`). Only the model: no runner, no
# Valgrind, so it builds on every platform. Apache-2.0 OR MIT. Exactly the version of `gungraun`
# below, so the schema read is the one the runner writes (a test checks they agree).
gungraun-runner = { version = "=0.20.0", default-features = false, features = ["summary"] }
# The JSON parser for those summaries. MIT OR Apache-2.0.
serde_json = "1.0.154"

[dev-dependencies]
# Wall-clock timings for people, on every platform. MIT OR Apache-2.0.
divan = "0.1.21"

# The merge gate: instruction counts, cache misses and heap use under Valgrind, through Gungraun.
# Valgrind runs on Linux here, so the gate is Linux only and other platforms never build it.
# Apache-2.0 OR MIT. The `gungraun-runner` binary must have exactly this version (see the crate
# documentation).
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = "=0.20.0"

[[bench]]
name = "instructions"
harness = false

[[bench]]
name = "wall_clock"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
