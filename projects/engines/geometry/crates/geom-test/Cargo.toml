[package]
name = "geom-test"
version = "0.0.0"
edition.workspace = true
rust-version = "1.86"
publish.workspace = true
license.workspace = true
description = "Spare Kit geometry kernel, development only: shared test support, seeds, generators and the dependency rule."

[dependencies]
geom-num = { path = "../geom-num" }
# The operation contract, for the history-law kit (src/history.rs, piece G88): the kit checks
# histories through geom-op's own checker, so every operation's tests use the same laws.
geom-op = { path = "../geom-op" }
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }
serde_json = "1.0.149"
# Cargo's metadata in its typed model, and the command that asks for it, so the dependency rule
# reads `cargo metadata` as cargo documents it (src/deps.rs; piece G12a put it in place of a
# field-by-field reading of the JSON; chapter 29.1). cargo_metadata 0.23.1: MIT, the version
# engine-geometry's scaffold check pins.
cargo_metadata = "=0.23.1"
# TOML 1.0, so the map reads each crate's Cargo.toml as cargo does (src/map.rs; piece G12a put it
# in place of a line reader; chapter 29.1). toml 0.9.6: MIT OR Apache-2.0, the version
# engine-geometry's scaffold check pins.
toml = "=0.9.6"
# Rust's lexer, the one syn parses with, so the map reads source as rustc does (src/map/rust.rs;
# piece G12a put it in place of a lexer written there; chapter 29.1). proc-macro2 1.0.107: MIT OR
# Apache-2.0, without its default proc-macro feature (the map runs outside a macro) and with
# span-locations for byte offsets (also the line of each call site the recursion check names,
# piece G13); the version engine-geometry's scaffold check pins.
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
# The golden store (`golden::store`), read into typed records with unknown fields refused.
# MIT OR Apache-2.0.
serde = { version = "1.0.229", features = ["derive"] }
# SHA-256 (FIPS 180-4), the hash of every golden digest (chapters 21 and 28.13): RustCrypto's sha2,
# the one implementation every kernel test hashes with, through `golden::sha256`. MIT OR
# Apache-2.0. 0.11.0, not 0.11.1: 0.11.1 needs Rust 1.88 and this crate declares 1.86. Without its
# default `alloc` and `oid` features, which nothing here uses.
sha2 = { version = "0.11.0", default-features = false }
# The Fisher-Yates shuffle of the input-shuffle hook (`golden::shuffle`), driven by `SplitMix64`.
# MIT OR Apache-2.0. Without its default features, so it has no generator of its own and never
# reaches the operating system's random source.
rand = { version = "0.10.3", default-features = false }
# Rust's grammar, for the golden store's repository check (`golden::repo`), where every kernel
# source is parsed as Rust so a comment or a string never counts as code, and for the recursion
# check's call graph (src/recursion). MIT OR Apache-2.0. The 3.0 line, the one serde's derive
# already brings into this crate's build, so the build holds one copy. Without its default
# features: the full syntax tree, its parser, printer and visitors, and the clone and debug traits
# the recursion check uses; no procedural-macro support.
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "printing", "visit", "visit-mut", "clone-impls", "extra-traits"] }
# Token printing, for the recursion check's names. MIT OR Apache-2.0.
quote = { version = "1.0.47", default-features = false }
# The recursion check's graph and its strongly connected components (Tarjan's algorithm). MIT OR
# Apache-2.0. Without its default features.
petgraph = { version = "0.8.3", default-features = false }
# The command line of the `kernel-quality` binary (G21), without colour or terminal detection.
# MIT OR Apache-2.0.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# The LCOV tracefiles cargo-llvm-cov writes, read by the coverage gate (G21). MIT OR Apache-2.0.
lcov = "0.8.2"
# The regular expressions of a narrowed full mutation run (`kernel-quality --files`), in the syntax
# cargo-mutants' `--re` takes; the plan checks the two select the same mutants. regex-lite 0.1.9:
# MIT OR Apache-2.0, the Rust project's regex crate without Unicode tables, already in the lock
# (divan's), with no dependencies of its own.
regex-lite = "=0.1.9"
# The exact rationals of the NURBS reference implementation (G57, `nurbs_reference`): big integers
# and rationals. MIT OR Apache-2.0, the versions geom-num's and geom-linalg's tests use, without
# the default num-order and dashu-float features, which the reference does not use.
dashu-int = { version = "0.6.2", default-features = false, features = ["std"] }
dashu-ratio = { version = "0.6.1", default-features = false, features = ["std"] }

[dev-dependencies]
# A CommonMark parser, so tests/attack_g17.rs reads the kernel's README.md, AGENTS.md and
# GLOSSARY.md (their links, headings and code spans) as Markdown rather than by a home-made parser.
# MIT (pulldown-cmark's manifest); without its default features, the HTML writer and the command
# line, which the test does not use.
pulldown-cmark = { version = "0.13.5", default-features = false }
# Unicode's canonical decomposition, so tests/attack_g17.rs sorts the glossary's headwords with
# their accents set aside ("Bézier" as "Bezier"), as GLOSSARY.md states its order.
# (MIT OR Apache-2.0) AND Unicode-3.0 (unicode-normalization's manifest), taken as MIT AND
# Unicode-3.0.
unicode-normalization = "0.1.26"
# The exact oracle of the banned-source scanner's cited Cash-Karp fixture: its tableau checked
# against the order conditions in rational arithmetic (tests/scan_seeded.rs). MIT OR Apache-2.0,
# the version geom-num's tests already use.
num-rational = "0.4.2"
# The workflow test reads `.github/workflows/kernel-quality.yml` as YAML (G21). MIT OR Apache-2.0.
yaml-rust2 = { version = "0.13.0", default-features = false }
# The kernel crates the NURBS reference is compared with on every pull request (G57,
# tests/nurbs_reference.rs): geom-nurbs's curves and the work meter its operations take. Ours,
# MPL-2.0; development dependencies, so no kernel crate comes to depend on this one.
geom-nurbs = { path = "../geom-nurbs" }
geom-run = { path = "../geom-run" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Kani sets `cfg(kani)` when it compiles a proof; proofs and the code they need sit beside the
# code under it (chapter 28.7).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
# The crate is written to clippy's pedantic idioms; CI denies every warning.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Chapter 21's disallowed methods and types (clippy.toml) are errors in every clippy run, not
# only in one given -D warnings (the merge gate, G12).
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name, todo!, unimplemented! and unreachable!: principle 13
# (no panics in kernel paths) and chapter 27's denial of panic, as errors (the merge gate, G12).
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step in kernel code is a checked method, and no cast loses a value
# silently. Tests may use native arithmetic and casts: each test file and test module allows these
# four, and kernel code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Exact comparison of doubles is the point of this crate: the interval and error-free code compare
# bits and bounds exactly, never against a tolerance.
float_cmp = "allow"
