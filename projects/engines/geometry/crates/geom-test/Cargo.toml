[package]
name = "geom-test"
version = "0.0.0"
edition.workspace = true
rust-version = "1.86"
publish.workspace = true
license.workspace = true
description = "Spare Kit geometry kernel, development only: shared test support, seeds, generators and the dependency rule."

[dependencies]
geom-num = { path = "../geom-num" }
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }
serde_json = "1.0.149"

[dev-dependencies]
# A CommonMark parser, so tests/attack_g17.rs reads the kernel's README.md, AGENTS.md and
# GLOSSARY.md (their links, headings and code spans) as Markdown rather than by a home-made parser.
# MIT (pulldown-cmark's manifest); without its default features, the HTML writer and the command
# line, which the test does not use.
pulldown-cmark = { version = "0.13.5", default-features = false }
# Unicode's canonical decomposition, so tests/attack_g17.rs sorts the glossary's headwords with
# their accents set aside ("Bézier" as "Bezier"), as GLOSSARY.md states its order.
# (MIT OR Apache-2.0) AND Unicode-3.0 (unicode-normalization's manifest), taken as MIT AND
# Unicode-3.0.
unicode-normalization = "0.1.26"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# The crate is written to clippy's pedantic idioms; CI denies every warning.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Chapter 21's disallowed methods and types (clippy.toml) are errors in every clippy run, not
# only in one given -D warnings (the merge gate, G12).
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name, todo!, unimplemented! and unreachable!: principle 13
# (no panics in kernel paths) and chapter 27's denial of panic, as errors (the merge gate, G12).
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step in kernel code is a checked method, and no cast loses a value
# silently. Tests may use native arithmetic and casts: each test file and test module allows these
# four, and kernel code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Exact comparison of doubles is the point of this crate: the interval and error-free code compare
# bits and bounds exactly, never against a tolerance.
float_cmp = "allow"
