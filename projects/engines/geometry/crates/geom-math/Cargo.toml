[package]
name = "geom-math"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Spare Kit geometry kernel: exact grid vectors, floating-point points and vectors, typed transforms (exact, rational and certified), boxes, double-double arithmetic, and frames tied to map projections with their regional lattices."

[dependencies]
# The numbers layer: grid coordinates, exact predicates' integers, error-free transformations,
# intervals and the only maths functions the kernel may use.
geom-num = { path = "../geom-num" }

[dev-dependencies]
# Exact oracles for tests only, never linked into the kernel. All MIT OR Apache-2.0.
num-bigint = "0.4"
num-rational = "0.4.2"
num-traits = "0.2"
num-integer = "0.1"
# Without its default fork and timeout features, which pull in code that has no WebAssembly
# (WASI) build, so the tests also run on wasm32-wasip1.
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }

# The 1M-point transform benchmark (piece G45), with the standard library's clock only; it moves
# to geom-bench (piece G06) when that harness merges.
[[bench]]
name = "transform"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# geom-num's posture, for the same reasons (chapter 21): every fixed-width arithmetic step in kernel
# code is a checked method, so nothing depends on overflow checks being on, and no cast loses a
# value silently. Tests and the benchmark may use native arithmetic and casts: each test file, test
# module and the benchmark allows these five, and kernel code allows a cast only where its bound is
# written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
