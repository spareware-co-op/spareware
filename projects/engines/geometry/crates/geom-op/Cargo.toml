[package]
name = "geom-op"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Spare Kit geometry kernel: the operation contract every crate shares."

[dependencies]
geom-run = { path = "../geom-run", default-features = false }
# Exactly this crate's row of chapter 27's crate table, checked by the scaffold test
# in engine-geometry (tests/scaffold).

geom-num = { path = "../geom-num" }
# SHA-256 (FIPS 180-4), the kernel's one hash for content IDs and names (owner action G79, 32.20):
# RustCrypto's sha2, MIT OR Apache-2.0, without its default alloc and oid features. On the vetted
# allow-list in deny-no-std.toml, with its audit (projects/kit/notes/G86-sha2-audit.md).
sha2 = { version = "0.11.0", default-features = false }
# Normalization Form C checks of text hashed into names, under Unicode 18.0.0 (owner action G78,
# 32.19): (MIT OR Apache-2.0) AND Unicode-3.0, without its std feature. On the vetted allow-list in
# deny-no-std.toml, with its audit (projects/kit/notes/G87-unicode-normalization-audit.md).
unicode-normalization = { version = "=0.1.26", default-features = false }

[dev-dependencies]
# Property tests only, never linked into the kernel (chapter 29: a development dependency).
# MIT OR Apache-2.0. Without its default fork and timeout features, which pull in code that has no
# WebAssembly (WASI) build, so the tests also run on wasm32-wasip1, as geom-run's do.
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }
# The kernel's development crate, a development dependency only (chapter 28.1): the golden store,
# its one SHA-256 and the seed every property test prints (pieces G19 and G28), its Rust lexer, so
# the attack test reads this crate's code as rustc does, and its map, whose error catalogue the
# attack test checks against the code.
geom-test = { path = "../geom-test" }
# Oracles for the CBOR encoder, tests only: ciborium-ll's head and float encoding (Apache-2.0) and
# half's binary16 conversions (MIT OR Apache-2.0).
ciborium-ll = { version = "=0.2.2", default-features = false }
ciborium-io = { version = "=0.2.2", default-features = false, features = ["alloc"] }
half = { version = "=2.7.1", default-features = false }
# JSON: the values the cbor2 oracle reads and writes (oracles/cbor2.py), and MAP.json's error
# catalogue, which the attack test reads. MIT OR Apache-2.0; the version geom-test uses.
serde_json = "1.0.149"

# The encoder and hash benchmarks (piece G86) and the contract's own costs (piece G82), with the
# standard library's clock only: `cargo bench -p geom-op`.
[[bench]]
name = "encode"
harness = false

[[bench]]
name = "contract"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Kani sets `cfg(kani)` when it compiles a proof; proofs and the code they need sit beside the
# code under it (chapter 28.7).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)", "cfg(kani)"] }

[lints.clippy]
# The kernel's one lint posture: exactly geom-num's settings, here and in clippy.toml (the scaffold
# check in engine-geometry, tests/scaffold/lints.rs, fails until they match). The crate is written
# to clippy's pedantic idioms; CI denies every warning.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Chapter 21's disallowed methods and types (clippy.toml) are errors in every clippy run, not
# only in one given -D warnings (the merge gate, G12).
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name, todo!, unimplemented! and unreachable!: principle 13
# (no panics in kernel paths) and chapter 27's denial of panic, as errors (the merge gate, G12).
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step in kernel code is a checked method, and no cast loses a value
# silently. Tests may use native arithmetic and casts: each test file and test module allows these
# four, and kernel code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Doubles are compared exactly, never against a tolerance: the kernel decides with exact predicates
# and certified bounds (principles 1 and 2), so clippy's advice to compare within an epsilon does
# not apply.
float_cmp = "allow"
