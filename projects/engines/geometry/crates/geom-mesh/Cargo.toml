[package]
name = "geom-mesh"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Spare Kit geometry kernel: exact meshes and watertight tessellation."

[dependencies]
geom-math = { path = "../geom-math", default-features = false }
geom-run = { path = "../geom-run", default-features = false }
# Exactly this crate's row of chapter 27's crate table, checked by the scaffold test
# in engine-geometry (tests/scaffold).

geom-2d = { path = "../geom-2d" }
geom-bvh = { path = "../geom-bvh" }
geom-curve = { path = "../geom-curve" }
geom-intersect = { path = "../geom-intersect" }
geom-linalg = { path = "../geom-linalg" }
geom-num = { path = "../geom-num" }
geom-op = { path = "../geom-op" }
geom-poly = { path = "../geom-poly" }
geom-surface = { path = "../geom-surface" }
geom-topo = { path = "../geom-topo" }

[dev-dependencies]
# Without its default fork and timeout features, which pull in code that has no WebAssembly
# (WASI) build, so the tests also run on wasm32-wasip1. MIT OR Apache-2.0.
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }

# Seeds, the test generator, and the golden store with its one SHA-256 (piece G19): the kernel's
# development crate, a development dependency only (chapter 28.1).
geom-test = { path = "../geom-test" }
# A real thread pool, for the timing program's 8 threads and the test that a pool changes nothing.
geom-pool = { path = "../geom-pool" }

# The triangulation's timing (piece G153), with the standard library's clock only.
[[bench]]
name = "cdt"
harness = false

# Point location's timing (piece G147), at 1 and 8 threads.
[[bench]]
name = "classify"
harness = false

# The triangle contact test's timing (piece G151).
[[bench]]
name = "contact"
harness = false

[[bench]]
name = "exact"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Kani sets `cfg(kani)` when it compiles a proof; proofs and the code they need sit beside the
# code under it (chapter 28.7).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)", "cfg(kani)"] }

[lints.clippy]
# The kernel's one lint posture: exactly geom-num's settings, here and in clippy.toml (the scaffold
# check in engine-geometry, tests/scaffold/lints.rs, fails until they match). The crate is written
# to clippy's pedantic idioms; CI denies every warning.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Chapter 21's disallowed methods and types (clippy.toml) are errors in every clippy run, not
# only in one given -D warnings (the merge gate, G12).
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name, todo!, unimplemented! and unreachable!: principle 13
# (no panics in kernel paths) and chapter 27's denial of panic, as errors (the merge gate, G12).
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step in kernel code is a checked method, and no cast loses a value
# silently. Tests may use native arithmetic and casts: each test file and test module allows these
# four, and kernel code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Doubles are compared exactly, never against a tolerance: the kernel decides with exact predicates
# and certified bounds (principles 1 and 2), so clippy's advice to compare within an epsilon does
# not apply.
float_cmp = "allow"
