# Kernel lints deny unwrap, expect, panic and unchecked indexing in kernel code. Tests may use them:
# a failing test should stop loudly.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Chapter 21's determinism hazards, enforced by clippy as chapter 21's "Enforced by" column and
# section 28's merge gate require. Each reason names what the kernel uses instead.
disallowed-methods = [
    # `max` and `min` may return either zero when given −0 and +0.
    { path = "f64::max", reason = "may return either zero; use Real::total_max (chapter 21)" },
    { path = "f64::min", reason = "may return either zero; use Real::total_min (chapter 21)" },
    { path = "f32::max", reason = "may return either zero; use Real::total_max (chapter 21)" },
    { path = "f32::min", reason = "may return either zero; use Real::total_min (chapter 21)" },
    # Reductions whose order is not written out (chapter 23).
    { path = "core::iter::Iterator::sum", reason = "write the order out, or use ExactSum (chapter 23)" },
    { path = "core::iter::Iterator::product", reason = "write the order out (chapter 23)" },
    # The same reductions called as trait functions, `<f64 as Sum<&f64>>::sum(it)` or
    # `f64::sum(it)`: Iterator::sum and product call these, the order just as unstated.
    { path = "core::iter::Sum::sum", reason = "write the order out, or use ExactSum (chapter 23)" },
    { path = "core::iter::Product::product", reason = "write the order out (chapter 23)" },
    # The platform's maths functions differ by platform: only geom_num::math supplies them.
    { path = "f64::sin", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::cos", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::tan", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::sin_cos", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::asin", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::acos", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::atan", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::atan2", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::sinh", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::cosh", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::tanh", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::asinh", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::acosh", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::atanh", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::exp", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::exp2", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::exp_m1", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::ln", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::log", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::log2", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::log10", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::ln_1p", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::powf", reason = "platform maths; use geom_num::math::pow (chapter 21)" },
    { path = "f64::powi", reason = "platform maths; use geom_num::math::powi (chapter 21)" },
    { path = "f64::cbrt", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f64::hypot", reason = "platform maths; use geom_num::math (chapter 21)" },
    # The same functions on f32: the platform's maths differ by platform whatever the width.
    { path = "f32::sin", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::cos", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::tan", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::sin_cos", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::asin", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::acos", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::atan", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::atan2", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::sinh", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::cosh", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::tanh", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::asinh", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::acosh", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::atanh", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::exp", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::exp2", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::exp_m1", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::ln", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::log", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::log2", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::log10", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::ln_1p", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::powf", reason = "platform maths; use geom_num::math::pow (chapter 21)" },
    { path = "f32::powi", reason = "platform maths; use geom_num::math::powi (chapter 21)" },
    { path = "f32::cbrt", reason = "platform maths; use geom_num::math (chapter 21)" },
    { path = "f32::hypot", reason = "platform maths; use geom_num::math (chapter 21)" },
    # Relaxed ("algebraic") operations let the compiler reorder and fuse arithmetic, so a result
    # depends on the optimiser and the target (chapter 21: forbidden). They are in core, so no_std
    # code can call them.
    { path = "f64::algebraic_add", reason = "relaxed float operation; forbidden (chapter 21)" },
    { path = "f64::algebraic_sub", reason = "relaxed float operation; forbidden (chapter 21)" },
    { path = "f64::algebraic_mul", reason = "relaxed float operation; forbidden (chapter 21)" },
    { path = "f64::algebraic_div", reason = "relaxed float operation; forbidden (chapter 21)" },
    { path = "f64::algebraic_rem", reason = "relaxed float operation; forbidden (chapter 21)" },
    { path = "f32::algebraic_add", reason = "relaxed float operation; forbidden (chapter 21)" },
    { path = "f32::algebraic_sub", reason = "relaxed float operation; forbidden (chapter 21)" },
    { path = "f32::algebraic_mul", reason = "relaxed float operation; forbidden (chapter 21)" },
    { path = "f32::algebraic_div", reason = "relaxed float operation; forbidden (chapter 21)" },
    { path = "f32::algebraic_rem", reason = "relaxed float operation; forbidden (chapter 21)" },
    # Clocks, the process id and the running thread's identity differ run to run (chapter 21,
    # "Random numbers, clocks, and process or thread identity"): std's entries of that row. A
    # no_std build does not link std, so it never resolves them and says nothing; every build that
    # links std (the facade, geom-pool, and every crate's tests) resolves them, and the merge gate
    # fails on clippy's "does not refer to a reachable" message, so none lapses in silence. The
    # row's other entries (std's random module, the x86 RDRAND, RDSEED and RDTSC intrinsics, and
    # the random-number crates' entry points) are geom_num::rng's piece's (G32).
    { path = "std::time::SystemTime::now", reason = "the clock differs run to run; nothing the kernel computes may depend on it (chapter 21)" },
    { path = "std::time::SystemTime::elapsed", reason = "reads the clock; nothing the kernel computes may depend on it (chapter 21)" },
    { path = "std::time::Instant::now", reason = "the clock differs run to run; nothing the kernel computes may depend on it (chapter 21)" },
    { path = "std::time::Instant::elapsed", reason = "reads the clock; nothing the kernel computes may depend on it (chapter 21)" },
    { path = "std::process::id", reason = "differs run to run; nothing the kernel computes may depend on it (chapter 21)" },
    { path = "std::thread::current", reason = "which thread runs a piece of work differs run to run; nothing the kernel computes may depend on it (chapter 21)" },
    { path = "std::thread::Thread::id", reason = "which thread runs a piece of work differs run to run; nothing the kernel computes may depend on it (chapter 21)" },
    { path = "std::hash::RandomState::new", reason = "seeded from the operating system's entropy; use BTreeMap or BTreeSet (chapter 21)" },
]

# Hash map iteration order is random (chapter 21).
disallowed-types = [
    { path = "std::collections::HashMap", reason = "random iteration order; use BTreeMap (chapter 21)" },
    { path = "std::collections::HashSet", reason = "random iteration order; use BTreeSet (chapter 21)" },
    # std's randomly seeded hasher and the running thread's identity (chapter 21).
    { path = "std::hash::RandomState", reason = "seeded from the operating system's entropy; use BTreeMap or BTreeSet (chapter 21)" },
    { path = "std::thread::ThreadId", reason = "which thread runs a piece of work differs run to run; nothing the kernel computes may depend on it (chapter 21)" },
]
