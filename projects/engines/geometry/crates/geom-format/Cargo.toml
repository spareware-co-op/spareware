[package]
name = "geom-format"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Spare Kit geometry kernel: the native file format and its canonical bytes."

[features]
# Reference mode (23.13; piece G106): the memo store never answers and every version of a body
# hashes every chunk, so CI can show that a cache changes nothing. Never in a shipped build.
reference = []

[dependencies]
geom-math = { path = "../geom-math", default-features = false }
geom-run = { path = "../geom-run", default-features = false }
# Exactly this crate's row of chapter 27's crate table, checked by the scaffold test
# in engine-geometry (tests/scaffold).

geom-2d = { path = "../geom-2d" }
geom-cloud = { path = "../geom-cloud" }
geom-curve = { path = "../geom-curve" }
geom-draw = { path = "../geom-draw" }
geom-field = { path = "../geom-field" }
geom-mesh = { path = "../geom-mesh" }
geom-name = { path = "../geom-name" }
geom-num = { path = "../geom-num" }
geom-op = { path = "../geom-op" }
geom-poly = { path = "../geom-poly" }
geom-sketch = { path = "../geom-sketch" }
geom-subd = { path = "../geom-subd" }
geom-surface = { path = "../geom-surface" }
geom-topo = { path = "../geom-topo" }
# CRC-32C (Castagnoli), every record's check (24.2): the `crc` crate, MIT OR Apache-2.0,
# no_std and forbid(unsafe_code), with its catalogue crc-catalog. On the vetted allow-list in
# deny-no-std.toml, with its audit (projects/kit/notes/G92-crc-audit.md).
crc = "3.4.0"

[dev-dependencies]
# The CDDL validator (RFC 8610) that checks every archived file against format/cddl/, tests only:
# cddl-cat, MIT, pure Rust, with its ciborium feature for CBOR. Chosen over the `cddl` crate, which
# brings about 87 crates and a separate wasm-bindgen interface; cddl-cat covers every CDDL feature
# format 1's schemas use (it has no tags, `#6.n`, which body records' columns will need, G94).
cddl-cat = { version = "=0.7.1", default-features = false, features = ["ciborium"] }
# Property tests only, never linked into the kernel. MIT OR Apache-2.0. Without its default fork and
# timeout features, so the tests also run on wasm32-wasip1.
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }
# The tests' seeded generator and seed printing (geom_test::rng and geom_test::seed).
geom-test = { path = "../geom-test" }
# The validity checker, as a program passes it to trust on open (tests/trust.rs, G108): chapter 27
# puts geom-format above no checker, so it is a development dependency only (ours, MPL-2.0).
geom-check = { path = "../geom-check" }
# Reads the cbor2 cross-check vectors, tests/cbor2/vectors.jsonl (MIT OR Apache-2.0).
serde_json = "1.0.154"


[[bench]]
name = "cbor"
harness = false

# The record layer's benchmarks (piece G92), with the standard library's clock only.
[[bench]]
name = "records"
harness = false

# Trust on open and the reference container (piece G108).
[[bench]]
name = "open"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Kani sets `cfg(kani)` when it compiles a proof; proofs and the code they need sit beside the
# code under it (chapter 28.7).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)", "cfg(kani)"] }

[lints.clippy]
# The kernel's one lint posture: exactly geom-num's settings, here and in clippy.toml (the scaffold
# check in engine-geometry, tests/scaffold/lints.rs, fails until they match). The crate is written
# to clippy's pedantic idioms; CI denies every warning.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Chapter 21's disallowed methods and types (clippy.toml) are errors in every clippy run, not
# only in one given -D warnings (the merge gate, G12).
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name, todo!, unimplemented! and unreachable!: principle 13
# (no panics in kernel paths) and chapter 27's denial of panic, as errors (the merge gate, G12).
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step in kernel code is a checked method, and no cast loses a value
# silently. Tests may use native arithmetic and casts: each test file and test module allows these
# four, and kernel code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Doubles are compared exactly, never against a tolerance: the kernel decides with exact predicates
# and certified bounds (principles 1 and 2), so clippy's advice to compare within an epsilon does
# not apply.
float_cmp = "allow"
