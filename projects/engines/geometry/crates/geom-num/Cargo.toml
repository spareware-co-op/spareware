[package]
name = "geom-num"
version = "0.0.0"
edition.workspace = true
# const f64::next_up and next_down, used by the interval bounds, are const from 1.86.
rust-version = "1.86"
publish.workspace = true
# MPL-2.0 for Spare Kit's code, and MIT for the CORE-MATH functions ported into src/math/
# (rule 29.20(4); their notices are in projects/engines/geometry/NOTICE).
license = "MPL-2.0 AND MIT"
description = "Spare Kit geometry kernel: the numbers layer. Grid coordinates, fixed-width integers, exact predicates, intervals, deterministic maths and the tolerance ladder."

[dependencies]
geom-run = { path = "../geom-run", default-features = false }
# The source of the unproven maths functions, the fused multiply-add, the correctly rounded
# square root and the exact rounding functions: pure Rust, the same result on every target. The
# proven maths functions are CORE-MATH ports in src/math/. MIT (libm 0.2.16's licence).
libm = "0.2.16"

[dev-dependencies]
# Exact oracles for tests only, never linked into the kernel. All MIT OR Apache-2.0.
num-bigint = "0.4"
num-rational = "0.4.2"
num-traits = "0.2"
num-integer = "0.1"
# Without its default fork and timeout features, which pull in code that has no WebAssembly
# (WASI) build, so the tests also run on wasm32-wasip1.
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }
# The exact oracle of the double-double and ExactSum tests (piece G25): big integers and rationals.
# MIT OR Apache-2.0. Without the default num-order and dashu-float features, which the tests do not
# use.
dashu-int = { version = "0.6.2", default-features = false, features = ["std"] }
dashu-ratio = { version = "0.6.1", default-features = false, features = ["std"] }
# SHA-256 (FIPS 180-4), the hash of the golden digests (chapters 21 and 28.13), and its digests
# in hexadecimal: tests only, never linked into the kernel (chapter 29.1, a development
# dependency; piece G12a put these standard crates in place of the copies the tests held).
# sha2 0.11.0: MIT OR Apache-2.0, RustCrypto, without its default alloc and oid features, which
# the digests do not use. hex 0.4.3: MIT OR Apache-2.0.
sha2 = { version = "=0.11.0", default-features = false }
hex = "=0.4.3"
# TOML 1.0, so the tests of the clippy ban (rng_ban.rs, attack_g32.rs) read clippy.toml as clippy
# reads it: tests only (chapter 29.1; piece G12a put it in place of a line reader). toml 0.9.6:
# MIT OR Apache-2.0, the version engine-geometry's scaffold check pins.
toml = "=0.9.6"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# The crate is written to clippy's pedantic idioms; CI denies every warning.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Chapter 21's disallowed methods and types (clippy.toml) are errors in every clippy run, not
# only in one given -D warnings (the merge gate, G12).
disallowed_methods = "deny"
disallowed_types = "deny"
# The panics clippy::panic does not name, todo!, unimplemented! and unreachable!: principle 13
# (no panics in kernel paths) and chapter 27's denial of panic, as errors (the merge gate, G12).
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Every fixed-width arithmetic step in kernel code is a checked method, and no cast loses a value
# silently. Tests may use native arithmetic and casts: each test file and test module allows these
# four, and kernel code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Exact comparison of doubles is the point of this crate: the interval and error-free code compare
# bits and bounds exactly, never against a tolerance.
float_cmp = "allow"
