[package]
name = "geom-num"
version = "0.0.0"
edition.workspace = true
# const f64::next_up and next_down, used by the interval bounds, are const from 1.86.
rust-version = "1.86"
publish.workspace = true
license.workspace = true
description = "Spare Kit geometry kernel: the numbers layer. Grid coordinates, fixed-width integers, exact predicates, intervals, deterministic maths and the tolerance ladder."

[dependencies]
# The only source of maths functions (sin, cos, atan2, exp and so on): pure Rust, the same
# result on every target. MIT OR Apache-2.0.
libm = "0.2.16"

[dev-dependencies]
# Exact oracles for tests only, never linked into the kernel. All MIT OR Apache-2.0.
num-bigint = "0.4"
num-rational = "0.4.2"
num-traits = "0.2"
num-integer = "0.1"
# Without its default fork and timeout features, which pull in code that has no WebAssembly
# (WASI) build, so the tests also run on wasm32-wasip1.
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }
# The exact oracle of the double-double and ExactSum tests (piece G25): big integers and rationals.
# MIT OR Apache-2.0. Without the default num-order and dashu-float features, which the tests do not
# use.
dashu-int = { version = "0.6.2", default-features = false, features = ["std"] }
dashu-ratio = { version = "0.6.1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# The crate is written to clippy's pedantic idioms; CI denies every warning.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Every fixed-width arithmetic step in kernel code is a checked method, and no cast loses a value
# silently. Tests may use native arithmetic and casts: each test file and test module allows these
# four, and kernel code allows a cast only where its bound is written beside it.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Exact comparison of doubles is the point of this crate: the interval and error-free code compare
# bits and bounds exactly, never against a tolerance.
float_cmp = "allow"
