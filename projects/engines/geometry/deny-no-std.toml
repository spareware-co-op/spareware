# cargo-deny's configuration for the no_std kernel crates alone, and the one vetted allow-list of
# the published crates that may ship inside a kernel crate (kernel architecture, chapter 29.1 and
# 29.20, rule 3, as the owner directed on 2026-10-22): a well-known permissive crate is used rather
# than hand-rolled, but inside a kernel crate only once it is vetted against the principles. Each
# entry pins one version (`name@version` is exact to cargo-deny) and its reason is its record, four
# clauses in this order: deterministic (the same bits on every target, principle 5 and chapter 21),
# no_std (every kernel crate is no_std, chapter 27), audited (the committed audit's path, or
# "pending, piece <ID>" naming the piece that owes it) and pinned (the same version, and where it
# is held). The scaffold test reads the list (tests/scaffold/vetted.rs) and refuses an entry that is
# not pinned or whose record is not whole, and a pin Cargo.lock does not hold. Adding an entry, or
# moving one to a new version, needs a new record and a kernel owner's yes in review (29.20). Every
# crate a kernel crate would use and that is not on the list is a PORT, written into our own code.
#
# The merge gate (.github/workflows/kernel-gate.yml) runs `cargo deny ... check bans` with this
# file once for each kernel crate of chapter 27's crate table (the rows of kind Kernel, the ones
# kernel-build.yml builds for wasm32v1-none), with that crate's own Cargo.toml as --manifest-path,
# so the crate is the only root of the graph. Only the bans check reads this file; the licence,
# advisory and source rules for the same crates are deny.toml's, beside it. The runs are the
# scaffold test's `gate_deny_*` tests (projects/engines/crates/engine-geometry/tests/scaffold/
# deny.rs), which also seed a violation to show the rule fails. For one crate by hand:
#
#   cargo deny --manifest-path projects/engines/geometry/crates/<crate>/Cargo.toml \
#     --config projects/engines/geometry/deny-no-std.toml check bans
#
# geom-pool and the facade, which may use std (chapter 27), are not checked with this file:
# geom-pool brings rayon, and both are held by deny.toml's rules and deny-ships.toml's rayon bans.
# Which published crates each may name beyond those is not settled by the chapters; the piece that
# builds geom-pool (G04) and the facade's pieces settle it.
#
# cargo-deny's bans match a crate by name and version only, so an entry would pass a crate of that
# name and version from anywhere, a `[patch.crates-io] libm = { path = "..." }` included. The
# gate's own rules (tests/scaffold/deny.rs, module `rules`) read this same list and run on the same
# graph, refusing every crate outside the workspace that is not on it, at its version, from
# crates.io: the vetted release Cargo.lock pins (29.4), not code patched in.

[graph]
# What ships: normal and build dependencies, with every feature on. Development dependencies
# (proptest, bolero, the oracles) build only tests, which 28.1 allows any kernel crate.
all-features = true
exclude-dev = true

[bans]
# The vetted allow-list: the only published crates allowed in the graph of a kernel crate: libm,
# and RustCrypto's sha2 with the crates it brings (owner action G79, 32.20; piece G86). Our own
# crates are workspace members and are allowed as such; which of them a kernel crate may name is
# the crate table's rule (projects/engines/crates/engine-geometry/tests/scaffold), which also holds
# that only geom-num names libm, the kernel's one door to maths functions (21), and that only
# geom-op and geom-format name sha2 (32.20). A path crate outside the workspace is not allowed,
# and a vetted crate must come from crates.io (the gate's rules, above).
allow = [
  { crate = "libm@0.2.16", reason = """\
deterministic: pure Rust; its default arch feature takes the processor's square root on x86-64 \
and aarch64 and, where present, its fused multiply-add, which IEEE 754 rounds correctly, so the \
bits agree with its own routines on wasm32; the functions with no proven bound are kept apart in \
geom_num::math::unproven (6.4, 21, 29.4); \
no_std: yes, the crate is #![no_std] and builds for wasm32v1-none in the gate's build of geom-num; \
audited: projects/kit/notes/G24-libm-audit.md, the written audit (notices, unsafe, panics, \
allocation) of the release this entry pins (29.20, rule 3); what vendoring it should mean is open \
(31.7); \
pinned: 0.2.16, by Cargo.lock and this entry: geom-num asks for ^0.2.16, so a lock that moves past \
it fails the gate until a new record is written""" },
  { crate = "block-buffer@0.12.1", reason = """\
deterministic: buffers a message into 64-byte blocks for sha2: copies and counts bytes, no \
arithmetic on their values, so the blocks are the same on every target; no_std: yes, the crate is \
#![no_std]; audited: projects/kit/notes/G86-sha2-audit.md, the written audit of sha2 0.11.0 and \
every crate it brings, at the releases these entries pin (29.20, rule 3); pinned: 0.12.1, by \
Cargo.lock and this entry: digest 0.11.3 asks for ^0.12, so a lock that moves past it fails the \
gate until a new record is written""" },
  { crate = "cfg-if@1.0.5", reason = """\
deterministic: one macro, expanded at compile time, that chooses sha2's backend code by target; \
it runs nothing; no_std: yes, the crate is #![no_std]; audited: \
projects/kit/notes/G86-sha2-audit.md, the written audit of sha2 0.11.0 and every crate it brings, \
at the releases these entries pin (29.20, rule 3); pinned: 1.0.5, by Cargo.lock and this entry: \
sha2 0.11.0 asks for ^1""" },
  { crate = "cpufeatures@0.3.1", reason = """\
deterministic: reads at run time whether the processor has SHA instructions, so sha2 can take its \
x86 SHA-NI or AArch64 SHA2 path; each path computes the one function FIPS 180-4 defines, so the \
answer changes speed, never bits; it is compiled only for x86, x86-64 and AArch64, never for \
wasm32; no_std: yes, the crate is #![no_std]; audited: projects/kit/notes/G86-sha2-audit.md, the \
written audit of sha2 0.11.0 and every crate it brings, at the releases these entries pin (29.20, \
rule 3); pinned: 0.3.1, by Cargo.lock and this entry: sha2 0.11.0 asks for ^0.3 on x86, x86-64 \
and AArch64""" },
  { crate = "crypto-common@0.2.2", reason = """\
deterministic: the traits and fixed-size array types sha2 is written against; it computes nothing \
of its own; no_std: yes, the crate is #![no_std], with its optional getrandom and rand_core \
features off; audited: projects/kit/notes/G86-sha2-audit.md, the written audit of sha2 0.11.0 and \
every crate it brings, at the releases these entries pin (29.20, rule 3); pinned: 0.2.2, by \
Cargo.lock and this entry: digest 0.11.3 asks for ^0.2""" },
  { crate = "digest@0.11.3", reason = """\
deterministic: the traits sha2 implements and the update and finalize plumbing around \
block-buffer; it computes nothing of its own; no_std: yes, the crate is #![no_std], with its \
alloc, oid, zeroize and dev features off; audited: projects/kit/notes/G86-sha2-audit.md, the \
written audit of sha2 0.11.0 and every crate it brings, at the releases these entries pin (29.20, \
rule 3); pinned: 0.11.3, by Cargo.lock and this entry: sha2 0.11.0 asks for ^0.11""" },
  { crate = "hybrid-array@0.4.15", reason = """\
deterministic: fixed-size arrays sized by typenum, for the blocks and the digest; it copies and \
indexes, and computes nothing of its own; no_std: yes, the crate is #![no_std], with every \
optional feature off; audited: projects/kit/notes/G86-sha2-audit.md, the written audit of sha2 \
0.11.0 and every crate it brings, at the releases these entries pin (29.20, rule 3); pinned: \
0.4.15, by Cargo.lock and this entry: block-buffer 0.12.1 and crypto-common 0.2.2 ask for ^0.4.7 \
or ^0.4""" },
  { crate = "libc@0.2.191", reason = """\
deterministic: declarations only, used by cpufeatures to ask the operating system for the \
processor's features on AArch64 Linux, Android and Apple targets; it computes nothing and is not \
compiled for x86-64 or wasm32; no_std: yes, with its default std feature off, as cpufeatures \
asks; audited: projects/kit/notes/G86-sha2-audit.md, the written audit of sha2 0.11.0 and every \
crate it brings, at the releases these entries pin (29.20, rule 3); pinned: 0.2.191, by \
Cargo.lock and this entry: cpufeatures 0.3.1 asks for ^0.2.155 on those AArch64 targets""" },
  { crate = "sha2@0.11.0", reason = """\
deterministic: SHA-256 as FIPS 180-4 defines it, in pure Rust; its x86 SHA-NI and AArch64 SHA2 \
backends, chosen at run time, and its portable backend, the one on wasm32, compute the one \
function, so the digest never depends on the machine; geom-op's tests check NIST's published \
vectors on every leg of kernel.yml, natively and in WebAssembly (owner action G79, 32.20); \
no_std: yes, the crate is #![no_std], and geom-op names it with default-features = false, so its \
alloc and oid features are off; it builds for wasm32v1-none in the gate's build of geom-op; \
audited: projects/kit/notes/G86-sha2-audit.md, the written audit of sha2 0.11.0 and every crate \
it brings, at the releases these entries pin (29.20, rule 3); pinned: 0.11.0, by Cargo.lock and \
this entry: geom-op asks for ^0.11.0, so a lock that moves past it fails the gate until a new \
record is written""" },
  { crate = "typenum@1.20.1", reason = """\
deterministic: numbers in the type system, worked out at compile time to size arrays; no code of \
it runs; no_std: yes, the crate is #![no_std]; audited: projects/kit/notes/G86-sha2-audit.md, the \
written audit of sha2 0.11.0 and every crate it brings, at the releases these entries pin (29.20, \
rule 3); pinned: 1.20.1, by Cargo.lock and this entry: hybrid-array 0.4.15 asks for ^1.20""" },
]
allow-workspace = true
wildcards = "deny"
allow-wildcard-paths = true
