<!doctype html>
<html lang="en" data-app="stay">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spare Stay demo</title>
<style>
/* copied from design/tokens.css */
/* Spareware design tokens: the one shared look for every Spareware app.
   Read design/DESIGN.md first. An app sets data-app="<name>" on <html> to get its own colour.
   Text is always ink on light colours; white text appears only on Spareware red. */
:root {
  /* Spareware (the co-op) */
  --spare-red: #C8102E;
  --spare-red-hover: #A80D26;
  --spare-red-tint: #FCE9EC;

  /* Neutrals */
  --ink: #1A1A1A;
  --ink-2: #595959;
  --ink-3: #8A8A8A;
  --page: #FAF8F5;
  --panel: #FFFFFF;
  --panel-alt: #F7F6F3;
  --sink: #F1EFEA;
  --hairline: #E5E5E3;
  --rule: #C9C9C9;

  /* States (always paired: strong for borders and icons, tint for backgrounds) */
  --danger: #B91C1C;  --danger-tint: #FDE8E8;
  --success: #15803D; --success-tint: #E3F6E8;
  --info: #1D4ED8;    --info-tint: #E3ECFD;

  /* Type and shape */
  --font-ui: system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --text: 13px;
  --radius: 3px;
  --space: 8px;

  /* The current app's colours (default: Spareware itself) */
  --app: var(--spare-red-tint);
  --app-strong: var(--spare-red);
  --app-tint: var(--spare-red-tint);
}

/* One light colour per app: --app is the fill for its mark, primary buttons and active items
   (ink text on it), --app-strong is for thin borders and icons, --app-tint for quiet backgrounds. */
[data-app="construct"] { --app: #8EC5FF; --app-strong: #1F5FA8; --app-tint: #EAF4FF; }
[data-app="studio"] { --app: #C4B2FF; --app-strong: #5B3FB8; --app-tint: #F3EFFF; }
[data-app="social"] { --app: #FFB27A; --app-strong: #9E4A14; --app-tint: #FFF1E6; }
[data-app="ride"]   { --app: #7FD8CF; --app-strong: #13756B; --app-tint: #E8F8F6; }
[data-app="food"]   { --app: #A9DE8A; --app-strong: #3E7C1F; --app-tint: #EFF9E8; }
[data-app="stay"]   { --app: #80D4F0; --app-strong: #11708F; --app-tint: #E7F7FD; }
[data-app="home"]   { --app: #E8C99A; --app-strong: #8A5A1C; --app-tint: #FBF4EA; }
[data-app="rent"]   { --app: #F2B8E0; --app-strong: #94306F; --app-tint: #FCEEF8; }
[data-app="work"]   { --app: #B8C4D6; --app-strong: #3D4F6B; --app-tint: #EEF1F6; }
[data-app="market"] { --app: #D8E36A; --app-strong: #66700F; --app-tint: #F7F9DF; }
[data-app="office"] { --app: #A9B6FF; --app-strong: #3A47A8; --app-tint: #EEF0FF; }
[data-app="os"]     { --app: #CDD1D6; --app-strong: #4A525C; --app-tint: #F2F3F5; }
</style>
<style>
/* Spare Stay demo styles. Only the tokens above are used for colour, type and shape. */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:var(--font-ui);font-size:var(--text);line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--app-strong);outline-offset:2px}
a{color:var(--app-strong)}
p{margin:0 0 6px}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3{margin:0;font-size:14px;font-weight:700}
.mono{font-family:var(--font-mono)}
.label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 6px}
.ink2{color:var(--ink-2)}
.ink3{color:var(--ink-3)}
.sm{font-size:12px}
.b{font-weight:600}
.r{text-align:right}
.grow{flex:1;min-width:0}
.flex{display:flex;align-items:center;gap:8px}
.flex.top{align-items:flex-start}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:8px}.mt2{margin-top:16px}.mb{margin-bottom:8px}
.h{font-size:14px;font-weight:700;margin:0}
.big{font-size:16px;font-weight:700}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic .f{fill:currentColor;stroke:none}
.mark{display:inline-block;width:14px;height:14px;background:var(--app);border:1px solid var(--app-strong);border-radius:var(--radius);flex:none}
.coop .mark{background:var(--spare-red);border-color:var(--spare-red)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Demo layout: index on the left, the phone in the middle */
.demo{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--hairline);position:sticky;top:0;height:100vh;overflow-y:auto;padding:14px 0 70px}
.brand{display:flex;align-items:center;gap:8px;padding:0 16px;font-weight:700;font-size:14px}
.brand .badge{margin-left:auto}
.brand-sub{padding:6px 16px 12px;color:var(--ink-2);border-bottom:1px solid var(--hairline)}
.nav{padding:4px 0 8px}
.nav .label{padding:12px 16px 2px;margin:0}
.nav a{display:block;padding:5px 16px 5px 13px;border-left:3px solid transparent;color:var(--ink);text-decoration:none}
.nav a:hover{background:var(--panel-alt)}
.nav a[aria-current="page"]{background:var(--app-tint);border-left-color:var(--app);font-weight:600}
.onscreen{border-top:1px solid var(--hairline);padding:12px 16px}
.onscreen li{padding:3px 0;line-height:1.35}
.fid{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);display:block}
.pick{display:none}
.country{padding:12px 16px;border-bottom:1px solid var(--hairline)}
.country .label{margin:0 0 4px}
.country select.input{width:100%}
.country p{margin:6px 0 0}
p:not(.flex)>.ic:first-child{margin-right:4px}
.stage{display:flex;justify-content:center;align-items:flex-start;padding:20px 24px;min-width:0}
.device{background:var(--sink);border:1px solid var(--rule);border-radius:34px;padding:10px;flex:none}
.screen{position:relative;background:var(--panel);border:1px solid var(--hairline);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;width:390px;height:min(812px,calc(100vh - 62px))}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.bigtext{font-size:15px}
.bigtext .sm,.bigtext .badge,.bigtext .tabbar a,.bigtext .label{font-size:13px}
/* Higher contrast: each grey steps up to the next darker token value (ink, ink-2, ink-3) */
.contrast{--ink-2:#1A1A1A;--ink-3:#595959;--hairline:#8A8A8A;--rule:#595959}

/* Phone status bar, app header, tab bar */
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:7px 24px 3px;font-size:12px;font-weight:600}
.statusbar .flex{gap:5px}
.apphead{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--hairline);background:var(--panel);min-height:48px;flex:none}
.apphead .name{font-weight:700;white-space:nowrap}
.apphead .open{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.apphead .acts{display:flex;gap:6px;align-items:center;margin-left:auto}
.tabbar{display:flex;border-top:1px solid var(--hairline);background:var(--panel);flex:none}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 8px;font-size:11px;color:var(--ink-2);text-decoration:none}
.tabbar a .ic{width:18px;height:18px}
.tabbar a[aria-current="page"]{background:var(--app);color:var(--ink);font-weight:600}
.footbar{flex:none;border-top:1px solid var(--hairline);background:var(--panel);padding:10px 16px;display:flex;align-items:center;gap:10px}

/* Building blocks */
.sec{padding:12px 16px;border-bottom:1px solid var(--hairline)}
.sec.alt{background:var(--panel-alt)}
.row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--hairline);background:var(--panel)}
.row.tight{padding:7px 0;background:none}
.rows>.row:last-child{border-bottom:0}
.row.sel{background:var(--app-tint);box-shadow:inset 3px 0 0 var(--app)}
button.row{width:100%;border:0;border-bottom:1px solid var(--hairline);text-align:left;font:inherit}
button.row:hover{background:var(--panel-alt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--ink);background:var(--panel);color:var(--ink);font-weight:600;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--app);border-color:var(--app);color:var(--ink)}
.btn.primary:hover{border-color:var(--app-strong)}
.btn.quiet{border-color:var(--rule);color:var(--ink-2);font-weight:500}
.btn.quiet:hover{border-color:var(--ink-2)}
.btn.danger{border-color:var(--danger);background:var(--danger-tint);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{display:flex;width:100%}
.btn.tall{min-height:44px;font-size:14px}
.btn.sm{min-height:26px;padding:2px 8px;font-size:12px}
.coop .btn.primary{background:var(--spare-red);border-color:var(--spare-red);color:var(--panel)}
.coop .btn.primary:hover{background:var(--spare-red-hover)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.two>.btn{flex:1}
.iconbtn{width:32px;height:32px;padding:0;border:1px solid var(--rule);background:var(--panel);border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none;text-decoration:none}
.iconbtn[aria-pressed="true"]{color:var(--app-strong);border-color:var(--app-strong);background:var(--app-tint)}
.iconbtn[aria-pressed="true"] .ic{fill:currentColor}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;background:var(--app-tint);color:var(--app-strong);font-size:11px;font-weight:600;white-space:nowrap;line-height:18px}
.badge .ic{width:12px;height:12px}
.badge.n{background:var(--sink);color:var(--ink-2)}
.badge.ok{background:var(--success-tint);color:var(--ink);box-shadow:inset 0 0 0 1px var(--success)}
.badge.bad{background:var(--danger-tint);color:var(--ink);box-shadow:inset 0 0 0 1px var(--danger)}
.badge.info{background:var(--info-tint);color:var(--ink);box-shadow:inset 0 0 0 1px var(--info)}
.coop .badge{background:var(--spare-red-tint);color:var(--spare-red-hover)}
.coop .badge.n{background:var(--sink);color:var(--ink-2)}
.coop .badge.ok{background:var(--success-tint);color:var(--ink)}
.note{background:var(--app-tint);border-left:3px solid var(--app);padding:8px 10px;border-radius:var(--radius)}
.coop .note{background:var(--spare-red-tint);border-left-color:var(--spare-red)}
.state{padding:8px 10px;border-left:3px solid var(--rule);border-radius:var(--radius);background:var(--panel-alt)}
.state.bad{border-color:var(--danger);background:var(--danger-tint)}
.state.ok{border-color:var(--success);background:var(--success-tint)}
.state.info{border-color:var(--info);background:var(--info-tint)}
.state .ic,.note .ic{margin-right:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);border-radius:999px;padding:4px 10px;white-space:nowrap;font-size:12px}
.chip[aria-pressed="true"]{background:var(--app);border-color:var(--app);color:var(--ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--panel);flex:none}
.seg button{border:0;border-right:1px solid var(--rule);background:transparent;padding:5px 10px;color:var(--ink-2);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--app);color:var(--ink);font-weight:600}
.coop .seg button[aria-pressed="true"]{background:var(--spare-red-tint);color:var(--ink)}
.seg.full{display:flex}.seg.full button{flex:1}
.switch{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:2px 0;text-align:left}
.switch .track{width:36px;height:20px;border-radius:999px;background:var(--sink);border:1px solid var(--rule);position:relative;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:1px solid var(--ink-2)}
.switch[aria-checked="true"] .track{background:var(--app);border-color:var(--app-strong)}
.switch[aria-checked="true"] .track::after{left:18px;border-color:var(--ink)}
.input,textarea.input,select.input{width:100%;border:1px solid var(--rule);border-radius:var(--radius);background:var(--panel);padding:7px 9px;resize:vertical}
.input:focus{outline:2px solid var(--app-strong);outline-offset:1px}
select.input{width:auto;padding:5px 8px}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:var(--radius);padding:0 9px;background:var(--panel)}
.field input{border:0;outline:0;padding:8px 0;flex:1;min-width:0;background:transparent}
.field:focus-within{outline:2px solid var(--app-strong);outline-offset:1px}
.field .ic{color:var(--ink-2)}
.lines{width:100%;border-collapse:collapse}
.lines td{padding:4px 0;vertical-align:top}
.lines td.r{text-align:right;font-family:var(--font-mono);white-space:nowrap;padding-left:8px}
.lines tr.total td{border-top:1px solid var(--ink);padding-top:8px;font-weight:700}
.lines .sub td{padding-top:0;color:var(--ink-2);font-size:12px}
.linkbtn{border:0;background:none;padding:0;color:var(--app-strong);text-decoration:underline;font:inherit;cursor:pointer;text-align:left}
.coop .linkbtn{color:var(--spare-red-hover)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;flex:none}
.stepper button{width:30px;height:28px;border:0;background:var(--panel);color:var(--ink);padding:0;display:flex;align-items:center;justify-content:center}
.stepper button:disabled{color:var(--ink-3);cursor:not-allowed}
.stepper span{min-width:34px;text-align:center;font-family:var(--font-mono);border-left:1px solid var(--rule);border-right:1px solid var(--rule);line-height:28px;padding:0 4px}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;color:var(--ink-2)}
.steps .dot{width:18px;height:18px;border-radius:50%;border:1px solid var(--rule);background:var(--panel);flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.steps .dot .ic{width:12px;height:12px}
.steps li.done{color:var(--ink)}
.steps li.done .dot{background:var(--app-tint);border-color:var(--app-strong);color:var(--app-strong)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now .dot{background:var(--app);border-color:var(--app-strong)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--app-tint);border:1px solid var(--app-strong);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:var(--ink)}
.avatar.sm{width:28px;height:28px;font-size:12px}
.coop .avatar{background:var(--spare-red-tint);border-color:var(--spare-red)}
.democtl{margin:12px 16px;border:1px dashed var(--rule);border-radius:var(--radius);padding:10px;background:var(--panel-alt)}
.empty{text-align:center;color:var(--ink-3);padding:24px 16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--hairline)}
.stat{padding:10px 12px;border-right:1px solid var(--hairline);min-width:0}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--font-mono);font-size:15px;font-weight:700;display:block;white-space:nowrap}
.meter{height:8px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.meter i{display:block;height:100%;background:var(--app)}
.meter.warn i{background:var(--danger-tint);box-shadow:inset 0 0 0 1px var(--danger)}
.coop .meter i{background:var(--spare-red)}
.split{display:flex;height:14px;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;margin:6px 0}
.split span{display:block;height:100%}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--rule);margin-right:6px;vertical-align:-1px}
.c-host{background:var(--app)} .c-tax{background:var(--info-tint)} .c-coop{background:var(--spare-red-tint)} .c-proc{background:var(--sink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--rule);border-radius:var(--radius);background:var(--panel);padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:64px}
.tile .ic{width:18px;height:18px;color:var(--app-strong)}
.tile:hover{border-color:var(--ink-2)}
.tile.warn{border-color:var(--danger);background:var(--danger-tint)}
.tile.warn .ic{color:var(--danger)}
.tile[disabled]{opacity:.5;cursor:not-allowed}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;text-align:right;font-family:var(--font-mono)}
.price{font-family:var(--font-mono);font-weight:700;font-size:16px}
.price.lg{font-size:20px}
.secret{font-family:var(--font-mono);font-size:18px;letter-spacing:.2em;font-weight:700}
.thread{display:flex;flex-direction:column;gap:6px;padding:12px 16px}
.msg{max-width:82%;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--hairline);background:var(--panel-alt)}
.msg.me{align-self:flex-end;background:var(--app-tint);border-color:var(--app)}
.msg .who{display:block;font-size:11px;color:var(--ink-2)}
.hidden-bit{background:var(--sink);border-radius:2px;padding:0 4px;color:var(--ink-2);font-size:12px}
details.faq{border-bottom:1px solid var(--hairline)}
details.faq summary{padding:9px 16px;cursor:pointer;font-weight:600}
details.faq p{padding:0 16px 10px;color:var(--ink-2)}
.cmd{font-family:var(--font-mono);font-size:12px;background:var(--panel-alt);border:1px solid var(--hairline);border-radius:var(--radius);padding:6px 8px;overflow-wrap:anywhere}

/* Search: box, results and map */
.searchbox{border:1px solid var(--ink);border-radius:var(--radius);overflow:hidden}
.sb-row{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--panel);padding:7px 10px;text-align:left}
.sb-row .ic{color:var(--app-strong)}
.sb-row .label{margin:0}
.sb-row:hover{background:var(--panel-alt)}
.sb-two{display:grid;grid-template-columns:1.4fr 1fr;border-top:1px solid var(--rule)}
.sb-two .sb-row+.sb-row{border-left:1px solid var(--rule)}
.results>li{border-bottom:1px solid var(--hairline);padding:12px 16px;position:relative}
.results>li.sel{background:var(--app-tint);box-shadow:inset 3px 0 0 var(--app)}
.card-art{display:block;border-radius:var(--radius);overflow:hidden;border:1px solid var(--hairline)}
.card-title{font-weight:700;color:var(--ink);text-decoration:none;font-size:14px}
.card-title:hover{text-decoration:underline}
.save{position:absolute;top:20px;right:24px}
.pic{display:block;width:100%;height:auto}
.map{display:block;width:100%;height:auto;border:1px solid var(--hairline);border-radius:var(--radius)}
.m-sea{fill:var(--info-tint)} .m-land{fill:var(--panel-alt);stroke:var(--rule);stroke-width:1}
.m-bush{fill:var(--success-tint)} .m-road{stroke:var(--panel);stroke-width:4;fill:none} .m-road-o{stroke:var(--rule);stroke-width:6;fill:none}
.m-label{fill:var(--ink-2);font-size:10px;font-family:var(--font-ui)}
.m-pin rect{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
.m-pin text{fill:var(--ink);font:700 11px var(--font-mono)}
.m-pin.on rect{fill:var(--app);stroke:var(--app-strong);stroke-width:2}
.m-pin{cursor:pointer}
.m-pin:focus-visible rect{stroke:var(--app-strong);stroke-width:3}
.m-area{fill:var(--app-tint);stroke:var(--app-strong);stroke-width:1.5;stroke-dasharray:4 3;opacity:.9}

/* Illustrations drawn in SVG (not photos) */
.a-sky{fill:var(--app-tint)} .a-sun{fill:var(--panel);stroke:var(--app-strong);stroke-width:1.5}
.a-land{fill:var(--success-tint)} .a-sand{fill:var(--sink)} .a-sea{fill:var(--info-tint)}
.a-wave{fill:none;stroke:var(--app-strong);stroke-width:1.2;stroke-linecap:round}
.a-wall{fill:var(--panel)} .a-roof{fill:var(--app)} .a-sink{fill:var(--sink)} .a-glass{fill:var(--app-tint)} .a-alt{fill:var(--panel-alt)} .a-rule{fill:var(--rule)}
.a-trunk{fill:none;stroke:var(--ink-2);stroke-width:3;stroke-linecap:round}

/* Sheets, toast and the assess panel */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}

.sheet{position:relative;width:100%;max-height:88%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--ink);border-radius:var(--radius) var(--radius) 0 0}

.toast{position:absolute;left:12px;right:12px;bottom:66px;background:var(--panel);border:1px solid var(--ink);border-radius:var(--radius);padding:8px 10px;z-index:30;display:flex;gap:8px;align-items:flex-start}

.assess-btn{position:fixed;right:16px;bottom:16px;z-index:50;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border:1px solid var(--ink);border-radius:var(--radius);font-weight:600;color:var(--ink)}

.assess-panel details{border-bottom:1px solid var(--hairline)}
.assess-panel summary{padding:8px 16px;cursor:pointer;font-weight:600}
.assess-panel details ul{padding:0 16px 10px}
.assess-panel details li{padding:2px 0}

/* Host calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--hairline);border-left:1px solid var(--hairline)}
.cal .dow{font-size:11px;color:var(--ink-3);text-align:center;padding:4px 0;border-right:1px solid var(--hairline);border-bottom:1px solid var(--hairline);background:var(--panel-alt)}

.cal .day.own{background:var(--sink)}

.cal .day.out{background:var(--panel-alt);color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2)}

.cal .day.past{color:var(--ink-3)}

/* ---------- prices: the full price is worked out before anything is shown ---------- */
const guestCount = () => S.adults + S.children;
function nightsOf(dateId) { const d = DATES[dateId]; return Array.from({length:d.n}, (_, i) => addD(d.from, i)); }
function nightPrice(id, dt) {
  const p = PRICE[id], ov = S.priceOv && S.priceOv[id + '|' + dt.toISOString().slice(0, 10)];
  if (ov) return ov;
  if (dt >= SEASON[0] && dt <= SEASON[1]) return p.season;
  const w = dt.getUTCDay();
  return (w === 5 || w === 6) ? p.weekend : p.base;
}
function quote(id, o = {}) {
  const l = LBY[id], dateId = o.date || S.date, pets = o.pets ?? S.pets, ex = o.extras || {};
  const lines = nightsOf(dateId).map(dt => [fd(dt), nightPrice(id, dt)]);
  const nightsTotal = lines.reduce((a, [, v]) => a + v, 0);
  const petFee = pets > 0 && l.pet ? l.pet : 0;
  const extras = (ex.firewood ? 25 : 0) + (ex.linen ? 40 : 0);
  const accom = nightsTotal + l.cleaning + petFee + extras;
  const guestFee = r2(FEE.perBooking * FEE.guestShare), hostFee = r2(FEE.perBooking - guestFee);
  /* Tax on the stay comes from the country pack: included in the host's prices, added on top, or none */
  const T = P().stay, rate = T.rate || 0;
  const base = T.mode === 'incl' ? accom / (1 + rate) : accom;
  const tax = T.mode === 'incl' ? r2(accom - base) : r2(accom * rate);
  const added = T.mode === 'add' ? tax : 0;
  const credit = r2(base * (T.credit || 0));
  const proc = r2((accom + added + guestFee) * PROC.rate + PROC.fixed);
  const total = r2(accom + added + guestFee + proc);
  const hostGets = r2(base + credit - hostFee);
  const toTax = r2(tax - credit);
  return {lines, nightsTotal, petFee, extras, cleaning:l.cleaning, accom, guestFee, hostFee, proc, total, tax, added, credit, hostGets, toTax, coop:r2(guestFee + hostFee), n:lines.length};
}
function payPlan(q, dateId = S.date) {
  const d = DATES[dateId], days = daysUntil(d.from), bal = addD(d.from, -14), dep = r2(q.total * 0.3);

}

function draftIssues() {
  const d = S.draft, out = [];
  if (d.photos < 5) out.push(`Add ${5 - d.photos} more photo${5 - d.photos === 1 ? '' : 's'} (at least 5)`);
  if (d.access && !d.accessPhoto) out.push('Add a photo proving step-free entry');
  if (!d.co) out.push('Answer the carbon monoxide alarm question');
  if (d.cams === 'inside') out.push('Remove inside cameras: they are not allowed');
  if (!d.insurer) out.push('Confirm your insurer knows about paid guests');
  if (d.type === 'camp' && !d.council) out.push(`Add the ${P().campDoc}`);
  return out;
}

const MORE_ACT = {
  /* host side */
  hl: v => { S.hl = v; S.dayKey = null; },
  calMove: v => { let m = S.calM + Number(v), y = S.calY; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.calM = m; S.calY = y; },
  day: v => { S.dayKey = v; S.sheet = 'day'; },
  dayKind: v => { S.dayKind[S.hl + '|' + S.dayKey] = v; toast(v === 'open' ? 'Night opened for booking. Other sites see it at their next sync.' : v === 'own' ? 'Kept for your own use. Other sites see it as booked.' : 'Night blocked here and on the linked sites.'); },
  nightPrice: v => { const i = v.lastIndexOf(':'), key = v.slice(0, i), n = Number(v.slice(i + 1)); const dt = new Date(key + 'T00:00:00Z'); S.priceOv[S.hl + '|' + key] = Math.max(50, nightPrice(S.hl, dt) + n); },
  nightReset: () => { delete S.priceOv[S.hl + '|' + S.dayKey]; },
  applyClash: () => { S.clashDone = true; S.sheet = null; toast('Rule applied. Ana has a full refund and three similar places to pick from. Your record is unaffected.'); },
  syncNow: () => { Object.values(S.feeds).flat().forEach(f => { f.ok = true; f.ago = 0; }); toast('All linked calendars synced just now.'); },
  addFeed: () => { if (!S.feedText.trim()) { toast('Paste a calendar link first.'); return; } S.feeds[S.hl].push({name:'New linked calendar', ok:true, ago:0, n:0}); S.feedText = ''; toast('Calendar linked. Nights booked there close here within 15 minutes.'); },
  rule: v => { const [k, n] = v.split(':'); const lim = {min:[1, 14], max:[7, 60], notice:[0, 7], window:[3, 24], prep:[0, 3], seasonMin:[2, 14]}[k]; S.rules[k] = Math.min(lim[1], Math.max(lim[0], S.rules[k] + Number(n))); },
  ruleGap: () => { S.rules.gap = !S.rules.gap; },
  price: v => { const [k, n] = v.split(':'); PRICE[S.hl][k] = Math.max(0, PRICE[S.hl][k] + Number(n)); },
  fee: v => { const [k, n] = v.split(':'); LBY[S.hl][k] = Math.max(0, LBY[S.hl][k] + Number(n)); },
  req: v => { S.req = v; toast(v === 'accepted' ? 'Accepted. Tom has paid, and the money is held until check-in.' : "Declined. Tom's dates are open again."); },
  instant: v => { LBY[v].instant = !LBY[v].instant; toast(LBY[v].instant ? 'Instant booking on: guests book straight away.' : 'Instant booking off: guests send a request first.'); },
  hreason: v => { S.hreason = v; },
  hostCancel: () => { S.hostCancelled[S.arg] = true; S.sheet = null; toast(`Cancelled ${S.arg}. The guest has a full refund and help to rebook.`); },
  hostAs: v => { S.hostAs = v; },
  twostepOk: () => { if (!/^\d{6}$/.test(S.code)) { toast('Enter the 6 digits from your app.'); return; } S.sheet = null; S.code = ''; toast('Confirmed. You can now change where payouts go.'); },
  /* reviews */
  rvSide: v => { S.rvSide = v; },
  rvStar: v => { const [k, n] = v.split(':'); S.rv[k] = Number(n); },
  hrvStar: v => { const [k, n] = v.split(':'); S.hrv[k] = Number(n); },
  hostAgain: () => { S.hostAgain = !S.hostAgain; },
  rvSend: () => { if (!avgOf(S.rv, CATS)) { toast('Rate all six first.'); return; } S.rvSent = true; if (S.hrvSent) S.released = true; toast(S.released ? 'Both reviews are now published together.' : 'Review sent. Hidden until the host writes theirs.'); },
  hrvSend: () => { if (!avgOf(S.hrv, HCATS)) { toast('Rate all three first.'); return; } S.hrvSent = true; if (S.rvSent) S.released = true; toast(S.released ? 'Both reviews are now published together.' : 'Review sent. Hidden until the guest writes theirs.'); },
  otherSends: () => { S.rvSent = true; S.hrvSent = true; S.released = true; toast('Both reviews are now published together.'); },
  rvReason: v => { S.rvReason = v; },
  rvReport: () => { S.reported[S.arg] = true; S.sheet = null; toast('Report sent to a moderator.'); },
  appealSend: () => { S.sheet = null; toast('Appeal sent. A fresh reviewer answers within 7 days.'); },
  /* messages */
  thread: (v, el) => { S.thread = v || null; S.chatDraft = ''; return el.dataset.go || undefined; },
  send: () => {
    const t = S.chatDraft.trim(); if (!t) { toast('Write a message first.'); return; }
    (S.extraMsgs[S.thread] = S.extraMsgs[S.thread] || []).push(['me', t, 'Just now']); S.chatDraft = '';
    toast(/bank|transfer|cash|outside/i.test(t) ? 'Keep payments in Spare Stay: money paid outside is not held or protected.' : 'Sent.');
  },
  msgReport: () => toast('Message reported. A moderator will look at it today.'),
  block: v => { S.blocked[v] = true; S.sheet = null; toast(`Blocked and reported ${THREADS[v].name}.`); },
  notif: v => { S.notif[v] = !S.notif[v]; },
  /* help */
  claim: v => { S.claim = v; if (v === 'panel') toast('Sent to a member panel. Your hold stays where it is.'); },
  caseBooking: v => { S.caseBooking = v; },
  caseSend: () => { if (!S.caseText.trim()) { toast('Tell us what you need first.'); return; } S.cases.unshift({no:'#' + (3310 + S.cases.length), t:S.caseText.trim().slice(0, 40), b:S.caseBooking === 'none' ? 'General' : S.caseBooking, due:tm(19, 30)}); S.caseText = ''; S.sheet = null; toast('Request sent. You can follow it here.'); },
  /* account */
  lang: v => { S.lang = v; },
  h24: v => { S.h24 = v === '24'; },
  big: () => { S.big = !S.big; },
  contrast: () => { S.contrast = !S.contrast; },
  twoStepToggle: () => { toast('The second sign-in step stays on for accounts that get payouts or see guest addresses.'); },
  agent: () => { S.agent = !S.agent; toast(S.agent ? 'Trip planner agent connected. It must ask you before paying.' : 'Trip planner agent disconnected.'); },
  priv: v => { S.priv[v] = !S.priv[v]; },
  /* setup */
  dtype: v => { S.draft.type = v; },
  dphoto: () => { S.draft.photos = Math.min(6, S.draft.photos + 1); },
  drule: v => { S.draft[v] = !S.draft[v]; },
  daccess: () => { S.draft.access = !S.draft.access; },
  daccessPhoto: () => { S.draft.accessPhoto = true; },
  dco: () => { S.draft.co = true; },
  dcams: v => { S.draft.cams = v; },
  dflag: v => { S.draft[v] = !S.draft[v]; },
  dprice: v => { const [k, n] = v.split(':'); S.draft[k] = Math.max(0, S.draft[k] + Number(n)); },
  dsubmit: () => toast('Sent for review. A person checks it, usually within a working day.'),
  /* co-op */
  member: () => { S.member = !S.member; toast(S.member ? 'Welcome back. One host, one vote.' : 'You are no longer a member. You still host and keep what you earn, and can join again at any time.'); },
  vote: v => { const [p, k] = v.split(':'); if (!S.member) { toast('Join as a member to vote.'); return; } if (S.votes[p]) S.tally[p][S.votes[p]]--; S.votes[p] = k; S.tally[p][k]++; toast('Vote recorded. One host, one vote. You can change it until 31 Oct.'); }
};
const MORE_INPUT = {
  feedText: v => { S.feedText = v; }, code: v => { S.code = v; },
  rvText: v => { S.rvText = v; }, rvPrivate: v => { S.rvPrivate = v; }, hrvText: v => { S.hrvText = v; }, appealText: v => { S.appealText = v; },
  chatDraft: v => { S.chatDraft = v; }, helpQ: v => { S.helpQ = v; return true; }, caseText: v => { S.caseText = v; },
  dcouncil: v => { S.draft.council = v; }
};
S.cases = [{no:'#3302', t:'Damage claim on Kōwhai Cottage', b:'SS-26-46110', due:'Thu 22 Oct'}, {no:'#3187', t:'Receipt in my company name', b:'SS-26-44901', done:true}];

/* ---------- actions ---------- */
let toastTimer;
function toast(t) { S.toast = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ''; const el = $('#toast'); if (el) el.hidden = true; }, 3600); }
const ACT = {
  sheet: (v, el) => { S.sheet = v; S.arg = el.dataset.x || null; if (v === 'lockout') S.lock = 0; },
  close: () => { S.sheet = null; },
  toast: v => toast(v),
  region: v => { S.region = v; S.whereText = ''; const r = results().res; S.sel = r[0] ? r[0].l.id : null; if (S.sheet === 'where') S.sheet = null; },
  date: v => { S.date = v; S.sheet = null; },
  count: v => { const [k, n] = v.split(':'); S[k] = Math.max(0, S[k] + Number(n)); },
  service: () => { S.service = !S.service; },
  view: v => { S.view = v; },
  ftype: v => { const a = S.filt.types; a.includes(v) ? a.splice(a.indexOf(v), 1) : a.push(v); },
  famen: v => { const a = S.filt.amen; a.includes(v) ? a.splice(a.indexOf(v), 1) : a.push(v); },
  finstant: () => { S.filt.instant = !S.filt.instant; },
  fclear: () => { S.filt = {max:3000, types:[], amen:[], instant:false}; },
  save: v => { S.saved[v] = !S.saved[v]; toast(S.saved[v] ? `Saved ${LBY[v].name} to your list.` : 'Removed from your list.'); },
  pin: v => { S.sel = v; },
  searchArea: () => toast(`Searched again in this area: ${results().res.length} places, full prices updated.`),
  open: v => { S.listing = v; S.photo = 0; },
  photo: v => { S.photo = (S.photo + Number(v) + PHOTOS.length) % PHOTOS.length; },
  photoGo: v => { S.photo = Number(v); S.sheet = null; },
  reportListing: () => toast('Thanks. A moderator checks this listing for fake photos or a wrong address.'),
  extra: v => { S.extras[v] = !S.extras[v]; },
  plan: v => { S.plan = v; },
  pay: v => { S.pay = v; },
  confirmBook: () => {
    const l = LBY[S.listing];
    if (!l.instant && !S.reqMsg.trim()) { toast('Add a short message to the host first.'); return; }
    const q = quote(l.id, {extras:S.extras}); const pp = payPlan(q);
    if (!l.instant) { toast(`Request sent to ${l.host}. Your dates are held for 24 hours. Nothing is charged unless they accept.`); return; }
    S.trip = {id:l.id, date:S.date, adults:S.adults, children:S.children, pets:S.pets, extras:{...S.extras}, q, no:'SS-26-' + (48213 + Math.floor(Math.random() * 700)), plan:pp.rows.length > 1 ? 'parts' : 'full', pay:S.pay};
    S.phase = 'booked'; S.cancelled = false; S.problem = null;
    toast(`Booked. ${M(pp.rows[0][1])} paid and held by the payment provider.`);
    return '#trip';
  },
  phase: v => { S.phase = v; S.showCode = false; if (v === 'after') toast('Stay over. Codes hidden and wiped from your phone. Reviews are open for 14 days.'); },
  offline: () => { S.offline = !S.offline; },
  alert: () => { S.alert = !S.alert; if (S.alert) toast('Official alert pushed to guests with stays in the area.'); },
  emergencyRefund: () => { S.alert = false; S.cancelled = true; toast('Full refund under the emergency rule. No policy applies.'); },
  showCode: () => { S.showCode = !S.showCode; },
  directions: () => toast("Opening directions in your phone's own map app."),
  cancelBooking: () => { S.cancelled = true; S.sheet = null; toast('Booking cancelled. Refund on its way.'); },
  resetTrip: () => { S.cancelled = false; },
  ptype: v => { S.problemType = v; },
  pphoto: () => { S.problemPhoto = true; },
  sendProblem: () => { S.problem = {title:{broken:'Something broken.', dirty:'Not clean.', notas:'Not as described.', unsafe:'Not safe.', camera:'Hidden camera reported.'}[S.problemType], fixed:false}; S.sheet = null; toast('Sent to Mere with your photo.'); },
  problemFixed: () => { S.problem.fixed = true; },
  problemEscalate: () => { toast('Guest protection claim opened: refund for the nights affected, or a move tonight.'); },
  lockNext: () => { S.lock = 1; },
  lockMove: () => { S.lock = 2; },
  check: v => { S.checklist[v] = !S.checklist[v]; },
  checkedOut: () => { S.phase = 'after'; S.sheet = null; toast('Checked out. Mere has been told. Reviews are open for 14 days.'); },
  assessOpen: () => { openAssess(); return false; },
  assessClose: () => { $('#assess').hidden = true; $('#assessBtn').focus(); return false; }
};
const INPUT = {
  /* Demo control: switch the country rules pack. A booked trip keeps its stay, priced again under the new pack. */
  country: v => { S.country = PACKS[v] ? v : 'nz'; if (S.trip) S.trip.q = quote(S.trip.id, {date:S.trip.date, pets:S.trip.pets, extras:S.trip.extras}); return true; },
  sort: v => { S.sort = v; return true; },
  max: v => { S.filt.max = Number(v); return true; },
  reqMsg: v => { S.reqMsg = v; },
  whereText: v => {
    S.whereText = v; const s = v.toLowerCase();
    const hit = Object.entries(REGIONS).find(([k, r]) => k !== 'all' && (r.name.toLowerCase().includes(s) || L.some(l => l.region === k && l.place.toLowerCase().includes(s))));
    if (s.length > 2 && hit) { S.region = hit[0]; }
    return true;
  }
};

Object.assign(ACT, MORE_ACT);
Object.assign(INPUT, MORE_INPUT);

/* ---------- side index and the assess panel ---------- */
function sideHtml() {
  const groups = {};
  Object.entries(ROUTES).forEach(([k, r]) => { (groups[r.g] = groups[r.g] || []).push([k, r]); });
  const feats = SCREEN_FEATS[S.route] || [];
  const ctry = id => `<select class="input" id="${id}" data-in="country">${Object.entries(PACKS).map(([k, c]) => `<option value="${k}" ${S.country === k ? 'selected' : ''}>${c.name}</option>`).join('')}</select>`;
  const nz = S.country === 'nz';
  return `<div class="brand"><span class="mark" aria-hidden="true"></span>Spare Stay<span class="badge n">Demo</span></div>
    <p class="brand-sub sm">Clickable demo with sample data. Not the real app. Every place, person, price and number is made up.</p>
    <div class="country"><label class="label" for="ctry">Country rules pack</label>${ctry('ctry')}
      <p class="sm ink2">${nz ? 'Example: New Zealand. The sample places and people are set there.' : `Showing the ${P().name} rules pack on the same New Zealand sample places, so you can compare.`} Switch to see money, tax and local rules for another country. Each country gets its own rules pack. Sample rules, not legal advice.</p></div>
    <nav class="nav" aria-label="Screens">${Object.entries(groups).map(([g, rs]) => `<p class="label">${g}</p>${rs.map(([k, r]) => `<a href="#${k}" ${S.route === k ? 'aria-current="page"' : ''}>${r.t}</a>`).join('')}`).join('')}</nav>
    <div class="onscreen"><p class="label">Core features on this screen</p><ul>${feats.map(f => `<li class="sm"><span class="fid">${f}</span>${esc(FNAME[f] || '')}</li>`).join('')}</ul></div>
    <div class="pick"><label class="sm ink2" for="pick">Screen</label><select class="input" id="pick" data-in="pick">${Object.entries(ROUTES).map(([k, r]) => `<option value="${k}" ${S.route === k ? 'selected' : ''}>${r.g}: ${r.t}</option>`).join('')}</select>
      <label class="sm ink2" for="ctry2">Country</label>${ctry('ctry2')}
      <p class="sm ink2">${nz ? 'Example: New Zealand.' : `${P().name} rules on the New Zealand sample places.`} Each country gets its own rules pack.</p></div>`;
}
function openAssess() {
  const shown = new Set(Object.values(SCREEN_FEATS).flat());
  const all = CORE.flatMap(([, , fs]) => fs.map(f => f[0]));
  const missing = all.filter(f => !shown.has(f));
  $('#assess').innerHTML = `<button class="scrim" data-act="assessClose" aria-label="Close" tabindex="-1"></button><div class="assess-panel">
    <div class="sheet-head"><span class="mark" aria-hidden="true"></span><span class="h grow" id="assessTitle">Assess this demo</span><button class="iconbtn" data-act="assessClose" aria-label="Close">${ic('x')}</button></div>
    <div class="sec"><p>Questions to answer while you click through. They come from <span class="mono">features.json</span> ("assess").</p><p><a href="https://github.com/spareware-co-op/spareware/blob/main/projects/spare-stay/FEATURES.md" target="_blank" rel="noopener">Feature map: FEATURES.md</a></p>
      <p class="sm ink2">Spare Stay is international. Where a question names New Zealand law, New Zealand is the first example country; each country gets its own rules pack. Use the country switch to compare.</p></div>
    <div class="sec"><p class="label">Assessment questions</p><ol>${ASSESS.map(q => `<li>${esc(q)}</li>`).join('')}</ol></div>
    <div class="sec"><p class="label">Core features each screen shows</p><p class="sm ink2">${all.length - missing.length} of ${all.length} core features in ${CORE.length} areas appear on at least one screen.${missing.length ? ` Not shown yet: ${missing.join(', ')}.` : ''}</p></div>
    ${Object.entries(SCREEN_FEATS).map(([k, fs]) => `<details open><summary>${ROUTES[k].g}: ${ROUTES[k].t} <span class="badge n">${fs.length}</span></summary><ul>${fs.map(f => `<li><span class="mono sm">${f}</span> ${esc(FNAME[f] || '')}</li>`).join('')}</ul><p style="padding:0 16px 10px"><a href="#${k}" data-act="assessClose">Open this screen</a></p></details>`).join('')}
    <div class="sec"><p class="label">Core areas</p><ul class="sm">${CORE.map(([id, n, fs]) => `<li><span class="mono">${id}</span> ${esc(n)} <span class="ink2">(${fs.length} core)</span></li>`).join('')}</ul><p class="sm ink2 mt">Areas STAY-A11 Host operations and teams and STAY-A22 Experiences have no core features, so they aren't in this demo.</p></div>
  </div>`;
  $('#assess').hidden = false; $('#assess .assess-panel .iconbtn').focus();
}

/* ---------- render ---------- */
const RENDER = {search:rSearch, listing:rListing, book:rBook, trip:rTrip, reviews:rReviews, chat:rChat, help:rHelp, account:rAccount, host:rHost, calendar:rCalendar, payouts:rPayouts, setup:rSetup, coop:rCoop};
function rTodo() { return phone(head(ROUTES[S.route].t), `<p class="empty">This screen is being drawn.</p>`, tabs('')); }
let lastRoute = null, lastSheet = null;
function render() {
  const sc = $('#scroll'), sh = $('.sheet');
  const keep = lastRoute === S.route && sc ? sc.scrollTop : 0;
  const keepSheet = lastSheet === S.sheet && sh ? sh.scrollTop : 0;
  const ae = document.activeElement;
  const fkey = ae && ae.dataset && (ae.dataset.act || ae.dataset.in) ? [ae.dataset.act || '', ae.dataset.in || '', ae.dataset.v || ''].join('|') : null;
  const r = ROUTES[S.route] ? S.route : 'search';
  if (['host', 'calendar', 'payouts', 'setup'].includes(r)) S.role = 'host';
  if (['search', 'listing', 'book', 'trip'].includes(r)) S.role = 'guest';
  document.documentElement.lang = S.lang === 'l2' ? P().l2.code : P().loc;
  $('#stage').innerHTML = `<div class="device"><div class="screen ${S.big ? 'bigtext' : ''} ${S.contrast ? 'contrast' : ''} ${ROUTES[r].coop ? 'coop' : ''}">${(RENDER[r] || rTodo)()}${sheetHtml()}<div class="toast" id="toast" role="status" ${S.toast ? '' : 'hidden'}>${ic('check')}<span>${esc(S.toast)}</span></div></div></div>`;
  $('#side').innerHTML = sideHtml();
  document.body.classList.toggle('has-sheet', !!S.sheet);
  const nsc = $('#scroll'); if (nsc) nsc.scrollTop = keep;
  const nsh = $('.sheet'); if (nsh) nsh.scrollTop = keepSheet;
  if (fkey) {
    const [a, i, v] = fkey.split('|');
    const el = [...document.querySelectorAll(a ? `[data-act="${a}"]` : `[data-in="${i}"]`)].find(e => (e.dataset.v || '') === v);
    if (el) { el.focus({preventScroll:true}); if (el.setSelectionRange && el.type === 'text') { const n = el.value.length; el.setSelectionRange(n, n); } }
  }
  lastRoute = S.route; lastSheet = S.sheet;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act], a[href^="#"]');
  if (!el) return;
  const href = el.getAttribute('href');
  if (el.disabled) return;
  let go = null;
  if (el.dataset.act) {
    const fn = ACT[el.dataset.act];
    if (fn) { const res = fn(el.dataset.v, el); if (res === false && !href) return; if (typeof res === 'string') go = res; }
  }
  if (href && href.startsWith('#')) { e.preventDefault(); go = href; }
  if (go && go !== '#' + S.route) { S.sheet = null; location.hash = go; return; }
  render();
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-in]'); if (!el) return;
  if (el.dataset.in === 'pick') { location.hash = '#' + el.value; return; }
  const fn = INPUT[el.dataset.in]; if (fn && fn(el.value, el)) render();
});
document.addEventListener('change', e => { const el = e.target.closest('select[data-in]'); if (el && el.dataset.in !== 'pick') { const fn = INPUT[el.dataset.in]; if (fn && fn(el.value, el)) render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#assess').hidden) { $('#assess').hidden = true; return; } if (S.sheet) { S.sheet = null; render(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true})); }
});
window.addEventListener('hashchange', () => { S.route = location.hash.slice(1) || 'search'; S.sheet = null; render(); const sc = $('#scroll'); if (sc) sc.scrollTop = 0; window.scrollTo(0, 0); });
S.route = location.hash.slice(1) || 'search';
render();
</script>
</body>
</html>
