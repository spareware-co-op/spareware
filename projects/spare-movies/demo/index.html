<!doctype html>
<html lang="en" data-app="movies">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spare Movies demo</title>
<style>
/* copied from design/tokens.css */
/* Spareware design tokens: the one shared look for every Spareware app.
   Read design/DESIGN.md first. An app sets data-app="<name>" on <html> to get its own colour.
   Text is always ink on light colours; white text appears only on Spareware red. */
:root {
  /* Spareware (the co-op) */
  --spare-red: #C8102E;
  --spare-red-hover: #A80D26;
  --spare-red-tint: #FCE9EC;

  /* Neutrals */
  --ink: #1A1A1A;
  --ink-2: #595959;
  --ink-3: #8A8A8A;
  --page: #FAF8F5;
  --panel: #FFFFFF;
  --panel-alt: #F7F6F3;
  --sink: #F1EFEA;
  --hairline: #E5E5E3;
  --rule: #C9C9C9;

  /* States (always paired: strong for borders and icons, tint for backgrounds) */
  --danger: #B91C1C;  --danger-tint: #FDE8E8;
  --success: #15803D; --success-tint: #E3F6E8;
  --info: #1D4ED8;    --info-tint: #E3ECFD;

  /* Type and shape */
  --font-ui: system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --text: 13px;
  --radius: 3px;
  --space: 8px;

  /* The current app's colours (default: Spareware itself) */
  --app: var(--spare-red-tint);
  --app-strong: var(--spare-red);
  --app-tint: var(--spare-red-tint);
}

/* One light colour per app: --app is the fill for its mark, primary buttons and active items
   (ink text on it), --app-strong is for thin borders and icons, --app-tint for quiet backgrounds. */
[data-app="construct"] { --app: #8EC5FF; --app-strong: #1F5FA8; --app-tint: #EAF4FF; }
[data-app="studio"] { --app: #C4B2FF; --app-strong: #5B3FB8; --app-tint: #F3EFFF; }
[data-app="social"] { --app: #FFB27A; --app-strong: #9E4A14; --app-tint: #FFF1E6; }
[data-app="ride"]   { --app: #7FD8CF; --app-strong: #13756B; --app-tint: #E8F8F6; }
[data-app="food"]   { --app: #A9DE8A; --app-strong: #3E7C1F; --app-tint: #EFF9E8; }
[data-app="stay"]   { --app: #80D4F0; --app-strong: #11708F; --app-tint: #E7F7FD; }
[data-app="home"]   { --app: #E8C99A; --app-strong: #8A5A1C; --app-tint: #FBF4EA; }
[data-app="rent"]   { --app: #F2B8E0; --app-strong: #94306F; --app-tint: #FCEEF8; }
[data-app="work"]   { --app: #B8C4D6; --app-strong: #3D4F6B; --app-tint: #EEF1F6; }
[data-app="market"] { --app: #D8E36A; --app-strong: #66700F; --app-tint: #F7F9DF; }
[data-app="office"] { --app: #A9B6FF; --app-strong: #3A47A8; --app-tint: #EEF0FF; }
[data-app="os"]     { --app: #CDD1D6; --app-strong: #4A525C; --app-tint: #F2F3F5; }
[data-app="music"]  { --app: #EB8EEB; --app-strong: #B82EB8; --app-tint: #FBE9FB; }
[data-app="movies"] { --app: #EB8E8E; --app-strong: #B82E2E; --app-tint: #FBE9E9; }
[data-app="research"] { --app: #C2DBB3; --app-strong: #458321; --app-tint: #F0FBE9; }
</style>
<style>
/* Spare Movies demo styles. Only the tokens above set colour, type, corners and spacing. */
:root { --s1: var(--space); --s2: calc(var(--space) * 2); --s3: calc(var(--space) * 3); --half: calc(var(--space) / 2); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--font-ui); font-size: var(--text); line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, select, textarea { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 6px 8px; min-height: 32px; width: 100%; }
input[type="checkbox"], input[type="radio"] { width: auto; min-height: 0; accent-color: var(--app-strong); }
input[type="range"] { padding: 0; border: 0; min-height: 0; accent-color: var(--app-strong); background: none; }
a { color: var(--ink); text-decoration-color: var(--app-strong); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--app-strong); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; font-weight: 700; }
h1 { font-size: 18px; }
h2 { font-size: 15px; }
h3 { font-size: 13px; }
p { margin: 0; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--ink-2); }
.small { font-size: 12px; }
.grow { flex: 1; min-width: 0; }
.mt { margin-top: var(--s1); }
.mt2 { margin-top: var(--s2); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; margin: 0 0 var(--s1); }
.mark { display: inline-block; width: 14px; height: 14px; background: var(--app); border: 1px solid var(--app-strong); border-radius: var(--radius); flex: none; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: middle; }
.ic.sm { width: 14px; height: 14px; }
.ic.app { color: var(--app-strong); }
.ic.ok { color: var(--success); }
.ic.dan { color: var(--danger); }
.ic.inf { color: var(--info); }

/* Demo chrome */
.demohead { min-height: 48px; display: flex; align-items: center; flex-wrap: wrap; gap: var(--s1); padding: 6px var(--s2); background: var(--panel); border-bottom: 1px solid var(--hairline); position: sticky; top: 0; z-index: 50; }
.demohead .sep { color: var(--ink-3); }
.demohead select { width: auto; min-height: 30px; padding: 3px 6px; }
.demohead .ctry { display: inline-flex; align-items: center; gap: 6px; }
.demohead .ctry label { margin: 0; }
.screens-btn { display: none !important; }
.stage { display: grid; grid-template-columns: 220px minmax(0, 1fr) 270px; gap: var(--s2); padding: var(--s2); max-width: 1500px; margin: 0 auto; align-items: start; }
.nav, .about { background: var(--panel); border: 1px solid var(--hairline); border-radius: var(--radius); position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow-y: auto; }
.nav { padding: var(--s2) 0; }
.nav .label { padding: 0 var(--s2); margin-top: var(--s2); }
.nav .label:first-child { margin-top: 0; }
.nav a { display: flex; gap: var(--s1); align-items: baseline; padding: 6px var(--s2); text-decoration: none; color: var(--ink); border-left: 3px solid transparent; }
.nav a .num { font-family: var(--font-mono); color: var(--ink-2); font-size: 11px; width: 18px; flex: none; }
.nav a:hover { background: var(--panel-alt); }
.nav a[aria-current="page"] { background: var(--app-tint); border-left-color: var(--app); font-weight: 600; }
.nav .navfoot { margin: var(--s2) var(--s2) 0; padding-top: var(--s2); border-top: 1px solid var(--hairline); font-size: 12px; color: var(--ink-2); }
.about { padding: var(--s2); }
.about h3 { margin: 0 0 var(--half); }
.about p { margin: 0 0 var(--s2); color: var(--ink-2); }
.about ul { margin: 0 0 var(--s2); padding: 0; list-style: none; }
.about li { padding: 5px 0; border-bottom: 1px solid var(--hairline); }
.about li .mono { font-size: 11px; color: var(--app-strong); display: block; }
.about .try li { padding-left: var(--s2); position: relative; }
.about .try li::before { content: ""; position: absolute; left: 0; top: 11px; width: 6px; height: 6px; background: var(--app); border: 1px solid var(--app-strong); }

/* The app frame */
.app { background: var(--panel); border: 1px solid var(--ink); border-radius: var(--radius); min-width: 0; position: relative; }
.apphead { display: flex; align-items: center; gap: var(--s1); padding: 8px var(--s2); border-bottom: 1px solid var(--hairline); }
.apphead b { white-space: nowrap; }
.apphead .crumb { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.apphead .crumb::before { content: "/"; color: var(--ink-3); margin-right: var(--s1); }
.who { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); padding: 3px 8px 3px 4px; min-height: 32px; white-space: nowrap; }
.who .av { width: 14px; height: 14px; }
.avatar { width: 32px; height: 32px; display: inline-grid; place-items: center; flex: none; background: var(--sink); border: 1px solid var(--rule); border-radius: var(--radius); font-weight: 700; font-size: 11px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s1); }
.apptabs { display: flex; border-bottom: 1px solid var(--hairline); overflow-x: auto; scrollbar-width: none; }
.apptabs button { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border: 0; background: none; color: var(--ink-2); font-weight: 600; }
.apptabs button[aria-current="page"] { background: var(--app); color: var(--ink); }
.view { min-height: 560px; }
.appfoot { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 10px var(--s2); border-top: 1px solid var(--hairline); font-size: 12px; color: var(--ink-2); background: var(--panel-alt); }
.appfoot button { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 2px; font-size: 12px; }

/* Buttons, badges, fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--ink); background: var(--panel); color: var(--ink); font-weight: 600; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--panel-alt); }
.btn.primary { background: var(--app); border-color: var(--app); }
.btn.primary:hover { border-color: var(--app-strong); }
.btn.quiet { border-color: var(--rule); color: var(--ink-2); font-weight: 500; }
.btn.small { min-height: 28px; padding: 0 9px; font-size: 12px; }
.btn.on { background: var(--app-tint); border-color: var(--app-strong); }
.btn.dan { border-color: var(--danger); color: var(--danger); }
.btn:disabled { opacity: .55; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: var(--s1); }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--app-strong); text-underline-offset: 2px; font-weight: 600; }
.iconbtn { width: 34px; height: 34px; display: inline-grid; place-items: center; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); color: var(--ink); padding: 0; flex: none; }
.iconbtn:hover { background: var(--panel-alt); }
.badge { display: inline-flex; align-items: center; gap: 4px; min-height: 20px; padding: 0 8px; border-radius: 999px; background: var(--app-tint); color: var(--app-strong); font-size: 11px; font-weight: 600; white-space: nowrap; vertical-align: middle; }
.badge .ic { width: 12px; height: 12px; }
.badge.n { background: var(--sink); color: var(--ink-2); }
.badge.inf { background: var(--info-tint); color: var(--info); box-shadow: inset 0 0 0 1px var(--info); }
.badge.ok { background: var(--success-tint); color: var(--success); box-shadow: inset 0 0 0 1px var(--success); }
.badge.dan { background: var(--danger-tint); color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.rating { display: inline-flex; align-items: center; min-height: 22px; padding: 0 7px; border: 1px solid var(--ink); border-radius: var(--radius); background: var(--panel); font-weight: 700; font-size: 12px; font-family: var(--font-mono); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 28px; padding: 0 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); color: var(--ink); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.chip[aria-pressed="true"] { background: var(--app); border-color: var(--app-strong); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.seg button { border: 0; border-left: 1px solid var(--rule); background: var(--panel); padding: 5px 12px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--app); color: var(--ink); font-weight: 700; }
.sw { position: relative; width: 38px; height: 22px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sink); padding: 0; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 1px solid var(--ink-2); transition: left .15s; }
.sw[aria-checked="true"] { background: var(--app); border-color: var(--app-strong); }
.sw[aria-checked="true"]::after { left: 19px; border-color: var(--app-strong); }
.subtabs { display: flex; border-bottom: 1px solid var(--hairline); overflow-x: auto; scrollbar-width: none; background: var(--panel-alt); }
.subtabs button { flex: none; padding: 8px 12px; border: 0; background: none; color: var(--ink-2); font-weight: 600; font-size: 12px; }
.subtabs button[aria-current="page"] { background: var(--app-tint); color: var(--ink); box-shadow: inset 0 -3px 0 var(--app); }
.note { background: var(--app-tint); border-left: 3px solid var(--app); padding: 8px 10px; border-radius: 0 var(--radius) var(--radius) 0; }
.note.inf { background: var(--info-tint); border-left-color: var(--info); }
.note.ok { background: var(--success-tint); border-left-color: var(--success); }
.note.dan { background: var(--danger-tint); border-left-color: var(--danger); }
.note.n { background: var(--panel-alt); border-left-color: var(--rule); }
.field { display: block; }
.field > span:first-child { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.field + .field { margin-top: 10px; }
.hint { display: block; font-size: 12px; margin-top: 4px; color: var(--ink-2); }
.check { display: flex; gap: var(--s1); align-items: flex-start; }
.check input { margin-top: 3px; }
.bar { height: 6px; background: var(--sink); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--app); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 12px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; }

/* Blocks */
.pad { padding: var(--s2); }
.sect { padding: 14px var(--s2); border-bottom: 1px solid var(--hairline); }
.sect.alt { background: var(--panel-alt); }
.sect > * + * { margin-top: var(--s1); }
.sect > .label + * { margin-top: 0; }
.sect-title { display: flex; align-items: center; gap: var(--s1); flex-wrap: wrap; }
.sect-title h2 { flex: 1; min-width: 160px; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 0; border: 0; border-bottom: 1px solid var(--hairline); background: none; text-align: left; color: var(--ink); text-decoration: none; }
.row:last-child { border-bottom: 0; }
.row .sub, .grow > .sub { display: block; font-size: 12px; color: var(--ink-2); font-weight: 400; }
button.row:hover { background: var(--panel-alt); }
.row.sel { background: var(--app-tint); box-shadow: inset 3px 0 0 var(--app); padding-left: 10px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s2); }
.card { border: 1px solid var(--hairline); border-radius: var(--radius); padding: 10px 12px; background: var(--panel); }
.card.sel { background: var(--app-tint); border-color: var(--app-strong); }
.card.dim { background: var(--panel-alt); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; }
.stat { background: var(--panel); padding: 8px 10px; min-width: 0; }
.stat b { display: block; font-family: var(--font-mono); font-size: 16px; }
.stat span { font-size: 11px; color: var(--ink-2); }
.chart { display: flex; align-items: flex-end; gap: 3px; height: 90px; border-bottom: 1px solid var(--rule); }
.chart i { flex: 1; background: var(--app); border: 1px solid var(--app-strong); border-bottom: 0; border-radius: 2px 2px 0 0; min-height: 2px; }
.chart-x { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--ink-2); margin-top: 3px; }
.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.tbl td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--hairline); vertical-align: top; }
.tbl .n { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
.tbl tr.total td { font-weight: 700; border-bottom: 0; border-top: 1px solid var(--rule); }
.tbl tr.sub td { color: var(--ink-2); }
.votebar { display: grid; grid-template-columns: 90px 1fr 44px; gap: var(--s1); align-items: center; font-size: 12px; }
.votebar + .votebar { margin-top: 4px; }
.votebar output { font-family: var(--font-mono); text-align: right; }
.stepper { list-style: none; margin: 0; padding: 0; }
.stepper li { position: relative; padding: 0 0 12px 24px; }
.stepper li::before { content: ""; position: absolute; left: 2px; top: 3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--rule); background: var(--panel); }
.stepper li::after { content: ""; position: absolute; left: 8px; top: 17px; bottom: 1px; width: 2px; background: var(--hairline); }
.stepper li:last-child { padding-bottom: 0; }
.stepper li:last-child::after { display: none; }
.stepper li.done::before { background: var(--app); border-color: var(--app-strong); }
.stepper li.now::before { border-color: var(--app-strong); box-shadow: 0 0 0 3px var(--app-tint); }
.stepper li.todo { color: var(--ink-2); }
.stepper .sub { display: block; font-size: 12px; color: var(--ink-2); }
.code { font-family: var(--font-mono); font-size: 11px; background: var(--panel-alt); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Poster scenes: plain shapes in token colours */
.k-sky { fill: var(--info-tint); }
.k-dawn { fill: var(--app-tint); }
.k-paper { fill: var(--panel-alt); }
.k-sun, .k-app, .k-ember { fill: var(--app); }
.k-kite { stroke: var(--app-strong); stroke-width: 1.5; }
.k-red { fill: var(--app-strong); }
.k-sea { fill: color-mix(in srgb, var(--info) 28%, var(--panel)); }
.k-sea2 { fill: color-mix(in srgb, var(--info) 46%, var(--panel)); }
.k-night { fill: color-mix(in srgb, var(--info) 45%, var(--ink-3)); }
.k-hill { fill: color-mix(in srgb, var(--success) 38%, var(--panel)); }
.k-hill2 { fill: color-mix(in srgb, var(--success) 60%, var(--panel)); }
.k-sand { fill: color-mix(in srgb, var(--app) 30%, var(--panel)); }
.k-rock { fill: var(--rule); }
.k-rock2 { fill: var(--ink-3); }
.k-white { fill: var(--panel); }
.k-ink { fill: var(--ink-2); }
.k-ai { fill: color-mix(in srgb, var(--info) 14%, var(--app-tint)); }
.k-glass { fill: color-mix(in srgb, var(--info) 16%, var(--panel)); stroke: var(--info); stroke-width: 1.5; }
.k-shelf { fill: color-mix(in srgb, var(--app-strong) 40%, var(--rule)); }
.k-line { fill: none; stroke: var(--panel); stroke-width: 3; stroke-linecap: round; }
.k-thin { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-linecap: round; }
.k-string { fill: none; stroke: var(--ink-2); stroke-width: 1.2; }
.k-bird { fill: none; stroke: var(--ink-2); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.k-dash { fill: none; stroke: var(--info); stroke-width: 2; stroke-dasharray: 6 5; }
.k-edge { stroke: var(--rule); stroke-width: 1.5; }

/* Posters and film tiles */
.scene { display: block; width: 100%; height: 100%; }
.poster { position: relative; aspect-ratio: 2 / 3; border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; background: var(--sink); }
.poster .scene { position: absolute; inset: 0; }
.poster .pbadge { position: absolute; left: 4px; top: 4px; display: flex; flex-wrap: wrap; gap: 3px; }
.poster .pbadge span { background: var(--panel); border: 1px solid var(--ink); border-radius: var(--radius); font-size: 10px; font-weight: 700; padding: 0 4px; }
.poster .pbadge span.ai { background: var(--info-tint); border-color: var(--info); color: var(--ink); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px var(--s2); }
.tile { display: flex; flex-direction: column; align-self: start; border: 0; background: none; padding: 0; text-align: left; color: var(--ink); min-width: 0; }
.tile b { display: block; margin-top: 6px; font-size: 13px; line-height: 1.25; }
.tile .sub { display: block; font-size: 11px; color: var(--ink-2); margin-top: 2px; }
.tile .prog { height: 4px; background: var(--sink); margin-top: 4px; border-radius: 2px; overflow: hidden; }
.tile .prog span { display: block; height: 100%; background: var(--app-strong); }
.tile:hover b { text-decoration: underline; text-decoration-color: var(--app-strong); }
.locked .poster .scene { filter: blur(6px); }

  h += '<div class="chips mt">' + [['cc', 'Captions'], ['ad', 'Audio description'], ['free', 'Free']].map(([k, l]) => '<button class="chip" data-act="sfilt" data-v="' + k + '" ' + pressed(!!S.sfilt[k]) + '>' + l + '</button>').join('') + '<span class="small muted" style="align-self:center">Section: ' + { both: 'Both', human: 'Human', ai: 'AI' }[S.sec] + '</span></div></div><div id="results">' + searchResults() + '</div>';
  return h;
}
function searchResults() {
  const q = S.q.trim();
  if (!q) return '<p class="pad muted">Type a title, a person, a genre, or a line someone says in a film. Try <button class="link" data-act="try" data-v="fold it smaller">fold it smaller</button>, <button class="link" data-act="try" data-v="quilfeather">quilfeather</button> or <button class="link" data-act="try" data-v="choir">choir</button>.</p>';
  const fil = f => inSec(f) && (!S.sfilt.cc || f.cc.length) && (!S.sfilt.ad || f.ad) && (!S.sfilt.free || f.ways.includes('free'));
  const films = FILMS.filter(f => fil(f) && fuzzy([f.t, f.kind, f.by, f.dir, f.syn].join(' '), q));
  const people = [];
  FILMS.forEach(f => [...f.cast.map(c => c[0]), ...f.crew.map(c => c[1])].forEach(n => { if (fuzzy(n, q) && !people.find(p => p[0] === n)) people.push([n, f]); }));
  const lines = norm(q).length > 5 ? CAPLINES.filter(l => norm(l.en).includes(norm(q))) : [];
  let h = '';
  if (lines.length) h += '<div class="sect"><div class="label">Said in a film</div>' + lines.map(l => '<button class="row" data-act="jump" data-t="' + l.t + '"><i data-i="cc" class="app"></i><span class="grow"><b>"' + esc(l.en) + '"</b><span class="sub">Tin Kite at ' + clock(l.t) + ', from its English captions</span></span><i data-i="play"></i></button>').join('') + '</div>';
  if (films.length) h += '<div class="sect"><div class="label">Films and series</div>' + films.map(f => {
    const ok = available(f);
    return '<button class="row" data-film="' + f.id + '"><span style="width:44px;flex:none"><span class="poster" style="display:block">' + scene(f.scene) + '</span></span><span class="grow"><b>' + esc(f.t) + '</b><span class="sub">' + f.kind + ' · ' + f.year + ' · ' + esc(f.by) + '</span>' + (ok ? '' : '<span class="sub" style="color:var(--danger)">Not available in ' + CY.in + ': the filmmaker does not hold the rights here. Follow to be told if that changes.</span>') + '</span><span class="rating">' + rating(f) + '</span></button>';
  }).join('') + '</div>';
  if (people.length) h += '<div class="sect"><div class="label">People</div>' + people.map(([n, f]) => '<button class="row" data-film="' + f.id + '"><span class="avatar">' + n.split(' ').map(x => x[0]).join('').slice(0, 2) + '</span><span class="grow"><b>' + esc(n) + '</b><span class="sub">' + esc(f.t) + '</span></span></button>').join('') + '</div>';
  if (!h) h = '<p class="pad muted">No match for "' + esc(q) + '". Check the section switch: it is set to ' + { both: 'Both', human: 'Human', ai: 'AI' }[S.sec] + '.</p>';
  return h;
}

const PLAYABLE = { tinkite: { len: 6120, start: 2472, label: 'Tin Kite' }, night: { len: 2640, start: 2580, label: 'Night Shift at Hollow Bay, episode 3' }, swim: { len: 4680, start: 300, label: 'Weather for Swimming' } };
function capLine() {
  const i = Math.floor(Math.max(0, S.p.t - 2472) / 4) % CAPLINES.length;
  const l = CAPLINES[i];
  if (S.p.film === 'swim') return { txt: S.p.cc === 'Off' ? '' : ['The water was eight degrees this morning.', 'We go in whatever the forecast says.', '[Waves break on the shingle]'][Math.floor(S.p.t / 4) % 3], ad: 'Two swimmers in red and coral caps wade out past the breakers.' };
  if (S.p.film === 'night') return { txt: S.p.cc === 'Off' ? '' : ['Who signed him in tonight?', '[Monitor beeps steadily]', 'Same scar. Different name.'][Math.floor(S.p.t / 4) % 3], ad: 'Nurse Tolley holds two admission forms side by side.' };
  if (S.p.film !== 'tinkite') return { txt: S.p.cc === 'Off' ? '' : 'Captions show here in time with the film.', ad: 'Descriptions of what is on screen are read in the gaps in the dialogue.' };
  const txt = S.p.cc === 'Off' ? '' : S.p.cc === 'Spanish' ? (S.p.audio === 1 ? '' : l.es) : S.p.cc.indexOf('Deaf') > -1 ? l.sdh : l.en;
  return { txt, ad: l.ad };
}

  return h;

function updatePlayer() {
  const P = PLAYABLE[S.p.film]; if (!P || S.screen !== 'player') return;
  const t = $('#ptime'), sk = $('#pseek'), cap = $('#cap'), ad = $('#adline span');
  if (t) t.textContent = clock(S.p.t) + ' / ' + clock(P.len);
  if (sk) sk.value = Math.round(S.p.t);
  const c = capLine();
  if (cap) { cap.hidden = !c.txt; cap.textContent = c.txt; }
  if (ad) ad.textContent = c.ad;
}

  if (['publish', 'rights', 'earnings', 'protection'].includes(S.screen)) { $('#who').innerHTML = '<span class="mark av"></span>Lantern Yard Films'; return; }
  $('#who').innerHTML = S.guest ? '<span class="mark av"></span>Guest' : '<span class="mark av"></span>' + P.name + (P.adult ? '' : ' <span class="badge n">up to ' + CY.ratings[P.limit] + '</span>');
}
function show(id, keepScroll) {
  if (!RENDER[id]) id = 'browse';
  S.screen = id;
  const s = SCREENS.find(x => x.id === id);
  $('#crumb').textContent = id === 'film' || id === 'pay' ? FILM(S.film).t : s.crumb;
  $('#view').innerHTML = RENDER[id]();
  $$('#nav a').forEach(a => a.dataset.id === id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  renderTabs();
  renderAbout(s);
  paint(document.body);
  $('#nav').classList.remove('open');
  if (!keepScroll) { const app = $('#app'); if (app.getBoundingClientRect().top < 0) app.scrollIntoView(); }
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
}
const rerender = () => show(S.screen, true);
function renderAssess() {
  const shown = new Set(); SCREENS.forEach(s => s.f.forEach(id => shown.add(id)));
  const core = Object.keys(DATA.feats).filter(id => DATA.feats[id][1] === 'core');
  const missing = core.filter(id => !shown.has(id));
  let h = '<p>A clickable demo with sample data, for judging the design and how much of the map it covers. It is not the real app, and no money moves. <a href="https://github.com/spareware-co-op/spareware/blob/main/projects/spare-movies/FEATURES.md" target="_blank" rel="noopener">Feature map: FEATURES.md</a></p>';
  h += '<p class="small muted">Spare Movies is for every country. Money, tax, age ratings, rating bodies and rights rules follow the example country at the top (now ' + CY.name + '); each country gets its own rules pack. All films, filmmakers and numbers are made up.</p>';
  h += '<div class="label">Questions to assess (from the feature map)</div><ol>' + DATA.assess.map(q => '<li>' + esc(q) + '</li>').join('') + '</ol>';
  h += '<div class="label">Core features shown, by area</div><table class="cov">' + DATA.areas.map(a => { const c = core.filter(id => id.startsWith(a[0] + '-')); const n = c.filter(id => shown.has(id)).length; return '<tr><td class="id">MOV-' + a[0] + '</td><td>' + a[1] + '</td><td class="mono">' + (c.length ? n + ' of ' + c.length : 'no core features') + '</td></tr>'; }).join('') + '</table>';
  h += '<p class="small">' + (missing.length ? 'Core features not shown yet: ' + missing.map(id => 'MOV-' + id + ' ' + fname(id)).join('; ') + '.' : 'All ' + core.length + ' core features appear on at least one screen. The viewer pass (MOV-A7) has no core features; it is shown as a next feature.') + '</p>';
  h += '<div class="label mt2">What each screen shows</div>' + SCREENS.map((s, i) => '<div class="scrcov"><a href="#' + s.id + '" data-act="assessclose">' + (i + 1) + '. ' + s.t + '</a> <span class="badge n">' + GROUPS[s.g] + '</span><ul>' + s.f.map(id => '<li><span class="mono">MOV-' + id + '</span>' + fname(id) + '</li>').join('') + s.x.map(id => '<li><span class="mono">MOV-' + id + '</span>' + fname(id) + ' <span class="badge n">' + fpri(id) + '</span></li>').join('') + '</ul></div>').join('');
  $('#assessBody').innerHTML = h;
}

/* ---------- Sheets and toasts ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 4200); }
function sheet(title, body) { $('#sheetTitle').textContent = title; $('#sheetBody').innerHTML = body; paint($('#sheetBody')); $('#sheet').hidden = false; $('#scrim').hidden = false; const b = $('#sheet button, #sheet input, #sheet select'); if (b) b.focus(); }
function closeSheet() { $('#sheet').hidden = true; $('#scrim').hidden = true; }

/* ---------- Actions ---------- */
let upTimer = null;
function tickUpload() {
  if (!S.up.run) return;
  S.up.pct = Math.min(100, S.up.pct + 7);
  if (S.up.pct >= 100) { S.up.run = false; toast('Upload finished. Quality checks done; every size is being made from the master.'); }
  if (S.screen === 'publish') rerender();
}
const ACT = {
  drawer() { $('#nav').classList.toggle('open'); },
  sec(el) { S.sec = el.dataset.v; rerender(); },
  filter(el) { S.filters[el.dataset.v] = !S.filters[el.dataset.v]; rerender(); },
  guest() { S.guest = !S.guest; rerender(); toast(S.guest ? 'Guest: free films and trailers play with no account.' : 'Signed in as ' + prof().name + '.'); },
  join() { sheet('Join Spare Movies', '<p class="small">One Spareware login for every Spareware app. Free to join; no member shares.</p><label class="field"><span>Display name</span><input value="Robin"></label><label class="field"><span>Country</span><input value="' + CY.name + '" readonly></label><label class="field"><span>Date of birth</span><input value="1990-04-12"><span class="hint">Only your age band is kept, never this date.</span></label><label class="check small"><input type="checkbox" checked> I have read the rules in plain words</label><button class="btn primary" data-act="joined">Create a passkey (sample)</button>'); },
  joined() { S.guest = false; closeSheet(); rerender(); toast('Welcome, Robin. Your list from this device came with you.'); },
  list(el) { const id = el.dataset.id; S.list[id] = !S.list[id]; rerender(); toast(S.list[id] ? 'Added to your list.' : 'Removed from your list.'); },
  follow(el) { const v = el.dataset.v; S.follows[v] = !S.follows[v]; rerender(); toast(S.follows[v] ? 'Following ' + v + '. You will be told when they release a film in ' + CY.in + '.' : 'Unfollowed ' + v + '.'); },
  share() { toast('Link copied: a short link that opens in the app or the browser. Nothing tracks who clicks it.'); },
  trailer() { S.p.trailer = !S.p.trailer; rerender(); },
  watch(el) { const id = el.dataset.id, f = FILM(id); if (!PLAYABLE[id]) PLAYABLE[id] = { len: f.min * 60, start: 0, label: f.t }; S.p.film = id; S.p.t = PLAYABLE[id].start; S.p.cc = f.cc[0]; S.p.audio = 0; S.p.ad = false; S.p.playing = true; show('player'); },
  payway(el) { S.pay.way = el.dataset.v; S.pay.done = null; if (S.screen !== 'pay') show('pay'); else rerender(); },
  cover(el) { S.pay.cover = el.checked; rerender(); },
  paynow() {
    if (S.guest) { ACT.join(); return; }
    const amt = $('#amt'); if (amt) S.pay.amount = Math.max(0, Number(amt.value) || 0);
    const f = FILM(S.film); const b = breakdown(f, S.pay.way);
    if (S.pay.way === 'rent' || S.pay.way === 'buy' || S.pay.way === 'pwyl') S.owned[f.id] = S.pay.way === 'buy' ? 'buy' : 'rent';
    S.pay.done = b; rerender(); toast('Paid (sample). ' + f.by + ' gets ' + money(b.maker) + '.');
  },
  unlock() { const v = ($('#pin') || {}).value || ''; if (/^\d{4}$/.test(v)) { S.pay.unlocked = true; rerender(); toast('Unlocked for this one payment.'); } else toast('Enter four digits (sample).'); },
  play() { S.p.playing = !S.p.playing; rerender(); },
  seek(el) { S.p.t = Math.max(0, Math.min(PLAYABLE[S.p.film].len, S.p.t + Number(el.dataset.v))); updatePlayer(); },
  cc() { S.p.cc = S.p.cc === 'Off' ? FILM(S.p.film).cc[0] : 'Off'; rerender(); },
  ad() { if (!FILM(S.p.film).ad) { toast('This film has no audio description yet.'); return; } S.p.ad = !S.p.ad; rerender(); toast(S.p.ad ? 'Audio description on: ' + FILM(S.p.film).ad + '.' : 'Audio description off.'); },
  capLg() { S.p.capLg = !S.p.capLg; rerender(); },
  capTint() { S.p.capTint = !S.p.capTint; rerender(); },
  autoplay() { S.p.autoplay = !S.p.autoplay; rerender(); },
  jump(el) { S.p.film = 'tinkite'; S.p.t = Number(el.dataset.t); S.p.cc = 'English'; S.p.playing = false; show('player'); toast('Jumped to ' + clock(S.p.t) + ' in Tin Kite, where the line is said.'); },
  preport() { const f = FILM(S.p.film); sheet('Report a playback problem', '<div class="chips"><button class="chip" aria-pressed="true">Stalls or stops</button><button class="chip" aria-pressed="false">Captions wrong</button><button class="chip" aria-pressed="false">Sound out of step</button><button class="chip" aria-pressed="false">Audio description</button></div><div class="code">Film: ' + esc(f.t) + '\nMoment: ' + clock(S.p.t) + '\nDevice: browser on this computer\nStream: ' + (S.p.q === 'auto' ? 'auto, 1080p' : S.p.q) + ', AV1, delivered from ' + CY.region + '</div><p class="small muted">These details are filled in for you. If a rental could not play, it is refunded automatically.</p><button class="btn primary" data-act="preportsend">Send report</button>'); },
  preportsend() { closeSheet(); toast('Report sent to support with the details. You will hear back here.'); },
  report(el) { const f = FILM(el.dataset.id); sheet('Report ' + f.t, '<p class="small">What is wrong? Lawful films are never removed for being unpopular; only what the law requires comes down.</p>' + ['Illegal material', 'Copyright: this is my film', 'Wrong section (Human or AI)', 'Wrong age rating or missing advice', 'Privacy', 'Pretending to be someone'].map((r, i) => '<label class="check small"><input type="radio" name="rr" ' + (i === 2 ? 'checked' : '') + '> ' + r + '</label>').join('') + '<button class="btn primary" data-act="reportsend" data-v="' + esc(f.t) + '">Send report</button><p class="small muted">Reports can be made without an account. The result goes in the public log.</p>'); },
  reportsend(el) { S.flags.push('Report about ' + el.dataset.v); closeSheet(); toast('Report sent. A moderator elected by filmmakers will look at it.'); },
  wrongsec(el) { const f = FILM(el.dataset.id); S.flags.push(f.t + ': flagged as possibly in the wrong section'); toast('Flag sent for ' + f.t + '. If it moves, the reason goes in the public log, and the filmmaker can appeal.'); },
  profile(el) { S.profile = el.dataset.v; S.pay.unlocked = false; S.guest = false; rerender(); toast('Now watching as ' + prof().name + '.'); },
  agecheck() { sheet('Age check', '<p class="small">An accredited age check provider confirms only whether you are over 18. Spare Movies never sees your documents or your birth date.</p><button class="btn primary" data-act="agedone">Check with the provider (sample)</button>'); },
  agedone() { S.ageChecked = true; closeSheet(); rerender(); toast('Over 18: confirmed. Only that answer was kept.'); },
  history() { S.history = !S.history; rerender(); },
  histdel(el) { S.histItems = S.histItems.filter(x => x !== el.dataset.id); rerender(); },
  histclear() { S.histItems = []; rerender(); toast('History cleared.'); },
  notif(el) { S.notif[el.dataset.v] = !S.notif[el.dataset.v]; rerender(); },
  large() { S.large = !S.large; document.body.classList.toggle('large', S.large); rerender(); },
  contrast() { S.contrast = !S.contrast; document.body.classList.toggle('contrast', S.contrast); rerender(); },
  devout(el) { const d = S.devices[Number(el.dataset.i)]; S.devices.splice(Number(el.dataset.i), 1); rerender(); toast('Signed out: ' + d + '.'); },
  aitrain() { S.aiTrain = !S.aiTrain; rerender(); },
  agent() { S.aiAgent = !S.aiAgent; rerender(); },
  passway(el) { S.passWay = el.dataset.v; rerender(); },
  upkind(el) { S.up.kind = el.dataset.v; rerender(); if (S.up.kind === 'episode') toast('Series episode: it joins a season, with its own release date.'); },
  upstart() { S.up.run = true; S.up.paused = false; rerender(); },
  updrop() { S.up.run = false; S.up.paused = true; rerender(); toast('Connection dropped. The upload will carry on from ' + S.up.pct + '%, not from the start.'); },
  upai(el) { S.up.ai = el.dataset.v; rerender(); },
  capdraft() { S.up.capDraft = 1; rerender(); },
  capfix() { S.up.capDraft = 2; rerender(); toast('Captions checked and saved.'); },
  upad() { S.up.ad = 'text'; rerender(); },
  rate() { sheet('Rating questions', '<p class="small">Plain questions, answered once. Each country\'s rules pack turns them into its own rating, or tells you where an official rating is needed.</p>' + [['Violence', 'Brief, not detailed'], ['Language', 'Some strong words'], ['Sex and nudity', 'None'], ['Drug use', 'None'], ['Themes', 'Grief']].map(([q, a]) => '<label class="field"><span>' + q + '</span><select><option>' + a + '</option><option>None</option><option>Strong</option></select></label>').join('') + '<button class="btn primary" data-act="rated">Work out the ratings</button>'); },
  rated() { S.up.rated = true; closeSheet(); rerender(); toast('Ratings worked out for each example country.'); },
  publish() { S.up.published = true; rerender(); toast('Published. It releases on its date in each country; a fingerprint was made.'); },
  rightc(el) { if (el.dataset.v === 'DE') { S.rights.DE = el.checked; rerender(); } else toast('Rights updated and logged (sample).'); },
  match(el) { S.match = el.dataset.v; rerender(); },
  logf(el) { S.logFilter = el.dataset.v; rerender(); },
  appeal() { S.appealStep = S.appealStep ? 0 : 1; rerender(); },
  vote(el) { S.vote = el.dataset.v; rerender(); toast('Vote recorded. You can change it until the vote closes.'); },
  rules() { sheet('Rules in plain words', '<ol class="small" style="padding-left:18px;margin:0"><li>Spare Movies removes only what the law requires, in the country where the law requires it.</li><li>Every film says how AI was used. AI films go in the AI section.</li><li>Upload only films you hold the rights to, in the countries you choose.</li><li>Ratings follow each country\'s rules. Never invent an official rating.</li><li>No adverts, no tracking, no selling data.</li><li>Filmmakers keep everything except running costs.</li></ol><p class="small muted">Sample wording. The full terms follow the co-op\'s legal set-up.</p>'); },
  a11y() { sheet('Accessibility statement', '<p class="small">Every screen works with a screen reader, a keyboard and a TV remote. Every film has captions in its main language; many have audio description. Known gaps: sign language versions come later. Report a barrier and a person will answer.</p><button class="btn primary" data-act="closesheet">Close</button>'); },
  toast(el) { toast(el.dataset.msg); },
  try(el) { S.q = el.dataset.v; rerender(); const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } },
  sfilt(el) { S.sfilt[el.dataset.v] = !S.sfilt[el.dataset.v]; rerender(); },
  assess() { renderAssess(); $('#assess').hidden = false; $('#assessScrim').hidden = false; $('#assess .iconbtn').focus(); },
  assessclose() { $('#assess').hidden = true; $('#assessScrim').hidden = true; },
  closesheet() { closeSheet(); }
};
document.addEventListener('click', e => {
  const film = e.target.closest('[data-film]');
  if (film) { S.film = film.dataset.film; S.p.trailer = false; S.pay.done = null; closeSheet(); show('film'); return; }
  const go = e.target.closest('[data-go]');
  if (go) { closeSheet(); show(go.dataset.go); if (go.dataset.anchor) { const a = document.getElementById(go.dataset.anchor); if (a) a.scrollIntoView(); } return; }
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) { if (a.tagName === 'A') e.preventDefault(); ACT[a.dataset.act](a); }
  const nav = e.target.closest('#nav a');
  if (nav) { e.preventDefault(); show(nav.dataset.id); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; $('#results').innerHTML = searchResults(); paint($('#results')); }
  if (e.target.id === 'pseek') { S.p.t = Number(e.target.value); updatePlayer(); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset.input;
  if (e.target.id === 'amt') { S.pay.amount = Math.max(0, Number(e.target.value) || 0); rerender(); return; }
  if (e.target.id === 'ctry') { CY = COUNTRIES[e.target.value]; rerender(); toast('Example country: ' + CY.name + '. Money, tax, age ratings and rights rules now follow its rules pack.'); return; }
  if (!k) return;
  if (k === 'pfilm') { S.p.film = e.target.value; S.p.t = PLAYABLE[S.p.film].start; S.p.cc = FILM(S.p.film).cc[0]; S.p.audio = 0; S.p.ad = false; rerender(); }
  if (k === 'pcc') { S.p.cc = e.target.value; rerender(); }
  if (k === 'paudio') { S.p.audio = Number(e.target.value); rerender(); if (FILM(S.p.film).audio[S.p.audio].indexOf('AI') > -1) toast('This track was dubbed with AI voices, and it says so.'); }
  if (k === 'pq') { S.p.q = e.target.value; rerender(); }
  if (k === 'pad') { if (e.target.value === '1') ACT.ad(); else { S.p.ad = false; rerender(); } }
  if (k === 'lang') toast('Language changed for the demo text that is translated; the rest stays in English.');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); ACT.assessclose(); $('#nav').classList.remove('open'); } });
setInterval(() => {
  if (S.screen === 'player' && S.p.playing) { S.p.t = Math.min(PLAYABLE[S.p.film].len, S.p.t + 0.25 * S.p.speed); updatePlayer(); }
}, 250);
setInterval(tickUpload, 400);
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (RENDER[id] && id !== S.screen) show(id); });

/* ---------- Start ---------- */
Object.keys(COUNTRIES).forEach(k => { COUNTRIES[k].key = k; });
$('#ctry').innerHTML = Object.keys(COUNTRIES).map(k => '<option value="' + k + '">' + COUNTRIES[k].name + '</option>').join('');
renderNav();
show(location.hash.slice(1) || 'browse', true);
</script>
