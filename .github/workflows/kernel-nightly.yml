name: Kernel nightly

# The geometry kernel's nightly checks (chapter 28.17 of the kernel architecture, "Nightly"):
# what pull requests run with fixed seeds, run again every night with fresh ones. Piece G34 starts
# it with the exact predicates (28.6): geom-num's predicate verification suite
# (tests/verification.rs) and the predicates' attack tests (tests/attack_g28.rs, attack_g29.rs and
# attack_g30.rs), with SPAREKIT_SEED set to the run's number in hexadecimal and printed first, so
# each night draws new cases and a failure replays exactly: rerun the job, or set SPAREKIT_SEED to
# the printed value. A failed property prints its shrunk input as a fixture line (`fixture[...]`),
# to add to geom-num's tests/verification/fixtures.txt once the bug is fixed (28.16). Piece G47
# adds the proven maths functions (sinpi, cospi, exp, ln and atan2): every input of CORE-MATH's
# worst-case lists, fetched at the commit the ports come from and checked by SHA-256, and ten
# million inputs per function from the night's seed, each against geom-num's big-number reference
# (tests/math_full_worst_cases.rs and tests/math_oracle.rs). Piece G63 adds the first outside
# oracle run out of process (28.10's differential testing; 17.8): Bertolazzi and Frego's Clothoids
# library, built from source at a pinned commit in a container pinned by digest, evaluates the
# night's seeded clothoids, and geom-curve's tests/clothoids_oracle.rs compares every point with
# the kernel's certified enclosure, settling any difference by a fixed-point truth. Piece G69 adds
# the law catalogue of 28.3 for the curve and surface kinds and NURBS (geom-test's tests/laws_nurbs.rs,
# laws_curves.rs and laws_surfaces.rs), each law's dense refutation sampler drawing from the night's
# seed. Piece G86 adds Python's cbor2, run the same way: geom-op's tests/cbor2_oracle.rs writes the
# night's seeded values of SKG's subset with the kernel's canonical CBOR, cbor2 6.1.5 (pinned by
# hash) encodes each value in its canonical mode in a container pinned by digest and reads the
# kernel's bytes back, and the test fails on any byte that differs. Later pieces add the rest of
# 28.17's nightly list (hours of fuzzing, slow fixtures, the other outside oracles).
#
# --locked: Cargo.lock is committed and must already list every dependency (28.13, the toolchain
# guard).
#
# Supply chain: every action is pinned to the same full commit as in kernel.yml, checked against
# its tag when it was pinned there (the tag beside each); update a pin in all the kernel workflows
# together, and only after reviewing the new commit. The workflow can only read the repository.

on:
  schedule:
    # 13:17 UTC every day: early morning in New Zealand, outside the busiest hours elsewhere.
    - cron: "17 13 * * *"
  # By hand, from the Actions tab, to test a change to this workflow or rerun a night.
  workflow_dispatch:
  # Run whole by kernel-release.yml on a release tag, with every other kernel workflow (28.17).
  workflow_call:

permissions:
  contents: read

env:
  # The same pinned compiler as kernel.yml (chapter 28.13, the toolchain guard).
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  predicates:
    name: Predicates with a fresh seed
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Tonight's seed, printed
        run: |
          set -euo pipefail
          seed=$(printf '%016x' "$GITHUB_RUN_ID")
          echo "SPAREKIT_SEED=$seed" >> "$GITHUB_ENV"
          echo "seed: $seed (replay with SPAREKIT_SEED=$seed)"
      - name: The predicate verification suite and the predicates' attack tests
        run: >-
          cargo test --locked --release -p geom-num
          --test verification --test attack_g28 --test attack_g29 --test attack_g30

  laws:
    name: Kind and NURBS laws with a fresh seed
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Tonight's seed, printed
        run: |
          set -euo pipefail
          seed=$(printf '%016x' "$GITHUB_RUN_ID")
          echo "SPAREKIT_SEED=$seed" >> "$GITHUB_ENV"
          echo "seed: $seed (replay with SPAREKIT_SEED=$seed)"
      - name: The law catalogue for NURBS and the curve and surface kinds (28.3)
        run: >-
          cargo test --locked --release -p geom-test
          --test laws_nurbs --test laws_curves --test laws_surfaces

  maths:
    name: Proven maths against the oracle
    runs-on: ubuntu-latest
    # Measured (G47): about 6.5 hours of one core's work for the ten million inputs per function,
    # and 7 minutes on five cores for the lists, so about two hours on a hosted runner's four.
    timeout-minutes: 300
    env:
      # The CORE-MATH commit the five functions are ported from (geom-num's src/math/).
      CORE_MATH_COMMIT: 0ce0cbc15935e24c656280e5a46c34e89f301b7a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Tonight's seed, printed
        run: |
          set -euo pipefail
          seed=$(printf '%016x' "$GITHUB_RUN_ID")
          echo "SPAREKIT_SEED=$seed" >> "$GITHUB_ENV"
          echo "seed: $seed (replay with SPAREKIT_SEED=$seed)"
      - name: CORE-MATH's worst-case lists at the ported commit, checked by SHA-256
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/core-math/src/binary64"
          for f in sinpi cospi exp log atan2; do
            mkdir -p "$dir/$f"
            curl --fail --silent --show-error --location --retry 3 --output "$dir/$f/$f.wc" \
              "https://gitlab.inria.fr/core-math/core-math/-/raw/$CORE_MATH_COMMIT/src/binary64/$f/$f.wc"
          done
          cd "$dir"
          sha256sum --check --strict <<'SUMS'
          476d2c6bad1332cc2257a9b73dd95fcc86aa8ec2288d31db30695ed105955c37  sinpi/sinpi.wc
          ae02bccca8ea664673cf5b1035acb66d8bd3d74ad14d1e6f321ea73a2ae7e34f  cospi/cospi.wc
          8c62a01572eb5c66d0303f287ca528fffbb69f3d3935ca29f852f656553b128b  exp/exp.wc
          2d213b6758e257a1dc68dee717af2fc04b2907db19639b80bf196dfbf04ed9fb  log/log.wc
          9e4fb81a3c4a789ea739203d2db3ef9689c48208d94196726fa7a22886e573db  atan2/atan2.wc
          SUMS
          echo "CORE_MATH_DIR=$dir" >> "$GITHUB_ENV"
      - name: Every input of the worst-case lists
        run: >-
          cargo test --locked --release -p geom-num --test math_full_worst_cases
          -- --ignored --nocapture
      - name: Ten million inputs per function from tonight's seed
        run: >-
          cargo test --locked --release -p geom-num --test math_oracle
          -- --ignored --nocapture

  clothoids:
    name: Clothoids, out of process
    runs-on: ubuntu-latest
    # Measured (G63): the oracle builds in about a minute on twenty cores, so a few on a hosted
    # runner's four; the comparison takes seconds.
    timeout-minutes: 60
    env:
      # Bertolazzi and Frego's Clothoids (BSD-2-Clause), at the commit chapter 17.8 cites; its
      # submodules come at the commits it records.
      CLOTHOIDS_COMMIT: dafdc29acee5c4f25e777c6cffe56ecb39b0ec11
      # gcc:13.3.0, pinned by digest.
      GCC_IMAGE: gcc:13.3.0@sha256:1d71f0f3450214bef38fe09e6f610fb6cca90cf97b43f4ce845bfc32a4168818
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Tonight's seed, printed, and the files
        run: |
          set -euo pipefail
          seed=$(printf '%016x' "$GITHUB_RUN_ID")
          echo "SPAREKIT_SEED=$seed" >> "$GITHUB_ENV"
          echo "seed: $seed (replay with SPAREKIT_SEED=$seed)"
          mkdir -p "$RUNNER_TEMP/clothoids"
          echo "CLOTHOIDS_CASES=$RUNNER_TEMP/clothoids/cases.txt" >> "$GITHUB_ENV"
          echo "CLOTHOIDS_ANSWERS=$RUNNER_TEMP/clothoids/answers.txt" >> "$GITHUB_ENV"
      - name: Tonight's cases
        run: >-
          cargo test --locked --release -p geom-curve --test clothoids_oracle
          -- --ignored --exact write_the_cases --nocapture
      - name: Clothoids at the pinned commit, built and run in the container
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/clothoids"
          git clone --quiet https://github.com/ebertolazzi/Clothoids.git "$dir/src"
          git -C "$dir/src" checkout --quiet "$CLOTHOIDS_COMMIT"
          git -C "$dir/src" submodule --quiet update --init --recursive
          docker run --rm -i -v "$PWD:/work:ro" -v "$dir:/oracle" -w /work "$GCC_IMAGE" \
            bash projects/engines/geometry/crates/geom-curve/oracles/clothoids.sh \
            /oracle/src /oracle/build < "$CLOTHOIDS_CASES" > "$CLOTHOIDS_ANSWERS"
      - name: The kernel against Clothoids' points
        run: >-
          cargo test --locked --release -p geom-curve --test clothoids_oracle
          -- --ignored --exact compare_with_the_answers --nocapture

  cbor2:
    name: Canonical CBOR against cbor2, out of process
    runs-on: ubuntu-latest
    # The kernel's cases build and run in a few minutes; cbor2 installs from one wheel and encodes
    # them in seconds.
    timeout-minutes: 30
    env:
      # python:3.13-slim, pinned by digest; oracles/cbor2.sh pins cbor2 6.1.5's wheel by SHA-256.
      PYTHON_IMAGE: python:3.13-slim@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Tonight's seed, printed, and the files
        run: |
          set -euo pipefail
          seed=$(printf '%016x' "$GITHUB_RUN_ID")
          echo "SPAREKIT_SEED=$seed" >> "$GITHUB_ENV"
          echo "seed: $seed (replay with SPAREKIT_SEED=$seed)"
          mkdir -p "$RUNNER_TEMP/cbor2"
          echo "CBOR2_CASES=$RUNNER_TEMP/cbor2/cases.txt" >> "$GITHUB_ENV"
          echo "CBOR2_ANSWERS=$RUNNER_TEMP/cbor2/answers.txt" >> "$GITHUB_ENV"
      - name: Tonight's cases
        run: >-
          cargo test --locked --release -p geom-op --test cbor2_oracle
          -- --ignored --exact write_the_cases --nocapture
      - name: cbor2 6.1.5, in the container
        run: |
          set -euo pipefail
          docker run --rm -i -v "$PWD:/work:ro" -w /work "$PYTHON_IMAGE" \
            bash projects/engines/geometry/crates/geom-op/oracles/cbor2.sh \
            < "$CBOR2_CASES" > "$CBOR2_ANSWERS"
      - name: The kernel against cbor2's encodings
        run: >-
          cargo test --locked --release -p geom-op --test cbor2_oracle
          -- --ignored --exact compare_with_the_answers --nocapture
