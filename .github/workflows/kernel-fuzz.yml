name: Kernel fuzzing and proofs

# The legs of the geometry kernel's fuzz targets that need Linux (kernel architecture, chapter
# 28.5 and 28.7; the layout is in projects/engines/geometry/crates/geom-fuzz/README.md). Every
# target is one law and its oracle, `check`, in a module of geom-fuzz, with a `harness` that
# decodes a fuzzer's bytes and calls it. kernel.yml and kernel-dev.yml already run each target's
# tests on every operating system: bolero's test mode (`<target>_fuzz`), the seeded leg
# (`<target>_seeded`) and the property test of each proof's domain (`<target>_proof`). This
# workflow adds:
#
# - libFuzzer: each `<target>_fuzz` test rebuilt by cargo-bolero with libFuzzer, coverage
#   instrumentation and the address sanitizer, and fuzzed for a minute, on the pinned nightly
#   compiler those flags need. A crash fails the job and its input is uploaded; put the file in
#   tests/__fuzz__/<target>/crashes and `cargo test` replays it forever (28.16).
# - Kani: each `<target>_proof` test, bolero's harness unchanged, proven by Kani for every case of
#   its domain (the target module's header says which).
# - Kani for geom-num: each `#[kani::proof]` harness beside geom-num's code (piece G41), proven
#   on its own; and the same for geom-op's (piece G86), in the job kani-op.
# - kernel-fuzz-campaign.yml runs a target for hours instead, on demand: the wide integers' 25-hour
#   campaign (G26).
# - ClusterFuzzLite, on pull requests: .clusterfuzzlite/build.sh builds every `<target>_fuzz` test
#   with cargo-bolero's build-clusterfuzz command, and ClusterFuzzLite fuzzes them in turn
#   (code-change mode, address sanitizer). OSS-Fuzz's build check cannot read the start-up
#   scripts cargo-bolero packs, so it is turned off here and build.sh makes the same checks on the
#   binaries they start. A second job, clusterfuzzlite-seeded, runs ClusterFuzzLite's own images on
#   the checkout with a crash planted (gate 1, G43; .clusterfuzzlite/seeded.sh), and must see it
#   found.
#
# Path filters: the workflow runs when the code a target fuzzes or proves changes: geom-fuzz and
# every crate of the workspace it depends on (geom-gen, geom-num, geom-run and geom-test today;
# geom-fuzz's tests/attack_g14.rs fails until a new target's crates are listed here), geom-op for
# its job kani-op, the workspace
# files that change any build (Cargo.toml, Cargo.lock, .cargo/, the toolchain file), the
# ClusterFuzzLite files and this workflow.
#
# Pins: the compiler in RUST_TOOLCHAIN is the workspace's (the scaffold test checks every
# workflow that names it); FUZZ_NIGHTLY is the nightly compiler for libFuzzer's flags, a dated
# nightly so a run never changes because nightly did; cargo-bolero and Kani are exact versions,
# installed from their published lockfiles (--locked). Every action is pinned to a full commit,
# checked against its tag when it was pinned, as in kernel.yml. ClusterFuzzLite's actions run
# OSS-Fuzz's images tagged v1, which the action pins and we cannot; the image the targets are
# built in is pinned by digest in .clusterfuzzlite/Dockerfile.
#
# --locked: every cargo command that resolves dependencies runs with --locked, or after a
# `cargo metadata --locked`, which fails if Cargo.lock is not the reviewed one, for the tools
# (cargo-bolero, cargo kani) that take no such flag.

on:
  pull_request:
    paths:
      - "projects/engines/geometry/crates/geom-bench/**"
      - "projects/engines/geometry/crates/geom-fuzz/**"
      - "projects/engines/geometry/crates/geom-gen/**"
      - "projects/engines/geometry/crates/geom-num/**"
      - "projects/engines/geometry/crates/geom-op/**"
      - "projects/engines/geometry/crates/geom-run/**"
      - "projects/engines/geometry/crates/geom-test/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "rust-toolchain"
      - ".clusterfuzzlite/**"
      - ".github/workflows/kernel-fuzz.yml"
  push:
    branches: [main]
    paths:
      - "projects/engines/geometry/crates/geom-bench/**"
      - "projects/engines/geometry/crates/geom-fuzz/**"
      - "projects/engines/geometry/crates/geom-gen/**"
      - "projects/engines/geometry/crates/geom-num/**"
      - "projects/engines/geometry/crates/geom-op/**"
      - "projects/engines/geometry/crates/geom-run/**"
      - "projects/engines/geometry/crates/geom-test/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "rust-toolchain"
      - ".clusterfuzzlite/**"
      - ".github/workflows/kernel-fuzz.yml"
  # Run whole by kernel-release.yml on a release tag, with every other kernel workflow (28.17).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: kernel-fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The workspace's pinned compiler (rust-toolchain.toml), for building the tools.
  RUST_TOOLCHAIN: "1.99.0"
  # The nightly compiler cargo-bolero builds libFuzzer targets with (sanitizer flags are
  # nightly-only).
  FUZZ_NIGHTLY: nightly-2026-10-01
  CARGO_BOLERO_VERSION: 0.13.5
  KANI_VERSION: 0.68.0

jobs:
  libfuzzer:
    name: libFuzzer under cargo-bolero (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [orient2d_fuzz, predicates_fuzz, variants_fuzz, wide_fuzz]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the pinned nightly compiler
        run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-bolero ${{ env.CARGO_BOLERO_VERSION }}
        run: >-
          cargo install cargo-bolero --version "$CARGO_BOLERO_VERSION" --locked
          --no-default-features --features libfuzzer
      - name: Cargo.lock is the reviewed one
        run: cargo metadata --locked --format-version 1 > /dev/null
      # Gate 1 (G43): on the first leg, libFuzzer must first find a planted violation, a carry
      # dropped from geom-num's wide integers, which wide_fuzz compares with big integers
      # (geom-test's trip module and binary). The corpus and crash that run leaves are removed,
      # so a later failure uploads only its own.
      - name: libFuzzer finds a planted violation
        if: strategy.job-index == 0
        run: |
          cargo run --locked -q -p geom-test --bin trip -- libfuzzer -- cargo bolero test wide_fuzz --package geom-fuzz --toolchain "$FUZZ_NIGHTLY" --engine libfuzzer -T 60s
          rm -rf projects/engines/geometry/crates/geom-fuzz/tests/__fuzz__/wide
      - name: Fuzz ${{ matrix.target }} with libFuzzer for a minute
        run: >-
          cargo bolero test "${{ matrix.target }}" --package geom-fuzz
          --toolchain "$FUZZ_NIGHTLY" --engine libfuzzer -T 60s
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libfuzzer-crashes-${{ matrix.target }}
          path: projects/engines/geometry/crates/geom-fuzz/tests/__fuzz__/*/crashes/
          if-no-files-found: ignore

  kani:
    name: Kani (${{ matrix.harness }})
    runs-on: ubuntu-latest
    # orient2d_proof is the slowest harness: on G37's rewritten wide integers, which its total
    # path reaches, kissat proved it in 47 minutes (run 40291338626) and then in 75 (run
    # 40308963161, which the old 75-minute limit then cut off) on the hosted runners; CaDiCaL ran
    # past three hours. 120 minutes is about one and a half times the slower run.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        harness:
          - orient2d_fuzz
          - orient2d_proof
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install Kani ${{ env.KANI_VERSION }}
        run: |
          cargo install kani-verifier --version "$KANI_VERSION" --locked
          cargo kani setup
      - name: Cargo.lock is the reviewed one
        run: cargo metadata --locked --format-version 1 > /dev/null
      # Gate 1 (G43): on the first leg, Kani must first fail on a planted violation, orient2d's
      # exact path answering Positive whatever its points (geom-test's trip module and binary).
      - name: Kani fails on a planted violation
        if: strategy.job-index == 0
        run: >-
          cargo run --locked -q -p geom-test --bin trip -- kani-fuzz --
          cargo kani --tests -p geom-fuzz --harness orient2d_fuzz --exact
      - name: Prove ${{ matrix.harness }}
        run: |
          start=$(date +%s)
          cargo kani --tests -p geom-fuzz --harness "${{ matrix.harness }}" --exact
          echo "Proved in $(( $(date +%s) - start )) seconds."
      - name: Kani left Cargo.lock as it was
        run: git diff --exit-code -- Cargo.lock

  # Bounded proofs beside geom-num's own code (chapter 28.7; piece G41): each harness of a module's
  # `#[cfg(kani)] mod proofs`, proven by Kani for every case of its domain, with Kani's overflow,
  # bounds and panic checks on. A harness that cannot finish within the budget is narrowed, and
  # its module header says what is proven and what is only tested. geom-num's
  # tests/kani_harnesses.rs holds this list to the harnesses in the source. The budget, two hours:
  # in WSL on 2026-10-28, with up to thirteen proofs sharing twelve cores, the slowest took 57
  # minutes (exact_sum's cancellation in the subnormals), eft's full-width two_prod with the
  # splitter 54 and dd's from_i128 46; 120 minutes is the margin orient2d_proof's job above keeps.
  kani-num:
    name: Kani, geom-num (${{ matrix.proof }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        proof:
          - dd::proofs::exponent_reads_the_leading_bit
          - dd::proofs::from_i128_accepts_exactly_below_2_106
          - dd::proofs::pow2_is_exact_over_its_range
          - dd::proofs::scale_pow2_never_reports_a_defect
          - dd::proofs::whole_reads_what_it_accepts_exactly
          - eft::proofs::split_adds_back_exactly
          - eft::proofs::two_prod_with_minus_a_tenth
          - eft::proofs::two_prod_with_the_largest_double
          - eft::proofs::two_prod_with_the_smallest_subnormal
          - eft::proofs::two_prod_with_the_splitter
          - eft::proofs::two_prod_with_three
          - eft::proofs::two_prod_with_two_pow_996
          - eft::proofs::two_sum_with_minus_a_tenth
          - eft::proofs::two_sum_with_the_largest_double
          - eft::proofs::two_sum_with_the_smallest_subnormal
          - eft::proofs::two_sum_with_three
          - eft::proofs::two_sum_with_two_pow_53
          - exact_sum::proofs::a_non_finite_term_is_reported
          - exact_sum::proofs::a_term_and_its_negation_cancel_in_binade_31
          - exact_sum::proofs::a_term_and_its_negation_cancel_in_binade_32
          - exact_sum::proofs::a_term_and_its_negation_cancel_in_one_s_binade
          - exact_sum::proofs::a_term_and_its_negation_cancel_in_the_largest_binade
          - exact_sum::proofs::a_term_and_its_negation_cancel_in_the_smallest_binade
          - exact_sum::proofs::a_term_and_its_negation_cancel_in_the_subnormals
          - exact_sum::proofs::one_term_rounds_back_in_binade_31
          - exact_sum::proofs::one_term_rounds_back_in_binade_32
          - exact_sum::proofs::one_term_rounds_back_in_one_s_binade
          - exact_sum::proofs::one_term_rounds_back_in_the_largest_binade
          - exact_sum::proofs::one_term_rounds_back_in_the_smallest_binade
          - exact_sum::proofs::one_term_rounds_back_in_the_subnormals
          - exactness::proofs::combine_keeps_the_less_exact_class
          - exactness::proofs::within_never_panics_and_respects_the_ceiling
          - grid::proofs::coarsen_is_nearest_and_reported
          - grid::proofs::coord_from_i128_accepts_exactly_the_frame
          - grid::proofs::coord_new_accepts_exactly_the_frame
          - grid::proofs::p3_new_accepts_exactly_three_frame_coordinates
          - grid::proofs::refine_is_exact_or_refused
          - grid::proofs::steps_refine_is_exact_or_none
          - interval::proofs::add_sub_mul_enclose_the_rounded_result
          - interval::proofs::div_by_minus_a_tenth
          - interval::proofs::div_by_minus_zero_is_refused
          - interval::proofs::div_by_the_largest_double
          - interval::proofs::div_by_the_smallest_subnormal
          - interval::proofs::div_by_three
          - interval::proofs::div_by_zero_is_refused
          - interval::proofs::new_accepts_exactly_ordered_finite_bounds
          - interval::proofs::square_is_never_negative_and_encloses
          - ladder::proofs::quarter_nm_always_answers_exactly
          - math::atan2::proofs::add_of_like_signs_is_within_two_ulps
          - math::atan2::proofs::add_of_unlike_signs_at_equal_exponents_is_within_two_ulps
          - math::atan2::proofs::add_of_unlike_signs_one_apart_is_within_two_ulps
          - math::atan2::proofs::is_zero_holds_exactly_for_zero
          - math::atan2::proofs::mul_keeps_every_carry
          - math::atan2::proofs::shl_moves_every_bit_up
          - math::atan2::proofs::to_f64_rounds_to_nearest
          - math::log::proofs::is_zero_reads_both_words
          - math::proofs::abs_is_exact
          - math::proofs::ceil_is_exact
          - math::proofs::floor_is_exact
          - math::proofs::round_ties_even_is_exact
          - perturb::proofs::bit_of_covers_exactly_a_mask_of_32
          - perturb::proofs::distinct_refuses_exactly_repeated_keys
          - perturb::proofs::the_lift_of_every_frame_point_fits
          - real::proofs::real_new_refuses_exactly_nan_and_the_infinities
          - real::proofs::total_order_and_its_tie_rules
          - rng::proofs::draws_never_panic
          - rng::proofs::lemire_never_reports_a_defect
          - rng::proofs::philox_never_panics
          - rng::proofs::stream_ranges_cut_without_overflow
          - sign::proofs::signs_follow_the_integers
          - wide::proofs::add_and_sub_never_panic_and_invert
          - wide::proofs::extremes_are_the_limits
          - wide::proofs::i128_conversions_and_resize_round_trip
          - wide::proofs::mul_never_panics
          - wide::proofs::neg_refuses_exactly_the_minimum
          - wide::proofs::order_and_sign_agree
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install Kani ${{ env.KANI_VERSION }}
        run: |
          cargo install kani-verifier --version "$KANI_VERSION" --locked
          cargo kani setup
      - name: Cargo.lock is the reviewed one
        run: cargo metadata --locked --format-version 1 > /dev/null
      # Gate 1 (G43): on the first leg, Kani must first fail on a planted violation, Sign::of_i128
      # calling 1 zero (geom-test's trip module and binary).
      - name: Kani fails on a planted violation
        if: strategy.job-index == 0
        run: >-
          cargo run --locked -q -p geom-test --bin trip -- kani-num --
          cargo kani -p geom-num --harness sign::proofs::signs_follow_the_integers --exact
      - name: Prove ${{ matrix.proof }}
        run: |
          start=$(date +%s)
          cargo kani -p geom-num --harness "${{ matrix.proof }}" --exact
          echo "Proved in $(( $(date +%s) - start )) seconds."
      - name: Kani left Cargo.lock as it was
        run: git diff --exit-code -- Cargo.lock

  kani-limbs:
    name: Kani, geom-num limb steps
    runs-on: ubuntu-latest
    # Piece G42: one bounded proof for every kind of step the generated limb variant performs
    # (chapter 23.3), all in one run so they share one build; the generator writes them beside the
    # variant, in geom-num's src/generated/limbs.rs, and geom-num's tests/kani_harnesses.rs holds
    # this job to them.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install Kani ${{ env.KANI_VERSION }}
        run: |
          cargo install kani-verifier --version "$KANI_VERSION" --locked
          cargo kani setup
      - name: Cargo.lock is the reviewed one
        run: cargo metadata --locked --format-version 1 > /dev/null
      # Gate 1 (G43): Kani must first fail on a planted violation, Wide32::from_i128 refusing an
      # 83-bit value the three-limb step must hold (geom-test's trip module and binary).
      - name: Kani fails on a planted violation
        run: >-
          cargo run --locked -q -p geom-test --bin trip -- kani-limbs --
          cargo kani -p geom-num --harness generated::limbs::proofs::rounded_83_in_3
      - name: Prove every limb step
        run: |
          start=$(date +%s)
          cargo kani -p geom-num --harness generated::limbs::proofs::
          echo "Proved in $(( $(date +%s) - start )) seconds."
      - name: Kani left Cargo.lock as it was
        run: git diff --exit-code -- Cargo.lock

  # Bounded proofs beside geom-op's own code (chapter 28.7; piece G86), as kani-num proves
  # geom-num's: the canonical CBOR encoder's binary16 and binary32 narrowing, each proven exact and
  # shortest for every finite double, and a refused double proven to write nothing. geom-op's
  # tests/kani_harnesses.rs holds this list to the harnesses in the source. The budget: on a
  # development machine (Kani 0.68.0) each proof took under 3 seconds after a one-minute build, so
  # 60 minutes leaves room for Kani's install, which takes most of a job.
  kani-op:
    name: Kani, geom-op (${{ matrix.proof }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        proof:
          - cbor::proofs::a_refused_float_writes_nothing
          - cbor::proofs::binary16_is_exact_and_shortest
          - cbor::proofs::binary32_is_exact_and_shortest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install Kani ${{ env.KANI_VERSION }}
        run: |
          cargo install kani-verifier --version "$KANI_VERSION" --locked
          cargo kani setup
      - name: Cargo.lock is the reviewed one
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Prove ${{ matrix.proof }}
        run: |
          start=$(date +%s)
          cargo kani -p geom-op --harness "${{ matrix.proof }}" --exact
          echo "Proved in $(( $(date +%s) - start )) seconds."
      - name: Kani left Cargo.lock as it was
        run: git diff --exit-code -- Cargo.lock

  clusterfuzzlite:
    name: ClusterFuzzLite (address sanitizer)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Build the fuzz targets
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # main, 2026-02-12 (v1 and two documentation changes)
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
          bad-build-check: false
      - name: Fuzz the targets
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # main, 2026-02-12 (v1 and two documentation changes)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
      - name: Upload the crashing input
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clusterfuzzlite-artifacts
          path: ./out/artifacts
          if-no-files-found: ignore

  # Gate 1 (G43): the job above must fail on a planted crash. Its actions build a fresh clone of
  # the pull request, which a planted line never reaches, so this job runs the images those actions
  # run, with the inputs given above, on this checkout with the libFuzzer leg's planted violation
  # (.clusterfuzzlite/seeded.sh says what differs and why). run_fuzzers must report the crash.
  clusterfuzzlite-seeded:
    name: ClusterFuzzLite finds a planted violation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # The trip binary builds outside the checkout, which ClusterFuzzLite copies into its image.
      - name: ClusterFuzzLite's build and run fail on a planted violation
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: >-
          cargo run --locked -q -p geom-test --bin trip -- clusterfuzzlite --
          bash .clusterfuzzlite/seeded.sh
