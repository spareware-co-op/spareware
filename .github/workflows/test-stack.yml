name: Test stack

# The cloud foundation on real TiKV, on fresh ARM Ubuntu machines like the free server it is meant
# for: the store's promises, the load test, the acceptance checklist on one node and on three, real
# browsers, and the install script as deploy.sh runs it on a server. The kit's own crates, which
# need no database, are tested in kit.yml.

on:
  pull_request:
    paths:
      - "projects/kit/test-stack/**"
      - "projects/kit/crates/kit-core/**"
      - "projects/kit/crates/kit-ops/**"
      - "projects/kit/crates/kit-store/**"
      - "projects/kit/crates/kit-sync/**"
      - "projects/kit/services/accounts/**"
      - "projects/kit/services/store/**"
      - "projects/spare-construct/demo/index.html"
      - "design/ribbon/**"
      - ".github/workflows/test-stack.yml"

permissions:
  contents: read

env:
  # The workspace's pinned compiler (rust-toolchain.toml).
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  checklist:
    name: The checklist on ARM Linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    defaults:
      run:
        working-directory: projects/kit/test-stack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: projects/kit/test-stack
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests that need no database
        run: cargo test --locked --workspace
      - name: Install TiKV, PD and RustFS
        run: bash scripts/install-binaries.sh
      - name: On one node
        run: bash scripts/run-checklist.sh
      - name: On three nodes, by settings alone, with one killed mid-edit
        env:
          STACK_NODES: "3"
          STACK_PD: 127.0.0.1:2379,127.0.0.1:2389,127.0.0.1:2399
        run: bash scripts/run-checklist.sh
      - name: In real browsers
        run: |
          bash scripts/run-browser-test.sh
          cd tests/browser
          npm ci
          npx playwright-core install --with-deps chromium
          BROWSER=bundled STACK_KILL='pkill -9 -x test-stack' \
            STACK_START='bash ../../scripts/start-server.sh' node two_browsers.mjs

  licences:
    name: Every dependency's licence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check licences
        working-directory: projects/kit/test-stack
        run: cargo deny --locked check licenses

  install:
    name: The install script on a fresh ARM server
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lay out the server as deploy.sh does
        run: |
          sudo mkdir -p /opt/spare-stack/src /etc/spare-stack
          git archive HEAD Cargo.toml rust-toolchain.toml projects/kit/test-stack projects/kit/crates \
            projects/kit/services/accounts projects/kit/services/store \
            projects/spare-construct/demo/index.html design/ribbon \
            | sudo tar -x -C /opt/spare-stack/src
          sudo tee /etc/spare-stack/owner.env <<'EOF'
          STACK_PUBLIC_URL=http://localhost:8088
          OIDC_CLIENT_ID=not-set-in-this-test
          OIDC_CLIENT_SECRET=not-set-in-this-test
          STACK_PEOPLE=anna=someone@example.test
          EOF
          sudo sed -i 's/^ *//' /etc/spare-stack/owner.env
      - name: Install
        run: sudo bash /opt/spare-stack/src/projects/kit/test-stack/deploy/install-on-server.sh
      - name: Install again, as an update does
        run: sudo bash /opt/spare-stack/src/projects/kit/test-stack/deploy/install-on-server.sh
      - name: The web proxy reaches the server
        run: curl -fsS http://localhost:8088/health
      - name: The seeded logs check out
        run: |
          sudo systemd-run --wait --pipe --uid=spare \
            --property=EnvironmentFile=/etc/spare-stack/stack.env \
            /opt/spare-stack/bin/test-stack verify
      - name: The daily backup runs
        run: |
          sudo systemctl start spare-backup.service
          sudo systemctl is-enabled spare-backup.timer
          sudo ls /opt/spare-stack/backups/
      - name: Everything comes back after a restart of every service
        run: |
          sudo systemctl restart spare-pd spare-tikv spare-rustfs spare-server
          for _ in $(seq 1 60); do curl -fs http://localhost:8088/health && break; sleep 2; done
          curl -fsS http://localhost:8088/health
      - name: Show the logs on failure
        if: failure()
        run: |
          sudo journalctl -n 80 --no-pager -u spare-pd -u spare-tikv -u spare-rustfs -u spare-server -u caddy
