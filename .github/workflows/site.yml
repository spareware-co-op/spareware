name: Site

# Publishes the browse hub, every program's demo and feature map to GitHub Pages.
# Layout: /index.html (hub), /<program>/index.html (demo), /<program>/features.json, /<program>/FEATURES.md

on:
  # Every merge to main: the contributor map (/contributors.html) counts merged pull requests,
  # and the kernel progress page (/kernel-progress.html) counts the board's pieces.
  push:
    branches: [main]
  # A pull request that changes the site or its page builders builds the site to check it; only main deploys.
  pull_request:
    paths:
      - 'site/**'
      - 'tools/contributor-map/**'
      - 'tools/kernel-progress/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the contributor map counts a renamed project folder under its new name.
          fetch-depth: 0
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp design/tokens.css _site/tokens.css
          # the shared ribbon the desktop-style demos load as ../../../design/ribbon/ (from a demo page that resolves to /design/ribbon/)
          mkdir -p _site/design
          cp -r design/ribbon _site/design/ribbon
          for dir in projects/*/; do
            slug=$(basename "$dir")
            case "$slug" in _template) continue ;; esac
            mkdir -p "_site/$slug"
            if [ -d "$dir/demo" ]; then cp -r "$dir/demo/." "_site/$slug/"; fi
            for f in features.json FEATURES.md; do
              if [ -f "$dir/$f" ]; then cp "$dir/$f" "_site/$slug/$f"; fi
            done
          done
          touch _site/.nojekyll
      - name: Build the contributor map
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/contributor-map/build.py _site/contributors.html
      - name: Build the kernel progress page
        env:
          # Read-only: branches, the merge trains' MAP.json and open pull requests.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/kernel-progress/test_build.py
          python3 tools/kernel-progress/build.py _site/kernel-progress.html
          find _site -maxdepth 2 | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
