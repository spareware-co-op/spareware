name: Kernel release

# Every check of the geometry kernel, on a release (kernel architecture, chapter 28.17: "Each
# release and edition: everything; the format museum; the edition's goldens frozen"; piece G10).
#
# A tag `geom-v<version>` pushed to a commit runs every other kernel workflow on that commit, each
# called whole (workflow_call) and each in the configuration its main-branch or scheduled runs use:
# every test on every target and build mode with the golden digests (kernel.yml); the builds, the
# merge gate and the development crates with the Verus twins (kernel-build.yml, kernel-gate.yml,
# kernel-dev.yml); the golden store (kernel-golden.yml); the count gates against the commit's first
# parent (kernel-bench.yml); fuzzing and the bounded proofs (kernel-fuzz.yml), and five hours of
# libFuzzer on every target (kernel-fuzz-campaign.yml); the full mutation run, coverage and Miri
# over every partition (kernel-quality.yml, which runs its full scope on any event but a pull
# request); the predicates' verification suite with a fresh seed (kernel-nightly.yml); and the
# filters' error bounds, proved by Gappa and Rocq and checked by FPTaylor and HOL Light
# (kernel-certificates.yml); and the exact-path variants' timings on every engine, recorded, never
# a gate (kernel-variants.yml). The tag's run takes as long as its longest workflow, the five-hour
# campaign or the mutation run.
#
# When all of them pass, `freeze` checks the golden store once more and attaches it, with its
# SHA-256, to a draft GitHub release for the tag: the record of every digest the release was
# checked against. An owner reads the run and publishes the release. A rerun of the same tag
# compares the store with the one already attached and fails if they differ, so a release's record
# never changes.
#
# Not here yet, and why: the format museum (28.13) has no files before the native format's first
# version (chapter 24), and a tag cannot yet name a frozen edition of the store, because editions
# begin with the first Stable release (board piece G482; chapter 32.12): until then the store has
# one open edition, `pre-edition`, and a tag records it as it stands.
#
# Permissions: read for every check; the freeze job alone may write, to create the draft release
# and attach the store. Every action is pinned to a full commit, kernel.yml's.

on:
  push:
    tags: ["geom-v*"]

permissions:
  contents: read
  # kernel-golden.yml reads a pull request's reviews; called here it reads none, but a called
  # workflow may not ask for more than its caller grants.
  pull-requests: read

concurrency:
  group: kernel-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The workspace's pinned compiler (rust-toolchain.toml), as in kernel.yml.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  kernel:
    uses: ./.github/workflows/kernel.yml
  build:
    uses: ./.github/workflows/kernel-build.yml
  gate:
    uses: ./.github/workflows/kernel-gate.yml
  dev:
    uses: ./.github/workflows/kernel-dev.yml
  certificates:
    uses: ./.github/workflows/kernel-certificates.yml
  golden:
    uses: ./.github/workflows/kernel-golden.yml
  bench:
    uses: ./.github/workflows/kernel-bench.yml
  variants:
    uses: ./.github/workflows/kernel-variants.yml
  fuzz:
    uses: ./.github/workflows/kernel-fuzz.yml
  fuzz-campaign:
    uses: ./.github/workflows/kernel-fuzz-campaign.yml
  quality:
    uses: ./.github/workflows/kernel-quality.yml
  nightly:
    uses: ./.github/workflows/kernel-nightly.yml

  # The facade's public interface against the release before this one (chapter 25; piece G100):
  # cargo-semver-checks reads engine-geometry's public items at both commits and fails on a breaking
  # change the version number does not admit. The first release has no baseline, and says so.
  semver:
    name: The facade's public interface against the last release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # cargo-semver-checks 0.51.0 (Apache-2.0 OR MIT), released 2026-10-03, the first release with
      # lints for Rust 1.99's new items: the x86_64 Linux build's archive,
      # cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz, checked against GitHub's SHA-256 of it.
      SEMVER_CHECKS_VERSION: "0.51.0"
      SEMVER_CHECKS_SHA256: "cacadafaa5cd27ae6d05a74a103266917ebab4c5e43c898360e177d4fbf06a65"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag, to find the release before this one.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-semver-checks ${{ env.SEMVER_CHECKS_VERSION }}
        run: |
          set -euo pipefail
          f=cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$f" "https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v$SEMVER_CHECKS_VERSION/$f"
          echo "$SEMVER_CHECKS_SHA256  $RUNNER_TEMP/$f" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/semver"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/semver"
          echo "$RUNNER_TEMP/semver" >> "$GITHUB_PATH"
      - name: engine-geometry against the release before this one
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous="$(git tag --list 'geom-v*' --merged HEAD --sort=-version:refname | grep -vxF "$TAG" | head -n 1 || true)"
          if [ -z "$previous" ]; then
            echo "No release before $TAG: its public interface is the first baseline." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "engine-geometry at $TAG against $previous" | tee -a "$GITHUB_STEP_SUMMARY"
          cargo semver-checks --package engine-geometry --baseline-rev "$previous"

  freeze:
    name: The golden store, recorded with the release
    needs: [kernel, build, gate, dev, certificates, golden, bench, variants, fuzz, fuzz-campaign, quality, nightly, semver]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The store against the repository
        run: cargo run --locked -p geom-test --bin golden -- check
      - name: Attach the store to the tag's draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/record"
          mkdir -p "$out"
          cp projects/engines/geometry/crates/geom-test/golden/store.json "$out/golden-store.json"
          (cd "$out" && sha256sum golden-store.json > golden-store.json.sha256)
          cat "$out/golden-store.json.sha256"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --notes "Every kernel check passed on $GITHUB_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. golden-store.json is the golden store the release was checked against."
          fi
          mkdir -p "$RUNNER_TEMP/attached"
          if gh release download "$TAG" --pattern golden-store.json --dir "$RUNNER_TEMP/attached"; then
            if ! cmp -s "$RUNNER_TEMP/attached/golden-store.json" "$out/golden-store.json"; then
              echo "::error::$TAG already records a different golden store; a release's record never changes."
              exit 1
            fi
            echo "$TAG already records this golden store."
          else
            gh release upload "$TAG" "$out/golden-store.json" "$out/golden-store.json.sha256"
          fi
