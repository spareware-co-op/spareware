name: Pieces

# Keeps the check-out system honest:
#  - a pull request from a piece/<ID> branch must come from someone who has that piece checked out;
#  - every day, pieces with no activity for 7 days are released (any work stays on the branch).

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  checked-out:
    name: Piece is checked out
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: The author has this piece checked out
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$BRANCH" in
            piece/*) ;;
            *) echo "Not a piece branch, so there is nothing to check."; exit 0 ;;
          esac
          ID="${BRANCH#piece/}"
          NUM=$(gh issue list --repo "$REPO" --state all --label piece --search "\"$ID:\" in:title" --limit 50 \
                --json number,title --jq ".[] | select(.title | startswith(\"$ID:\")) | .number" | head -n 1)
          if [ -z "$NUM" ]; then
            echo "::error::There is no issue for piece $ID."
            exit 1
          fi
          ASSIGNEES=$(gh issue view "$NUM" --repo "$REPO" --json assignees --jq '[.assignees[].login] | join(" ")')
          case " $ASSIGNEES " in
            *" $AUTHOR "*) echo "$ID (#$NUM) is checked out by $AUTHOR." ;;
            *) echo "::error::$ID (#$NUM) is not checked out by $AUTHOR (assigned: ${ASSIGNEES:-nobody}). Run: python tools/piece.py checkout $ID"
               exit 1 ;;
          esac

  release-idle:
    name: Release idle pieces
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Free pieces with no activity for 7 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh issue list --repo "$REPO" --state open --label claimed --limit 500 --json number,title,updatedAt \
            --jq ".[] | select(.updatedAt < \"$CUTOFF\") | \"\(.number) \(.title | split(\":\")[0])\"" |
          while read -r NUM ID; do
            LAST=$(gh api "repos/$REPO/commits?sha=piece/$ID&per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null || true)
            if [ -n "$LAST" ] && [[ "$LAST" > "$CUTOFF" ]]; then continue; fi
            AHEAD=$(gh api "repos/$REPO/compare/main...piece/$ID" --jq '.ahead_by' 2>/dev/null || echo 0)
            for A in $(gh issue view "$NUM" --repo "$REPO" --json assignees --jq '.assignees[].login'); do
              gh issue edit "$NUM" --repo "$REPO" --remove-assignee "$A"
            done
            if [ "${AHEAD:-0}" -gt 0 ]; then
              gh issue edit "$NUM" --repo "$REPO" --remove-label claimed --add-label "handed over"
              gh issue comment "$NUM" --repo "$REPO" --body "No activity for 7 days, so $ID is free again. The work so far stays on branch \`piece/$ID\` for the next agent."
            else
              gh api -X DELETE "repos/$REPO/git/refs/heads/piece/$ID" >/dev/null 2>&1 || true
              gh issue edit "$NUM" --repo "$REPO" --remove-label claimed
              gh issue comment "$NUM" --repo "$REPO" --body "No activity for 7 days and nothing pushed, so $ID is free again."
            fi
          done
