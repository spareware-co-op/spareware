name: Kernel development crates

# What only this workflow runs for the geometry kernel's development crates (chapter 28 of the
# kernel architecture, projects/engines/geometry/architecture/28-testing.md). kernel.yml tests
# every crate in projects/engines/geometry/crates, these included: their whole test suites natively
# on every operating system the kernel targets, in release with overflow checks on and in debug,
# and their formatting and lints. So this workflow runs only:
#
# - The development-dependency rule: no kernel crate has a normal or build dependency on a
#   development crate (28.1, chapter 27), over `cargo metadata`'s whole resolved graph
#   (geom-test's tests/dependency_rule.rs). It reads manifests outside the kernel's folder (the
#   facade and its binding crates in projects/engines/crates/, and kit-core, which the facade
#   reaches, in projects/kit/crates/), and kernel.yml does not run when those change; this
#   workflow does (path filters, below).
# - The fuzz target, in bolero's test mode on stable Rust and its seeded leg (geom-fuzz's
#   tests/predicates.rs): the short fuzz of 28.17, as its own step, so a fuzz failure reports as
#   one. kernel.yml's suites run these tests too, among geom-fuzz's others.
# - `cargo run -p geom-gen -- check`, which regenerates every committed generator output in memory
#   and fails, naming each file, on any difference or on an orphan in a generated folder
#   (chapter 27, "Generated code and data have one home"). kernel.yml runs no binary.
# - `cargo run -p geom-test --bin map -- check`, the map for people and AI (chapter 26.3, piece
#   G15): it reads every crate and module header of the kernel's crates
#   (projects/engines/geometry/crates) and of the facade and its binding crates
#   (projects/engines/crates/engine-geometry*) by the grammar in
#   projects/engines/geometry/HEADERS.md, and fails, naming the file and the field, on any header
#   that lacks a required field or writes a placeholder for it, any provenance record that is
#   incomplete or takes more than chapter 29.2 allows, any link to outside code that no Source: or
#   Consulted: line credits, any method link into the repository that does not exist, any
#   published dependency whose licence the header does not record, any error kind without a doc
#   comment, and any known gap or pending folder that no longer applies; and fails if the
#   committed projects/engines/geometry/MAP.json differs from the map the headers give. kernel.yml's
#   run of geom-test's suite checks the same (tests/map_repo.rs); this step reports it on its own,
#   with the command that fixes it. The map reads files under projects/engines/geometry and
#   projects/engines/crates, and resolves header links into projects/engines/geometry and
#   projects/kit/notes; the path filters below cover all of them.
# - `cargo run -p geom-test --bin provenance -- check`, the kernel's source ledger and notices
#   (chapter 29.20, rules 4 to 6; piece G16): it regenerates projects/engines/geometry/PROVENANCE.md
#   and projects/engines/geometry/NOTICE from the map's Source: and Consulted: records, the licence
#   texts in projects/engines/geometry/notices/ and the method notes in
#   projects/engines/geometry/methods/, and fails on any difference, on a ported source without its
#   licence text or a licence text no port uses, and on a method note that breaks its template or
#   credits another source than the records naming it. geom-test's tests/ledger_repo.rs checks the
#   same in kernel.yml's run; this step reports it on its own.
# - `cargo run -p geom-test --bin source-scan -- check`, the banned-source scan (chapter 29.20,
#   rules 2 and 7; piece G16): every file of the kernel's crates and the facade's, scanned for
#   Numerical Recipes markers, copyleft notices, statements that code was taken from a copyleft
#   source, and Autodesk hatch pattern and linetype names, outside the scanner's own named files.
#   geom-test's tests/scan_repo.rs checks the same in kernel.yml's run.
# - The development crates' tests on wasm32-wasip1 under wasmtime, a 32-bit target: kernel.yml's
#   WebAssembly job leaves the development crates out. A seed must draw the same test data and a
#   generator give the same bytes there as natively, and the golden hashes and committed-output
#   tests fail on a target that differs.
# - Verus on orient2d's twin (chapter 28.7, "Predicates, by generated twins"; piece G36): geom-gen
#   writes a Verus-annotated twin of orient2d's exact path (since G38 a module of geom-num's
#   Verus crate, projects/engines/geometry/crates/geom-num/verus/lib.rs, with orient3d's,
#   incircle's and insphere's beside it), whose `value` is the
#   shipped one with its annotations; this job verifies it with a pinned Verus release, proving the
#   path never overflows and returns the description's value for every input on the grid.
#   geom-gen's tests/verus_twin.rs, which kernel.yml runs, holds the twin to the shipped code token
#   for token. Verus checks with its own pinned Rust compiler, which builds nothing that ships, so
#   it is not the kernel's compiler; it runs on Linux only. The same job verifies geom-num's
#   verus/wide.rs (piece G37), the twin of src/wide.rs's arithmetic, which proves add, subtract,
#   negate, multiply and compare exact for every width; tests/verus_twin.rs holds it to the code
#   token for token too.
# - Verus on geom-topo's model of the Euler operators (chapter 28.7, "Topology, by a model"; piece
#   G111), projects/engines/geometry/crates/geom-topo/verus/lib.rs: a body's loops and vertex fans
#   as rings of fins, and every operator proved to keep every fin's partner, every loop and
#   Euler's formula.
#
# The dependency rule, the fuzz target, the generator check, the map check, the ledger check and the
# banned-source scan run on every operating system kernel.yml tests, the same six runners, so the
# map's and the ledger's bytes are proved the same on each of them. On five they are built and run
# natively (`native`); macOS x86-64's are compiled on macOS arm64 for x86_64-apple-darwin
# (`native-cross-build`) and run on the Intel runner (`native-cross`), decision 32.92.
#
# Seeds: every seeded test prints its seed as `seed: <hex>` and runs from a fixed default on pull
# requests, so they run the same cases every time (28.17); SPAREKIT_SEED=<hex> replays any printed
# seed. bolero's test mode draws its inputs' seeds itself and prints BOLERO_RANDOM_SEED=<seed> with
# any failure, which replays it. The fuzz harnesses are seeded tests of the suite (28.5).
#
# Path filters: the workflow runs when any file the dependency rule or the map reads changes, as
# well as the development crates; projects/kit/notes/** is there for the evidence notes that
# module headers link to, which the map check resolves. The rule reads every kernel crate's
# manifest (projects/engines/geometry/**, and the facade and its binding crates in
# projects/engines/crates/), every manifest they reach (the facade reaches kit-core, in
# projects/kit/crates/), the workspace's Cargo.toml ([patch],
# [workspace.dependencies], members), Cargo.lock, and cargo's configuration in .cargo/ ([patch],
# path overrides). Moving a development crate from [dev-dependencies] to [dependencies] changes no
# line of Cargo.lock, so the manifests themselves must be filtered. geom-test's
# tests/dependency_rule.rs fails if a manifest the rule reads is not matched by both triggers. A
# rust-toolchain file, which would override the pinned compiler below, reruns everything here too,
# as it does kernel.yml (28.13, the toolchain guard).
#
# --locked: Cargo.lock is committed and must already list every dependency (28.13, the toolchain
# guard), so CI never resolves a different version from the one reviewed.
#
# Supply chain: every action is pinned to the same full commit as in kernel.yml, checked against
# its tag when it was pinned there (the tag beside each); update a pin in both files together, and
# only after reviewing the new commit. wasmtime is a pinned release checked against its SHA-256
# before it runs, and so is the Verus release. The workflow can only read the repository.

on:
  pull_request:
    paths:
      - "projects/engines/geometry/**"
      - "projects/engines/crates/**"
      - "projects/kit/crates/**"
      - "projects/kit/notes/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "rust-toolchain"
      - ".github/workflows/kernel-dev.yml"
  push:
    branches: [main]
    paths:
      - "projects/engines/geometry/**"
      - "projects/engines/crates/**"
      - "projects/kit/crates/**"
      - "projects/kit/notes/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "rust-toolchain"
      - ".github/workflows/kernel-dev.yml"
  # Run whole by kernel-release.yml on a release tag, with every other kernel workflow (28.17).
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the runs it supersedes; a push to main does not.
concurrency:
  group: kernel-dev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The same pinned compiler as kernel.yml (chapter 28.13, the toolchain guard).
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  native:
    name: Development crates (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, so a difference on one platform shows which.
      fail-fast: false
      matrix:
        # The runners of kernel.yml's test job but macOS x86-64, whose run is `native-cross`'s.
        include:
          - name: Linux x86-64
            os: ubuntu-latest
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: Windows x86-64
            os: windows-latest
          - name: Windows arm64
            os: windows-11-arm
          - name: macOS arm64
            os: macos-latest
    defaults:
      run:
        # bash with -eo pipefail on every runner, Windows included.
        shell: bash
    # No build cache: the repository's caches were over GitHub's 10 GB, so the least used were
    # thrown out all the time, and these five (about 190 MB each) saved this job little. In main's
    # run 44175516389, Linux arm64 found none and took 4.2 minutes, Linux x86-64 restored its own and
    # took 2.8, and every system took under 10. macOS x86-64's was the one kept, and it is now
    # `native-cross-build`'s (decision 32.92).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: The development-dependency rule, and CI's reruns of it
        run: cargo test --locked -p geom-test --test dependency_rule
      - name: The predicates fuzz target, in bolero's test mode and the seeded leg
        run: cargo test --locked -p geom-fuzz --test predicates
      - name: Every committed generator output is current, with no orphan
        run: cargo run --locked -p geom-gen -- check
      - name: Every crate and module header is complete, and MAP.json is current
        run: cargo run --locked -p geom-test --bin map -- check
      - name: PROVENANCE.md and NOTICE are current, and every port has its licence text
        run: cargo run --locked -p geom-test --bin provenance -- check
      - name: No banned-source marker in the kernel's crates
        run: cargo run --locked -p geom-test --bin source-scan -- check

  # macOS x86-64's run of `native`, compiled on macOS arm64 (decision 32.92). On the Intel runner
  # the job was nearly all compiling: 6.6 to 11.2 minutes with main's cache and 18.3 on main's push
  # 78eed9501, when GitHub had thrown the cache out (run 44382890859), over the rule of 15 minutes
  # a job; the arm64 runner compiles the same in a third of the time. This job builds, for
  # x86_64-apple-darwin, exactly what `native`'s steps build, each as its step does: its two test
  # targets packed with `cargo nextest archive`, one archive a step, and its four tools with `cargo
  # build`, the same packages, binaries and profile (debug) and no other flags. They are handed to
  # `native-cross` as an artifact of the run kept a day. geom-test's tests/queue_wiring.rs holds the
  # two jobs to `native`'s steps.
  native-cross-build:
    name: Development crates build (macOS x86-64 on macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # kernel.yml's pin.
      CARGO_NEXTEST_VERSION: "0.9.146"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only a push to main saves the cache; a pull request restores main's.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          key: dev-cross
          # Named without the runner image's own compilers (decision 32.90).
          add-rust-environment-hash-key: false
      - name: Install cargo-nextest ${{ env.CARGO_NEXTEST_VERSION }}
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: nextest@${{ env.CARGO_NEXTEST_VERSION }}
      - name: The folder handed to native-cross
        run: mkdir "$RUNNER_TEMP/dev-macos-x86-64"
      - name: Build the development-dependency rule for macOS x86-64
        run: cargo nextest archive --locked -p geom-test --test dependency_rule --target x86_64-apple-darwin --archive-file "$RUNNER_TEMP/dev-macos-x86-64/dependency_rule.tar.zst"
      - name: Build the predicates fuzz target for macOS x86-64
        run: cargo nextest archive --locked -p geom-fuzz --test predicates --target x86_64-apple-darwin --archive-file "$RUNNER_TEMP/dev-macos-x86-64/predicates.tar.zst"
      - name: Build the generator check for macOS x86-64
        run: cargo build --locked -p geom-gen --target x86_64-apple-darwin
      - name: Build the map check for macOS x86-64
        run: cargo build --locked -p geom-test --bin map --target x86_64-apple-darwin
      - name: Build the ledger check for macOS x86-64
        run: cargo build --locked -p geom-test --bin provenance --target x86_64-apple-darwin
      - name: Build the banned-source scan for macOS x86-64
        run: cargo build --locked -p geom-test --bin source-scan --target x86_64-apple-darwin
      - name: Put the four tools beside the archives
        run: cp target/x86_64-apple-darwin/debug/{geom-gen,map,provenance,source-scan} "$RUNNER_TEMP/dev-macos-x86-64/"
      # Kept for a day: the run job of this run downloads it within minutes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-macos-x86-64
          path: ${{ runner.temp }}/dev-macos-x86-64
          retention-days: 1
          if-no-files-found: error

  native-cross:
    name: Development crates (macOS x86-64, built on macOS arm64)
    needs: native-cross-build
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CARGO_NEXTEST_VERSION: "0.9.146"
    defaults:
      run:
        shell: bash
    steps:
      # The checkout is the archives' workspace (`--workspace-remap`), at the same path as on the
      # arm64 runner, where the tools also find it (each reads the workspace's path the build
      # gave it, `env!("CARGO_MANIFEST_DIR")`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo itself: the dependency rule runs `cargo metadata` at test time.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-nextest ${{ env.CARGO_NEXTEST_VERSION }}
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: nextest@${{ env.CARGO_NEXTEST_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dev-macos-x86-64
          path: ${{ runner.temp }}/dev-macos-x86-64
      # An artifact does not keep a file's mode.
      - name: Make the four tools executable
        run: chmod +x "$RUNNER_TEMP"/dev-macos-x86-64/{geom-gen,map,provenance,source-scan}
      # The locked crates' sources in cargo's registry, as `native`'s build left them, for the
      # dependency rule's `cargo metadata`.
      - name: Fetch the locked dependencies
        run: cargo fetch --locked
      # Each archive's every test, none filtered: the tests `native`'s steps run. The archive is
      # unpacked into the checkout, so its binaries sit at the path the arm64 build gave them.
      - name: The development-dependency rule, and CI's reruns of it
        run: cargo nextest run --archive-file "$RUNNER_TEMP/dev-macos-x86-64/dependency_rule.tar.zst" --workspace-remap . --extract-to . --extract-overwrite --no-fail-fast
      - name: The predicates fuzz target, in bolero's test mode and the seeded leg
        run: cargo nextest run --archive-file "$RUNNER_TEMP/dev-macos-x86-64/predicates.tar.zst" --workspace-remap . --extract-to . --extract-overwrite --no-fail-fast
      - name: Every committed generator output is current, with no orphan
        run: '"$RUNNER_TEMP/dev-macos-x86-64/geom-gen" check'
      - name: Every crate and module header is complete, and MAP.json is current
        run: '"$RUNNER_TEMP/dev-macos-x86-64/map" check'
      - name: PROVENANCE.md and NOTICE are current, and every port has its licence text
        run: '"$RUNNER_TEMP/dev-macos-x86-64/provenance" check'
      - name: No banned-source marker in the kernel's crates
        run: '"$RUNNER_TEMP/dev-macos-x86-64/source-scan" check'

  # The tests in parts side by side, each part building and running only its own test units (the
  # owner's rule of 15 minutes a job). On main's pushes e792e882e and 907247b27 (runs 44043473629
  # and 44052487974) this job, then one job, took 17 and 23 minutes, and most of it was running, not
  # building: the build took 3.2 and 3.7 minutes, and `cargo test` ran the 126 test binaries one
  # after another for 13.4 and 18.9. wasm32-wasip1 has no threads, so each binary ran its tests one
  # at a time too, the whole run on one core, and the runner's speed went straight into the job's
  # minutes (no kernel code changed between those two pushes). Running each test in its own process
  # under nextest did not help (run 44075158941: 18.5 minutes, of which 5.7 went on wasmtime compiling
  # every binary to list its tests, before any test ran). So each part runs `cargo test` as before on
  # its own units: a crate's library (`--lib`), its doctests (`--doc`), a binary or a test target,
  # shared out by their measured seconds (geom-test's src/wasm-dev-times.tsv, the slowest of main's
  # four runs above). `cargo run -p geom-test --bin kernel-quality -- wasm-dev-parts --parts 5`
  # writes the `part:` lines below, and geom-test's tests/test_scope.rs holds them to what it
  # writes and every test unit of the three crates to exactly one part.
  # Five parts since Phase 5: its sixteen more test units add 567 s by the Phase 5 branch's own
  # run of this job (run 44068113586), which would put each of four parts at 580 s of tests.
  # Phase 6's fifteen more units are not measured yet and are planned at the slowest listed time
  # (350 s each), so each part's plan reads 1,514 s until the job has measured them.
  wasm:
    name: Development crates (wasm32-wasip1 under wasmtime, part ${{ matrix.part.k }} of ${{ matrix.part.n }})
    runs-on: ubuntu-latest
    strategy:
      # Every part reports, so one failure does not hide another.
      fail-fast: false
      matrix:
        part:
          - { k: 1, n: 5, planned: 1514, run: "-p geom-fuzz --test adversarial --test arrange --test attributes --test booleans --test cbor --test nurbs --test pencils --test planes --test prune --test records --test sketch_motions --test surfaces --test transforms; -p geom-gen --test drift; -p geom-test --bin fixture --bin oracle --bin ssi-runner --test arc_reference --test attack_g11 --test certificates_workflow --test corpus_runs --test determinism --test fixture_tool --test naming --test nurbs_reference --test oracle_tool --test quality_gates --test second_mesh --test sketch_families_replay" }
          - { k: 2, n: 5, planned: 1514, run: "-p geom-fuzz --lib --test arrange_curves --test cache --test cdt --test curve_offsets --test intersect --test naming --test open --test orient2d --test quadric --test sketch_splines; -p geom-gen --test certificate_problems --test facade --test verus_twin; -p geom-test --bin golden --bin provenance --bin trip --test attack_g43 --test completeness --test ember_pairs --test exact_rank --test laws_names --test ledger_repo --test ledger_seeded --test oracle --test oracles_workflow --test replay --test seed_replay --test solidcore_job; -p geom-test --doc" }
          - { k: 3, n: 5, planned: 1514, run: "-p geom-fuzz --bin replay-hashes --test arenas --test batch --test crossings --test edit --test make --test maths --test operations --test predicates --test roots --test sequence --test sketch_text --test variants --test wide; -p geom-gen --test predicate_rounded; -p geom-test --bin guard --bin recursion --test attack_g10 --test attack_g135 --test attack_g15 --test contract_kit --test fixtures --test flat_reference --test fuzz_scope --test laws_mass --test laws_surfaces --test licences --test manifold_rust_oracle --test orient2d --test queue_wiring --test seeded_gates --test shipped --test ssi" }
          - { k: 4, n: 5, planned: 1514, run: "-p geom-fuzz --test boxtree --test contract --test encoder --test entity --test euler --test level --test natural --test piercing --test references --test snap --test solids --test surface_offsets; -p geom-gen --bin geom-gen --lib --test attack_g27 --test predicate_checker --test purity; -p geom-test --bin kernel-quality --bin source-scan --test attack_g13 --test attack_g17 --test attack_g19 --test corpus --test corpus_polyhedral --test kernel_quality_workflow --test laws_formats --test laws_intersections --test map_files --test oracle_families --test scan_repo --test ssi_tool --test truth_corpus; -p geom-fuzz --doc" }
          - { k: 5, n: 5, planned: 1514, run: "-p geom-fuzz --test attack_g14 --test bodies --test curves --test exact --test general --test linalg --test names --test p21 --test project --test reductions --test sketch_corpus --test zone; -p geom-gen --test write_check; -p geom-test --bin corpus --bin map --bin ssi --lib --test attack_g110 --test attack_g16 --test attack_g20 --test canonical --test dependency_rule --test laws_booleans --test laws_curves --test laws_numbers --test laws_nurbs --test map_repo --test map_seeded --test museum --test oracle_meshes --test oracle_sketches --test scan_seeded --test test_scope; -p geom-gen --doc" }
    env:
      WASMTIME_VERSION: v50.0.0
      # GitHub's digest of the release asset wasmtime-v50.0.0-x86_64-linux.tar.xz.
      WASMTIME_SHA256: 77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; a pull request restores main's (a pull request's own
          # caches filled the repository's cache limit and evicted what main saved).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Named without the runner image's own compilers (decision 32.90).
          add-rust-environment-hash-key: false
      - name: Install wasmtime ${{ env.WASMTIME_VERSION }}, checked against its SHA-256
        run: |
          cd "$RUNNER_TEMP"
          name="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 6 --retry-delay 10 --retry-connrefused -o "$name.tar.xz"             "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/$name.tar.xz"
          echo "${WASMTIME_SHA256}  $name.tar.xz" | sha256sum --check --strict
          tar -xJf "$name.tar.xz"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      # WebAssembly's shadow stack is 1 MiB by default and has no guard page. The pencil and
      # Sturm chain code sets its integers up in place, in small steps, so even an unoptimised
      # build needs well under that (measured natively: 640 KiB), and the tests run on the
      # default stack with no linker flag.
      # Each group of the part's arguments is one `cargo test` (cargo runs doctests alone), and every
      # group runs, so one run reports every failure.
      - name: geom-test, geom-fuzz (the seeded leg) and geom-gen on a 32-bit target
        env:
          RUN: ${{ matrix.part.run }}
        run: |
          status=0
          IFS=';' read -ra groups <<< "$RUN"
          for group in "${groups[@]}"; do
            echo "cargo test${group} --target wasm32-wasip1"
            cargo test --locked $group --target wasm32-wasip1 -- --nocapture || status=1
          done
          exit "$status"

  verus:
    name: Verus proves the twins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Verus release the twins are verified with, by its tag, its Linux archive and the
      # SHA-256 GitHub publishes for that archive, and the Rust release it names (its
      # version.json); change all four together.
      VERUS_RELEASE: "release/0.2026.10.18.7d82994"
      VERUS_ARCHIVE: "verus-0.2026.10.18.7d82994-x86-linux.zip"
      VERUS_SHA256: "e9af03732d4bdd32b93a8fcf471706739c24c1473fa5086618d96c47237845dd"
      VERUS_RUST: "1.99.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Verus release, checked against its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$VERUS_RELEASE" --repo verus-lang/verus \
            --pattern "$VERUS_ARCHIVE" --dir "$RUNNER_TEMP"
          echo "$VERUS_SHA256  $RUNNER_TEMP/$VERUS_ARCHIVE" | sha256sum --check
          unzip -q "$RUNNER_TEMP/$VERUS_ARCHIVE" -d "$RUNNER_TEMP/verus"
          verus=$(find "$RUNNER_TEMP/verus" -type f -name verus -perm -u+x | head -n 1)
          test -n "$verus"
          rustup toolchain install "$VERUS_RUST" --profile minimal
          dirname "$verus" >> "$GITHUB_PATH"
      # Gate 1 (G43): Verus must first fail on a planted violation, a carry dropped from the wide
      # integers' twin (geom-test's trip module and binary, built with the kernel's toolchain).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Verus fails on a planted violation
        run: >-
          cargo run --locked -q -p geom-test --bin trip -- verus --
          verus --crate-type=lib projects/engines/geometry/crates/geom-num/verus/lib.rs
      - name: Verus verifies geom-num's twins (the wide integers and the four explicit-point predicates)
        run: verus --crate-type=lib projects/engines/geometry/crates/geom-num/verus/lib.rs
      - name: Verus verifies geom-topo's model of the Euler operators
        run: verus --crate-type=lib projects/engines/geometry/crates/geom-topo/verus/lib.rs
