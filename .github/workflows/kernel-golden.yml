name: Kernel goldens

# The geometry kernel's golden store (kernel architecture, chapter 28.13; piece G19):
# projects/engines/geometry/crates/geom-test/golden/store.json, every golden digest of the kernel
# keyed by kernel edition, golden id and operation versions, with the record of every change.
# kernel.yml runs every golden of the store on every target and build mode (`golden run`); this
# workflow holds the store to its rules:
#
# - `golden check`, on every pull request and push that touches the kernel: every golden is checked
#   where the store says (its test function exists and calls golden::check with the golden's id),
#   every golden check in the kernel's code is in the store, no golden digest is kept outside it,
#   and every pinned golden file (geom-bench's src/golden.txt) still has the store's digest.
# - `golden diff`, on every pull request that edits the store: the store at the pull request's base
#   against the store it would merge, held to the store's own record (decision 32.54; geom-test's
#   src/golden/diff.rs). Every stored answer that moves carries exactly one new history record in
#   the store: the old digest (`sha256`), its `kind`, one the golden allows (bug, improvement or
#   corpus; only corpus on a golden that covers operation versions), its `piece` and `why`. A move
#   with no record, a record whose digest is not the old one, a kind the golden does not allow or
#   an empty reason fails, and so do any change to a frozen edition, a removed or renamed edition,
#   a removed golden, rewritten history and releasing an edition, until the first Stable release
#   (G482) writes the rule a release is held to. The step prints each moved answer with its
#   record, and the main session's merge record names each one. Adding goldens, and an edit that
#   moves no answer (where a golden is checked, the file it pins, what it covers), pass: `golden
#   check` holds those to the repository.
#
# Before the first kernel edition the store holds one open edition, "pre-edition", and every change
# to a golden is recorded in its pull request (chapter 32.12, recommendation A; decision 32.54).
#
# The second job holds the fixtures (chapter 28.16; piece G97) to their rules, on the same terms:
#
# - `fixture check`: every fixture holds its rules and sits where its id says.
# - `fixture run`: the fast fixtures pass; slow ones run in kernel-nightly.yml.
# - `fixture diff`, on every pull request that edits the fixtures: the fixtures at the pull
#   request's base against those it would merge, held to their own records (decision 32.55;
#   geom-test's src/fixture/diff.rs). A removed fixture, a changed log or source, Pass become
#   Known, a work count that moves alone, or a change to a frozen edition fails outright. Every
#   other changed expectation, and a Known fixture's changed wanted result, carries a new history
#   record in the fixture: what it was (`was`), its `kind`, one the fixture's rules allow (corpus
#   only where the hash alone moved; bug or improvement only in pre-edition), its `piece` and
#   `why`. A change with no record, a record of another old value, a kind the rules do not allow or
#   an empty reason fails. The step prints each changed expectation with its record, and the main
#   session's merge record names each one. Adding a fixture, and moving a Known fixture to Pass
#   with what it wanted, need no record.
# - The fails-on-base check, on every pull request: a new fixture whose source records a fix must
#   fail on the merge base. `fixture fixes` lists them, the base is checked out with those files
#   copied in, and `fixture fails` requires each to fail there (a crash or a hang counts as
#   failing). `fixture run` above is the other half: it passes with the fix. Oracle outcomes "their
#   bug" and "both within bounds", and Known fixtures, are exempt (28.16, step 3).
#
# Neither job reads a review: one account opens every pull request and no kernel owner reviews
# them, so the approval both steps used to wait for never came (decisions 32.54 and 32.55), and a
# review starts no run.
#
# If this workflow becomes a required check, note that the pull_request path filter below means a
# pull request outside those paths never runs it; drop the filter or require a summary job first.
#
# Supply chain: every action is pinned to the same full commit as in kernel.yml; update a pin in
# all the kernel workflows together, after reviewing the new commit. The token can read the
# repository, nothing more.

on:
  pull_request:
    paths:
      - "projects/engines/geometry/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/kernel-golden.yml"
  push:
    branches: [main]
    paths:
      - "projects/engines/geometry/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/kernel-golden.yml"
  # Run whole by kernel-release.yml on a release tag, with every other kernel workflow (28.17).
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes; pushes to main all run.
concurrency:
  group: kernel-golden-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  # The same pinned compiler as kernel.yml (chapter 28.13, the toolchain guard).
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  store:
    name: Golden store
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base commit's store is read with `git show`, so the history is fetched.
          fetch-depth: 0
      # The base compared with is the one the merge would land on: for a pull request the checkout
      # is GitHub's test merge commit, refs/pull/<n>/merge, whose first parent is the base branch's
      # tip it was made on, so the diff is exactly what merging does to the store. The event's
      # base.sha can be older than that tip, and a diff from it would count the base branch's own
      # later edits as this pull request's. A checkout with one parent falls back to base.sha.
      - name: Does this pull request edit the golden store?
        id: edits
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          store=projects/engines/geometry/crates/geom-test/golden/store.json
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "store=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            BASE=$(git rev-parse HEAD^1)
          else
            BASE=$EVENT_BASE
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$BASE" HEAD -- "$store"; then
            echo "The store is the same as at the base, $BASE."
            echo "store=same" >> "$GITHUB_OUTPUT"
          else
            git diff --stat "$BASE" HEAD -- "$store"
            echo "store=edited" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; a pull request restores main's (a pull request's own
          # caches filled the repository's cache limit and evicted what main saved).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The store against the repository
        run: cargo run --locked -p geom-test --bin golden -- check
      - name: Every moved answer carries its record in the store
        if: github.event_name != 'push' && steps.edits.outputs.store == 'edited'
        env:
          BASE: ${{ steps.edits.outputs.base }}
        run: cargo run --locked -p geom-test --bin golden -- diff --base "$BASE"

  fixtures:
    name: Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      FIXTURES: projects/engines/geometry/crates/geom-test/fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base commit's fixtures are read with `git show`, and its tree is checked out.
          fetch-depth: 0
      # As the store's job: the base is the first parent of GitHub's test merge commit, so the diff
      # is what merging does to the fixtures.
      - name: Does this pull request edit the fixtures?
        id: edits
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "fixtures=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            BASE=$(git rev-parse HEAD^1)
          else
            BASE=$EVENT_BASE
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$BASE" HEAD -- "$FIXTURES"; then
            echo "The fixtures are the same as at the base, $BASE."
            echo "fixtures=same" >> "$GITHUB_OUTPUT"
          else
            git diff --stat "$BASE" HEAD -- "$FIXTURES"
            echo "fixtures=edited" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Every fixture holds its rules
        run: cargo run --locked -p geom-test --bin fixture -- check
      # The corpus register (28.12; piece G114): no unlicensed or non-commercial file is vendored,
      # no credit is missing, and every stored corpus is byte for byte what the register pins.
      - name: Every corpus holds its rules, and every vendored file its register entry
        run: cargo run --locked -p geom-test --bin corpus -- check
      # The oracle catalogue and the triage register (28.10; piece G113): each holds its rules, and
      # Cargo.lock holds no package an out-of-process oracle would bring in.
      - name: No oracle is linked
        run: cargo run --locked -p geom-test --bin oracle -- check
      - name: The fast fixtures pass
        run: cargo run --locked -p geom-test --bin fixture -- run --tier fast
      # Reference mode (23.13; piece G106): caches and the generated filters off. The fixtures meet
      # the same goldens, and seeded logs give the same hash, names and measures line by line.
      - name: The fixtures pass in reference mode
        run: cargo run --locked -p geom-test --features reference --bin fixture -- run --tier fast
      - name: Reference mode replays every seeded log to the same answers
        run: |
          cargo run --locked --release -p geom-fuzz --bin replay-hashes > "$RUNNER_TEMP/normal.txt"
          cargo run --locked --release -p geom-fuzz --features reference --bin replay-hashes \
            > "$RUNNER_TEMP/reference.txt"
          test -s "$RUNNER_TEMP/normal.txt"
          diff "$RUNNER_TEMP/normal.txt" "$RUNNER_TEMP/reference.txt"
      - name: Every changed expectation carries its record in the fixture
        if: github.event_name != 'push' && steps.edits.outputs.fixtures == 'edited'
        env:
          BASE: ${{ steps.edits.outputs.base }}
        run: cargo run --locked -p geom-test --bin fixture -- diff --base "$BASE"
      - name: New fixtures that record a fix fail on the merge base
        if: github.event_name == 'pull_request' && steps.edits.outputs.fixtures == 'edited'
        env:
          BASE: ${{ steps.edits.outputs.base }}
        run: |
          cargo run --locked -p geom-test --bin fixture -- fixes --base "$BASE" > "$RUNNER_TEMP/fixes.txt"
          if [ ! -s "$RUNNER_TEMP/fixes.txt" ]; then
            echo "No new fixture records a fix."
            exit 0
          fi
          cat "$RUNNER_TEMP/fixes.txt"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          while read -r id; do
            mkdir -p "$RUNNER_TEMP/base/$FIXTURES/$(dirname "$id")"
            cp "$FIXTURES/$id.json" "$RUNNER_TEMP/base/$FIXTURES/$id.json"
          done < "$RUNNER_TEMP/fixes.txt"
          cd "$RUNNER_TEMP/base"
          xargs cargo run --locked -p geom-test --bin fixture -- fails < "$RUNNER_TEMP/fixes.txt"
