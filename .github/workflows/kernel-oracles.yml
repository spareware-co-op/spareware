name: Kernel oracles

# The geometry kernel's checks that need something outside the repository's test suite: a
# container with an outside oracle, a download, or minutes of slow fixtures (chapters 28.10, 28.12,
# 28.16 and 28.17). They run after a change lands, on a push to main, and only for what that push
# can reach (the owner's testing principle 2, decision 32.53): the job `scope` runs geom-test's
# `kernel-quality test-scope` on the files the push changed, and each job runs only when the crate
# whose tests it runs is among the crates named. The mesh comparisons (`meshes-images` and
# `meshes`) also run on a pull request, measured against its merge commit's first parent; the
# other jobs do not. By hand (`workflow_dispatch`) and on a release tag (kernel-release.yml calls
# this workflow) every job runs. Nothing runs on a timer.
#
# - Slow fixtures (piece G97, 28.16): geom-test's `fixture run --tier slow`.
# - Fetched corpora (piece G114, 28.12): geom-test's `corpus fetch` downloads each at its pinned
#   source and checks it against the register's digest.
# - Bertolazzi and Frego's Clothoids library (piece G63, 28.10 and 17.8), built from source at a
#   pinned commit in a container pinned by digest, evaluates the run's seeded clothoids, and
#   geom-curve's tests/clothoids_oracle.rs compares every point with the kernel's certified
#   enclosure, settling any difference by a fixed-point truth.
# - Python's cbor2 (piece G86): geom-op's tests/cbor2_oracle.rs writes the run's seeded values of
#   SKG's subset with the kernel's canonical CBOR, cbor2 6.1.5 (pinned by hash) encodes each value
#   in its canonical mode in a container pinned by digest and reads the kernel's bytes back, and
#   the test fails on any byte that differs.
# - zcbor: geom-format's archived body records and every kind, validated against their CDDL.
# - Manifold (Apache-2.0) and CGAL (GPL-3.0-or-later, run only as a separate program, never linked
#   and never read, decision 32.6) on mesh booleans (piece G154, 28.10; Gate 4, G156), when the
#   change reaches geom-mesh or geom-test. Each image is built from its harness in the oracle
#   repository (spareware-co-op/oracles) at `ORACLES_COMMIT`, and kept in this repository's Actions
#   cache under the key of that folder's tree, so a push restores it and builds nothing; it is
#   never pushed to any registry (29.20, rule 8). `meshes-images` builds an image only when no run
#   has kept it; `meshes` runs one leg per oracle and case set (`geom_test::oracle::meshes::
#   CASE_SETS`: the seeded solids and Manifold's stored models), each writing its jobs with
#   `oracle jobs`, running the image on them without a network, and judging the answers with
#   `oracle compare`, which fails on any difference whose signature and job
#   `geom-test/oracles/triaged.json` does not hold.
#   The comparison names the leg's case set: a model the set records as refused is not sent to the
#   oracle, and the kernel must refuse it exactly as recorded; a job on a model that crosses itself,
#   which the oracle's documentation says it does not take, is judged by the exact reference alone
#   (decision 32.59). A case set is one line of the matrix.
#
# Each seeded job's seed is the run's number in hexadecimal, printed first, so a failure replays
# exactly: rerun the job, or set SPAREKIT_SEED to the printed value. The predicates' verification
# suite and attack tests, the kinds' and NURBS laws and the proven maths functions against the
# big-integer reference are quick seeded tests of the normal suite (kernel.yml).
#
# --locked: Cargo.lock is committed and must already list every dependency (28.13, the toolchain
# guard).
#
# Supply chain: every action is pinned to the same full commit as in kernel.yml, checked against
# its tag when it was pinned there (the tag beside each); update a pin in all the kernel workflows
# together, and only after reviewing the new commit. The workflow can only read the repository.

on:
  push:
    branches: [main]
    paths:
      - "projects/engines/geometry/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/kernel-oracles.yml"
  # The mesh comparisons only: `scope` gives every other job no crate on a pull request.
  pull_request:
    paths:
      - "projects/engines/geometry/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/kernel-oracles.yml"
  # By hand, from the Actions tab: every job.
  workflow_dispatch:
  # Run whole by kernel-release.yml on a release tag, with every other kernel workflow (28.17).
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes; a run on main is never
# cancelled.
concurrency:
  group: kernel-oracles-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The same pinned compiler as kernel.yml (chapter 28.13, the toolchain guard).
  RUST_TOOLCHAIN: "1.99.0"
  # The oracle repository's commit whose Manifold and CGAL harnesses the mesh jobs run: CGAL's
  # harness reading a solid shell by shell (spareware-co-op/oracles#4).
  ORACLES_COMMIT: d9817fe4ecf67da5926b253f34f1f85101c9ecf5
  # How many seeded mesh jobs a leg writes.
  MESH_JOBS: "2000"

jobs:
  # The crates whose tests the push reaches: every crate by hand and on a release tag.
  scope:
    name: Which crates' tests the push reaches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # What every job but the mesh comparisons reads: no crate on a pull request, so they skip it.
      crates: ${{ github.event_name != 'pull_request' && steps.scope.outputs.crates || '' }}
      # What the mesh comparisons read, on every event.
      reached: ${{ steps.scope.outputs.crates }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: The files the push touches
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request against its merge commit's first parent, a push to main against the
          # commit main was at; none (every crate) by hand, on a release tag or a first push.
          base=""
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push) if [ "$GITHUB_REF" = refs/heads/main ]; then base="$BEFORE"; fi ;;
          esac
          case "$base" in 0000000000000000000000000000000000000000) base="" ;; esac
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null             && ! git fetch -q --no-tags --depth 1 origin "$base"; then
            base=""
          fi
          if [ -n "$base" ]; then
            git diff --no-ext-diff --no-renames --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
            echo "SCOPE=--changed $RUNNER_TEMP/changed.txt --base $base" >> "$GITHUB_ENV"
          else
            echo "SCOPE=--all" >> "$GITHUB_ENV"
          fi
      - name: The crates whose tests it can reach, and why
        id: scope
        run: >-
          cargo run --locked -q -p geom-test --bin kernel-quality -- test-scope $SCOPE
          --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

  slow-fixtures:
    name: Slow fixtures
    needs: scope
    if: contains(format(' {0} ', needs.scope.outputs.crates), ' geom-test ')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Every slow fixture
        run: cargo run --locked --release -p geom-test --bin fixture -- run --tier slow

  corpora:
    name: Fetched corpora, by their digests
    needs: [scope, ember-corpus]
    if: contains(format(' {0} ', needs.scope.outputs.crates), ' geom-test ')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # EMBER's corpus as the job ember-corpus fetched it this run, so it is not fetched twice;
      # `corpus fetch` still holds the whole tree to the register's digest ("already here").
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpora/ember-cleared-pairs
          key: ember-cleared-pairs-all-${{ needs.ember-corpus.outputs.digest }}
          fail-on-cache-miss: true
      - name: Every fetched corpus, unmodified
        run: cargo run --locked --release -p geom-test --bin corpus -- fetch --cache "$RUNNER_TEMP/corpora"

  ember-corpus:
    # Gate 4 (G156): EMBER's cleared pairs' corpus (299 MB), fetched once a run for the jobs
    # `ember-pairs` and `corpora`, and kept in GitHub's cache under the register's digest of it
    # (`ember-cleared-pairs-all-<digest>`), so a later run with the same corpus fetches nothing.
    # When the cache holds it, the lookup downloads nothing and the job ends. The key changes with
    # the register's digest, and cache-prune.yml keeps main's newest copy of each.
    name: EMBER's cleared pairs' corpus, fetched once
    needs: scope
    if: contains(format(' {0} ', needs.scope.outputs.crates), ' geom-test ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The register's digest of the corpus
        id: digest
        run: |
          set -euo pipefail
          digest=$(jq -r '.corpora[] | select(.id == "ember-cleared-pairs") | .sha256' \
            projects/engines/geometry/crates/geom-test/corpora/manifest.json)
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no digest for ember-cleared-pairs"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Saved at the end of the job when the lookup misses.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ runner.temp }}/corpora/ember-cleared-pairs
          key: ember-cleared-pairs-all-${{ steps.digest.outputs.digest }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: The corpus, unmodified
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo run --locked --release -p geom-test --bin corpus -- fetch --cache "$RUNNER_TEMP/corpora" ember-cleared-pairs

  ember-pairs:
    # Gate 4 (G156): EMBER's pairs whose models' own licences rule (i) of 32.11 admits, each run as
    # EMBER runs it through geom-mesh's boolean, both mesh checkers and the flat reference
    # (geom-test's tests/ember_pairs.rs, `every_cleared_pair_is_the_reference`, ignored in the
    # suite because it reads a download). Each job takes only its own pairs' models: from its own
    # cache entry (`ember-cleared-pairs-from-<first pair>-<digest>-<pairs' hash>`), or, the first
    # time, from the whole corpus ember-corpus keeps, cut to its pairs' models and saved as its
    # own. The test holds every file it reads to that file's SHA-256 in the register. The pairs
    # are split over jobs by the test's own filter (SPAREKIT_PAIRS) by their measured seconds
    # (each group's beside it, whole runs on one core of a development machine, the reference
    # included), about nine minutes a job, so none passes 15; each runs the test ember-build
    # built, and compiles nothing itself. `every_cleared_pair_runs_in_one_job`
    # holds every cleared pair to exactly one group here.
    name: EMBER's cleared pairs to the reference (${{ matrix.pairs }})
    needs: [scope, ember-corpus, ember-build]
    if: contains(format(' {0} ', needs.scope.outputs.crates), ' geom-test ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every cleared pair, once, by its number in EMBER's list.
        pairs:
          - "1,11,73,216,530,777,998" # 552 s
          - "68,173,295,303,337,427,594,804" # 556 s
          - "79,437,562,618,720,799,836,839" # 548 s
          - "98,134,208,213,379,523,543,726" # 553 s
          - "111,277,317,356,399,644,947" # 548 s
          - "164,221,269,310,461,827,837,929" # 551 s
          - "169,224,349,389,727,848,933" # 551 s
          - "189,324,589,615,738,852,934" # 555 s
          - "238" # 574 s
          - "248,304,360,377,459,667,675,676" # 552 s
          - "291,321,350,447,654,689,930" # 554 s
          - "387,395,438,608,774,788,815,951" # 552 s
          - "432,553,640,659,688,698,703,915" # 555 s
    defaults:
      run:
        shell: bash
    steps:
      # The test built once by ember-build; this job compiles nothing and checks nothing out.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ember-pairs-test
          path: ${{ runner.temp }}/test
      - name: This job's cache key
        id: key
        env:
          PAIRS: ${{ matrix.pairs }}
          DIGEST: ${{ needs.ember-corpus.outputs.digest }}
        run: |
          set -euo pipefail
          hash=$(printf '%s' "$PAIRS" | sha256sum | cut -c1-16)
          echo "key=ember-cleared-pairs-from-${PAIRS%%,*}-$DIGEST-$hash" >> "$GITHUB_OUTPUT"
      # Saved at the end of the job, holding only this job's models, when its own entry missed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: models
        with:
          path: ${{ runner.temp }}/corpora/ember-cleared-pairs
          key: ${{ steps.key.outputs.key }}
          restore-keys: ember-cleared-pairs-all-${{ needs.ember-corpus.outputs.digest }}
      - name: Only this job's pairs' models, cut from the whole corpus
        if: steps.models.outputs.cache-hit != 'true'
        env:
          PAIRS: ${{ matrix.pairs }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/corpora/ember-cleared-pairs"
          cases="$dir/ember-benchmark-cases.json"
          [ -f "$cases" ] || { echo "::error::the cache holds no ember-cleared-pairs"; exit 1; }
          keep=$(jq -r --arg pairs "$PAIRS" \
            '. as $c | $pairs | split(",") | .[] | tonumber | $c[.] | "\(.id_a).stl", "\(.id_b).stl"' "$cases")
          for f in "$dir"/*.stl; do
            grep -qxF "$(basename "$f")" <<< "$keep" || rm -- "$f"
          done
          echo "Kept $(find "$dir" -name '*.stl' | wc -l) models for pairs $PAIRS"
      - name: The pairs named here, to the reference
        env:
          SPAREKIT_CORPORA: ${{ runner.temp }}/corpora
          SPAREKIT_PAIRS: ${{ matrix.pairs }}
        run: |
          chmod +x "$RUNNER_TEMP/test/ember_pairs"
          "$RUNNER_TEMP/test/ember_pairs" --ignored --exact every_cleared_pair_is_the_reference --nocapture

  ember-build:
    # Gate 4 (G156): geom-test's tests/ember_pairs.rs built once in release for every job of
    # ember-pairs, which run the binary it keeps for a day (a build there would take most of a
    # job's 15 minutes; measured on 4 threads of a busy development machine, 584 s without a
    # cache).
    name: EMBER's pairs' test, built once
    needs: scope
    if: contains(format(' {0} ', needs.scope.outputs.crates), ' geom-test ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; another ref restores main's. It is the one cache of
          # geom-test's release test build on Linux x86-64: kernel.yml's large-models builds the
          # same dependencies and restores it (decision 32.90).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: geom-test-release-tests-${{ env.RUST_TOOLCHAIN }}
          add-rust-environment-hash-key: false
      - name: The test, in release
        run: |
          set -euo pipefail
          exe=$(cargo test --locked --release -p geom-test --test ember_pairs --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "ember_pairs" and .executable != null) | .executable')
          [ -x "$exe" ] || { echo "::error::no ember_pairs test binary"; exit 1; }
          mkdir -p "$RUNNER_TEMP/test" && cp "$exe" "$RUNNER_TEMP/test/ember_pairs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ember-pairs-test
          path: ${{ runner.temp }}/test/ember_pairs
          retention-days: 1
          if-no-files-found: error

  clothoids:
    name: Clothoids, out of process
    needs: scope
    if: contains(format(' {0} ', needs.scope.outputs.crates), ' geom-curve ')
    runs-on: ubuntu-latest
    # Measured (G63): the oracle builds in about a minute on twenty cores, so a few on a hosted
    # runner's four; the comparison takes seconds.
    timeout-minutes: 60
    env:
      # Bertolazzi and Frego's Clothoids (BSD-2-Clause), at the commit chapter 17.8 cites; its
      # submodules come at the commits it records.
      CLOTHOIDS_COMMIT: dafdc29acee5c4f25e777c6cffe56ecb39b0ec11
      # gcc:13.3.0, pinned by digest.
      GCC_IMAGE: gcc:13.3.0@sha256:1d71f0f3450214bef38fe09e6f610fb6cca90cf97b43f4ce845bfc32a4168818
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: This run's seed, printed, and the files
        run: |
          set -euo pipefail
          seed=$(printf '%016x' "$GITHUB_RUN_ID")
          echo "SPAREKIT_SEED=$seed" >> "$GITHUB_ENV"
          echo "seed: $seed (replay with SPAREKIT_SEED=$seed)"
          mkdir -p "$RUNNER_TEMP/clothoids"
          echo "CLOTHOIDS_CASES=$RUNNER_TEMP/clothoids/cases.txt" >> "$GITHUB_ENV"
          echo "CLOTHOIDS_ANSWERS=$RUNNER_TEMP/clothoids/answers.txt" >> "$GITHUB_ENV"
      - name: This run's cases
        run: >-
          cargo test --locked --release -p geom-curve --test clothoids_oracle
          -- --ignored --exact write_the_cases --nocapture
      - name: Clothoids at the pinned commit, built and run in the container
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/clothoids"
          git clone --quiet https://github.com/ebertolazzi/Clothoids.git "$dir/src"
          git -C "$dir/src" checkout --quiet "$CLOTHOIDS_COMMIT"
          git -C "$dir/src" submodule --quiet update --init --recursive
          docker run --rm -i -v "$PWD:/work:ro" -v "$dir:/oracle" -w /work "$GCC_IMAGE" \
            bash projects/engines/geometry/crates/geom-curve/oracles/clothoids.sh \
            /oracle/src /oracle/build < "$CLOTHOIDS_CASES" > "$CLOTHOIDS_ANSWERS"
      - name: The kernel against Clothoids' points
        run: >-
          cargo test --locked --release -p geom-curve --test clothoids_oracle
          -- --ignored --exact compare_with_the_answers --nocapture

  cbor2:
    name: Canonical CBOR against cbor2, out of process
    needs: scope
    if: contains(format(' {0} ', needs.scope.outputs.crates), ' geom-op ')
    runs-on: ubuntu-latest
    # The kernel's cases build and run in a few minutes; cbor2 installs from one wheel and encodes
    # them in seconds.
    timeout-minutes: 30
    env:
      # python:3.13-slim, pinned by digest; oracles/cbor2.sh pins cbor2 6.1.5's wheel by SHA-256.
      PYTHON_IMAGE: python:3.13-slim@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: This run's seed, printed, and the files
        run: |
          set -euo pipefail
          seed=$(printf '%016x' "$GITHUB_RUN_ID")
          echo "SPAREKIT_SEED=$seed" >> "$GITHUB_ENV"
          echo "seed: $seed (replay with SPAREKIT_SEED=$seed)"
          mkdir -p "$RUNNER_TEMP/cbor2"
          echo "CBOR2_CASES=$RUNNER_TEMP/cbor2/cases.txt" >> "$GITHUB_ENV"
          echo "CBOR2_ANSWERS=$RUNNER_TEMP/cbor2/answers.txt" >> "$GITHUB_ENV"
      - name: This run's cases
        run: >-
          cargo test --locked --release -p geom-op --test cbor2_oracle
          -- --ignored --exact write_the_cases --nocapture
      - name: cbor2 6.1.5, in the container
        run: |
          set -euo pipefail
          docker run --rm -i -v "$PWD:/work:ro" -w /work "$PYTHON_IMAGE" \
            bash projects/engines/geometry/crates/geom-op/oracles/cbor2.sh \
            < "$CBOR2_CASES" > "$CBOR2_ANSWERS"
      - name: The kernel against cbor2's encodings
        run: >-
          cargo test --locked --release -p geom-op --test cbor2_oracle
          -- --ignored --exact compare_with_the_answers --nocapture

  zcbor:
    name: Body records and kinds against their CDDL, with zcbor
    needs: scope
    if: contains(format(' {0} ', needs.scope.outputs.crates), ' geom-format ')
    runs-on: ubuntu-latest
    # The writers build and run in a few minutes; zcbor validates each file in well under a second.
    timeout-minutes: 30
    env:
      # python:3.13-slim, pinned by digest, as the cbor2 job; oracles/zcbor.sh pins zcbor 0.9.1 and
      # its three dependencies' wheels by SHA-256.
      PYTHON_IMAGE: python:3.13-slim@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: The archived body records and every kind, one file each
        run: |
          set -euo pipefail
          echo "ZCBOR_DIR=$RUNNER_TEMP/zcbor" >> "$GITHUB_ENV"
          export ZCBOR_DIR="$RUNNER_TEMP/zcbor"
          cargo test --locked --release -p geom-format --test registry --test kinds \
            -- --ignored --exact write_the_body_payloads write_the_kinds --nocapture
      - name: zcbor 0.9.1, in the container
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work:ro" -v "$ZCBOR_DIR:/cases:ro" -w /work "$PYTHON_IMAGE" \
            bash projects/engines/geometry/crates/geom-format/oracles/zcbor.sh \
            projects/engines/geometry/format/cddl/body.cddl /cases

  # Each mesh oracle's image, from its harness at ORACLES_COMMIT, kept in the Actions cache under
  # its folder's tree: a run that finds it there does nothing more, so only a new pin builds. Only
  # a run on main saves the cache, so there is one copy of each image for every pull request to
  # restore (a pull request's own copies, 1.4 GB each time, filled the repository's cache limit and
  # got main's build caches thrown out). A run that builds (a pull request that moved the pin, or
  # main's copy thrown out) hands its image to `meshes` as an artifact kept one day, never as a
  # cache entry. The
  # oracle repository is audited first (nothing there can publish an image, and every base image is
  # pinned by digest), and the image is saved as a file, never pushed anywhere (29.20, rule 8).
  meshes-images:
    name: ${{ matrix.oracle }}'s image, from its pinned source
    needs: scope
    if: contains(format(' {0} ', needs.scope.outputs.reached), ' geom-mesh ') || contains(format(' {0} ', needs.scope.outputs.reached), ' geom-test ')
    runs-on: ubuntu-latest
    # Only a new pin builds: the oracle repository's own builds took up to about fifty minutes.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        oracle: [manifold, cgal]
    env:
      ORACLE: ${{ matrix.oracle }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spareware-co-op/oracles
          ref: ${{ env.ORACLES_COMMIT }}
          persist-credentials: false
          path: oracles
      - name: The image's key, from its pinned source
        id: key
        run: echo "key=oracle-image-$ORACLE-$(git -C oracles rev-parse "HEAD:$ORACLE")" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: kept
        with:
          path: ${{ runner.temp }}/image
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.kept.outputs.cache-hit != 'true'
        with:
          persist-credentials: false
          path: kernel
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        if: steps.kept.outputs.cache-hit != 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Nothing there can publish, and every base image is pinned
        if: steps.kept.outputs.cache-hit != 'true'
        working-directory: kernel
        run: cargo run --locked --release -p geom-test --bin oracle -- check --repository "$GITHUB_WORKSPACE/oracles"
      - name: The image, built from its pinned source and saved as a file
        if: steps.kept.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image"
          docker build --tag "oracle-$ORACLE:local" "oracles/$ORACLE"
          docker save --output "$RUNNER_TEMP/image/image.tar" "oracle-$ORACLE:local"
          ls -l "$RUNNER_TEMP/image"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.kept.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/image
          key: ${{ steps.key.outputs.key }}
      # For this run's `meshes` legs when the cache did not hold the image: an artifact of this run
      # (nothing else's), one day, the tar file as it is.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.kept.outputs.cache-hit != 'true'
        with:
          name: oracle-image-${{ matrix.oracle }}
          path: ${{ runner.temp }}/image/image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # One leg per mesh oracle and case set. A leg writes the run's jobs of its set, runs the oracle's
  # image on them in a container with no network, and judges the answers; a signature the triage
  # register does not hold fails it (28.10). Every leg keeps its jobs, answers and comparison for
  # triage, whatever the comparison found. A new case set (`geom_test::oracle::meshes::CASE_SETS`)
  # is one line of `cases`.
  meshes:
    name: ${{ matrix.oracle }} on ${{ matrix.cases }}
    needs: [scope, meshes-images]
    if: contains(format(' {0} ', needs.scope.outputs.reached), ' geom-mesh ') || contains(format(' {0} ', needs.scope.outputs.reached), ' geom-test ')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        oracle: [manifold, cgal]
        cases:
          - seeded
          - manifold-models
    env:
      ORACLE: ${{ matrix.oracle }}
      CASES: ${{ matrix.cases }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: kernel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spareware-co-op/oracles
          ref: ${{ env.ORACLES_COMMIT }}
          persist-credentials: false
          path: oracles
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Nothing there can publish, and every base image is pinned
        working-directory: kernel
        run: cargo run --locked --release -p geom-test --bin oracle -- check --repository "$GITHUB_WORKSPACE/oracles"
      - name: The image's key, from its pinned source
        id: key
        run: echo "key=oracle-image-$ORACLE-$(git -C oracles rev-parse "HEAD:$ORACLE")" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: kept
        with:
          path: ${{ runner.temp }}/image
          key: ${{ steps.key.outputs.key }}
      # No copy in the cache: this run's `meshes-images` built it and kept it as an artifact. A
      # missing artifact fails the step, and the next step fails on a missing or empty file.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.kept.outputs.cache-hit != 'true'
        with:
          name: oracle-image-${{ matrix.oracle }}
          path: ${{ runner.temp }}/image
      - name: The image, from the cache or this run's artifact
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/image/image.tar" ] || { echo "::error::no image for $ORACLE: not in the cache, not in this run's artifacts"; exit 1; }
          docker load --input "$RUNNER_TEMP/image/image.tar"
      - name: The run's jobs, the oracle's answers, and the comparison
        working-directory: kernel
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/meshes"
          mkdir -p "$out"
          given=()
          if [ "$CASES" = seeded ]; then
            seed=$(printf '%016x' "$GITHUB_RUN_ID")
            echo "seed: $seed"
            given=(--seed "$seed" --count "$MESH_JOBS")
          fi
          cargo run --locked --release -p geom-test --bin oracle -- jobs "$ORACLE" --cases "$CASES" "${given[@]}" > "$out/jobs.jsonl"
          time docker run --rm -i --network none "oracle-$ORACLE:local" < "$out/jobs.jsonl" > "$out/answers.jsonl"
          time cargo run --locked --release -p geom-test --bin oracle -- compare "$ORACLE" --cases "$CASES" --jobs "$out/jobs.jsonl" --answers "$out/answers.jsonl" | tee "$out/compare.txt"
      - name: The run's jobs, answers and differences, kept for triage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meshes-${{ matrix.oracle }}-${{ matrix.cases }}
          path: ${{ runner.temp }}/meshes
          retention-days: 90
          if-no-files-found: warn
