name: Kernel certificates

# Machine-checked proofs of the geometry kernel's f64 filter bounds (chapter 28.6 of the kernel
# architecture, projects/engines/geometry/architecture/28-testing.md; pieces G35 and G40). A filter
# claims that a computed value beyond its bound has the exact value's sign. geom-gen writes each
# filter's claim as a problem for two independent tools
# (projects/engines/geometry/crates/geom-gen/generated/gappa-*.g and fptaylor-*.fpt), and each
# tool runs here in a container pinned by digest, out of process:
#
# - Gappa proves the claim for binary64 rounding on whole-number inputs scaled by their axis
#   maxima, so one proof covers every scale, and Rocq checks Gappa's proof (with Gappa's support
#   library over Flocq), listing every axiom it rests on.
# - FPTaylor bounds each filter's normalised problem (each step divided by its scale, with a ratio
#   parameter where a sum's operand has a smaller scale) with a proof certificate, HOL Light checks
#   the certificate, one job per problem, and each job reports whether its bound is within the K
#   Gappa's goal uses; the error model is homogeneous, so the bound holds at every scale.
#
# The method note, projects/kit/notes/G35-filter-certificates.md, says what each proof covers and
# what the written argument covers.
#
# Each job first shows it can fail (gate 1, chapter 32.43; geom-test's trip): `trip gappa` halves
# the bound orient2d's Gappa problem claims, which Gappa must fail to prove, leaving Rocq a file
# with no theorem to refuse; and `trip hol-light`, on orient2d's leg, halves every bound of
# FPTaylor's certificate as HOL Light's session loads it, which HOL Light must refuse. Each runs
# the job's own command, with the line planted for that run only. Nothing here is a dependency: the tools run as separate
# programs and never touch the kernel's code.
#
# On a pull request, a problem is proved again only if it differs from the pull request's base:
# a problem byte for byte the base's, with the scripts in certificates/ and this workflow also the
# base's, was proved there, and the nightly run proves it again. Its FPTaylor job still shows, says
# so and skips the proof, and the Gappa job says so for each such problem and sets it aside, with
# the planted run's file for it. The planted runs come first and always run: each needs orient2d's
# problem. The nightly, dispatched and called runs (kernel-release.yml's, on a tag) prove every
# problem.

on:
  pull_request:
    paths:
      - "projects/engines/geometry/crates/geom-gen/**"
      - "projects/engines/geometry/crates/geom-num/src/generated/**"
      - ".github/workflows/kernel-certificates.yml"
  # Every night on main, so a proof that stops checking (a tool's image, a dependency) is seen
  # even when no pull request touches the filters (piece G40).
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
  # Run whole by kernel-release.yml on a release tag, with every other kernel workflow (28.17).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: kernel-certificates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # rocq/rocq-prover:9.1.1 (OCaml 4.14.2), pinned by digest.
  ROCQ_IMAGE: rocq/rocq-prover:9.1@sha256:9a1e969649a3cc3c6f310d5be5a842e2187384560337c6c0807aba9f8565efba
  # ocaml/opam:ubuntu-24.04-ocaml-4.11, pinned by digest (fptaylor.sh says why 4.11).
  OCAML_IMAGE: ocaml/opam:ubuntu-24.04-ocaml-4.11@sha256:b1a078473ec36987790399dc62e9f5147400000045d475652c4d4cc88dfc8530
  SCRIPTS: projects/engines/geometry/crates/geom-gen/certificates
  PROBLEMS: projects/engines/geometry/crates/geom-gen/generated
  # The Rust release rust-toolchain.toml pins, for the trip binary; nothing here builds the kernel.
  RUST_TOOLCHAIN: "1.99.0"
  # A pull request's base, whose problems were proved there; empty on every other run.
  BASE: ${{ github.event.pull_request.base.sha }}

jobs:
  gappa:
    name: Gappa, checked by Rocq
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # The trip binary builds outside the checkout, which the container mounts.
      - name: A filter bound halved fails Gappa's proof and Rocq's check
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          mkdir -m 777 "$RUNNER_TEMP/proofs"
          cargo run --locked -q -p geom-test --bin trip -- gappa -- docker run --rm -v "$PWD:/work:ro" -v "$RUNNER_TEMP/proofs:/out" -e OUT=/out -w /work "$ROCQ_IMAGE" bash "$SCRIPTS/gappa.sh" "$PROBLEMS"/gappa-*.g
      # After the planted run, which needs orient2d's problem whatever the base holds. The next
      # step's command is unchanged: a problem set aside is no longer in the checkout, and the
      # planted run's file for it is removed, so no unchecked file is kept as a proof.
      - name: Set aside the problems the base proved
        id: base
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --no-tags --depth 1 origin "$BASE"
          for problem in "$PROBLEMS"/gappa-*.g; do
            if git diff --quiet "$BASE" HEAD -- "$problem" "$SCRIPTS" .github/workflows/kernel-certificates.yml; then
              echo "$(basename "$problem"): same problem as $BASE, proved there; the nightly run proves it again"
              rm "$problem"
              rm -f "$RUNNER_TEMP/proofs/$(basename "$problem" .g | tr - _)_gappa.v"
            fi
          done
          if ! compgen -G "$PROBLEMS/gappa-*.g" >/dev/null; then echo "none=true" >> "$GITHUB_OUTPUT"; fi
      - name: Prove the filter bounds
        if: steps.base.outputs.none != 'true'
        run: |
          # The planted run's files are each replaced here.
          mkdir -p -m 777 "$RUNNER_TEMP/proofs"
          docker run --rm -v "$PWD:/work:ro" -v "$RUNNER_TEMP/proofs:/out" -e OUT=/out -w /work \
            "$ROCQ_IMAGE" bash "$SCRIPTS/gappa.sh" "$PROBLEMS"/gappa-*.g
      - name: Keep the Rocq proofs
        if: always() && steps.base.outputs.none != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gappa-rocq-proofs
          path: ${{ runner.temp }}/proofs

  fptaylor-problems:
    name: The FPTaylor problems
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      problems: ${{ steps.list.outputs.problems }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List them
        id: list
        run: |
          problems=$(cd "$PROBLEMS" && ls fptaylor-*.fpt | jq -R . | jq -sc .)
          echo "$problems"
          echo "problems=$problems" >> "$GITHUB_OUTPUT"

  # One job per problem: each sizes HOL Light's Taylor tables to its own problem's variables, and
  # has a runner's whole budget to itself.
  fptaylor:
    name: FPTaylor, checked by HOL Light (${{ matrix.problem }})
    needs: fptaylor-problems
    runs-on: ubuntu-24.04
    # HOL Light loads its multivariate analysis (about 40 minutes) and its Taylor tables before it
    # checks anything; GitHub stops a hosted runner's job at six hours.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        problem: ${{ fromJSON(needs.fptaylor-problems.outputs.problems) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        if: matrix.problem == 'fptaylor-orient2d.fpt'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # On orient2d's leg, the shortest, first: HOL Light refuses a certificate with its bounds
      # halved. The trip binary builds outside the checkout, which the container mounts.
      - name: A certificate with its bounds halved fails HOL Light's check
        if: matrix.problem == 'fptaylor-orient2d.fpt'
        env:
          PROBLEM: ${{ matrix.problem }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: >-
          cargo run --locked -q -p geom-test --bin trip -- hol-light --
          docker run --rm -v "$PWD:/work:ro" -w /work "$OCAML_IMAGE" bash "$SCRIPTS/fptaylor.sh" "$PROBLEMS/$PROBLEM"
      # After the planted run, which runs whatever the base holds.
      - name: Set aside the problem if the base proved it
        id: base
        if: github.event_name == 'pull_request'
        env:
          PROBLEM: ${{ matrix.problem }}
        run: |
          git fetch -q --no-tags --depth 1 origin "$BASE"
          if git diff --quiet "$BASE" HEAD -- "$PROBLEMS/$PROBLEM" "$SCRIPTS" .github/workflows/kernel-certificates.yml; then
            echo "$PROBLEM: same problem as $BASE, proved there; the nightly run proves it again"
            echo "same=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bound the filter and check the certificate
        if: steps.base.outputs.same != 'true'
        env:
          PROBLEM: ${{ matrix.problem }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work "$OCAML_IMAGE"             bash "$SCRIPTS/fptaylor.sh" "$PROBLEMS/$PROBLEM"
