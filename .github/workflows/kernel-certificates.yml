name: Kernel certificates

# Machine-checked proofs of the geometry kernel's f64 filter bounds (chapter 28.6 of the kernel
# architecture, projects/engines/geometry/architecture/28-testing.md; pieces G35 and G40). A filter
# claims that a computed value beyond its bound has the exact value's sign; two independent tools
# prove the bound, each in a pinned container, out of process:
#
# - Gappa, whose proof Rocq checks against Flocq's model of binary64 rounding. The problem states
#   the filter as the generated code computes it, on whole-number inputs scaled by their group
#   maxima, so the proof covers every scale at once.
# - FPTaylor, whose certificate HOL Light checks. The problem is the normalised one; the error
#   model is homogeneous, so its bound holds at every scale (the method note).
#
# The method note, projects/kit/notes/G35-filter-certificates.md, says what each proof covers and
# what it does not. Nothing here is a dependency: the tools run as separate programs and never
# touch the kernel's code.

on:
  pull_request:
    paths:
      - "projects/engines/geometry/crates/geom-gen/**"
      - "projects/engines/geometry/crates/geom-num/src/generated/**"
      - "projects/kit/notes/G35-filter-certificates/**"
      - ".github/workflows/kernel-certificates.yml"

permissions:
  contents: read

concurrency:
  group: kernel-certificates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # rocq/rocq-prover:9.1.1 (OCaml 4.14.2), pinned by digest.
  ROCQ_IMAGE: rocq/rocq-prover:9.1@sha256:9a1e969649a3cc3c6f310d5be5a842e2187384560337c6c0807aba9f8565efba
  # ocaml/opam:ubuntu-24.04-ocaml-4.13, pinned by digest (fptaylor.sh says why 4.13).
  OCAML_IMAGE: ocaml/opam:ubuntu-24.04-ocaml-4.13@sha256:819c3f568ba8afaa36900a8bed1e6e9e69ea7ba96432df330e3d3ab25870646a
  CERTS: projects/kit/notes/G35-filter-certificates

jobs:
  gappa:
    name: Gappa, checked by Rocq
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove the filter bounds
        run: |
          mkdir -m 777 "$RUNNER_TEMP/proofs"
          docker run --rm -v "$PWD:/work:ro" -v "$RUNNER_TEMP/proofs:/out" -e OUT=/out -w /work \
            "$ROCQ_IMAGE" bash "$CERTS/gappa.sh" "$CERTS/orient2d.g" "$CERTS/orient3d.g"
      - name: Keep the Rocq proofs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gappa-rocq-proofs
          path: ${{ runner.temp }}/proofs

  fptaylor:
    name: FPTaylor, checked by HOL Light
    runs-on: ubuntu-24.04
    # HOL Light loads its multivariate analysis before it checks anything: about two hours.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bound the filters and check the certificates
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work "$OCAML_IMAGE" \
            bash "$CERTS/fptaylor.sh" "$CERTS/fptaylor-checks.txt"
