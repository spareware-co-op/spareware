# Kernel variant timings (piece G42; chapter 23.3 of the kernel architecture,
# projects/engines/geometry/architecture/23-performance.md).
#
# Times every variant of every generated exact path (the shipped width-aware path, plain i128 and
# width-aware 32-bit limbs) and the 64- and 32-bit-limb integers, with geom-bench-guest's `time`
# command: natively on x86-64 and aarch64 Linux; built for wasm32-wasip1, in Wasmtime with and
# without wide arithmetic, in Node, and in Chromium, Firefox and WebKit (Playwright) and Safari
# (safaridriver); then writes one report, projects/engines/geometry/crates/geom-bench/variants/
# report.py's tables, to the run's summary and as an artifact. The report the piece commits is
# made from it.
#
# Timings are statistics for that report, never a gate: nothing here can fail a pull request, and
# a step that cannot run on an engine (a build the engine does not validate) records "unsupported".
# It runs when a pull request is labelled `variant-bench` (workflow_dispatch runs only from the
# default branch), or by hand once on main.

name: Kernel variant timings

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-variants-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.99.0
  WASMTIME_VERSION: "50.0.0"
  NODE_VERSION: "24"
  # Each round of `time` runs this long; six rounds per benchmark.
  ROUND_MS: "150"
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # The benchmarks timed: every generated exact path in each variant on typical and extreme inputs,
  # and the limb integers' sums and products at 256 and 384 bits.
  CASES: '^generated/orient[23]d_avnaim/(typical|degenerate|nearly_degenerate|extreme)$|^generated/orient[23]d_value/(degenerate|nearly_degenerate)$|^generated/[a-z0-9_]+_value(_plain|_limbs)?/(typical|extreme)$|^wide/i(256|384)_(add|mul)/typical$|^wide32/w(8|12)_(add|product)/typical$|^wide32/w3_product_i64/typical$'

jobs:
  native:
    name: Native (${{ matrix.engine }})
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'variant-bench'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            engine: x86_64-linux
          - runner: ubuntu-24.04-arm
            engine: aarch64-linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Build geom-bench-guest
        run: cargo build --release --locked -p geom-bench --bin geom-bench-guest
      - name: Time every case
        run: |
          guest=target/release/geom-bench-guest
          mkdir -p results
          out="results/${{ matrix.engine }}-native.txt"
          cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -1)
          echo "# version $(rustc --version), ${cpu:-unknown processor}" > "$out"
          "$guest" list | grep -E "$CASES" > cases.txt
          while read -r name; do "$guest" time "$name" "$ROUND_MS" >> "$out"; done < cases.txt
          echo "$(($(wc -l < "$out") - 1)) timings"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: variants-native-${{ matrix.engine }}
          path: results/

  wasm:
    name: WebAssembly (Wasmtime and Node)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'variant-bench'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1
      - name: Build geom-bench-guest for wasm32, with and without wide arithmetic
        run: |
          cargo build --release --locked -p geom-bench --bin geom-bench-guest --target wasm32-wasip1
          cp target/wasm32-wasip1/release/geom-bench-guest.wasm guest-plain.wasm
          RUSTFLAGS="-C target-feature=+wide-arithmetic" cargo build --release --locked -p geom-bench \
            --bin geom-bench-guest --target wasm32-wasip1 --target-dir target-wide
          cp target-wide/wasm32-wasip1/release/geom-bench-guest.wasm guest-wide.wasm
      - name: Install wasmtime ${{ env.WASMTIME_VERSION }}
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASMTIME_VERSION }}
      - name: Install Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The cases
        run: wasmtime run guest-plain.wasm list | grep -E "$CASES" > cases.txt && wc -l cases.txt
      - name: Time in Wasmtime
        run: |
          mkdir -p results
          for build in plain wide; do
            out="results/wasmtime-$build.txt"
            flags=""
            if [ "$build" = wide ]; then flags="-W wide-arithmetic=y"; fi
            echo "# version $(wasmtime --version)" > "$out"
            # A build Wasmtime refuses (a flag it lacks, or wide arithmetic it cannot run) is
            # recorded as unsupported, not a failure: this workflow measures, it never gates.
            if ! wasmtime run $flags "guest-$build.wasm" list > /dev/null 2> wasmtime-$build.err; then
              cat wasmtime-$build.err
              printf 'unsupported\n' > "$out"
              continue
            fi
            while read -r name; do wasmtime run $flags "guest-$build.wasm" time "$name" "$ROUND_MS" >> "$out"; done < cases.txt
          done
      - name: Time in Node
        run: |
          cat > wasi-run.mjs <<'JS'
          // Runs a wasm32-wasip1 program under Node's WASI, as kernel.yml's runner does.
          import { readFile } from 'node:fs/promises';
          import { WASI } from 'node:wasi';
          import { argv, env, exit } from 'node:process';
          const [file, ...args] = argv.slice(2);
          const wasi = new WASI({ version: 'preview1', args: [file, ...args], env, returnOnExit: true });
          const bytes = await readFile(file);
          if (!WebAssembly.validate(bytes)) { console.log('unsupported'); exit(0); }
          const module = await WebAssembly.compile(bytes);
          const instance = await WebAssembly.instantiate(module, wasi.getImportObject());
          exit(wasi.start(instance));
          JS
          for build in plain wide; do
            out="results/node-$build.txt"
            echo "# version Node $(node --version)" > "$out"
            if [ "$(node --no-warnings wasi-run.mjs "guest-$build.wasm" list | head -1)" = unsupported ]; then
              printf 'unsupported\n' > "$out"
              continue
            fi
            while read -r name; do node --no-warnings wasi-run.mjs "guest-$build.wasm" time "$name" "$ROUND_MS" >> "$out"; done < cases.txt
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: variants-wasm
          path: results/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: variants-guests
          path: |
            guest-plain.wasm
            guest-wide.wasm
            cases.txt

  browsers:
    name: Browser (${{ matrix.engine }})
    needs: wasm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            engine: chromium
          - runner: ubuntu-latest
            engine: firefox
          - runner: macos-latest
            engine: webkit
          - runner: macos-latest
            engine: safari
    defaults:
      run:
        shell: bash
        working-directory: projects/engines/geometry/crates/geom-bench/variants
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: variants-guests
          path: projects/engines/geometry/crates/geom-bench/variants
      - name: Install Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the drivers and the WASI shim
        # Playwright and selenium-webdriver: Apache-2.0; @bjorn3/browser_wasi_shim: MIT OR
        # Apache-2.0. Exact versions.
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.52.0 selenium-webdriver@4.27.0 \
            @bjorn3/browser_wasi_shim@0.3.0
          if [ "${{ matrix.engine }}" != safari ]; then
            npx playwright install --with-deps "${{ matrix.engine }}"
          else
            sudo safaridriver --enable
          fi
      - name: Time in the browser
        run: |
          python3 -m http.server 8642 > /dev/null 2>&1 &
          sleep 2
          mkdir -p results
          for build in plain wide; do
            node browsers.mjs "${{ matrix.engine }}" "$build" "$ROUND_MS" http://localhost:8642 \
              "results/${{ matrix.engine }}-$build.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: variants-browser-${{ matrix.engine }}
          path: projects/engines/geometry/crates/geom-bench/variants/results/

  report:
    name: Report
    needs: [native, wasm, browsers]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'variant-bench')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: variants-*
          path: results
          merge-multiple: true
      - name: Write the report
        run: |
          python3 projects/engines/geometry/crates/geom-bench/variants/report.py results > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: variants-report
          path: report.md
