name: Kernel fuzz campaign

# Measurement only, on a throwaway branch (never merged): the curve_offsets fuzz target's time on
# the five slowest stored inputs of run 43564862778, on a hosted runner, at the budget of
# fix/offset-budgets. It builds the libFuzzer target exactly as the campaign does (cargo-bolero,
# the dated nightly, address sanitizer and coverage) and runs each of the five files three times,
# one file at a time (libFuzzer prints "Executed <file> in <n> ms"). No fuzzing.

run-name: "Offset budgets measurement, the five slowest curve offsets, on ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "ignored here"
        required: false
        default: wide
        type: choice
        options:
          - wide
          - all
      hours:
        description: "ignored here"
        required: false
        default: "1"
        type: choice
        options:
          - "5"
          - "4"
          - "3"
          - "2"
          - "1"

permissions:
  contents: read

concurrency:
  group: offset-budgets-measure-${{ github.run_id }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.99.0"
  FUZZ_NIGHTLY: nightly-2026-10-01
  CARGO_BOLERO_VERSION: 0.13.5

jobs:
  measure:
    name: ${{ matrix.target }}, the five slowest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [curve_offsets_fuzz]
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the pinned nightly compiler
        run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Install cargo-bolero ${{ env.CARGO_BOLERO_VERSION }}
        run: >-
          cargo install cargo-bolero --version "$CARGO_BOLERO_VERSION" --locked
          --no-default-features --features libfuzzer
      - name: Cargo.lock is the reviewed one
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build the target and fuzz it one second
        run: |
          touch "$RUNNER_TEMP/stamp"
          cargo bolero test "$TARGET" --package geom-fuzz --toolchain "$FUZZ_NIGHTLY" --engine libfuzzer -T 1s --timeout 30s
          grep -m1 "model name" /proc/cpuinfo
      - name: Replay the five slowest stored inputs, each three times
        run: |
          name="${TARGET%_fuzz}"
          exe=$(find target -type f -executable -newer "$RUNNER_TEMP/stamp" -name "${name}-*" | head -1)
          echo "binary: $exe"
          dir="measure/inputs/$name"
          files=""
          for f in 36a4848b78ebd5c702581573be8cd6917d4b548a 44fc6556c24258bece19b0d65142ae3c1f03ca6b \
                   830f8b78736d8e70f42d4a0a6b7e75f3d75d44d7 8c111277d6928986186f866e18af266a96fec569 \
                   0d5f2126685e3f1d5b467ac70bcc5b6d8759d2ad; do
            files="$files $dir/$f $dir/$f $dir/$f"
          done
          out="$RUNNER_TEMP/out.txt"
          BOLERO_TEST_NAME="$TARGET" BOLERO_LIBTEST_HARNESS=1 \
            BOLERO_LIBFUZZER_ARGS="-timeout=0 -rss_limit_mb=0${files}" \
            "$exe" "$TARGET" --exact --nocapture --quiet --test-threads 1 > "$out" 2>&1 || echo "exit $?"
          grep -E '^Executed|ERROR|panicked|deadly|SUMMARY' "$out"
      - name: Replay every stored input as the first run did, in processes of 200
        run: |
          name="${TARGET%_fuzz}"
          exe=$(find target -type f -executable -newer "$RUNNER_TEMP/stamp" -name "${name}-*" | head -1)
          dir="measure/inputs/$name"
          out="$RUNNER_TEMP/times.txt"
          : > "$out"
          ls "$dir" | split -l 200 - "$RUNNER_TEMP/chunk."
          for c in "$RUNNER_TEMP"/chunk.*; do
            files=$(sed "s|^|$dir/|" "$c" | paste -sd ' ')
            BOLERO_TEST_NAME="$TARGET" BOLERO_LIBTEST_HARNESS=1 \
              BOLERO_LIBFUZZER_ARGS="-timeout=0 -rss_limit_mb=0 $files" \
              "$exe" "$TARGET" --exact --nocapture --quiet --test-threads 1 > "$RUNNER_TEMP/one.txt" 2>&1 || echo "exit $? in $c"
            grep -E '^Executed|ERROR|panicked|deadly|SUMMARY' "$RUNNER_TEMP/one.txt" >> "$out" || true
          done
          echo "inputs: $(ls "$dir" | wc -l), executed: $(grep -c '^Executed' "$out")"
          grep -vE '^Executed' "$out" > "$RUNNER_TEMP/other.txt" || true
          cat "$RUNNER_TEMP/other.txt"
          grep '^Executed' "$out" | sort -k4,4 -n -r > "$RUNNER_TEMP/sorted.txt"
          echo "slowest 15 (ms):"
          sed -n 1,15p "$RUNNER_TEMP/sorted.txt"
