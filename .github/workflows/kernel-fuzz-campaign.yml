name: Kernel fuzz campaign

# Measurement only, on a throwaway branch (never merged): the offset fuzz targets' per-input times
# on a hosted runner at the budgets of fix/offset-budgets. For each of curve_offsets_fuzz and
# surface_offsets_fuzz it builds the libFuzzer target exactly as the campaign does (cargo-bolero,
# the dated nightly, address sanitizer and coverage), runs it on every stored curves or surfaces
# input one file at a time (libFuzzer prints "Executed <file> in <n> ms"), then fuzzes it for the
# hours asked, seeded with the same inputs, with the campaign's 10 s limit and slow units of 3 s
# or more reported.

run-name: "Offset budgets measurement, ${{ inputs.hours || '1' }} h of fuzzing, on ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "ignored here"
        required: false
        default: wide
        type: choice
        options:
          - wide
          - all
      hours:
        description: "Hours of fuzzing after the replay"
        required: false
        default: "1"
        type: choice
        options:
          - "5"
          - "4"
          - "3"
          - "2"
          - "1"

permissions:
  contents: read

concurrency:
  group: offset-budgets-measure-${{ github.run_id }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.99.0"
  FUZZ_NIGHTLY: nightly-2026-10-01
  CARGO_BOLERO_VERSION: 0.13.5

jobs:
  measure:
    name: ${{ matrix.target }}, replay and fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [curve_offsets_fuzz, surface_offsets_fuzz]
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the pinned nightly compiler
        run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Install cargo-bolero ${{ env.CARGO_BOLERO_VERSION }}
        run: >-
          cargo install cargo-bolero --version "$CARGO_BOLERO_VERSION" --locked
          --no-default-features --features libfuzzer
      - name: Cargo.lock is the reviewed one
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build the target and fuzz it one second
        run: |
          touch "$RUNNER_TEMP/stamp"
          cargo bolero test "$TARGET" --package geom-fuzz --toolchain "$FUZZ_NIGHTLY" --engine libfuzzer -T 1s --timeout 30s
          find target -type f -executable -newer "$RUNNER_TEMP/stamp" -name "${TARGET%_fuzz}-*" -printf '%s %p\n'
          nproc; grep -m1 "model name" /proc/cpuinfo
      - name: Replay every stored input, one file at a time
        run: |
          name="${TARGET%_fuzz}"
          exe=$(find target -type f -executable -newer "$RUNNER_TEMP/stamp" -name "${name}-*" | head -1)
          echo "binary: $exe"
          dir="measure/inputs/$name"
          out="$RUNNER_TEMP/times.txt"
          : > "$out"
          ls "$dir" | split -l 200 - "$RUNNER_TEMP/chunk."
          for c in "$RUNNER_TEMP"/chunk.*; do
            files=$(sed "s|^|$dir/|" "$c" | paste -sd ' ')
            BOLERO_TEST_NAME="$TARGET" BOLERO_LIBTEST_HARNESS=1 \
              BOLERO_LIBFUZZER_ARGS="-timeout=0 -rss_limit_mb=0 $files" \
              "$exe" "$TARGET" --exact --nocapture --quiet --test-threads 1 2>&1 \
              | grep -E '^Executed|ERROR|panicked|deadly|SUMMARY' >> "$out" || true
          done
          echo "inputs: $(ls "$dir" | wc -l), executed: $(grep -c '^Executed' "$out")"
          grep -vE '^Executed' "$out" | head -40 || true
          echo "slowest 30 (ms):"
          grep '^Executed' "$out" | sort -k4,4 -n -r | head -30
          grep '^Executed' "$out" | awk '{s+=$4; if ($4>=1000) n1++; if ($4>=2000) n2++; if ($4>=3000) n3++; if ($4>=4000) n4++} END {printf "total %d ms; at least 1 s: %d, 2 s: %d, 3 s: %d, 4 s: %d\n", s, n1, n2, n3, n4}'
          cp "$out" "times-$name.txt"
      - name: Upload the times
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: times-${{ matrix.target }}
          path: times-*.txt
          if-no-files-found: ignore
      - name: Fuzz the target for the hours asked, seeded with the stored inputs
        timeout-minutes: 330
        env:
          HOURS: ${{ inputs.hours || '1' }}
        run: |
          name="${TARGET%_fuzz}"
          mkdir -p "$RUNNER_TEMP/seed"
          cp "measure/inputs/$name"/* "$RUNNER_TEMP/seed/"
          cargo bolero test "$TARGET" --package geom-fuzz --toolchain "$FUZZ_NIGHTLY" --engine libfuzzer \
            -T "$((HOURS * 3600))s" --timeout 10s --corpus-dir "$RUNNER_TEMP/seed" \
            --engine-args=-report_slow_units=3
      - name: Upload slow units and crashing inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slow-${{ matrix.target }}
          path: projects/engines/geometry/crates/geom-fuzz/tests/__fuzz__/*/crashes/
          if-no-files-found: ignore
