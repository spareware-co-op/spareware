name: Construct server

# Spare Construct's cloud server on real TiKV, on fresh ARM Ubuntu machines like the free server it
# is meant for: the store's promises, the load test, the acceptance checklist on one node and on
# three, real browsers, and the install script as deploy.sh runs it on a server. Construct's crates
# (Transport's core in a job of its own) and the kit's services are tested here too. The kit's own
# crates, which need no database, are tested in kit.yml.

on:
  pull_request:
    paths:
      - "projects/spare-construct/server/**"
      - "projects/spare-construct/app/**"
      - "projects/spare-construct/crates/**"
      - "projects/spare-construct/demo/index.html"
      - "projects/spare-construct/demo/workshop/**"
      - "projects/spare-construct/clippy.toml"
      - "projects/engines/geometry/geom-solidcore/**"
      - "projects/engines/crates/engine-geometry/**"
      - "projects/engines/geometry/crates/geom-op/**"
      - "tools/transport-truth/**"
      - "projects/kit/crates/kit-core/**"
      - "projects/kit/crates/kit-ops/**"
      - "projects/kit/crates/kit-store/**"
      - "projects/kit/crates/kit-sync/**"
      - "projects/kit/services/**"
      - "Cargo.lock"
      - "design/ribbon/**"
      - ".github/workflows/construct-server.yml"

permissions:
  contents: read

env:
  # The workspace's pinned compiler (rust-toolchain.toml).
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  crates:
    name: Construct's crates, native and for the browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The crates are found by a rule, not named one by one, so a crate added under
      # projects/spare-construct/crates is linted and tested the day it lands. The step fails if a
      # crate folder is not a workspace member (nothing would check it) or if an exclusion below
      # names a crate that is gone.
      - name: List the crates under projects/spare-construct/crates
        id: crates
        env:
          # Tested in the job `transport`, whose truth tests take far longer than this job allows.
          # It is still linted here.
          NOT_TESTED_HERE: construct-transport
        run: |
          set -euo pipefail
          meta=$(cargo metadata --locked --no-deps --format-version 1)
          listed=$(printf '%s' "$meta" | jq -r '.packages[]
            | select(.manifest_path | contains("/projects/spare-construct/crates/"))
            | .manifest_path | sub("/Cargo.toml$"; "")
            | sub("^.*/projects/spare-construct/"; "projects/spare-construct/")' | sort)
          present=$(for d in projects/spare-construct/crates/*/; do
            if [ -f "${d}Cargo.toml" ]; then echo "${d%/}"; fi
          done | sort)
          missing=$(comm -13 <(echo "$listed") <(echo "$present"))
          if [ -n "$missing" ]; then
            echo "::error::Not workspace members, so no check reaches them: $missing"
            exit 1
          fi
          names=$(printf '%s' "$meta" | jq -r '.packages[]
            | select(.manifest_path | contains("/projects/spare-construct/crates/")) | .name' | sort)
          tests=$names
          for n in $NOT_TESTED_HERE; do
            if ! echo "$names" | grep -qx "$n"; then
              echo "::error::NOT_TESTED_HERE names $n, which is not a crate under projects/spare-construct/crates"
              exit 1
            fi
            tests=$(echo "$tests" | grep -vx "$n")
          done
          echo "all=$(echo "$names" | sed 's/^/-p /' | paste -sd' ')" >>"$GITHUB_OUTPUT"
          echo "tests=$(echo "$tests" | sed 's/^/-p /' | paste -sd' ')" >>"$GITHUB_OUTPUT"
          echo "Linted: $(echo $names)"
          echo "Tested here: $(echo $tests)"
      # Every crate linted here carries the geometry kernel's lint tables (piece A19).
      - name: Clippy
        env:
          CRATES: ${{ steps.crates.outputs.all }}
        run: cargo clippy --locked --no-deps $CRATES --all-features --all-targets -- -D warnings
      - name: Tests, with the shapes run on two generators
        env:
          CRATES: ${{ steps.crates.outputs.tests }}
        run: cargo test --locked $CRATES --all-features
      # A release build runs only the kernel's cheap checker groups after each operation, as the
      # browser's does, so Workshop's assembly is held to the same answers there too.
      - name: Workshop's assembly, posed as the browser's release build poses it
        run: cargo test --locked --release -p construct-workshop --test assembly
      - name: The browser's builds stay free of the store
        run: >-
          cargo check --locked --target wasm32-unknown-unknown -p construct-shapes -p construct-wasm
          -p construct-workshop

  transport:
    name: Transport's core against the prototype's answers
    runs-on: ubuntu-latest
    # Its truth tests take about 40 minutes of test time in a debug build on a 3-thread machine;
    # they run in their own job so the crates job keeps its limit.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tests, against the answers tools/transport-truth recorded from the prototype
        run: cargo test --locked -p construct-transport

  kernel:
    name: The server built and tested with the kernel engine
    # The server's Cargo feature `kernel` links the geometry kernel's builder with solidcore's
    # engine behind it (src/geometry.rs), chosen at run time by STACK_GEOMETRY=kernel. No other job
    # builds it, so these are its checks: the build, clippy, and every test that needs no database
    # (tests/kernel.rs runs the builder's suite on the engine; the checklist stays on the default
    # build, as the checklist job runs it). One compile of solidcore takes 10 to 17 minutes and
    # about 7 GB, so only a push to main saves the cache, as in kernel.yml's job `solidcore`.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # solidcore's README asks for an 8 MiB stack.
      RUST_MIN_STACK: "8388608"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: projects/spare-construct/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # The pinned commit of solidcore (geom-solidcore's Cargo.toml).
          key: server-kernel-1d8e14b46dedccbb03572956e7c708782fef1b8f
          workspaces: projects/spare-construct/server -> target
          add-rust-environment-hash-key: false
      - name: Build with the kernel feature
        run: cargo build --locked --features kernel
      - name: Clippy with the kernel feature
        run: cargo clippy --locked --features kernel --all-targets -- -D warnings
      - name: Tests that need no database, with the kernel feature
        run: cargo test --locked --features kernel

  kernel-browser:
    name: The kernel engine builds for the browser's target
    # The browser's page builds shapes with construct-regen, whose kernel builder (src/kernel.rs)
    # sees only the engine seam; the crates job's check of construct-shapes and construct-wasm
    # covers that. This checks the engine that answers behind it, geom-solidcore (its own
    # workspace), for wasm32-unknown-unknown, which kernel.yml's wasm32-wasip1 job does not.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: projects/engines/geometry/geom-solidcore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          key: solidcore-browser-1d8e14b46dedccbb03572956e7c708782fef1b8f
          workspaces: projects/engines/geometry/geom-solidcore -> target
          add-rust-environment-hash-key: false
      - name: Check geom-solidcore for wasm32-unknown-unknown
        run: cargo check --locked --target wasm32-unknown-unknown

  checklist:
    name: The checklist on ARM Linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    defaults:
      run:
        working-directory: projects/spare-construct/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            projects/spare-construct/server
            projects/kit/services
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --manifest-path ../../kit/services/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Tests that need no database
        run: |
          cargo test --locked
          cargo test --locked --manifest-path ../../kit/services/Cargo.toml --workspace
      - name: Install TiKV, PD and RustFS
        run: bash scripts/install-binaries.sh
      # The checklist's limits (200 ms an edit, 300 ms between browsers) are the server's and the
      # store's. A shared runner's disk sometimes takes most of a second to sync TiKV's Raft log,
      # which no limit can hold, so here TiKV's data is on a RAM disk: these steps measure the
      # server and the store without the disk's sync time (issue #886). Each run ends by printing
      # TiKV's own sync times (scripts/store-sync-times.sh). The install job keeps TiKV on disk.
      - name: TiKV's data on a RAM disk
        run: |
          sudo mkdir -p /mnt/tikv-ram
          sudo mount -t tmpfs -o size=4G,mode=0700,uid="$(id -u)",gid="$(id -g)" tmpfs /mnt/tikv-ram
          echo "STACK_TIKV_RAMDISK=/mnt/tikv-ram" >>"$GITHUB_ENV"
      # TiKV refuses to start below 123,880 open files, and a runner allows 65,536.
      - name: On one node
        run: |
          sudo prlimit --pid $$ --nofile=1000000:1000000
          bash scripts/run-checklist.sh
      - name: On three nodes, by settings alone, with one killed mid-edit
        env:
          STACK_NODES: "3"
          STACK_PD: 127.0.0.1:2379,127.0.0.1:2389,127.0.0.1:2399
        run: |
          sudo prlimit --pid $$ --nofile=1000000:1000000
          bash scripts/run-checklist.sh
      - name: In real browsers
        run: |
          sudo prlimit --pid $$ --nofile=1000000:1000000
          bash scripts/run-browser-test.sh
          trap "bash $PWD/scripts/store-sync-times.sh" EXIT
          cd tests/browser
          npm ci
          npx playwright-core install --with-deps chromium
          BROWSER=bundled STACK_KILL='pkill -9 -x spare-server' \
            STACK_START='bash ../../scripts/start-server.sh' node two_browsers.mjs

  checklist-kernel:
    name: The checklist on ARM Linux, on the kernel engine in the server and the browser
    # The job `checklist`'s run on one node and its real browsers, with the server built with its
    # `kernel` feature and run with STACK_GEOMETRY=kernel: every document is seeded on the kernel's
    # edition, and the page builds its shapes with the kernel's own package for the browser
    # (server/shapes-kernel), which this job builds, since it isn't committed (note
    # CON-A3-F1-P1-kernel-in-the-browser). First the package is held to the server's own build:
    # every answer to shapes-kernel/tests/cases.json is the same bytes natively, on this ARM machine,
    # and in the browser's build. The server's default stays the stand-in until this job is green on
    # main. solidcore is compiled three times here (the package for the browser, the package
    # natively, the server), so only a push to main saves the cache, as in kernel.yml.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      STACK_GEOMETRY: kernel
      # solidcore's README asks for an 8 MiB stack.
      RUST_MIN_STACK: "8388608"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: projects/spare-construct/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # The pinned commit of solidcore (geom-solidcore's Cargo.toml).
          key: checklist-kernel-1d8e14b46dedccbb03572956e7c708782fef1b8f
          workspaces: |
            projects/spare-construct/server
            projects/spare-construct/server/shapes-kernel
            projects/kit/services
      # The version construct-shapes and shapes-kernel pin wasm-bindgen to, as the CLI must match.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.118 --locked
      - name: Build the kernel's package for the browser
        run: bash scripts/build-shapes-kernel.sh
      - name: The package natively, its clippy and its tests
        working-directory: projects/spare-construct/server/shapes-kernel
        run: |
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo test --locked --release
      - name: The browser's build gives the same bytes as the native build
        run: |
          (cd shapes-kernel && cargo run --locked --release --example answers -- tests/cases.json) \
            >"$RUNNER_TEMP/native-answers.txt"
          node tests/browser/same_bytes.mjs "$RUNNER_TEMP/native-answers.txt"
      - name: Install TiKV, PD and RustFS
        run: bash scripts/install-binaries.sh
      # As in the job `checklist` (issue #886).
      - name: TiKV's data on a RAM disk
        run: |
          sudo mkdir -p /mnt/tikv-ram
          sudo mount -t tmpfs -o size=4G,mode=0700,uid="$(id -u)",gid="$(id -g)" tmpfs /mnt/tikv-ram
          echo "STACK_TIKV_RAMDISK=/mnt/tikv-ram" >>"$GITHUB_ENV"
      - name: On one node, on the kernel
        run: |
          sudo prlimit --pid $$ --nofile=1000000:1000000
          bash scripts/run-checklist.sh
      - name: In real browsers, on the kernel
        run: |
          sudo prlimit --pid $$ --nofile=1000000:1000000
          bash scripts/run-browser-test.sh
          trap "bash $PWD/scripts/store-sync-times.sh" EXIT
          cd tests/browser
          npm ci
          npx playwright-core install --with-deps chromium
          BROWSER=bundled STACK_KILL='pkill -9 -x spare-server' \
            STACK_START='bash ../../scripts/start-server.sh' node two_browsers.mjs

  licences:
    name: Every dependency's licence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check the server's licences
        working-directory: projects/spare-construct/server
        run: cargo deny --locked check licenses
      - name: Check the licences of the kernel's package for the browser, by the server's rules
        working-directory: projects/spare-construct/server/shapes-kernel
        run: cargo deny --locked --config ../deny.toml check licenses
      - name: Check the kit services' licences
        working-directory: projects/kit/services
        run: cargo deny --locked check licenses

  install:
    name: The install script on a fresh ARM server
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lay out the server as deploy.sh does
        run: |
          sudo mkdir -p /opt/spare-stack/src /etc/spare-stack
          git archive HEAD Cargo.toml rust-toolchain.toml projects/spare-construct/server \
            projects/spare-construct/app projects/spare-construct/crates \
            projects/spare-construct/demo/index.html projects/spare-construct/demo/workshop \
            projects/kit/crates projects/kit/services \
            projects/engines/crates projects/engines/geometry/crates \
            projects/engines/geometry/geom-solidcore design/ribbon \
            | sudo tar -x -C /opt/spare-stack/src
          sudo tee /etc/spare-stack/owner.env <<'EOF'
          STACK_PUBLIC_URL=http://localhost:8088
          OIDC_CLIENT_ID=not-set-in-this-test
          OIDC_CLIENT_SECRET=not-set-in-this-test
          STACK_PEOPLE=anna=someone@example.test
          EOF
          sudo sed -i 's/^ *//' /etc/spare-stack/owner.env
      - name: Install
        run: sudo bash /opt/spare-stack/src/projects/spare-construct/server/deploy/install-on-server.sh
      - name: Install again, as an update does
        run: sudo bash /opt/spare-stack/src/projects/spare-construct/server/deploy/install-on-server.sh
      - name: The web proxy reaches the server
        run: curl -fsS http://localhost:8088/health
      - name: The seeded logs and shapes check out
        run: |
          sudo systemd-run --wait --pipe --uid=spare \
            --property=EnvironmentFile=/etc/spare-stack/stack.env \
            /opt/spare-stack/bin/spare-server verify
      - name: The daily backup runs
        run: |
          sudo systemctl start spare-backup.service
          sudo systemctl is-enabled spare-backup.timer
          sudo ls /opt/spare-stack/backups/
      - name: Everything comes back after a restart of every service
        run: |
          sudo systemctl restart spare-pd spare-tikv spare-rustfs spare-server
          for _ in $(seq 1 60); do curl -fs http://localhost:8088/health && break; sleep 2; done
          curl -fsS http://localhost:8088/health
      - name: Show the logs on failure
        if: failure()
        run: |
          sudo journalctl -n 80 --no-pager -u spare-pd -u spare-tikv -u spare-rustfs -u spare-server -u caddy
