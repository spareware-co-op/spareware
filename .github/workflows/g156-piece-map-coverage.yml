# A measurement for Gate 4's piece map (G156, gap 9), on its measurement branch only: the line
# coverage of the geom-poly, geom-bool and geom-mesh files (and the other Phase 4 crates') that each
# shared fuzz target's seeded test and each shared benchmark reaches, built as kernel-quality.yml's
# coverage parts build (the pinned nightly, release with overflow checks and debug assertions,
# --branch, -Z cross-crate-inline-threshold=never -C link-dead-code). Each unit runs alone in its
# own process, its profiles cleared first, and its per-file summary is printed as lines
# "PM <unit> <variant> <file> <covered> <count>" and kept as an artifact.
# Benchmarks are measured twice: `whole` (inputs built and one pass) and `kernel` (the counters
# zeroed after the inputs are built, so only the measured kernel's lines count).
name: G156 piece map coverage

on:
  push:
    branches: [measure/g156-piece-map-coverage]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.0"
  RUST_NIGHTLY: "nightly-2026-10-01"
  CARGO_LLVM_COV_VERSION: "0.9.1"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
  CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"

jobs:
  measure:
    name: Coverage of ${{ matrix.unit }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Runs 43894768049 and 43896027651 gave the files; this one the whole catalogue, every
        # seeded test, per-op query and make, and hit lines for the files pieces share.
        unit: [fuzz-all, fuzz-planes, fuzz-predicates, fuzz-solids, fuzz-make, bench-all, bench-scenario,
          bench-query, bench-make, bench-group-predicate, bench-group-plane]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the pinned nightly with llvm-tools
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component llvm-tools-preview
          rustc "+$RUST_NIGHTLY" -vV
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          key: coverage
      - name: Install cargo-llvm-cov ${{ env.CARGO_LLVM_COV_VERSION }}
        run: cargo install --locked cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
      - name: Measure each unit
        env:
          UNIT: ${{ matrix.unit }}
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          RUSTFLAGS: -Z cross-crate-inline-threshold=never -C link-dead-code
        run: |
          set -u
          out="$RUNNER_TEMP/pm"
          mkdir -p "$out"
          # The files whose hit lines are printed too ("PML <unit> <variant> <file> <ranges>"), for
          # the pieces that share a file: which lines of it a unit reaches.
          lines='geom-bool/src/(combine|batch|operand|names)\.rs|geom-poly/src/(merge|subdivide|plane)\.rs|geom-num/src/(predicate|plane|step)\.rs|geom-check/src/planar\.rs'
          show() { # label variant json lcov
            python3 - "$1" "$2" "$3" "$4" "$lines" <<'PY'
          import json, re, sys
          label, variant, path, lcov, wanted = sys.argv[1:6]
          data = json.load(open(path))
          for f in data["data"][0]["files"]:
              name = f["filename"]
              m = re.search(r"crates/(geom-(?:poly|bool|mesh|num|topo|op|check|name|make|bvh))/src/(.*)$", name)
              if not m:
                  continue
              lines = f["summary"]["lines"]
              print(f"PM\t{label}\t{variant}\t{m.group(1)}/src/{m.group(2)}\t{lines['covered']}\t{lines['count']}")
          hits, src = {}, None
          for line in open(lcov):
              line = line.strip()
              if line.startswith("SF:"):
                  m = re.search(r"crates/(geom-[a-z]+/src/.*)$", line[3:])
                  src = m.group(1) if m and re.fullmatch(wanted, m.group(1)) else None
              elif src and line.startswith("DA:"):
                  n, count = line[3:].split(",")[:2]
                  if int(count) > 0:
                      hits.setdefault(src, set()).add(int(n))
          for src, got in sorted(hits.items()):
              got, ranges, start = sorted(got), [], None
              for i, n in enumerate(got):
                  if start is None:
                      start = n
                  if i + 1 == len(got) or got[i + 1] != n + 1:
                      ranges.append(f"{start}-{n}" if start != n else f"{n}")
                      start = None
              print(f"PML\t{label}\t{variant}\t{src}\t{','.join(ranges)}")
          PY
          }
          clear() { find target -name '*.profraw' -delete 2>/dev/null || true; }
          one() { # label variant package test filter [names]; an empty test runs every test binary
            local label=$1 variant=$2 pkg=$3 test=$4 filter=$5 names=${6:-}
            local file="$out/${label////_}.$variant"
            local which=(--test "$test") match=(--exact "$filter")
            if [ -z "$test" ]; then which=(--tests); match=("$filter"); fi
            clear
            echo "::group::$label $variant"
            if PIECE_MAP_NAMES="$names" cargo llvm-cov --no-report --locked -p "$pkg" --release --branch \
                "${which[@]}" -- "${match[@]}" --test-threads 1 --nocapture; then
              cargo llvm-cov report --release --branch --json --summary-only --output-path "$file.json"
              cargo llvm-cov report --release --branch --lcov --output-path "$file.lcov"
              echo "::endgroup::"
              show "$label" "$variant" "$file.json" "$file.lcov" | tee "$file.tsv"
            else
              echo "::endgroup::"
              echo "PMFAIL $label $variant"
            fi
          }
          bench() { # family, then one benchmark op per argument
            local family=$1; shift
            for op in "$@"; do one "$family/$op" whole geom-bench piece_map_whole run_named "$family/$op/"; done
            one "$family" whole geom-bench piece_map_whole run_named "$family/"
            for op in "$@"; do one "$family/$op" kernel geom-bench piece_map_kernel run_named "$family/$op/"; done
            one "$family" kernel geom-bench piece_map_kernel run_named "$family/"
          }
          case "$UNIT" in
            fuzz-all)
              # Every target's seeded test, each test binary in its own process.
              one all seeded geom-fuzz "" _seeded
              ;;
            fuzz-*)
              target=${UNIT#fuzz-}
              one "$target" seeded geom-fuzz "$target" "${target}_seeded"
              ;;
            bench-all)
              one all whole geom-bench piece_map_whole run_named "*"
              one all kernel geom-bench piece_map_kernel run_named "*"
              ;;
            bench-scenario)
              bench scenario openings moved_door slab_holes union one_selection three_selections storey
              ;;
            bench-mesh)
              bench mesh cdt exact_build locate boolean hull slice point_point point_line point_plane \
                line_line closest_dots triangles envelope decimate remesh
              ;;
            bench-query)
              bench query area bounding_box exactness faces validity volume
              ;;
            bench-make)
              bench make build_box cylinder move_box turn_box
              ;;
            bench-group-*)
              group=${UNIT#bench-group-}
              one "$group" whole geom-bench piece_map_whole run_named "$group/"
              one "$group" kernel geom-bench piece_map_kernel run_named "$group/"
              ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: piece-map-${{ matrix.unit }}
          path: ${{ runner.temp }}/pm
          if-no-files-found: ignore
