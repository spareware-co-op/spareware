name: Kernel quality

# The geometry kernel's mutation and coverage gates and its Miri run (chapter 28 of the kernel
# architecture, projects/engines/geometry/architecture/28-testing.md, section 28.8; when each runs
# is 28.17). geom-test's `kernel-quality` binary plans and judges every run, so this file holds no
# copy of the foundation set, the bars or the shard sizes (geom_test::foundation,
# geom_test::mutants).
#
# When each runs (the owner's testing principles 2 and 5, decision 32.53): mutation testing and
# coverage run once per change, on what it changed, when it is ready to land. Nothing runs on a
# timer. The first job, `when`, decides:
#
# - A pull request: mutants in the diff, coverage and the gates' own proof once it is ready for
#   review, never on a push to a draft (a draft's pushes skip them, and marking it ready runs them).
#   A later push judges again only what its tests may judge otherwise since the last head whose
#   run finished clean (principle 5; geom-test's src/increment.rs): `when` finds that head in
#   GitHub's record of the pull request's runs (the newest finished run whose judge, or whose
#   coverage job, succeeded), and the plan mutates the change's lines in every crate whose tests
#   what changed since then (on the pull request's side and on its base's) can reach, a new test
#   file and an added ledger entry left out and a removed one counted by its file; coverage
#   measures the crates of what changed since then. With no such run, or a head that cannot be
#   fetched, the whole change is judged.
# - GitHub's merge queue for main: the same, unless they already passed on this very tree. A
#   passing run leaves a mark named for the tree it judged (an artifact, `quality-tested-<tree>`),
#   and `when` looks for it, so a pull request whose base has not moved is not judged twice.
# - A push to main: the full mutation run over the files the push changed, and over every file one
#   of whose ledger entries is in a function the push's diff declares (a function that moved:
#   `kernel-quality mutants-files`), judged as a full run narrowed to those files, so an entry left
#   stale by the change fails; Miri over the crates whose tests the push reaches; coverage and the
#   gates' proof only when no mark shows they passed on this tree.
# - By hand (`workflow_dispatch`, every mutant, or `-f files=<regex>` for some files) and on a
#   release tag (kernel-release.yml calls this workflow): everything, whole. A run by hand may ask
#   for Miri's gate alone (`-f gate=miri`), so proving Miri's jobs costs its own jobs and not every
#   gate's; only a dispatch reads that input, and its default (`all`) runs everything.
#
# The gates:
#
# - Mutants in the diff: cargo-mutants mutates the lines the change makes (`--in-diff`), and each
#   mutant is judged by the mutated crate's integration tests, which reach only its public
#   interface (.cargo/mutants.toml). A mutant that survives or times out fails the gate unless the
#   quality ledger (projects/engines/geometry/quality-ledger.json) keeps it: in the foundation set
#   only as equivalent, with a written reason; elsewhere also as harmless, with a reason, or as
#   known, an older survivor the base branch's ledger already holds, so no new unexplained one
#   merges.
# - The full run: every mutant of the files it covers, judged against those files' ledger entries
#   as a whole; the judge also fails on any such entry that no survivor matches any more. Both runs
#   are sharded across runners: the plan job lists the mutants and asks the judge how many shards
#   they need, and the judge proves the shards together tested exactly that list. The plan sums
#   each shard's own mutants at their crates' measured rates and takes the fewest shards of about
#   ten planned minutes each (geom_test::mutants::shard_count), so a shard's job ends in about a
#   quarter of an hour; a run too large for 512 such shards takes 512, each within the job's limit.
#   A matrix holds
#   at most 256 jobs, so two jobs run the shards, `mutants` shards 0 to 255 and `mutants-2` shards
#   256 to 511, each numbered in the whole run (`--shard k/n`). A full run narrowed to some files
#   (`cargo mutants --re`) has its plan check that cargo-mutants selected every mutant of the
#   matching files and, of other files, only the struct-field deletions cargo-mutants 27.1.0 lists
#   whatever --re says (geom_test::mutants::UNFILTERED_GENRE), which the shards then test too. A
#   dispatched narrowed run is the mutation gate alone.
# - Coverage: each crate measured by its own tests with cargo-llvm-cov, lines and branches, on the
#   pinned nightly compiler that branch coverage needs. The foundation set needs 100% of lines and
#   branches, every other kernel crate 90% of lines, and every `coverage(off)` mark must cite a Kani
#   or Verus proof that the ledger records. A foundation line the tests do not run yet passes only
#   while the ledger's awaiting_proof list names it, with the piece that proves it unreachable or
#   tests it. A change measures the crates it changes and every kernel crate that depends on one of
#   them; a dispatched or release run measures all. The crates are measured in parts side by
#   side, balanced by each crate's measured time, and judged together; the judge lists the crates
#   itself and fails on any whose files no part left.
# - The gates' own proof: geom-test's seeded_gates test runs the real cargo-mutants and
#   cargo-llvm-cov on a seeded crate and shows each gate fails on a seeded survivor, an uncovered
#   line, an untaken branch and an uncited coverage(off) mark.
# - Miri over every kernel test it finishes (28.8, 32.58, 32.60). Every kernel crate forbids unsafe
#   code, so Miri looks for undefined behaviour inside the libraries the kernel drives and the
#   standard library, which `forbid(unsafe_code)` does not reach, and for leaks and results that
#   differ between machines. nextest runs each test in its own Miri process and stops a test at its
#   budget, the default-miri profile in .config/nextest.toml. Miri's table (geom-test's
#   src/miri-times.tsv) gives each test's measured time, or marks it native-only when a measuring
#   run found Miri does not finish it. One plan job (`miri-plan`) lists the run's tests under Miri
#   once, fails on a test with no row, writes each partition's filterset of finishing tests and
#   geom-pool's, and hands them on with the cargo-nextest it built, for one day; the partitions
#   (`miri`) and geom-pool's job (`miri-pool`, with the doctests) run from that hand-over, so none
#   lists every test or builds a tool. The plan packs the partitions so each job ends within 15
#   minutes, its set-up counted, on a cold cache and a runner 1.6 times slower
#   (`geom_test::miri::PART_SECONDS`). A pull request that changes how Miri runs gets the plan,
#   partition 1 and geom-pool's job at a short budget, the miri-smoke profile. geom-pool's tests
#   run under Tree Borrows, every other crate's under Stacked Borrows, while crossbeam-epoch 0.9.21
#   is in the lock (the step says why).
#
# Miri's measuring run, by hand only (`-f miri_measure=new` or `all`; not a gate): it measures the
# tests for Miri's table on these runners instead of a development machine, and runs no gate. Its
# plan lists the ref's tests under Miri and takes those with no row in the table (`new`) or every
# one (`all`, to measure the whole table again), only those a nextest filterset selects when
# `miri_measure_tests` gives one; `kernel-quality miri-measure` packs them into parts whose tests
# end within the stop at four at once in any order, each planned at its finishing row's seconds or
# at the stop, so a part's job ends in about a quarter of an hour with its build. Each part runs
# the miri-measure-ci profile (the miri-measure profile with the budget, 600 s, as its stop), its
# geom-pool tests under Tree Borrows as the gate runs them and the rest under Stacked Borrows,
# uploads its nextest reports for three days, and fails, naming it, on any test that failed under
# Miri: a fault is read, never recorded as slow. It saves no cache and writes no table; the rows
# are written afterwards on a development computer, from the reports, by the table's one writer:
#
#   gh workflow run kernel-quality.yml --ref <branch> -f miri_measure=new
#   gh run download <run id> -n miri-measure-plan -D measure/plan
#   gh run download <run id> -p 'miri-measure-[0-9]*' -D measure/parts
#   reports=(); for f in measure/parts/*/junit-*.xml; do reports+=(--report "$f"); done
#   cargo run -p geom-test --bin kernel-quality -- miri-times "${reports[@]}" \
#     --scale 1 --stop 600 --list measure/plan/miri-list.json --note "<the run, its ref and commit>"
#
# Every pull request and queued change runs this workflow, so its last job, `done` ("Kernel quality
# checks pass"), always reports: main's ruleset requires it (.github/rulesets/protect-main.json).
#
# Only geom-test's judges decide: a cargo-mutants run that finds survivors (exit 2) or timeouts
# (exit 3) passes its step and leaves the verdict to the ledger; any other failure of a tool fails
# its step, and a judge fails when a job it needs did not succeed.
#
# Toolchains: the same pinned compiler as kernel.yml (28.13, the toolchain guard), and for branch
# coverage and Miri one dated nightly compiler, installed with rustup by its date and used only
# through RUSTUP_TOOLCHAIN in the steps that need it; an instrumented or interpreted build never
# ships. It is at least two weeks old when pinned; change it in its own pull request.
#
# Tools: cargo-mutants (MIT), cargo-llvm-cov (Apache-2.0 OR MIT) and cargo-nextest (Apache-2.0 OR
# MIT), each built from crates.io at a pinned version with --locked; Miri's plan job builds
# cargo-nextest so and hands that binary to the Miri jobs of the same run, which check its version.
# Miri (MIT OR Apache-2.0) is a component of the pinned nightly compiler.
#
# Supply chain: every action is pinned to a full commit; checkout, rust-toolchain and rust-cache to
# the same commits as kernel.yml, and upload-artifact and download-artifact to the commits of their
# tags (beside each), checked when they were pinned. The workflow can only read the repository.

on:
  pull_request:
    # `ready_for_review`: marking a draft ready runs what its pushes skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      files:
        description: "Only the files whose path this regular expression matches, e.g. geom-num/src/math/ (empty: every mutant)"
        required: false
        default: ""
        type: string
      gate:
        description: "The gates to run: all (every gate) or miri (Miri's gate alone)"
        required: false
        default: all
        type: choice
        options: [all, miri]
      miri_measure:
        description: "Miri's measuring run instead of the gates: new (the tests with no row in Miri's table) or all (every test); none runs the gates"
        required: false
        default: none
        type: choice
        options: [none, new, all]
      miri_measure_tests:
        description: "With miri_measure: only the tests this nextest filterset selects, e.g. package(geom-num) (empty: every one)"
        required: false
        default: ""
        type: string
  # Run whole by kernel-release.yml on a release tag, with every other kernel workflow (28.17).
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the runs it supersedes. Dispatches on one branch
# queue behind each other only when they narrow to the same files, so a narrowed run never waits
# hours behind a whole one; a measuring run and a run of Miri's gate alone each have a group of
# their own (every other run's group is as it was: the last two terms are empty).
concurrency:
  group: kernel-quality-${{ github.ref }}-${{ github.event_name }}-${{ inputs.files }}${{ (inputs.miri_measure == 'new' || inputs.miri_measure == 'all') && format('-miri-measure-{0}', inputs.miri_measure) || '' }}${{ inputs.gate == 'miri' && '-miri-alone' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The same pinned compiler as kernel.yml (28.13, the toolchain guard).
  RUST_TOOLCHAIN: "1.99.0"
  # The pinned nightly for branch coverage (28.8) and Miri, by date: rustc 1.101.0-nightly
  # (21b707e3f 2026-09-30), LLVM 23.1.1, with llvm-tools-preview and miri.
  RUST_NIGHTLY: "nightly-2026-10-01"
  CARGO_MUTANTS_VERSION: "27.1.0"
  CARGO_LLVM_COV_VERSION: "0.9.1"
  CARGO_NEXTEST_VERSION: "0.9.146"
  CARGO_TERM_COLOR: always
  # The release profile, as the mutation and coverage builds use it: overflow checks and debug
  # assertions on, so tests that use native arithmetic still stop where a mutant overflows and code
  # behind debug assertions is built, tested and measured.
  CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
  CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
  # The files a change must touch for these gates to run, as kernel.yml's KERNEL_PATHS.
  KERNEL_PATHS: |
    projects/engines/geometry/**
    Cargo.toml
    Cargo.lock
    .cargo/**
    .config/**
    rust-toolchain.toml
    rust-toolchain
    .github/**

jobs:
  # What this run judges. `mutants`, `coverage` and `miri`: whether each runs. `mode`: `diff` (a
  # pull request's or the queue's change, against `base`) or `full`. `files`: a full run's files, as
  # a regular expression (empty: every mutant). `miri_packages`: on a push to main, the crates whose
  # tests it reaches (empty: every kernel crate). `tree`: the tree judged. `miri_measure`: on a
  # dispatch that asks for Miri's measuring run, `new` or `all`, and every gate off (empty on
  # every other run), with `miri_measure_tests`, its filterset.
  when:
    name: What this run judges
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mutants: ${{ steps.push.outputs.mutants || steps.when.outputs.mutants }}
      coverage: ${{ steps.when.outputs.coverage }}
      miri: ${{ steps.push.outputs.miri || steps.when.outputs.miri }}
      mode: ${{ steps.when.outputs.mode }}
      base: ${{ steps.when.outputs.base }}
      files: ${{ steps.push.outputs.files || steps.when.outputs.files }}
      miri_packages: ${{ steps.push.outputs.miri_packages }}
      tree: ${{ steps.when.outputs.tree }}
      since_mutants: ${{ steps.since.outputs.mutants }}
      since_coverage: ${{ steps.since.outputs.coverage }}
      miri_measure: ${{ steps.when.outputs.miri_measure }}
      miri_measure_tests: ${{ steps.when.outputs.miri_measure_tests }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: The change, and whether its gates already passed on this tree
        id: when
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
          INPUT_FILES: ${{ inputs.files }}
          INPUT_GATE: ${{ inputs.gate }}
          INPUT_MIRI_MEASURE: ${{ inputs.miri_measure }}
          INPUT_MIRI_MEASURE_TESTS: ${{ inputs.miri_measure_tests }}
        run: |
          # The change's base, as kernel.yml's job `changes` finds it.
          base=""
          case "$EVENT" in
            pull_request)
              test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
              base=$(git rev-parse HEAD^1)
              ;;
            merge_group) base="$QUEUE_BASE" ;;
            push) if [ "$GITHUB_REF" = refs/heads/main ]; then base="$BEFORE"; fi ;;
          esac
          case "$base" in 0000000000000000000000000000000000000000) base="" ;; esac
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null \
            && ! git fetch -q --no-tags --depth 1 origin "$base"; then
            echo "The base $base cannot be fetched, so every file counts as changed."
            base=""
          fi
          kernel=true
          miri_files=false
          if [ -n "$base" ]; then
            kernel=false
            while IFS= read -r file; do
              while IFS= read -r pattern; do
                [ -n "$pattern" ] || continue
                case "$pattern" in
                  */\*\*) if [[ "$file" == "${pattern%\*\*}"* ]]; then kernel=true; fi ;;
                  *) if [ "$file" = "$pattern" ]; then kernel=true; fi ;;
                esac
              done <<< "$KERNEL_PATHS"
              # What changes how Miri runs: this workflow, nextest's profiles, the crate list.
              case "$file" in
                .github/workflows/kernel-quality.yml | .config/nextest.toml | projects/engines/geometry/crates/geom-test/src/miri.rs | projects/engines/geometry/crates/geom-test/src/miri-times.tsv) miri_files=true ;;
              esac
            done < <(git diff --no-ext-diff --no-renames --name-only "$base" HEAD)
          fi
          tree=$(git rev-parse "HEAD^{tree}")
          marked=false
          if marks=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=quality-tested-$tree" \
            --jq '[.artifacts[] | select(.expired | not)] | length') && [ "$marks" -gt 0 ]; then
            marked=true
          fi
          mode=full
          files="$INPUT_FILES"
          mutants=true
          coverage=true
          miri=true
          measure="" measure_tests=""
          why="every gate runs whole"
          case "$EVENT" in
            pull_request | merge_group)
              mode=diff
              miri=$miri_files
              if [ "$EVENT" = merge_group ]; then miri=false; fi
              if [ "$DRAFT" = true ]; then
                mutants=false coverage=false miri=false
                why="a draft: its gates run once it is marked ready for review"
              elif [ "$marked" = true ]; then
                mutants=false coverage=false
                why="mutation and coverage already passed on this tree"
              else
                why="mutation in the diff and coverage of what it reaches"
              fi
              ;;
            push)
              if [ "$GITHUB_REF" = refs/heads/main ]; then
                # The next step chooses the files and Miri's crates.
                if [ "$marked" = true ]; then coverage=false; fi
                why="the full run of the files the push changed; coverage unless it passed on this tree"
              fi
              ;;
            workflow_dispatch)
              if [ -n "$files" ]; then
                coverage=false miri=false
                why="the full mutation run narrowed to $files"
              fi
              # Miri's gate alone, asked for by hand: Miri's jobs run as on any dispatch, and no
              # other gate runs. Only this branch reads the input.
              case "$INPUT_GATE" in
                all) ;;
                miri)
                  if [ -n "$files" ] || [ "$INPUT_MIRI_MEASURE" != none ]; then
                    echo "::error::Ask for Miri's gate alone, the narrowed mutation run or Miri's measuring run, one at a time."
                    exit 1
                  fi
                  mutants=false coverage=false
                  why="Miri's gate alone"
                  ;;
                *)
                  echo "::error::The input gate is all or miri, not $INPUT_GATE."
                  exit 1
                  ;;
              esac
              # Miri's measuring run, asked for by hand: it alone runs, never a gate.
              case "$INPUT_MIRI_MEASURE" in
                new | all)
                  if [ -n "$files" ]; then
                    echo "::error::Ask for the narrowed mutation run or Miri's measuring run, not both."
                    exit 1
                  fi
                  measure="$INPUT_MIRI_MEASURE"
                  measure_tests="$INPUT_MIRI_MEASURE_TESTS"
                  if [[ "$measure_tests" == *$'\n'* ]]; then
                    echo "::error::A filterset of one line, please."
                    exit 1
                  fi
                  mutants=false coverage=false miri=false
                  why="Miri's measuring run of the tests: $measure ${measure_tests:-(every one)}"
                  ;;
              esac
              ;;
          esac
          if [ "$kernel" = false ]; then
            mutants=false coverage=false miri=false
            why="the change touches no file these gates read"
          fi
          {
            echo "mutants=$mutants"
            echo "coverage=$coverage"
            echo "miri=$miri"
            echo "mode=$mode"
            echo "base=$base"
            echo "files=$files"
            echo "tree=$tree"
            echo "kernel=$kernel"
            echo "miri_measure=$measure"
            echo "miri_measure_tests=$measure_tests"
          } | tee -a "$GITHUB_OUTPUT"
          echo "$EVENT: $why." | tee -a "$GITHUB_STEP_SUMMARY"
      # The last heads of this pull request whose mutants were judged clean and whose coverage
      # passed, from GitHub's record of its finished runs (never from the pull request's own
      # word): the newest run whose job succeeded. None on any other event, or when the record
      # cannot be read, so the whole change is judged.
      - name: The last heads this pull request's gates passed on
        id: since
        if: github.event_name == 'pull_request' && steps.when.outputs.mutants == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mutants="" coverage=""
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/kernel-quality.yml/runs?event=pull_request&status=completed&per_page=50&branch=$HEAD_REF" \
            --jq ".workflow_runs[] | select(.head_repository.full_name == \"$HEAD_REPO\") | select(any(.pull_requests[]; .number == $PR)) | \"\(.id) \(.head_sha)\"") || runs=""
          while read -r id sha; do
            [ -n "$id" ] || continue
            jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
              --jq '.jobs[] | "\(.conclusion) \(.name)"') || continue
            if [ -z "$mutants" ] && grep -qxF "success Mutants, judged against the ledger" <<< "$jobs"; then
              mutants=$sha
            fi
            if [ -z "$coverage" ] && grep -qxF "success Coverage (lines, and branches on the pinned nightly)" <<< "$jobs"; then
              coverage=$sha
            fi
            if [ -n "$mutants" ] && [ -n "$coverage" ]; then break; fi
          done <<< "$runs"
          {
            echo "mutants=$mutants"
            echo "coverage=$coverage"
          } | tee -a "$GITHUB_OUTPUT"
          echo "Mutants last judged clean on ${mutants:-no head}, coverage last passed on ${coverage:-no head}." >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.when.outputs.kernel == 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.when.outputs.kernel == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: quality-tools
      # A push to main: the files its full mutation run covers, and the crates Miri runs. With no
      # base (a first push), every mutant and every crate.
      - name: The files a push to main mutates, and the crates Miri runs
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.when.outputs.kernel == 'true' && steps.when.outputs.base != ''
        env:
          BASE: ${{ steps.when.outputs.base }}
        run: |
          git diff --no-ext-diff --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
          git diff --no-ext-diff --no-color --no-renames "$BASE" HEAD -- '*.rs' > "$RUNNER_TEMP/push.diff"
          files=$(cargo run --locked -q -p geom-test --bin kernel-quality -- mutants-files \
            --changed "$RUNNER_TEMP/changed.txt" --diff "$RUNNER_TEMP/push.diff")
          packages=$(cargo run --locked -q -p geom-test --bin kernel-quality -- miri-packages \
            --changed "$RUNNER_TEMP/changed.txt")
          {
            echo "files=$files"
            if [ -n "$files" ]; then echo "mutants=true"; else echo "mutants=false"; fi
            echo "miri_packages=$packages"
            if [ -n "$packages" ]; then echo "miri=true"; else echo "miri=false"; fi
          } | tee -a "$GITHUB_OUTPUT"

  cheap:
    name: Cheap checks first
    needs: when
    # Waits for format, lints, the scaffold and the sign-off (cheap-checks.yml), so a push that
    # fails one of them stops here; every heavy job below lists this job under `needs`.
    if: needs.when.outputs.mutants == 'true' || needs.when.outputs.coverage == 'true' || needs.when.outputs.miri == 'true'
    uses: ./.github/workflows/cheap-checks.yml

  mutants-plan:
    name: Mutants, the plan
    needs: [when, cheap]
    if: needs.when.outputs.mutants == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      count_2: ${{ steps.plan.outputs.count_2 }}
      shards_2: ${{ steps.plan.outputs.shards_2 }}
    env:
      MODE: ${{ needs.when.outputs.mode }}
      BASE: ${{ needs.when.outputs.base }}
      FILES: ${{ needs.when.outputs.files }}
      SINCE: ${{ needs.when.outputs.since_mutants }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, for what changed since the last clean head on the base's side.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; a pull request restores main's (a pull request's own
          # caches filled the repository's cache limit and evicted what main saved).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: quality-tools
      - name: Install cargo-mutants ${{ env.CARGO_MUTANTS_VERSION }}
        run: cargo install --locked cargo-mutants --version "$CARGO_MUTANTS_VERSION"
      - name: Every mutant this run must test
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          if [ "$MODE" = diff ]; then
            # The change against its base (a pull request's merge commit's first parent, or the
            # merge queue's base): exactly the change as it would merge. Only Rust files can hold
            # mutants, and a rename is written as a deletion and an addition, so cargo-mutants
            # reads nothing but plain hunks. With a diff that touches no mutant, cargo-mutants
            # prints no list and exits 0: the judge reads the empty file as no mutants.
            git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch -q --no-tags --depth 1 origin "$BASE"
            git diff --no-ext-diff --no-color --no-renames "$BASE" HEAD -- '*.rs' > "$RUNNER_TEMP/plan/pr.diff"
            # A later push: the change's lines in the files whose verdicts what changed since the
            # last clean head can move (geom_test::increment), all of them when there is no such
            # head or it cannot be fetched. The pull request's head is the merge commit's second
            # parent.
            if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$SINCE" ] \
              && { git cat-file -e "$SINCE^{commit}" 2>/dev/null || git fetch -q --no-tags origin "$SINCE"; }; then
              t="$RUNNER_TEMP/plan"
              git diff --no-renames --name-only "$BASE" HEAD > "$t/changed.txt"
              git diff --no-renames --name-only "$SINCE" HEAD^2 > "$t/head-changes.txt"
              git diff --no-renames --name-only --diff-filter=A "$SINCE" HEAD^2 > "$t/added.txt"
              git log --format= --name-only "$SINCE..$BASE" | sort -u > "$t/base-changes.txt"
              cargo run --locked -q -p geom-test --bin kernel-quality -- mutants-increment \
                --since "$SINCE" --changed "$t/changed.txt" --head-changes "$t/head-changes.txt" \
                --added "$t/added.txt" --base-changes "$t/base-changes.txt" > "$t/again.txt"
              if [ -s "$t/again.txt" ]; then
                xargs -a "$t/again.txt" -d '\n' git diff --no-ext-diff --no-color --no-renames "$BASE" HEAD -- > "$t/pr.diff"
              else
                : > "$t/pr.diff"
              fi
              echo "Mutated again since $SINCE: $(wc -l < "$t/again.txt") of $(grep -c '\.rs$' "$t/changed.txt") Rust files of the change." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            cargo mutants --in-diff "$RUNNER_TEMP/plan/pr.diff" --list --json > "$RUNNER_TEMP/plan/list.json"
            # The base's ledger: the only source of the known entries a change may use
            # (geom_test::mutants). A base without a ledger has none.
            git show "$BASE:projects/engines/geometry/quality-ledger.json" > "$RUNNER_TEMP/plan/base-ledger.json" \
              || rm -f "$RUNNER_TEMP/plan/base-ledger.json"
          elif [ -n "$FILES" ]; then
            # A narrowed full run: the mutants the shards' --re selects, and every mutant, for the
            # plan's check that the two agree on which files are in it.
            cargo mutants --re "$FILES" --list --json > "$RUNNER_TEMP/plan/list.json"
            cargo mutants --list --json > "$RUNNER_TEMP/plan/all.json"
          else
            cargo mutants --list --json > "$RUNNER_TEMP/plan/list.json"
          fi
      - name: How many shards the mutants need
        id: plan
        run: |
          # A narrowed run's plan checks cargo-mutants selected exactly those files' mutants. A
          # push to main whose files hold no mutant (only constants or comments changed, or the
          # files are gone) has none to check: its judge still counts those files' ledger
          # entries, so an entry the push left stale fails.
          narrowed=()
          if [ "$MODE" != diff ] && [ -n "$FILES" ] \
            && { [ "$GITHUB_EVENT_NAME" != push ] || [ "$(jq -s 'add // [] | length' "$RUNNER_TEMP/plan/list.json")" != 0 ]; }; then
            narrowed=(--files "$FILES" --all "$RUNNER_TEMP/plan/all.json")
          fi
          plan=$(cargo run --locked -p geom-test --bin kernel-quality -- mutants-plan \
            --list "$RUNNER_TEMP/plan/list.json" "${narrowed[@]}")
          echo "$plan"
          echo "count=$(jq -r .count <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -c .shards <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "count_2=$(jq -r .count_2 <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "shards_2=$(jq -c .shards_2 <<<"$plan")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-plan
          path: ${{ runner.temp }}/plan
          if-no-files-found: error

  mutants:
    name: Mutants (shard ${{ matrix.shard }})
    needs: [when, mutants-plan]
    # A plan of no shard (a diff that touches no mutant) runs none; its matrix still lists shard 0,
    # because a matrix may not be empty.
    if: needs.mutants-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      # Every shard reports, so the judge sees every survivor.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    env:
      SHARDS: ${{ needs.mutants-plan.outputs.count }}
      MODE: ${{ needs.when.outputs.mode }}
      FILES: ${{ needs.when.outputs.files }}
      # Mutated builds are tests only: optimise lightly and build incrementally, so each mutant
      # rebuilds in seconds rather than minutes.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; a pull request restores main's (a pull request's own
          # caches filled the repository's cache limit and evicted what main saved).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: mutants
      - name: Install cargo-mutants ${{ env.CARGO_MUTANTS_VERSION }}
        run: cargo install --locked cargo-mutants --version "$CARGO_MUTANTS_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutants-plan
          path: ${{ runner.temp }}/plan
      - name: Mutate the kernel code (shard ${{ matrix.shard }})
        env:
          # The judge reads each mutant's log for a compiler error (geom_test::mutants); colour
          # codes before `error[E...]` would hide it, so the logs are written without colour.
          CARGO_TERM_COLOR: never
        run: |
          # rust-cache turns incremental compilation off for the whole job; turn it back on here.
          export CARGO_INCREMENTAL=1
          # At most 8 GiB of data for each process (RLIMIT_DATA: its heap and private writable
          # mappings; the runner has 16 GB). A mutant that stops a budget from ever stopping a map
          # over usize::MAX items made a test grow until the runner ran out of memory and was shut
          # down, losing the whole shard (runs 40947686294 and 40956182700). Under the limit such a
          # test aborts on a failed allocation, cargo-mutants counts the mutant caught, and the
          # shard goes on. The baseline runs under the same limit, so a test that needs more fails
          # the shard, never one mutant.
          ulimit -d $((8 * 1024 * 1024))
          # The plan's selection: a change's diff, or a narrowed full run's files.
          only=()
          if [ "$MODE" = diff ]; then
            only=(--in-diff "$RUNNER_TEMP/plan/pr.diff")
          elif [ -n "$FILES" ]; then
            only=(--re "$FILES")
          fi
          set +e
          cargo mutants "${only[@]}" --shard "${{ matrix.shard }}/$SHARDS" --no-shuffle --in-place \
            -vV --output "$RUNNER_TEMP/out"
          code=$?
          set -e
          # 0: every mutant caught; 2: survivors; 3: timeouts. The judge decides those. Any other
          # code (a usage error, a failing baseline, a diff that does not match the tree, an
          # internal error) means the run itself failed.
          case "$code" in 0|2|3) ;; *) exit "$code" ;; esac
          test -f "$RUNNER_TEMP/out/mutants.out/mutants.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  mutants-2:
    name: Mutants (shard ${{ matrix.shard }})
    needs: [when, mutants-plan]
    # Shards 256 on, for a run of more shards than one matrix may hold: the same steps as `mutants`,
    # word for word, with the same `--shard k/n`. A plan of 256 shards or fewer runs none; its
    # matrix still lists shard 256, because a matrix may not be empty.
    if: needs.mutants-plan.outputs.count_2 != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      # Every shard reports, so the judge sees every survivor.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards_2) }}
    env:
      SHARDS: ${{ needs.mutants-plan.outputs.count }}
      MODE: ${{ needs.when.outputs.mode }}
      FILES: ${{ needs.when.outputs.files }}
      # Mutated builds are tests only: optimise lightly and build incrementally, so each mutant
      # rebuilds in seconds rather than minutes.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; a pull request restores main's (a pull request's own
          # caches filled the repository's cache limit and evicted what main saved).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: mutants
      - name: Install cargo-mutants ${{ env.CARGO_MUTANTS_VERSION }}
        run: cargo install --locked cargo-mutants --version "$CARGO_MUTANTS_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutants-plan
          path: ${{ runner.temp }}/plan
      - name: Mutate the kernel code (shard ${{ matrix.shard }})
        env:
          # The judge reads each mutant's log for a compiler error (geom_test::mutants); colour
          # codes before `error[E...]` would hide it, so the logs are written without colour.
          CARGO_TERM_COLOR: never
        run: |
          # rust-cache turns incremental compilation off for the whole job; turn it back on here.
          export CARGO_INCREMENTAL=1
          # At most 8 GiB of data for each process (RLIMIT_DATA: its heap and private writable
          # mappings; the runner has 16 GB). A mutant that stops a budget from ever stopping a map
          # over usize::MAX items made a test grow until the runner ran out of memory and was shut
          # down, losing the whole shard (runs 40947686294 and 40956182700). Under the limit such a
          # test aborts on a failed allocation, cargo-mutants counts the mutant caught, and the
          # shard goes on. The baseline runs under the same limit, so a test that needs more fails
          # the shard, never one mutant.
          ulimit -d $((8 * 1024 * 1024))
          # The plan's selection: a change's diff, or a narrowed full run's files.
          only=()
          if [ "$MODE" = diff ]; then
            only=(--in-diff "$RUNNER_TEMP/plan/pr.diff")
          elif [ -n "$FILES" ]; then
            only=(--re "$FILES")
          fi
          set +e
          cargo mutants "${only[@]}" --shard "${{ matrix.shard }}/$SHARDS" --no-shuffle --in-place \
            -vV --output "$RUNNER_TEMP/out"
          code=$?
          set -e
          # 0: every mutant caught; 2: survivors; 3: timeouts. The judge decides those. Any other
          # code (a usage error, a failing baseline, a diff that does not match the tree, an
          # internal error) means the run itself failed.
          case "$code" in 0|2|3) ;; *) exit "$code" ;; esac
          test -f "$RUNNER_TEMP/out/mutants.out/mutants.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  mutants-judge:
    name: Mutants, judged against the ledger
    needs: [when, mutants-plan, mutants, mutants-2]
    if: ${{ !cancelled() && needs.when.outputs.mutants == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ needs.when.outputs.mode }}
      FILES: ${{ needs.when.outputs.files }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Every job the judge reads succeeded
        run: |
          echo "plan: ${{ needs.mutants-plan.result }}; shards: ${{ needs.mutants.result }}; shards 256 on: ${{ needs.mutants-2.result }}"
          test "${{ needs.mutants-plan.result }}" = success
          case "${{ needs.mutants.result }}" in success) ;; skipped) test "${{ needs.mutants-plan.outputs.count }}" = 0 ;; *) exit 1 ;; esac
          case "${{ needs.mutants-2.result }}" in success) ;; skipped) test "${{ needs.mutants-plan.outputs.count_2 }}" = 0 ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; a pull request restores main's (a pull request's own
          # caches filled the repository's cache limit and evicted what main saved).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: quality-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutants-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.mutants-plan.outputs.count != '0'
        with:
          pattern: mutants-[0-9]*
          path: ${{ runner.temp }}/shards
      - name: Judge every mutant against the ledger
        run: |
          shopt -s nullglob
          outs=("$RUNNER_TEMP"/shards/mutants-*/mutants.out)
          # download-artifact gives each artifact a folder of its own when a pattern matches several,
          # and extracts a single match straight into the path: read either layout.
          if [ -d "$RUNNER_TEMP/shards/mutants.out" ]; then
            outs+=("$RUNNER_TEMP/shards/mutants.out")
          fi
          args=(--expected "$RUNNER_TEMP/plan/list.json")
          if [ "$MODE" = diff ]; then
            args+=(--mode diff)
            if [ -f "$RUNNER_TEMP/plan/base-ledger.json" ]; then
              args+=(--base-ledger "$RUNNER_TEMP/plan/base-ledger.json")
            fi
          else
            args+=(--mode full)
            if [ -n "$FILES" ]; then
              args+=(--files "$FILES")
            fi
          fi
          cargo run --locked -p geom-test --bin kernel-quality -- mutants "${args[@]}" "${outs[@]}"

  # Coverage in parts side by side (each crate is measured by its own tests, so the crates share out
  # whole): `coverage-plan` lists the crates the judge will judge and shares them among parts by
  # their measured times (geom_test::coverage::plan_parts, src/coverage-times.tsv), each part
  # measures its crates, and `coverage` judges them all from one folder. The judge lists the crates
  # itself and fails on any crate whose files no part left (geom_test::coverage::missing_outputs),
  # so a dropped or failed part fails the gate, and `done` fails on any part that did not pass.
  coverage-plan:
    name: Coverage, which part measures which crates
    needs: [when, cheap]
    if: needs.when.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.parts.outputs.matrix }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, for what changed since the last clean head on the base's side.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; a pull request restores main's (a pull request's own
          # caches filled the repository's cache limit and evicted what main saved).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: coverage-plan
      - name: The crates to measure
        env:
          BASE: ${{ needs.when.outputs.base }}
          SINCE: ${{ needs.when.outputs.since_coverage }}
        run: |
          mkdir -p "$RUNNER_TEMP/scope"
          # The judge reads the scope from this folder: changed.txt when there is a base.
          echo "${BASE:-none}" > "$RUNNER_TEMP/scope/base.txt"
          if [ -n "$BASE" ]; then
            git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch -q --no-tags --depth 1 origin "$BASE"
            git diff --no-ext-diff --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/scope/changed.txt"
            # A later push: the crates of what changed since the last head whose coverage passed
            # (geom_test::increment::coverage); the whole change without one.
            if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$SINCE" ] \
              && { git cat-file -e "$SINCE^{commit}" 2>/dev/null || git fetch -q --no-tags origin "$SINCE"; }; then
              t="$RUNNER_TEMP"
              git diff --no-renames --name-only "$SINCE" HEAD^2 > "$t/head-changes.txt"
              git diff --no-renames --name-only --diff-filter=A "$SINCE" HEAD^2 > "$t/added.txt"
              git log --format= --name-only "$SINCE..$BASE" | sort -u > "$t/base-changes.txt"
              RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" RUSTFLAGS= cargo run --locked -q -p geom-test \
                --bin kernel-quality -- coverage-increment --since "$SINCE" \
                --head-changes "$t/head-changes.txt" --added "$t/added.txt" \
                --base-changes "$t/base-changes.txt" > "$t/scope/changed.txt"
              echo "Measured again since $SINCE: the crates of $(wc -l < "$t/scope/changed.txt") changed file(s)." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            echo "SCOPE=--changed $RUNNER_TEMP/scope/changed.txt" >> "$GITHUB_ENV"
          else
            echo "SCOPE=--all" >> "$GITHUB_ENV"
          fi
      - name: Which part measures which crates
        id: parts
        run: |
          # The list comes from the judge's own rule, so the parts measure what it will judge.
          # shellcheck disable=SC2086 # SCOPE holds an option and its value.
          matrix=$(cargo run --locked -q -p geom-test --bin kernel-quality -- coverage-parts $SCOPE)
          jq -r '.include[] | "part \(.part) of \(.of): \(.crates)"' <<<"$matrix" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-scope
          path: ${{ runner.temp }}/scope
          if-no-files-found: error

  coverage-parts:
    name: Coverage part ${{ matrix.part }} of ${{ matrix.of }}
    needs: [when, coverage-plan]
    if: needs.when.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # Every part reports, so the judge names every crate a failed part left unmeasured.
      fail-fast: false
      matrix: ${{ fromJSON(needs.coverage-plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the pinned nightly with llvm-tools
        # A run with no crate to measure has one empty part, which measures nothing.
        if: matrix.crates != ''
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component llvm-tools-preview
          rustc "+$RUST_NIGHTLY" -vV
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; a pull request restores main's (a pull request's own
          # caches filled the repository's cache limit and evicted what main saved). One part
          # saves it: every part restores and would save the same cache.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.part == 1 }}
          key: coverage
      - name: Install cargo-llvm-cov ${{ env.CARGO_LLVM_COV_VERSION }}
        # A run with no crate to measure has one empty part, which measures nothing.
        if: matrix.crates != ''
        run: cargo install --locked cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
      - name: Measure each crate with its own tests
        # A run with no crate to measure has one empty part, which measures nothing.
        if: matrix.crates != ''
        env:
          CRATES: ${{ matrix.crates }}
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          # llvm-cov keeps the first coverage record of each function name it reads, across every
          # test binary, and drops the rest. Two things would give a function a first record that
          # is not its real count:
          # - Optimised builds let rustc inline small functions into other crates, where the copy
          #   has different coverage data (llvm-cov's "mismatched data"); the threshold stops that
          #   (geom_test::coverage::check_log fails a run where it did not work).
          # - A function the crate itself never calls is not compiled into its library, and rustc
          #   records it there with every count zero; an `#[inline]` function that only another
          #   test binary calls is then reported as never run whenever a binary holding that zero
          #   record is read first. -C link-dead-code compiles every function into the library,
          #   so every record of a function reads the same counters, which llvm-profdata merge
          #   adds up over every test process (https://llvm.org/docs/CommandGuide/llvm-profdata.html).
          #   geom-test's seeded_gates test proves it on an `#[inline]` function.
          RUSTFLAGS: -Z cross-crate-inline-threshold=never -C link-dead-code
        run: |
          mkdir -p "$RUNNER_TEMP/cov"
          for crate in $CRATES; do
            echo "::group::$crate"
            cargo llvm-cov --locked -p "$crate" --release --branch \
              --lcov --output-path "$RUNNER_TEMP/cov/$crate.lcov" 2>&1 | tee "$RUNNER_TEMP/cov/$crate.log"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-part-${{ matrix.part }}
          path: ${{ runner.temp }}/cov
          if-no-files-found: ignore

  coverage:
    name: Coverage (lines, and branches on the pinned nightly)
    needs: [when, cheap, coverage-plan, coverage-parts]
    # It judges even when a part failed, so every crate left unmeasured is named.
    if: ${{ !cancelled() && needs.when.outputs.coverage == 'true' && needs.coverage-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          key: coverage-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-scope
          path: ${{ runner.temp }}/scope
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/cov
      - name: Judge the coverage against 28.8's bars, and every coverage(off) mark against its proof
        run: |
          # The plan's scope: the changed files it wrote, or every crate.
          SCOPE=--all
          if [ -f "$RUNNER_TEMP/scope/changed.txt" ]; then SCOPE="--changed $RUNNER_TEMP/scope/changed.txt"; fi
          mkdir -p "$RUNNER_TEMP/cov"
          # shellcheck disable=SC2086 # SCOPE holds an option and its value.
          cargo run --locked -p geom-test --bin kernel-quality -- coverage $SCOPE \
            --lcov-dir "$RUNNER_TEMP/cov"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: ${{ runner.temp }}/cov
          if-no-files-found: ignore

  gates-seeded:
    name: The gates fail on seeded faults
    needs: [when, cheap]
    # With coverage: once per change, when it is ready to land.
    if: needs.when.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the pinned nightly with llvm-tools
        run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; a pull request restores main's (a pull request's own
          # caches filled the repository's cache limit and evicted what main saved).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: quality-tools
      - name: Install cargo-mutants ${{ env.CARGO_MUTANTS_VERSION }} and cargo-llvm-cov ${{ env.CARGO_LLVM_COV_VERSION }}
        run: |
          cargo install --locked cargo-mutants --version "$CARGO_MUTANTS_VERSION"
          cargo install --locked cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
      - name: Each gate fails on its seeded fault and passes on the fixed crate
        env:
          # The seeded test runs cargo-llvm-cov on this nightly, as the coverage job does.
          SPAREKIT_COVERAGE_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
        run: cargo test --locked -p geom-test --test seeded_gates -- --ignored --test-threads 1

  # Miri's plan, once for the run's Miri jobs (32.60): it lists the run's tests under Miri, fails on
  # any test Miri's table has no row for (32.58), writes each partition's filterset of finishing
  # tests and geom-pool's (`kernel-quality miri-plan`), and hands them on, with the crates and the
  # cargo-nextest it built, as one artifact of this run kept one day. No partition lists every
  # test, builds cargo-nextest or builds kernel-quality (each cost every partition 0.6 to 5.4
  # minutes, main's run 44000736866). It saves the Miri cache the other Miri jobs restore.
  miri-plan:
    name: Miri, the plan
    needs: [when, cheap]
    if: needs.when.outputs.miri == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    env:
      # A push to main's crates (empty: every kernel crate).
      REACHED: ${{ needs.when.outputs.miri_packages }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the pinned nightly with Miri
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component miri,rust-src
          cargo "+$RUST_NIGHTLY" miri setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; a pull request restores main's (a pull request's own
          # caches filled the repository's cache limit and evicted what main saved). Named by its
          # key alone, not this job's id, so every Miri job restores this one.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: miri
          add-job-id-key: false
      - name: Install cargo-nextest ${{ env.CARGO_NEXTEST_VERSION }}
        run: cargo install --locked cargo-nextest --version "$CARGO_NEXTEST_VERSION"
      - name: The kernel crates
        run: |
          packages="$REACHED"
          if [ -z "$packages" ]; then
            packages=$(cargo run --locked -p geom-test --bin kernel-quality -- miri-packages)
          fi
          echo "$packages"
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
      - name: The run's tests
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          MIRIFLAGS: -Zmiri-isolation-error=warn-nobacktrace
        run: |
          mkdir -p "$RUNNER_TEMP/miri-plan"
          # shellcheck disable=SC2086 # PACKAGES holds several -p arguments, none with a space.
          cargo miri nextest list --locked $PACKAGES \
            --message-format json > "$RUNNER_TEMP/miri-plan/miri-list.json"
      - name: Every partition's tests, and geom-pool's
        id: plan
        run: |
          # Fails on any test of the run that Miri's table has no row for (32.58).
          plan=$(cargo run --locked -q -p geom-test --bin kernel-quality -- miri-plan \
            --list "$RUNNER_TEMP/miri-plan/miri-list.json" --out "$RUNNER_TEMP/miri-plan")
          echo "$plan"
          echo "parts=$(jq -c .parts <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "Miri's plan: $(jq -r .tests <<<"$plan") tests in $(jq -r .count <<<"$plan") partitions, and geom-pool's $(jq -r .pool <<<"$plan")." >> "$GITHUB_STEP_SUMMARY"
          echo "$PACKAGES" > "$RUNNER_TEMP/miri-plan/packages.txt"
          cp "$(command -v cargo-nextest)" "$RUNNER_TEMP/miri-plan/cargo-nextest"
          # The tool each Miri job reads its report with (`miri-stopped`), as built here.
          cp target/debug/kernel-quality "$RUNNER_TEMP/miri-plan/kernel-quality"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miri-plan
          path: ${{ runner.temp }}/miri-plan
          retention-days: 1
          if-no-files-found: error

  miri:
    name: Miri (partition ${{ matrix.partition }})
    needs: [when, cheap, miri-plan]
    if: needs.when.outputs.miri == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # A push to main, by hand or on a release: every partition of the plan. A pull request
        # that changes how Miri runs: partition 1 (the job `when` decides).
        partition: ${{ fromJSON(github.event_name == 'pull_request' && '[1]' || needs.miri-plan.outputs.parts) }}
    env:
      # The plan packs the tests Miri finishes (geom-test's src/miri-times.tsv) into the
      # partitions, so that each partition's listing and tests end within what is left of 15
      # minutes (principle 8) after its set-up, each test planned at 1.6 times its seconds and
      # never over the stop (`geom_test::miri::PART_SECONDS`, `planned`), in whatever order
      # nextest starts them: geom-test's
      # kernel_quality_workflow.rs holds the plan to it. Hashed into 16, every test took 1.7 to 3.4
      # hours a partition (run 43696026626), 823 of them stopped at their budget; such tests are
      # native-only now (32.58).
      # A partition a push's crates leave without a test passes.
      NEXTEST_NO_TESTS: pass
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the pinned nightly with Miri
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component miri,rust-src
          cargo "+$RUST_NIGHTLY" miri setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restores the cache the plan saves, and saves none.
          save-if: false
          key: miri
          add-job-id-key: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: miri-plan
          path: ${{ runner.temp }}/miri-plan
      - name: The plan's cargo-nextest and crates
        run: |
          # The artifact keeps no file modes. The binary is the plan's own locked build of the
          # pinned version from crates.io, checked here before it runs anything.
          install -m 755 "$RUNNER_TEMP/miri-plan/cargo-nextest" "$HOME/.cargo/bin/cargo-nextest"
          cargo nextest --version | grep -qxF "release: $CARGO_NEXTEST_VERSION"
          install -m 755 "$RUNNER_TEMP/miri-plan/kernel-quality" "$HOME/.cargo/bin/kernel-quality"
          packages=$(cat "$RUNNER_TEMP/miri-plan/packages.txt")
          echo "$packages"
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
      # The tests have a limit of their own, under the job's: a partition planned within 13
      # minutes that overruns is stopped here, red, and the steps after it still run, so its log,
      # the summary of its stopped tests and its report are kept. Run 44168015168's partition 65
      # overran inside this step until the job's 30 minutes, and GitHub kept nothing of it.
      # `geom_test::miri::TESTS_STEP_MINUTES`, with the set-up and the first upload's bound,
      # fits the job's limit (kernel_quality_workflow.rs).
      # The yardstick (32.78): the runner's processor, then one fixed small test alone under Miri;
      # its seconds over its row are this job's scale, held at 0.5 from below, and each test's stop
      # is its row times 1.6 times the scale. Over 3 the job fails here, a runner too slow to judge.
      - name: The runner's processor and Miri's scale (partition ${{ matrix.partition }})
        timeout-minutes: 12
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          MIRIFLAGS: -Zmiri-isolation-error=warn-nobacktrace
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          cargo miri nextest run --locked -p geom-num --profile miri-yardstick \
            -E 'test(=plane::tests::the_largest_denominators_of_both_widths)'
          kernel-quality miri-scale --report target/nextest/miri-yardstick/junit.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Every kernel test Miri finishes (partition ${{ matrix.partition }})
        timeout-minutes: 24
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          # Miri's defaults stay: isolation from the host (no clock but Miri's own, no outside
          # entropy, environment variables hidden), so a seeded test runs its fixed default seed;
          # and extra rounding error on the float operations whose precision Rust does not
          # guarantee, so a golden hash that rests on one of them fails here. One change: an
          # operation isolation refuses returns an error with a warning instead of stopping the
          # run, because proptest's failure persistence asks for the working directory before
          # every property and carries on without it.
          MIRIFLAGS: -Zmiri-isolation-error=warn-nobacktrace
        run: |
          # A pull request runs the miri-smoke profile: the same run at a short budget per test.
          profile=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            profile=(--profile miri-smoke)
          fi
          # coreutils' timeout stops nextest with SIGTERM a minute before this step's limit
          # (`geom_test::miri::TESTS_RUN_SECONDS`): nextest then ends its tests and writes its
          # report, which GitHub's own stop at the limit does not let it do (trial run
          # 44290072805: no report). The step's limit stays, for a run that ignores the signal.
          # shellcheck disable=SC2086 # PACKAGES holds several -p arguments, none with a space.
          timeout --signal=TERM --kill-after=30 1380 \
            cargo miri nextest run --locked $PACKAGES "${profile[@]}" \
            -E "not package(geom-pool) & ($(cat "$RUNNER_TEMP/miri-plan/part-${{ matrix.partition }}.txt"))"
      # A test nextest stops at the budget is counted as passing (the profiles' `on-timeout =
      # "pass"`), and its report shows a plain pass; a test nobody saw finish is not one (32.68).
      # This step reads the report, names every test stopped as stopped with no verdict in the
      # job's summary, and fails the job on any not on the list of tests that may stop (geom-test's
      # src/miri-may-stop.tsv, the table's rows over 375 s). A pull request's short stop may end
      # every test whose row a 1.6 times slower runner takes past it. It runs whatever the tests
      # did.
      - name: Tests stopped with no verdict (partition ${{ matrix.partition }})
        if: ${{ !cancelled() }}
        run: |
          stop=600 profile=default-miri
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            stop=60 profile=miri-smoke
          fi
          kernel-quality miri-stopped --stop "$stop" --report "target/nextest/$profile/junit.xml" \
            --yardstick target/nextest/miri-yardstick/junit.xml \
            --title "Partition ${{ matrix.partition }}" | tee -a "$GITHUB_STEP_SUMMARY"
      # The partition's report, in two tries. GitHub's storage can stall an upload until the
      # job's limit (run 44075531453: partition 31's tests passed in 466 s, then its upload hung
      # for 22 minutes), so each try is bounded; a first try that fails or runs out of time does
      # not fail the job by itself, only starts the second, under the same name (`overwrite`
      # replaces a part the first left), for the reader of `miri-<partition>`
      # (`gh run download <run id> -n miri-<partition>`, for `kernel-quality miri-times`). The
      # second try's failure fails the job: a report lost twice is never passed over. A reader of
      # a job red only there: the tests' verdict is in the test step's log; re-run the job for its
      # report.
      - id: report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: miri-${{ matrix.partition }}
          path: target/nextest/*/junit*.xml
          if-no-files-found: ignore
      - name: The report again, the first try having failed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.report.outcome != 'success' && steps.report.outcome != 'skipped' }}
        timeout-minutes: 3
        with:
          name: miri-${{ matrix.partition }}
          path: target/nextest/*/junit*.xml
          if-no-files-found: ignore
          overwrite: true

  # geom-pool's finishing tests under Tree Borrows, and the kernel's doctests, in a job of their
  # own beside the partitions, from the plan's hand-over.
  miri-pool:
    name: Miri (geom-pool under Tree Borrows, and the doctests)
    needs: [when, cheap, miri-plan]
    if: needs.when.outputs.miri == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A push to main's crates (empty: every kernel crate).
      REACHED: ${{ needs.when.outputs.miri_packages }}
      # A table with no finishing geom-pool test runs none, and passes.
      NEXTEST_NO_TESTS: pass
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the pinned nightly with Miri
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component miri,rust-src
          cargo "+$RUST_NIGHTLY" miri setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restores the cache the plan saves, and saves none.
          save-if: false
          key: miri
          add-job-id-key: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: miri-plan
          path: ${{ runner.temp }}/miri-plan
      - name: The plan's cargo-nextest and crates
        run: |
          # The artifact keeps no file modes. The binary is the plan's own locked build of the
          # pinned version from crates.io, checked here before it runs anything.
          install -m 755 "$RUNNER_TEMP/miri-plan/cargo-nextest" "$HOME/.cargo/bin/cargo-nextest"
          cargo nextest --version | grep -qxF "release: $CARGO_NEXTEST_VERSION"
          install -m 755 "$RUNNER_TEMP/miri-plan/kernel-quality" "$HOME/.cargo/bin/kernel-quality"
          packages=$(cat "$RUNNER_TEMP/miri-plan/packages.txt")
          echo "$packages"
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
      # geom-pool, the one crate that may name rayon (29.4), under Tree Borrows instead of Stacked
      # Borrows. crossbeam-epoch 0.9.21, which rayon's queues use, turns a reference to a list
      # entry into one to the whole thread record around it (`IsElement::element_of`); Stacked
      # Borrows reports that, Tree Borrows allows it. crossbeam fixed it upstream in
      # crossbeam-rs/crossbeam#871 (commit 02fb08a6c, "epoch: Fix stacked borrows violations"),
      # which changes a public trait, so only a 0.10 release carries it. geom-test's
      # kernel_quality_workflow test fails once Cargo.lock moves off 0.9.21, so the exception is
      # looked at again then. The leak check is off for this step only: rayon's `ThreadPool::drop`
      # signals its threads to stop (`registry.terminate()`) and does not join them, so when a test
      # ends each worker's crossbeam-epoch registration is still alive, and Miri reports it as
      # leaked (run 40593080811). rayon's own CI runs Miri the same way, `-Zmiri-tree-borrows
      # -Zmiri-ignore-leaks` (rayon-rs/rayon, .github/workflows/ci.yaml). Every other check of
      # Miri stays on: data races, use-after-free, uninitialised and out-of-bounds reads, and Tree
      # Borrows' own aliasing rules.
      # geom-pool runs its tasks with rayon's `join` and not a scope: rayon-core 1.13.0's
      # `Scope::spawn` frees a scope under a finishing job's protected reference, which Tree Borrows
      # rejects under some schedules (rayon-rs/rayon#1328, fixed by #1330, in no release yet). The
      # old scope code failed 4 of 16 Miri seeds (`-Zmiri-many-seeds=0..16`) on both e7dd9a41 and
      # 96e349a7, so the earlier green runs were a lucky schedule, not a fix; the join code is clean
      # on 32 seeds of the tests that nest and panic.
      # Like every partition, it runs the tests Miri's table says finish (its rows are measured
      # under Tree Borrows); a test measured over the stop is native-only, never run to the stop.
      # Its tests have a partition's limit of their own, `geom_test::miri::TESTS_STEP_MINUTES`, for
      # the plan holds them to a partition's seconds: an overrun is stopped here, red, and the
      # reading of the report and its upload still run (kernel_quality_workflow.rs).
      # The yardstick, as in each partition (32.78): the runner's processor and this job's scale,
      # measured under the partitions' own flags so every job's scale is counted the same way.
      - name: The runner's processor and Miri's scale (geom-pool)
        if: env.REACHED == '' || contains(format('{0} ', env.REACHED), '-p geom-pool ')
        timeout-minutes: 12
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          MIRIFLAGS: -Zmiri-isolation-error=warn-nobacktrace
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          cargo miri nextest run --locked -p geom-num --profile miri-yardstick \
            -E 'test(=plane::tests::the_largest_denominators_of_both_widths)'
          kernel-quality miri-scale --report target/nextest/miri-yardstick/junit.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: geom-pool's tests under Miri with Tree Borrows
        if: env.REACHED == '' || contains(format('{0} ', env.REACHED), '-p geom-pool ')
        timeout-minutes: 24
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          MIRIFLAGS: -Zmiri-isolation-error=warn-nobacktrace -Zmiri-tree-borrows -Zmiri-ignore-leaks
        run: |
          profile=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            profile=(--profile miri-smoke)
          fi
          # coreutils' timeout stops nextest with SIGTERM a minute before this step's limit
          # (`geom_test::miri::TESTS_RUN_SECONDS`): nextest then ends its tests and writes its
          # report, which GitHub's own stop at the limit does not let it do (trial run
          # 44290072805: no report). The step's limit stays, for a run that ignores the signal.
          timeout --signal=TERM --kill-after=30 1380 \
            cargo miri nextest run --locked -p geom-pool "${profile[@]}" \
            -E "package(geom-pool) & ($(cat "$RUNNER_TEMP/miri-plan/pool.txt"))"
      # As in each partition: every geom-pool test stopped is named as stopped with no verdict,
      # and one not on the list of tests that may stop fails the job (32.68).
      - name: geom-pool's tests stopped with no verdict
        if: ${{ !cancelled() && (env.REACHED == '' || contains(format('{0} ', env.REACHED), '-p geom-pool ')) }}
        run: |
          stop=600 profile=default-miri
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            stop=60 profile=miri-smoke
          fi
          kernel-quality miri-stopped --stop "$stop" --report "target/nextest/$profile/junit.xml" \
            --yardstick target/nextest/miri-yardstick/junit.xml \
            --title "geom-pool under Tree Borrows" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The kernel's doctests under Miri
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          MIRIFLAGS: -Zmiri-isolation-error=warn-nobacktrace
        run: |
          # nextest does not run doctests, so this job runs them, every one.
          # shellcheck disable=SC2086 # PACKAGES holds several -p arguments, none with a space.
          cargo miri test --locked $PACKAGES --doc
      # Bounded like a partition's first try, so the tests' limit, the set-up and the upload fit
      # the job's limit.
      - id: report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        with:
          name: miri-pool
          path: target/nextest/*/junit*.xml
          if-no-files-found: ignore

  # Miri's measuring run (the header says what it is for and how its reports become rows): only on
  # a dispatch that asks for it, and never a gate. Every job below restores main's Miri cache (the
  # one `miri-plan` saves) and saves none, and none writes the table.
  miri-measure-plan:
    name: Miri's measuring run, the plan
    needs: when
    if: needs.when.outputs.miri_measure != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      count: ${{ steps.plan.outputs.count }}
      parts: ${{ steps.plan.outputs.parts }}
      count_2: ${{ steps.plan.outputs.count_2 }}
      parts_2: ${{ steps.plan.outputs.parts_2 }}
    env:
      MEASURE: ${{ needs.when.outputs.miri_measure }}
      MEASURE_TESTS: ${{ needs.when.outputs.miri_measure_tests }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the pinned nightly with Miri
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component miri,rust-src
          cargo "+$RUST_NIGHTLY" miri setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restores the cache main's job `miri-plan` saves and saves nothing: a measuring run
          # leaves nothing another run reads.
          save-if: false
          key: miri
          add-job-id-key: false
      - name: Install cargo-nextest ${{ env.CARGO_NEXTEST_VERSION }}
        run: cargo install --locked cargo-nextest --version "$CARGO_NEXTEST_VERSION"
      - name: The kernel crates
        run: |
          packages=$(cargo run --locked -p geom-test --bin kernel-quality -- miri-packages)
          echo "$packages"
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
      - name: The run's tests
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          MIRIFLAGS: -Zmiri-isolation-error=warn-nobacktrace
        run: |
          # The whole listing, as Miri's plan lists it: the table's rows are written against it.
          mkdir -p "$RUNNER_TEMP/measure"
          # shellcheck disable=SC2086 # PACKAGES holds several -p arguments, none with a space.
          cargo miri nextest list --locked $PACKAGES \
            --message-format json > "$RUNNER_TEMP/measure/miri-list.json"
          # Only the tests the dispatch's filterset selects, when it gives one.
          if [ -n "$MEASURE_TESTS" ]; then
            # shellcheck disable=SC2086 # PACKAGES holds several -p arguments, none with a space.
            cargo miri nextest list --locked $PACKAGES -E "$MEASURE_TESTS" \
              --message-format json > "$RUNNER_TEMP/measure/only-list.json"
          fi
      - name: The parts
        id: plan
        run: |
          only=()
          if [ -f "$RUNNER_TEMP/measure/only-list.json" ]; then
            only=(--only "$RUNNER_TEMP/measure/only-list.json")
          fi
          plan=$(cargo run --locked -q -p geom-test --bin kernel-quality -- miri-measure \
            --which "$MEASURE" --list "$RUNNER_TEMP/measure/miri-list.json" "${only[@]}" \
            --out "$RUNNER_TEMP/measure")
          echo "$plan"
          echo "count=$(jq -r .count <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "parts=$(jq -c .parts <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "count_2=$(jq -r .count_2 <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "parts_2=$(jq -c .parts_2 <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "Miri's measuring run: $(jq -r .tests <<<"$plan") tests in $(jq -r .count <<<"$plan") parts." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miri-measure-plan
          path: ${{ runner.temp }}/measure
          retention-days: 3
          if-no-files-found: error

  miri-measure:
    name: Miri's measuring run (part ${{ matrix.part }})
    needs: [when, miri-measure-plan]
    # A plan with no test to measure runs no part; its matrix still lists part 1, because a matrix
    # may not be empty.
    if: needs.miri-measure-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A part with no test of one kind (geom-pool's, or the rest) runs none of that kind.
      NEXTEST_NO_TESTS: pass
    strategy:
      # Every part reports, so one failure does not lose the others' times.
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.miri-measure-plan.outputs.parts) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the pinned nightly with Miri
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component miri,rust-src
          cargo "+$RUST_NIGHTLY" miri setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restores the cache main's job `miri-plan` saves and saves nothing: a measuring run
          # leaves nothing another run reads.
          save-if: false
          key: miri
          add-job-id-key: false
      - name: Install cargo-nextest ${{ env.CARGO_NEXTEST_VERSION }}
        run: cargo install --locked cargo-nextest --version "$CARGO_NEXTEST_VERSION"
      - name: The kernel crates
        run: |
          packages=$(cargo run --locked -p geom-test --bin kernel-quality -- miri-packages)
          echo "$packages"
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: miri-measure-plan
          path: ${{ runner.temp }}/measure
      - name: Measure this part's tests under Miri (part ${{ matrix.part }})
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          # The flags of the job `miri`, so the times are that run's.
          MIRIFLAGS: -Zmiri-isolation-error=warn-nobacktrace
        run: |
          # The miri-measure-ci profile stops a test at the budget and counts it as timed out, so
          # nextest's exit status is 100 when any test was stopped or failed: the report says
          # which, and the last step reads it. Any other status (a build that failed) fails here.
          status=0
          # shellcheck disable=SC2086 # PACKAGES holds several -p arguments, none with a space.
          cargo miri nextest run --locked $PACKAGES --profile miri-measure-ci \
            -E "not package(geom-pool) & ($(cat "$RUNNER_TEMP/measure/part-${{ matrix.part }}.txt"))" || status=$?
          case "$status" in 0|100) ;; *) exit "$status" ;; esac
          # Each run's report beside the other's (a run with no test may write none).
          dir=target/nextest/miri-measure-ci
          if [ -f "$dir/junit.xml" ]; then mv "$dir/junit.xml" "$dir/junit-stacked-borrows.xml"; fi
      - name: Measure this part's geom-pool tests under Miri with Tree Borrows (part ${{ matrix.part }})
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          # The flags of the job `miri-pool`, so the times are that run's.
          MIRIFLAGS: -Zmiri-isolation-error=warn-nobacktrace -Zmiri-tree-borrows -Zmiri-ignore-leaks
        run: |
          status=0
          cargo miri nextest run --locked -p geom-pool --profile miri-measure-ci \
            -E "package(geom-pool) & ($(cat "$RUNNER_TEMP/measure/part-${{ matrix.part }}.txt"))" || status=$?
          case "$status" in 0|100) ;; *) exit "$status" ;; esac
          dir=target/nextest/miri-measure-ci
          if [ -f "$dir/junit.xml" ]; then mv "$dir/junit.xml" "$dir/junit-tree-borrows.xml"; fi
      # nextest writes each report under the workspace's own target/nextest/<profile>/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: miri-measure-${{ matrix.part }}
          path: target/nextest/miri-measure-ci/junit-*.xml
          retention-days: 3
          if-no-files-found: error
      - name: Every test finished or was stopped, none failed
        run: |
          # The table's one writer reads the reports and writes nothing (--dry-run): it fails,
          # naming each, on a test that failed or was killed under Miri, and on a part that
          # reported nothing.
          reports=()
          for f in target/nextest/miri-measure-ci/junit-*.xml; do reports+=(--report "$f"); done
          cargo run --locked -q -p geom-test --bin kernel-quality -- miri-times \
            "${reports[@]}" --scale 1 --stop 600 --dry-run

  miri-measure-2:
    name: Miri's measuring run (part ${{ matrix.part }})
    needs: [when, miri-measure-plan]
    # Parts 257 on, for a run of more parts than one matrix may hold: the same steps as
    # `miri-measure`, word for word. A plan of 256 parts or fewer runs none; its matrix still
    # lists part 257, because a matrix may not be empty.
    if: needs.miri-measure-plan.outputs.count_2 != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A part with no test of one kind (geom-pool's, or the rest) runs none of that kind.
      NEXTEST_NO_TESTS: pass
    strategy:
      # Every part reports, so one failure does not lose the others' times.
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.miri-measure-plan.outputs.parts_2) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the pinned nightly with Miri
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component miri,rust-src
          cargo "+$RUST_NIGHTLY" miri setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restores the cache main's job `miri-plan` saves and saves nothing: a measuring run
          # leaves nothing another run reads.
          save-if: false
          key: miri
          add-job-id-key: false
      - name: Install cargo-nextest ${{ env.CARGO_NEXTEST_VERSION }}
        run: cargo install --locked cargo-nextest --version "$CARGO_NEXTEST_VERSION"
      - name: The kernel crates
        run: |
          packages=$(cargo run --locked -p geom-test --bin kernel-quality -- miri-packages)
          echo "$packages"
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: miri-measure-plan
          path: ${{ runner.temp }}/measure
      - name: Measure this part's tests under Miri (part ${{ matrix.part }})
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          # The flags of the job `miri`, so the times are that run's.
          MIRIFLAGS: -Zmiri-isolation-error=warn-nobacktrace
        run: |
          # The miri-measure-ci profile stops a test at the budget and counts it as timed out, so
          # nextest's exit status is 100 when any test was stopped or failed: the report says
          # which, and the last step reads it. Any other status (a build that failed) fails here.
          status=0
          # shellcheck disable=SC2086 # PACKAGES holds several -p arguments, none with a space.
          cargo miri nextest run --locked $PACKAGES --profile miri-measure-ci \
            -E "not package(geom-pool) & ($(cat "$RUNNER_TEMP/measure/part-${{ matrix.part }}.txt"))" || status=$?
          case "$status" in 0|100) ;; *) exit "$status" ;; esac
          # Each run's report beside the other's (a run with no test may write none).
          dir=target/nextest/miri-measure-ci
          if [ -f "$dir/junit.xml" ]; then mv "$dir/junit.xml" "$dir/junit-stacked-borrows.xml"; fi
      - name: Measure this part's geom-pool tests under Miri with Tree Borrows (part ${{ matrix.part }})
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          # The flags of the job `miri-pool`, so the times are that run's.
          MIRIFLAGS: -Zmiri-isolation-error=warn-nobacktrace -Zmiri-tree-borrows -Zmiri-ignore-leaks
        run: |
          status=0
          cargo miri nextest run --locked -p geom-pool --profile miri-measure-ci \
            -E "package(geom-pool) & ($(cat "$RUNNER_TEMP/measure/part-${{ matrix.part }}.txt"))" || status=$?
          case "$status" in 0|100) ;; *) exit "$status" ;; esac
          dir=target/nextest/miri-measure-ci
          if [ -f "$dir/junit.xml" ]; then mv "$dir/junit.xml" "$dir/junit-tree-borrows.xml"; fi
      # nextest writes each report under the workspace's own target/nextest/<profile>/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: miri-measure-${{ matrix.part }}
          path: target/nextest/miri-measure-ci/junit-*.xml
          retention-days: 3
          if-no-files-found: error
      - name: Every test finished or was stopped, none failed
        run: |
          # The table's one writer reads the reports and writes nothing (--dry-run): it fails,
          # naming each, on a test that failed or was killed under Miri, and on a part that
          # reported nothing.
          reports=()
          for f in target/nextest/miri-measure-ci/junit-*.xml; do reports+=(--report "$f"); done
          cargo run --locked -q -p geom-test --bin kernel-quality -- miri-times \
            "${reports[@]}" --scale 1 --stop 600 --dry-run

  # The one check main's ruleset requires of this workflow: it fails if any job failed or was
  # cancelled, or if a gate `when` chose did not run, and when mutation and coverage both passed on
  # a change it leaves the mark that spares the same tree a second run.
  done:
    name: Kernel quality checks pass
    needs: [when, cheap, mutants-plan, mutants, mutants-2, mutants-judge, coverage-plan, coverage-parts, coverage, gates-seeded, miri-plan, miri, miri-pool, miri-measure-plan, miri-measure, miri-measure-2]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Every job that ran passed, and every gate chosen ran
        env:
          NEEDS: ${{ toJSON(needs) }}
          MUTANTS: ${{ needs.when.outputs.mutants }}
          COVERAGE: ${{ needs.when.outputs.coverage }}
          MIRI: ${{ needs.when.outputs.miri }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::These jobs did not pass: $(echo $bad)"
            exit 1
          fi
          test "$(jq -r '.when.result' <<< "$NEEDS")" = success
          must=""
          if [ "$MUTANTS" = true ]; then must="$must mutants-plan mutants-judge"; fi
          if [ "$COVERAGE" = true ]; then must="$must coverage-plan coverage-parts coverage gates-seeded"; fi
          if [ "$MIRI" = true ]; then must="$must miri-plan miri miri-pool"; fi
          for job in $must; do
            result=$(jq -r --arg j "$job" '.[$j].result' <<< "$NEEDS")
            if [ "$result" != success ]; then
              echo "::error::$job was chosen to run and its result is $result."
              exit 1
            fi
          done
          echo "Every quality gate this run chose has passed."
      - name: The mark for this tree
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.when.outputs.mutants == 'true' && needs.when.outputs.coverage == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/mark"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/mark/commit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.when.outputs.mutants == 'true' && needs.when.outputs.coverage == 'true'
        with:
          name: quality-tested-${{ needs.when.outputs.tree }}
          path: ${{ runner.temp }}/mark
          retention-days: 30
          if-no-files-found: error
