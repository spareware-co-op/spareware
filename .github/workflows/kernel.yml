        run: '"$GOLDEN" run --part 1/4'
      - name: Every golden in debug (part 2 of 4)
        if: ${{ !cancelled() && matrix.mode == 'debug' && matrix.k == 2 }}
        run: '"$GOLDEN" run --part 2/4'
      - name: Every golden in debug (part 3 of 4)
