          CARGO_TARGET_DIR: target-native
        run: '"$GOLDEN" run --part 10/11 --release'
      - name: Every golden in release for this machine's own CPU (part 11 of 11)
        if: ${{ !cancelled() && matrix.mode == 'release' && matrix.k == 40 }}
        env:
