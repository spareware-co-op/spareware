name: Kernel

# Tests every crate of the geometry kernel on every target the kernel builds for, and runs the
# determinism matrix (chapter 21; piece G19).
#
# The matrix: every golden of the golden store (projects/engines/geometry/crates/geom-test/
# golden/store.json, chapter 28.13), each the SHA-256 of a fixed corpus's canonical outputs, must
# give the store's digest on every target here, in debug and in release, release both with
# overflow checks on and as it ships (off), and natively with -C target-cpu=native; on wasm32 in
# debug and in both release modes. `cargo run -p geom-test --bin golden -- run <cargo test
# arguments>` runs them: one `cargo test` per crate and test target, with this step's arguments and
# environment, each golden twice in one process on two differently perturbed heaps (the perturbing
# allocator and the in-process repeat), and it fails unless every golden of the store ran and
# agreed, so a golden added to the store joins every leg at once and a renamed test cannot pass
# unrun. geom-num's whole test suite, every one of its test vectors, also runs in every native
# configuration and in both release modes on wasm32 (its debug suite there takes well over an
# hour, so wasm32's debug leg runs the goldens). A target that disagrees is a bug, never a reason
# to change a golden: a golden changes only by an approved edit of the store (kernel-golden.yml).
#
# The goldens run first, in every configuration, and every step runs even when an earlier one
# failed (`if: !cancelled()`), so a failing suite never hides the digests of a target.
#
# Every action is pinned to a full commit, checked against its tag when it was pinned; update a
# pin only after reviewing the new commit.
#
# If this workflow becomes a required check, note that a pull request outside the paths below
# never runs it, so it would never report: then drop the pull_request path filter and skip inside
# the jobs, or require a small summary job that always runs.

on:
  pull_request:
    paths:
      - "projects/engines/geometry/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "rust-toolchain"
      - "clippy.toml"
      - ".clippy.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - ".github/workflows/kernel.yml"
  push:
    branches: [main]
    paths:
      - "projects/engines/geometry/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "rust-toolchain"
      - "clippy.toml"
      - ".clippy.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - ".github/workflows/kernel.yml"
  # Run whole by kernel-release.yml on a release tag, with every other kernel workflow (28.17).
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the runs it supersedes. A newer push to main
# does not cancel a run in progress, but at most one run waits behind it (GitHub's default
# `queue: single`), so a run on main that is still waiting is cancelled by a newer push.
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # One pinned compiler for every job, so a golden digest never moves because the compiler did
  # (chapter 28.13, the toolchain guard). Change it only in a pull request that reruns every
  # golden. Chapter 28.13 asks for the pin in a committed rust-toolchain.toml at the repository
  # root; until an owner adds one, it is held here, and the path filters above already watch it.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  test:
    name: Test (${{ matrix.target.name }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.target.os }}
    # Every kernel crate in release on one runner and in debug on another, side by side, so a
    # run takes the longer of the two instead of their sum; geom-num's debug suite alone takes
    # over half an hour on a 12-thread machine, so the limit leaves room as crates grow.
    timeout-minutes: 240
    strategy:
      # Every target reports, so a golden digest that differs on one target shows which.
      fail-fast: false
      matrix:
        # The release legs run the golden digests (with and without overflow checks, and for the
        # runner's own CPU) and the whole suite with overflow checks on; the debug legs run the
        # golden digest and the whole suite in debug: together, the steps one runner used to run.
        mode: [release, debug]
        target:
          - name: Linux x86-64
            os: ubuntu-latest
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: Windows x86-64
            os: windows-latest
          - name: Windows arm64
            os: windows-11-arm
          - name: macOS arm64
            os: macos-latest
          - name: macOS x86-64
            # GitHub retired macos-13 in December 2025 and named macos-15-intel as the standard
            # x86-64 label to move to; it said x86-64 macOS ends when the macOS 15 image retires in
            # fall 2027 (changelog, 2025-09-19). Its macOS 26 image has a standard x86-64 label too,
            # macos-26-intel (changelog, 2026-02-26), and its runner reference, read 2026-10-22,
            # lists both, so when Intel images end is not settled. When they end, this leg needs a
            # self-hosted runner or an owner's decision to drop the target (chapter 32.4).
            os: macos-15-intel
    defaults:
      run:
        # bash with -eo pipefail on every runner, Windows included.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Release and debug builds are cached apart, so neither leg restores the other's.
          key: ${{ matrix.mode }}
      # Every crate in the kernel's folder is checked here, so a new crate is covered the day it
      # lands (chapter 27: one folder per crate, folder name = crate name).
      - name: List the kernel's crates
        run: echo "KERNEL_CRATES=$(for d in projects/engines/geometry/crates/*/; do printf -- '-p %s ' "$(basename "$d")"; done)" >> "$GITHUB_ENV"
      - name: Every golden in release, with overflow checks on
        if: ${{ !cancelled() && matrix.mode == 'release' }}
        env:
          RUSTFLAGS: -C overflow-checks=on
        run: cargo run --locked -p geom-test --bin golden -- run --release
      - name: Every golden in release as shipped, without overflow checks
        if: ${{ !cancelled() && matrix.mode == 'release' }}
        run: cargo run --locked -p geom-test --bin golden -- run --release
      - name: geom-num's every test vector in release as shipped
        if: ${{ !cancelled() && matrix.mode == 'release' }}
        run: cargo test -p geom-num --release --locked --no-fail-fast
      - name: Show this machine's CPU features
        if: ${{ !cancelled() && matrix.mode == 'release' }}
        run: rustc -vV && rustc --print cfg -C target-cpu=native
      - name: Every golden in release for this machine's own CPU
        if: ${{ !cancelled() && matrix.mode == 'release' }}
        env:
          RUSTFLAGS: -C overflow-checks=on -C target-cpu=native
          # Its own build folder, which the build cache never saves or restores: the cache's key
          # does not name the processor, so a restored native build from another machine's CPU
          # can hold instructions this one lacks (SIGILL). Built fresh here, it is this CPU's.
          CARGO_TARGET_DIR: target-native
        run: cargo run --locked -p geom-test --bin golden -- run --release
      - name: geom-num's every test vector in release for this machine's own CPU
        if: ${{ !cancelled() && matrix.mode == 'release' }}
        env:
          RUSTFLAGS: -C overflow-checks=on -C target-cpu=native
          CARGO_TARGET_DIR: target-native
        run: cargo test -p geom-num --release --locked --no-fail-fast
      - name: Every golden in debug
        if: ${{ !cancelled() && matrix.mode == 'debug' }}
        run: cargo run --locked -p geom-test --bin golden -- run
      - name: Test suite in release, with overflow checks on
        if: ${{ !cancelled() && matrix.mode == 'release' }}
        env:
          RUSTFLAGS: -C overflow-checks=on
        run: cargo test $KERNEL_CRATES --release --locked --no-fail-fast
      - name: Test suite in debug
        if: ${{ !cancelled() && matrix.mode == 'debug' }}
        run: cargo test $KERNEL_CRATES --locked --no-fail-fast

  guard:
    name: The toolchain guard trips
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The proof of the toolchain and dependency guard (chapter 28.13; piece G20). This workflow
    # reruns every golden on every target whenever the toolchain pin, Cargo.lock, the workspace
    # manifest or anything under the kernel changes (the path filters above), so a change there
    # that moves a result fails the test job. This job shows that it would: `guard prove` patches
    # in a copy of libm whose sin flips the last bit of every result, one ulp, and requires
    # geom-num's determinism golden to report a digest that differs from the store's. A run that
    # passes, builds the real libm, or fails for another reason fails this job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: guard
      - name: A one-bit change to libm's sin fails a golden
        run: cargo run --locked --release -p geom-test --bin guard -- prove

  wasm:
    name: Test (wasm32-wasip1 under ${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Chapter 21: wasm32 under wasmtime and under Node.
        runtime: [wasmtime, node]
    env:
      WASMTIME_VERSION: "50.0.0"
      NODE_VERSION: "24"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Every kernel crate in the kernel's folder; the development crates (chapter 27) need
      # processes and files that WASI test runs do not have, and run natively above.
      - name: List the kernel's crates
        run: echo "KERNEL_CRATES=$(for d in projects/engines/geometry/crates/*/; do c="$(basename "$d")"; case "$c" in geom-test|geom-fuzz|geom-gen|geom-bench) ;; *) printf -- '-p %s ' "$c" ;; esac; done)" >> "$GITHUB_ENV"
      - name: Install wasmtime ${{ env.WASMTIME_VERSION }}
        if: matrix.runtime == 'wasmtime'
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASMTIME_VERSION }}
      - name: Run the tests under wasmtime
        if: matrix.runtime == 'wasmtime'
        run: |
          wasmtime --version
          echo "CARGO_TARGET_WASM32_WASIP1_RUNNER=wasmtime" >> "$GITHUB_ENV"
      - name: Install Node ${{ env.NODE_VERSION }}
        if: matrix.runtime == 'node'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run the tests under Node's WASI (preview1)
        if: matrix.runtime == 'node'
        run: |
          node --version
          cat > "$RUNNER_TEMP/wasi-run.mjs" <<'EOF'
          // Runs a wasm32-wasip1 test binary under Node's WASI: cargo's runner for that target.
          // A failing test traps or exits non-zero, and either makes this process exit non-zero.
          import { readFile } from 'node:fs/promises';
          import { WASI } from 'node:wasi';
          import { argv, env, exit } from 'node:process';

          const [file, ...args] = argv.slice(2);
          const wasi = new WASI({ version: 'preview1', args: [file, ...args], env, returnOnExit: true });
          const module = await WebAssembly.compile(await readFile(file));
          const instance = await WebAssembly.instantiate(module, wasi.getImportObject());
          exit(wasi.start(instance));
          EOF
          echo "CARGO_TARGET_WASM32_WASIP1_RUNNER=node --no-warnings $RUNNER_TEMP/wasi-run.mjs" >> "$GITHUB_ENV"
      # Gate 1 (piece G43): the job `guard`'s proof, through this leg's own tool and runtime.
      # `libm`'s `sin` changed by one bit must make `golden run` fail on wasm32 too, with the golden
      # geom-num/determinism reporting a digest that differs from the store's (geom-test's `guard`).
      - name: A one-bit change to libm's sin fails a golden on wasm32
        run: cargo run --locked --release -p geom-test --bin guard -- prove --golden-run --target wasm32-wasip1 --release
      # Every golden of the store, geom-test's included (its library's goldens are pure
      # computation, which WASI runs); the golden tool itself runs natively and builds and runs the
      # tests for wasm32-wasip1 through the runner set above.
      - name: Every golden on wasm32 in release, with overflow checks on
        if: ${{ !cancelled() }}
        env:
          RUSTFLAGS: -C overflow-checks=on
        run: cargo run --locked -p geom-test --bin golden -- run --target wasm32-wasip1 --release
      - name: Every golden on wasm32 in release as shipped, without overflow checks
        if: ${{ !cancelled() }}
        run: cargo run --locked -p geom-test --bin golden -- run --target wasm32-wasip1 --release
      - name: Every golden on wasm32 in debug
        if: ${{ !cancelled() }}
        run: cargo run --locked -p geom-test --bin golden -- run --target wasm32-wasip1
      - name: geom-num's every test vector on wasm32 in release as shipped
        if: ${{ !cancelled() }}
        run: cargo test -p geom-num --target wasm32-wasip1 --release --locked --no-fail-fast
      # The whole suite in release. In debug, wasm32-wasip1 runs every test on one thread with no
      # optimisation, which takes well over an hour, so the debug leg here is every golden of the
      # store above (chapter 21 asks for the corpus in debug and release); the native jobs run the
      # whole suite in debug.
      - name: Test suite in release, with overflow checks on
        if: ${{ !cancelled() }}
        env:
          RUSTFLAGS: -C overflow-checks=on
        run: cargo test $KERNEL_CRATES --target wasm32-wasip1 --release --locked --no-fail-fast

  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Every crate in the kernel's folder is checked here, so a new crate is covered the day it
      # lands (chapter 27: one folder per crate, folder name = crate name).
      - name: List the kernel's crates
        run: echo "KERNEL_CRATES=$(for d in projects/engines/geometry/crates/*/; do printf -- '-p %s ' "$(basename "$d")"; done)" >> "$GITHUB_ENV"
      # Gate 1 (G43): the format check must first fail on a planted violation, a line of
      # geom-num that rustfmt would format differently (geom-test's trip module and binary).
      - name: Formatting fails on a planted violation
        run: cargo run --locked -q -p geom-test --bin trip -- fmt -- cargo fmt --check $KERNEL_CRATES
      - name: Formatting
        run: cargo fmt --check $KERNEL_CRATES
      # The crate's [lints] table enables clippy's pedantic group and denies native arithmetic,
      # lossy casts, unwrap, expect, panic and unchecked indexing in kernel code; its clippy.toml
      # holds chapter 21's disallowed methods and types. -D warnings makes every one an error.
      - name: Clippy with the kernel lints
        if: ${{ !cancelled() }}
        run: cargo clippy $KERNEL_CRATES --all-targets --locked -- -D warnings
