# nextest profiles for the geometry kernel's weekly Miri run (kernel architecture, section 28.8;
# .github/workflows/kernel-quality.yml runs them). The job `suite` of .github/workflows/kernel.yml
# also runs nextest, with the default profile, left as nextest ships it, to run the test suite in
# parts (`--partition count:k/n`).
#
# cargo-nextest 0.9.146 (Apache-2.0 OR MIT) is pinned in the workflow. `on-timeout = "pass"` needs
# 0.9.115 (https://nexte.st/docs/features/slow-tests/), so older versions are refused.
nextest-version = { required = "0.9.115" }

# `cargo miri nextest run` picks this profile by itself. Every kernel test Miri finishes runs under
# it (32.58: Miri's table in geom-test's src/miri-times.tsv says which), each in its own process,
# four at once on a GitHub-hosted runner. Each test has a budget of 10 minutes (two periods of
# five): a test still running then is stopped and counted as passing (TMPASS), and the run's report
# and its JUnit file name each one; a test the table lists as finishing should never reach it. Any
# undefined behaviour, panic or failed assertion fails the test, and every test runs (no
# fail-fast), so one run finds them all.
[profile.default-miri]
slow-timeout = { period = "300s", terminate-after = 2, on-timeout = "pass" }
fail-fast = false

[profile.default-miri.junit]
path = "junit.xml"

# The yardstick (32.78): one fixed small test (`geom_test::miri::YARDSTICK`) that every Miri gate
# job runs alone before its own tests, so its time over its row in Miri's table is the job's scale,
# the speed of the runner it got. It has a report of its own, which the tests' report never
# overwrites; a yardstick stopped at the budget is counted as timed out, not passed, and
# `kernel-quality miri-scale` refuses it: a missing time is an error, never a default.
[profile.miri-yardstick]
slow-timeout = { period = "300s", terminate-after = 2 }
fail-fast = false

[profile.miri-yardstick.junit]
path = "junit.xml"

# The same run at a budget of one minute a test, for a pull request that changes how Miri runs: it
# proves the run works without spending the weekly run's hours.
[profile.miri-smoke]
slow-timeout = { period = "30s", terminate-after = 2, on-timeout = "pass" }
fail-fast = false

[profile.miri-smoke.junit]
path = "junit.xml"

# A measuring run for Miri's table (32.58), on a development machine: each test is stopped at two
# periods of one minute and counted as timed out, not passed, so its JUnit report tells a test Miri
# finishes from one it does not; `kernel-quality miri-times` writes the table from that report.
[profile.miri-measure]
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = false

[profile.miri-measure.junit]
path = "junit.xml"

# The same measuring run on GitHub's runners (kernel-quality.yml's measuring mode, by hand only):
# the stop is the budget itself, two periods of five minutes, so a CI runner's report is read as it
# is (`kernel-quality miri-times --scale 1 --stop 600`) and a test that finishes under the budget
# is never written as native-only.
[profile.miri-measure-ci]
inherits = "miri-measure"
slow-timeout = { period = "300s", terminate-after = 2 }
