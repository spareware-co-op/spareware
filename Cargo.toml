# One Rust workspace for every Spareware program.
# Layering: programs depend on projects/kit and projects/engines, never on each other.
[workspace]
resolver = "3"
members = [
  "projects/kit/crates/*",
  "projects/engines/crates/*",
  "projects/engines/geometry/crates/*",
  "projects/spare-construct/crates/*",
  "projects/spare-office/crates/*",
]
# geom-solidcore is its own workspace, with its own Cargo.lock, kept out of this one and out of
# every kernel job but its own (decision 32.70).
exclude = ["projects/engines/geometry/geom-solidcore"]

[workspace.package]
edition = "2024"
publish = false
# Licence: Apache-2.0 for everything (LICENSE, README.md, Licence). Decision 32.45.
license = "Apache-2.0"

# The profile cargo-bolero builds fuzz targets with (its --profile option defaults to fuzz), as the
# bolero book asks: book/src/library-installation.md at commit
# 7642943b6c1f8a9b5e824dd1cd29b7c8e56068b8 of camshaft/bolero on GitHub. It is the dev profile, so
# debug assertions and overflow checks stay on and a fuzzer finds an overflow as a crash, with full
# optimisation for speed, and no link-time optimisation, which the book says fuzzing builds do not
# support well. Nothing else uses it; the geometry kernel runs its fuzz targets this way in
# .github/workflows/kernel-fuzz.yml (projects/engines/geometry/crates/geom-fuzz/README.md).
# No URL here: clippy records this file among the files each crate's build read, and the merge
# gate (G12) reads every such file with a Rust lexer, to which "//" opens a comment.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1

# The exact big integers and rationals (dashu, MIT OR Apache-2.0) are compiled with optimisation in
# the dev profile too, which tests build with: a profile override for those packages alone, as the
# Cargo book's chapter on profiles describes. Only how dashu's own code is compiled changes, never
# what it computes: its debug assertions and overflow checks stay on, and every crate of ours stays
# unoptimised. Unoptimised, dashu made one run of geom-gen's generators take 11 s instead of 1.9 s
# (the quadrature-rules generator's exact enclosures are almost all of it), and the exact oracles of
# the kernel's tests run on it too.
[profile.dev.package.dashu-base]
opt-level = 3

[profile.dev.package.dashu-int]
opt-level = 3

[profile.dev.package.dashu-ratio]
opt-level = 3

# dashu-int's own modular arithmetic, which its multiplication and division call.
[profile.dev.package.num-modular]
opt-level = 3

# The other exact oracles of the kernel's tests, num-bigint and num-rational with the num-integer
# and num-traits they rest on (all MIT OR Apache-2.0; development dependencies only, never linked
# into a kernel crate), compiled the same way and for the same reason. Unoptimised, the rationals'
# greatest common divisors were almost all of the time of the slowest tests in the plain debug
# run: geom-math's decimal-text and float-length tests took 59 s and 45 s on a development machine,
# nearly every sample of their stacks inside num-bigint's gcd.
[profile.dev.package.num-bigint]
opt-level = 3

[profile.dev.package.num-rational]
opt-level = 3

[profile.dev.package.num-integer]
opt-level = 3

[profile.dev.package.num-traits]
opt-level = 3
